<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background &amp; Shape Studio — MyoMT Utilities</title>
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="_motion.css">
<link rel="stylesheet" href="_effects.css">
<link rel="stylesheet" href="_design.css">
<style>
  :root{
    --bg:#070a0f; --bg2:#0d1119; --card:#151a24; --card2:#1b2130;
    --field:#12161f; --field-border:#2b3342; --text:#f2f5fa; --muted:#9aa4b3; --faint:#616c7d;
    --accent:#ec4899; --accent-2:#8b5cf6; --ok:#34d399;
    --sans:'Pyidaungsu','Padauk','Inter','Segoe UI',system-ui,sans-serif;
    --mono:'Cascadia Code','Consolas',monospace;
  }
  *{box-sizing:border-box}
  body{margin:0; font-family:var(--sans); color:var(--text); min-height:100vh; padding:20px 16px 50px;
    background:radial-gradient(1000px 600px at 10% -10%, rgba(236,72,153,.12), transparent 55%),
      radial-gradient(900px 550px at 105% 0%, rgba(139,92,246,.11), transparent 55%),
      linear-gradient(180deg, var(--bg2), var(--bg) 60%); background-attachment:fixed}
  .wrap{max-width:1080px; margin:0 auto}
  header{display:flex; align-items:center; gap:13px; margin-bottom:14px; flex-wrap:wrap}
  .logo{width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-size:1.3rem;
    background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:0 6px 18px rgba(236,72,153,.35)}
  header h1{font-size:1.25rem; margin:0; font-weight:800; letter-spacing:-.02em}
  header .sub{color:var(--muted); font-size:.8rem}
  header .title{flex:1; min-width:160px}

  .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap}
  .tabs button{padding:9px 16px; border-radius:11px; border:1px solid var(--field-border); background:var(--field); color:var(--muted);
    font-family:var(--sans); font-size:.86rem; font-weight:600; cursor:pointer; transition:.14s; display:inline-flex; align-items:center; gap:7px}
  .tabs button.on{background:linear-gradient(135deg,var(--accent),var(--accent-2)); border:none; color:#fff; box-shadow:0 6px 16px rgba(236,72,153,.3)}

  .layout{display:grid; grid-template-columns:1fr 300px; gap:14px; align-items:start}
  @media(max-width:820px){ .layout{grid-template-columns:1fr} }
  .preview{background:
      linear-gradient(45deg,#0c0f16 25%,transparent 25%,transparent 75%,#0c0f16 75%),
      linear-gradient(45deg,#0c0f16 25%,#10141d 25%,#10141d 75%,#0c0f16 75%);
    background-size:22px 22px; background-position:0 0, 11px 11px;
    border:1px solid rgba(255,255,255,.08); border-radius:16px; overflow:hidden; min-height:360px;
    display:flex; align-items:center; justify-content:center; position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 16px 40px -20px rgba(0,0,0,.6)}
  #stage{width:100%; aspect-ratio:16/10; display:block}
  .panel{background:var(--card); border:1px solid rgba(255,255,255,.07); border-radius:14px; padding:16px 17px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 12px 30px -16px rgba(0,0,0,.55)}
  .panel h3{margin:0 0 12px; font-size:.82rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
  .ctl{margin-bottom:13px}
  .ctl label{display:flex; justify-content:space-between; font-size:.74rem; color:var(--muted); font-weight:600; margin-bottom:6px}
  .ctl label b{color:var(--text); font-variant-numeric:tabular-nums; font-family:var(--mono)}
  .ctl input[type=range]{width:100%}
  .swrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .swrow .cw{display:flex; align-items:center; gap:6px; font-size:.72rem; color:var(--muted)}
  input[type=color]{width:34px; height:30px; border:1px solid var(--field-border); border-radius:7px; background:none; cursor:pointer; padding:0}
  select{width:100%; background:var(--field); border:1px solid var(--field-border); border-radius:9px; color:var(--text); font-family:var(--sans); font-size:14px; padding:9px 11px; outline:none}
  .seg{display:flex; gap:4px; background:var(--field); border:1px solid var(--field-border); border-radius:10px; padding:4px}
  .seg button{flex:1; border:none; background:transparent; color:var(--muted); font-family:var(--sans); font-size:.76rem; font-weight:600; padding:7px; border-radius:7px; cursor:pointer}
  .seg button.on{background:var(--accent); color:#fff}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 13px; border-radius:10px; border:1px solid rgba(255,255,255,.1);
    background:var(--field); color:var(--text); cursor:pointer; font-family:var(--sans); font-size:.8rem; font-weight:600; transition:.14s; width:100%}
  .btn:hover{border-color:var(--accent); transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2)); border:none; color:#fff}
  .btn-row{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:4px}
  code.out{display:block; background:var(--field); border:1px solid var(--field-border); border-radius:9px; padding:10px 12px;
    font-family:var(--mono); font-size:11.5px; color:var(--ok); white-space:pre-wrap; word-break:break-all; margin-top:12px; cursor:pointer; max-height:150px; overflow:auto}
  code.out:hover{border-color:var(--accent)}
  footer{text-align:center; color:var(--faint); font-size:.72rem; margin-top:22px}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--card2); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:10px 16px; font-size:.84rem; font-weight:600; box-shadow:0 12px 30px rgba(0,0,0,.5); transition:.25s; z-index:9999; pointer-events:none}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media(max-width:600px){ header .sub{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🫧</div>
    <div class="title"><h1>Background &amp; Shape Studio</h1><div class="sub">Blob · Waves · Mesh gradient · Pattern → SVG / CSS / PNG — offline</div></div>
  </header>

  <div class="tabs" id="tabs">
    <button data-t="blob" class="on">🫧 Blob</button>
    <button data-t="waves">🌊 Waves</button>
    <button data-t="mesh">🎨 Mesh</button>
    <button data-t="pattern">▦ Pattern</button>
  </div>

  <div class="layout">
    <div class="preview"><svg id="stage" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="panel" id="controls"></div>
  </div>
  <code class="out" id="out" title="Click to copy"></code>
  <footer>Developed by <b>MyoMT</b> · offline · hero backgrounds, blob shapes, dividers</footer>
</div>
<div class="toast" id="toast"></div>

<script defer src="_palette.js"></script>
<script defer src="_navrail.js"></script>
<script defer src="_ui.js"></script>
<script defer src="_pwa.js"></script>
<script defer src="_settings.js"></script>
<script defer src="_applock.js"></script>
<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id);
  const stage=$('stage'), controls=$('controls'), out=$('out'), toastEl=$('toast');
  const W=800,H=500;
  let tab='blob';
  const state={
    blob:{ edges:7, grow:7, c1:'#ec4899', c2:'#8b5cf6', grad:true, seed:[] },
    waves:{ layers:3, amp:60, c1:'#8b5cf6', c2:'#ec4899' },
    mesh:{ colors:['#ec4899','#8b5cf6','#0ea5e9','#22c55e'], pts:[] },
    pattern:{ type:'dots', size:22, color:'#8b5cf6', bg:'#12161f', op:0.5 }
  };
  function toast(m){ toastEl.textContent=m; toastEl.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),1500); }

  // ---------- Blob ----------
  function blobPoints(n,grow){ const cx=W/2,cy=H/2,base=Math.min(W,H)*0.36; const pts=[]; const s=state.blob.seed;
    for(let i=0;i<n;i++){ const a=(i/n)*Math.PI*2; const rnd=s[i]!==undefined?s[i]:Math.random(); const r=base*(1 - (grow/20) + rnd*(grow/10)); pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r*0.82]); } return pts; }
  function smoothClosed(p){ const n=p.length; let d=`M ${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)} `;
    for(let i=0;i<n;i++){ const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
      const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6, c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
      d+=`C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)} `; } return d+'Z'; }
  function renderBlob(){ const b=state.blob; if(b.seed.length!==b.edges){ b.seed=Array.from({length:b.edges},()=>Math.random()); }
    const d=smoothClosed(blobPoints(b.edges,b.grow));
    const fill=b.grad?'url(#bgrad)':b.c1;
    const svg=`<defs><linearGradient id="bgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${b.c1}"/><stop offset="1" stop-color="${b.c2}"/></linearGradient></defs><path d="${d}" fill="${fill}"/>`;
    stage.innerHTML=svg; setOut(exportSVG());
  }
  // ---------- Waves ----------
  function wavePath(amp,phase,yBase){ let d=`M 0 ${yBase} `; const steps=8; for(let i=0;i<=steps;i++){ const x=(i/steps)*W; const y=yBase+Math.sin(i*0.9+phase)*amp; const cx=x-(W/steps)/2; if(i===0){ d+=`L ${x} ${y.toFixed(1)} `; } else { d+=`Q ${cx.toFixed(1)} ${(yBase+Math.sin((i-0.5)*0.9+phase)*amp*1.3).toFixed(1)}, ${x.toFixed(1)} ${y.toFixed(1)} `; } } d+=`L ${W} ${H} L 0 ${H} Z`; return d; }
  function lerpColor(a,b,t){ const pa=hx(a),pb=hx(b); return '#'+[0,1,2].map(i=>Math.round(pa[i]+(pb[i]-pa[i])*t).toString(16).padStart(2,'0')).join(''); }
  function hx(x){ x=x.replace('#',''); return [parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)]; }
  function renderWaves(){ const w=state.waves; let paths='';
    for(let l=0;l<w.layers;l++){ const t=w.layers>1?l/(w.layers-1):0; const col=lerpColor(w.c1,w.c2,t);
      const yBase=H*0.45+l*(H*0.14); paths+=`<path d="${wavePath(w.amp*(1-l*0.12), l*1.3, yBase)}" fill="${col}" opacity="${(0.55+l*0.15).toFixed(2)}"/>`; }
    stage.innerHTML=`<rect width="${W}" height="${H}" fill="${lerpColor(w.c1,w.c2,0.5)}" opacity="0.12"/>${paths}`; setOut(exportSVG());
  }
  // ---------- Mesh ----------
  function renderMesh(){ const m=state.mesh; if(m.pts.length!==m.colors.length){ m.pts=m.colors.map(()=>[Math.random(),Math.random()]); }
    let rects=m.colors.map((c,i)=>{ const [x,y]=m.pts[i]; return `<radialGradient id="mg${i}" cx="${(x*100).toFixed(0)}%" cy="${(y*100).toFixed(0)}%" r="65%"><stop offset="0" stop-color="${c}" stop-opacity="0.9"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`; }).join('');
    let layers=m.colors.map((c,i)=>`<rect width="${W}" height="${H}" fill="url(#mg${i})"/>`).join('');
    stage.innerHTML=`<defs>${rects}</defs><rect width="${W}" height="${H}" fill="${m.colors[0]}"/>${layers}`;
    // CSS output
    const css='background-color: '+m.colors[0]+';\nbackground-image:\n'+m.colors.map((c,i)=>{const[x,y]=m.pts[i];return `  radial-gradient(at ${(x*100).toFixed(0)}% ${(y*100).toFixed(0)}%, ${c} 0px, transparent 55%)`;}).join(',\n')+';';
    setOut(css);
  }
  // ---------- Pattern ----------
  function patternCSS(){ const p=state.pattern; const c=p.color, s=p.size, bg=p.bg;
    const rgba=(()=>{const[r,g,b]=hx(c);return `rgba(${r},${g},${b},${p.op})`;})();
    if(p.type==='dots') return {bg:`${bg}`, img:`radial-gradient(${rgba} 2px, transparent 2px)`, size:`${s}px ${s}px`};
    if(p.type==='grid') return {bg, img:`linear-gradient(${rgba} 1px, transparent 1px), linear-gradient(90deg, ${rgba} 1px, transparent 1px)`, size:`${s}px ${s}px`};
    if(p.type==='lines') return {bg, img:`repeating-linear-gradient(45deg, ${rgba} 0 1px, transparent 1px ${s}px)`, size:`auto`};
    if(p.type==='cross') return {bg, img:`linear-gradient(${rgba} 1px, transparent 1px), linear-gradient(90deg, ${rgba} 1px, transparent 1px)`, size:`${s}px ${s}px`, extra:`background-position: ${s/2}px ${s/2}px;`};
    if(p.type==='diagonal') return {bg, img:`repeating-linear-gradient(60deg, ${rgba} 0 2px, transparent 2px ${s}px)`, size:`auto`};
    return {bg, img:'none', size:'auto'};
  }
  function renderPattern(){ const pc=patternCSS();
    // draw via foreignObject-free: use a rect + CSS on the stage container instead
    stage.innerHTML=`<rect width="${W}" height="${H}" fill="${pc.bg}"/>`;
    stage.style.background=`${pc.img}`; stage.style.backgroundColor=pc.bg; stage.style.backgroundSize=pc.size;
    const css=`background-color: ${pc.bg};\nbackground-image: ${pc.img};\nbackground-size: ${pc.size};${pc.extra?'\n'+pc.extra:''}`;
    setOut(css);
  }

  function clearStageBg(){ stage.style.background=''; stage.style.backgroundColor=''; stage.style.backgroundSize=''; }
  function render(){ clearStageBg();
    if(tab==='blob')renderBlob(); else if(tab==='waves')renderWaves(); else if(tab==='mesh')renderMesh(); else renderPattern();
  }

  function exportSVG(){ return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${stage.innerHTML}</svg>`; }
  function setOut(t){ out.textContent=t; }
  out.addEventListener('click',()=>{ navigator.clipboard.writeText(out.textContent); toast('✓ copied'); });

  // export PNG
  function downloadPNG(){ const svg=exportSVG(); const blob=new Blob([svg],{type:'image/svg+xml'}); const url=URL.createObjectURL(blob);
    const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=1600; c.height=1000; const g=c.getContext('2d');
      if(tab==='pattern'){ const pc=patternCSS(); g.fillStyle=pc.bg; g.fillRect(0,0,c.width,c.height); }
      g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=tab+'-'+Date.now()+'.png'; a.click(); URL.revokeObjectURL(a.href); toast('✓ PNG'); },'image/png'); };
    img.onerror=()=>toast('⚠ PNG failed'); img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg))); }
  function downloadSVG(){ const blob=new Blob([exportSVG()],{type:'image/svg+xml'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=tab+'-'+Date.now()+'.svg'; a.click(); URL.revokeObjectURL(a.href); toast('✓ SVG'); }

  // ---------- controls per tab ----------
  function slider(label,min,max,val,step,on){ const d=document.createElement('div'); d.className='ctl';
    d.innerHTML=`<label>${label}<b class="val">${val}</b></label><input type="range" min="${min}" max="${max}" step="${step||1}" value="${val}">`;
    d.querySelector('input').addEventListener('input',e=>{ d.querySelector('.val').textContent=e.target.value; on(+e.target.value); render(); }); return d; }
  function colorCtl(label,val,on){ const d=document.createElement('div'); d.className='ctl';
    d.innerHTML=`<label>${label}</label><div class="swrow"></div>`; const inp=document.createElement('input'); inp.type='color'; inp.value=val;
    inp.addEventListener('input',e=>{ on(e.target.value); render(); }); d.querySelector('.swrow').appendChild(inp); return d; }

  function buildControls(){
    controls.innerHTML=''; const h=document.createElement('h3'); h.textContent=tab+' controls'; controls.appendChild(h);
    if(tab==='blob'){ const b=state.blob;
      controls.appendChild(slider('Edges',3,12,b.edges,1,v=>{b.edges=v; b.seed=[];}));
      controls.appendChild(slider('Growth',1,12,b.grow,1,v=>b.grow=v));
      controls.appendChild(colorCtl('Colour A',b.c1,v=>b.c1=v));
      controls.appendChild(colorCtl('Colour B (gradient)',b.c2,v=>b.c2=v));
      const seg=document.createElement('div'); seg.className='ctl'; seg.innerHTML=`<label>Fill</label><div class="seg"><button data-v="1" class="${b.grad?'on':''}">Gradient</button><button data-v="0" class="${!b.grad?'on':''}">Solid A</button></div>`;
      seg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{ b.grad=btn.dataset.v==='1'; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===btn)); render(); })); controls.appendChild(seg);
      const gen=document.createElement('button'); gen.className='btn primary'; gen.textContent='🎲 New shape'; gen.style.margin='4px 0 10px'; gen.addEventListener('click',()=>{ b.seed=Array.from({length:b.edges},()=>Math.random()); render(); }); controls.appendChild(gen);
    } else if(tab==='waves'){ const w=state.waves;
      controls.appendChild(slider('Layers',1,4,w.layers,1,v=>w.layers=v));
      controls.appendChild(slider('Amplitude',10,110,w.amp,1,v=>w.amp=v));
      controls.appendChild(colorCtl('Colour A',w.c1,v=>w.c1=v));
      controls.appendChild(colorCtl('Colour B',w.c2,v=>w.c2=v));
    } else if(tab==='mesh'){ const m=state.mesh;
      m.colors.forEach((c,i)=>controls.appendChild(colorCtl('Colour '+(i+1),c,v=>m.colors[i]=v)));
      const seg=document.createElement('div'); seg.className='ctl'; seg.innerHTML=`<label>Colours</label><div class="seg"><button data-v="3">3</button><button data-v="4" class="on">4</button><button data-v="5">5</button></div>`;
      seg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{ const n=+btn.dataset.v; const base=['#ec4899','#8b5cf6','#0ea5e9','#22c55e','#f59e0b']; m.colors=base.slice(0,n); m.pts=[]; buildControls(); render(); })); controls.appendChild(seg);
      const gen=document.createElement('button'); gen.className='btn primary'; gen.textContent='🎲 Shuffle'; gen.style.margin='4px 0 10px'; gen.addEventListener('click',()=>{ m.pts=m.colors.map(()=>[Math.random(),Math.random()]); render(); }); controls.appendChild(gen);
    } else { const p=state.pattern;
      const sel=document.createElement('div'); sel.className='ctl'; sel.innerHTML=`<label>Type</label><select>${['dots','grid','cross','lines','diagonal'].map(t=>`<option ${t===p.type?'selected':''}>${t}</option>`).join('')}</select>`;
      sel.querySelector('select').addEventListener('change',e=>{ p.type=e.target.value; render(); }); controls.appendChild(sel);
      controls.appendChild(slider('Size',8,60,p.size,1,v=>p.size=v));
      controls.appendChild(slider('Opacity',0.1,1,p.op,0.05,v=>p.op=v));
      controls.appendChild(colorCtl('Pattern colour',p.color,v=>p.color=v));
      controls.appendChild(colorCtl('Background',p.bg,v=>p.bg=v));
    }
    const row=document.createElement('div'); row.className='btn-row';
    const png=document.createElement('button'); png.className='btn'; png.textContent='⬇ PNG'; png.addEventListener('click',downloadPNG);
    const svg=document.createElement('button'); svg.className='btn'; svg.textContent='⬇ SVG'; svg.addEventListener('click',downloadSVG);
    row.appendChild(png); row.appendChild(svg); controls.appendChild(row);
    if(tab==='pattern'||tab==='mesh'){ const cpy=document.createElement('button'); cpy.className='btn primary'; cpy.style.marginTop='7px'; cpy.textContent='⧉ Copy CSS'; cpy.addEventListener('click',()=>{ navigator.clipboard.writeText(out.textContent); toast('✓ CSS copied'); }); controls.appendChild(cpy); }
  }

  $('tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; tab=b.dataset.t;
    [...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b)); buildControls(); render(); });

  buildControls(); render();
})();
</script>
</body>
</html>
