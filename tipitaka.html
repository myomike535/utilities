<!DOCTYPE html>
<html lang="my" data-theme="parchment">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ပိဋကတ်သုံးပုံ · Tipiṭaka</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b6f47">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root, [data-theme="parchment"] {
    --bg-1: #f0d5a0;
    --bg-2: #e2c185;
    --paper: #fbeed0;
    --paper-2: #f5e2b4;
    --paper-3: #eed99f;
    --ink: #2d2115;
    --ink-dim: #6b5738;
    --ink-mute: #a08967;
    --accent: #c62d2d;
    --accent-2: #8b6f47;
    --gold: #b8860b;
    --border: #d4b075;
    --border-soft: #e2c58a;
    --shadow: 0 8px 24px rgba(139,100,40,0.22);
    --rule: rgba(198,45,45,0.35);
    --line: rgba(139,100,40,0.28);
    --serif: 'Georgia', 'Cambria', 'Times New Roman', serif;
    --sans: 'Pyidaungsu', 'Padauk', 'Myanmar Text', 'Segoe UI', system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --bg-1: #1a1310; --bg-2: #2a1e18;
    --paper: #2f231a; --paper-2: #3a2c22; --paper-3: #453629;
    --ink: #f5e2b4; --ink-dim: #c9ac74; --ink-mute: #8a7654;
    --accent: #e8a3a3; --accent-2: #d4b075; --gold: #ffd76a;
    --border: #4a3a2a; --border-soft: #3a2c22;
    --shadow: 0 8px 24px rgba(0,0,0,0.5);
    --rule: rgba(232,163,163,0.4); --line: rgba(212,176,117,0.22);
  }
  [data-theme="royal"] {
    --bg-1: #1a1830; --bg-2: #2d2650;
    --paper: #241e42; --paper-2: #2d2650; --paper-3: #362e5d;
    --ink: #f2d98a; --ink-dim: #d4b56a; --ink-mute: #9b8248;
    --accent: #ffd76a; --accent-2: #b8860b; --gold: #ffd76a;
    --border: #4a3d78; --border-soft: #362e58;
    --shadow: 0 12px 32px rgba(0,0,0,0.55);
    --rule: rgba(255,215,106,0.4); --line: rgba(212,181,106,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--sans); }
  body {
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px;
    display: flex; justify-content: center;
  }

  .app {
    background: var(--paper);
    max-width: 900px;
    width: 100%;
    border-radius: 6px;
    padding: 32px 40px 40px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    position: relative;
    background-image: linear-gradient(to right, transparent 0, transparent 32px,
                     var(--rule) 32px, var(--rule) 34px, transparent 34px);
  }
  [data-theme="royal"] .app {
    background: radial-gradient(ellipse at top, rgba(255,215,106,0.05), transparent 60%), var(--paper);
    border-color: var(--gold);
  }

  header {
    padding-bottom: 18px;
    margin-bottom: 22px;
    border-bottom: 1.5px solid var(--line);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header .title { flex: 1; min-width: 200px; padding-left: 12px; }
  header h1 {
    font-family: var(--serif);
    font-size: 2rem;
    font-weight: 600;
    color: var(--accent);
    font-style: italic;
    letter-spacing: 0.02em;
  }
  header .subtitle {
    font-family: var(--serif);
    font-style: italic;
    color: var(--ink-dim);
    font-size: 0.92rem;
    margin-top: 2px;
  }

  .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    text-decoration: none;
    transition: all 0.15s;
    font-family: inherit;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }

  .search-bar {
    display: flex; gap: 10px; align-items: center;
    padding-left: 12px;
    margin-bottom: 20px;
  }
  .search-bar input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--paper-2);
    color: var(--ink);
    font-size: 0.95rem;
    outline: none;
    font-family: inherit;
  }
  .search-bar input:focus { border-color: var(--accent); }

  .pitaka-nav {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding-left: 12px;
    margin-bottom: 24px;
  }
  .pitaka-nav .p-btn {
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--paper-2);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    font-style: italic;
    font-weight: 600;
  }
  .pitaka-nav .p-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .pitaka-nav .p-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .pitaka-nav .p-btn .p-my {
    display: block;
    font-family: var(--sans);
    font-size: 1rem;
    font-style: normal;
    font-weight: 700;
    margin-bottom: 2px;
  }
  @media (max-width: 640px) {
    .pitaka-nav { grid-template-columns: 1fr; }
  }

  .content { padding-left: 12px; }
  .section-title {
    font-family: var(--serif);
    font-style: italic;
    color: var(--accent);
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .section-sub {
    font-family: var(--serif);
    color: var(--ink-mute);
    font-size: 0.85rem;
    font-style: italic;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .section-intro {
    background: var(--paper-2);
    border-left: 3px solid var(--accent-2);
    padding: 12px 16px;
    border-radius: 4px;
    margin-bottom: 20px;
    color: var(--ink);
    line-height: 1.8;
    font-size: 0.95rem;
  }

  .book-list {
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .book-card {
    background: var(--paper-2);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 14px 16px;
    transition: border-color 0.15s;
  }
  .book-card:hover { border-color: var(--border); }
  .book-card .b-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 10px; flex-wrap: wrap;
    cursor: pointer;
  }
  .book-card .b-name {
    font-family: var(--serif);
    font-style: italic;
    color: var(--accent);
    font-weight: 600;
    font-size: 1rem;
  }
  .book-card .b-my {
    color: var(--ink);
    font-size: 1.05rem;
    font-weight: 600;
    font-family: var(--sans);
    margin-right: 6px;
  }
  .book-card .b-count {
    font-family: var(--serif);
    color: var(--ink-mute);
    font-size: 0.8rem;
    font-style: italic;
  }
  .book-card .b-desc {
    margin-top: 6px;
    color: var(--ink-dim);
    font-size: 0.88rem;
    line-height: 1.7;
  }
  .book-card .b-children {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    display: none;
    flex-direction: column;
    gap: 6px;
  }
  .book-card.open .b-children { display: flex; }
  .book-card .b-chev { color: var(--ink-mute); font-size: 0.85rem; transition: transform 0.2s; }
  .book-card.open .b-chev { transform: rotate(90deg); }
  .child-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 6px 10px;
    background: var(--paper);
    border-radius: 4px;
    font-size: 0.86rem;
    color: var(--ink);
  }
  .child-row.has-content {
    cursor: pointer;
    border-left: 3px solid var(--accent);
  }
  .child-row.has-content:hover { background: var(--paper-3); }
  .child-row .c-name { font-family: var(--sans); font-weight: 600; }
  .child-row .c-pali { color: var(--ink-mute); font-family: var(--serif); font-style: italic; font-size: 0.78rem; }

  /* Full-text sutta reader */
  .sutta {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 22px 26px;
    margin-top: 20px;
    animation: sutFade 0.4s ease;
  }
  @keyframes sutFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .sutta .s-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .sutta .s-my {
    font-family: var(--sans);
    color: var(--accent);
    font-size: 1.35rem;
    font-weight: 700;
  }
  .sutta .s-pali {
    font-family: var(--serif);
    font-style: italic;
    color: var(--ink-mute);
    font-size: 0.9rem;
    margin-bottom: 16px;
  }
  .sutta .s-source {
    font-family: var(--serif);
    color: var(--ink-mute);
    font-style: italic;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
  }
  .sutta .s-context {
    background: var(--paper-2);
    border-left: 3px solid var(--gold);
    padding: 10px 14px;
    border-radius: 4px;
    margin-bottom: 16px;
    font-size: 0.9rem;
    line-height: 1.8;
    color: var(--ink-dim);
    font-style: italic;
  }
  .sutta .s-body {
    display: flex; flex-direction: column;
    gap: 14px;
  }
  .sutta .lang {
    padding: 12px 16px;
    background: var(--paper-2);
    border-left: 3px solid var(--accent-2);
    border-radius: 4px;
    font-size: 1rem;
    line-height: 1.9;
  }
  .sutta .lang.my {
    font-family: var(--sans);
    color: var(--ink);
    border-left-color: var(--accent);
  }
  .sutta .lang.pali {
    font-family: var(--serif);
    font-style: italic;
    color: var(--accent);
  }
  .sutta .lang.en {
    font-family: var(--serif);
    color: var(--ink);
  }
  .sutta .lang .lbl {
    display: block;
    font-family: var(--sans);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-mute);
    font-style: normal;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .sutta .s-actions {
    display: flex; gap: 6px;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  .sutta .mini-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-dim);
    padding: 5px 12px;
    border-radius: 6px;
    font-family: var(--sans);
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .sutta .mini-btn:hover { color: var(--accent); border-color: var(--accent); }
  .sutta .mini-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .close-sutta {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-dim);
    padding: 6px 14px;
    border-radius: 6px;
    font-family: var(--sans);
    font-size: 0.85rem;
    cursor: pointer;
    margin-bottom: 12px;
  }
  .close-sutta:hover { color: var(--accent); border-color: var(--accent); }

  .external-links {
    margin-top: 24px;
    padding: 14px 16px;
    background: var(--paper-2);
    border: 1px dashed var(--border);
    border-radius: 6px;
    font-size: 0.85rem;
  }
  .external-links .el-title {
    font-family: var(--serif);
    color: var(--accent);
    font-weight: 600;
    font-style: italic;
    margin-bottom: 6px;
  }
  .external-links a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-style: dotted;
    display: block;
    padding: 3px 0;
  }
  .external-links a:hover { color: var(--gold); }

  .stats {
    padding: 12px;
    text-align: center;
    color: var(--ink-mute);
    font-family: var(--serif);
    font-style: italic;
    font-size: 0.85rem;
    margin-top: 20px;
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 16px; box-shadow: var(--shadow);
    font-size: 0.85rem; opacity: 0; pointer-events: none;
    transition: all 0.25s; z-index: 1000;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 640px) {
    body { padding: 12px 8px; }
    .app { padding: 20px 20px 28px; padding-left: 32px;
      background-image: linear-gradient(to right, transparent 0, transparent 20px,
                       var(--rule) 20px, var(--rule) 22px, transparent 22px);
    }
    header h1 { font-size: 1.5rem; }
    .content, .search-bar, .pitaka-nav { padding-left: 0; }
    .sutta { padding: 16px 18px; }
    .sutta .s-my { font-size: 1.15rem; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <h1>ပိဋကတ်သုံးပုံ · Tipiṭaka</h1>
        <div class="subtitle">မြန်မာဘာသာပြန် · The Three Baskets (Myanmar Translation)</div>
      </div>
      <div class="header-actions">
        <a class="icon-btn" href="index.html" title="Home">🏠</a>
        <button class="icon-btn" id="themeBtn" title="Theme">📜</button>
        <button class="icon-btn" id="favToggle" title="Favorites">⭐</button>
      </div>
    </header>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="🔍 ရှာဖွေရန် — သုတ်၊ ကျမ်း၊ ဘာသာပြန် (Search suttas, books, translations)">
    </div>

    <div class="pitaka-nav" id="pitakaNav"></div>

    <div class="content" id="content"></div>

    <div class="stats" id="stats"></div>
  </div>

  <div class="toast" id="toast"></div>

<script defer src="_palette.js"></script>
<script defer src="_navrail.js"></script>
<script defer src="_ui.js"></script>

<script>
  const THEME_KEY = 'tipitaka.theme';
  const FAV_KEY = 'tipitaka.favs.v1';
  const THEMES = ['parchment', 'dark', 'royal'];
  const $ = id => document.getElementById(id);

  // ═══════════════════════════════════════════════════════════════
  // TIPIṬAKA STRUCTURE — full three-basket index in Myanmar
  // ═══════════════════════════════════════════════════════════════

  const PITAKAS = [
    {
      id: 'vinaya',

      pali: 'Vinaya Piṭaka',
      en: 'The Discipline Basket',

        { my: 'မဟာဝဂ်ပါဠိတော်', pali: 'Mahāvagga Pāḷi', desc: 'သာသနာစတင်ကာလ၊ ရဟန်းအဖြစ်ရရှိခြင်း (ဥပသမ္ပဒ)၊ ဥပုသ်၊ ဝါဆို၊ ပဝါရဏာ။', suttaCount: 10 },

      ],
    },
    {
      id: 'sutta',
      my: 'သုတ္တန်ပိဋက',
      pali: 'Sutta Piṭaka',
      en: 'The Discourses Basket',
      intro: 'မြတ်စွာဘုရား၏ တရားတော်၊ တပည့်တော်ကြီးများ၏ တရားများ။ နိကာယ် ၅ ရပ်ဖြင့် ဖွဲ့စည်းထား၏။ Dhammapada, Jātaka တို့ ခုဒ္ဒကနိကာယ်တွင် ပါဝင်၏။',

        },
        {
          my: 'မဇ္ဈိမနိကာယ်', pali: 'Majjhima Nikāya', desc: 'အလယ်အလတ်အရွယ် သုတ်တော် ၁၅၂ သုတ်။', suttaCount: 152,
          children: [
            { my: 'မူလပဏ္ဏာသပါဠိတော်', pali: 'Mūlapaṇṇāsa', count: 50, key: 'mn-satipatthana' },
            { my: 'မဇ္ဈိမပဏ္ဏာသပါဠိတော်', pali: 'Majjhimapaṇṇāsa', count: 50 },

  // ═══════════════════════════════════════════════════════════════
  // State
  // ═══════════════════════════════════════════════════════════════

  let activePitaka = 'sutta';
  let activeSutta = null;
  let searchQuery = '';
  let showFavsOnly = false;

  function favSet() { try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); } catch { return new Set(); } }
  function saveFav(s) { localStorage.setItem(FAV_KEY, JSON.stringify([...s])); }

  function applyTheme(t) {
    if (!THEMES.includes(t)) t = 'parchment';
    document.documentElement.dataset.theme = t;
    localStorage.setItem(THEME_KEY, t);
    $('themeBtn').textContent = t === 'parchment' ? '📜' : t === 'dark' ? '🌙' : '👑';
  }
  applyTheme(localStorage.getItem(THEME_KEY) || 'parchment');
  $('themeBtn').onclick = () => {
    const i = THEMES.indexOf(document.documentElement.dataset.theme || 'parchment');
    applyTheme(THEMES[(i + 1) % THEMES.length]);
  };

  let toastTimer;
  function toast(msg) {
    $('toast').textContent = msg;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
  }

  function renderPitakaNav() {
    const nav = $('pitakaNav');
    nav.innerHTML = '';
    PITAKAS.forEach(p => {
      const b = document.createElement('button');
      b.className = 'p-btn' + (p.id === activePitaka ? ' active' : '');
      b.innerHTML = `<span class="p-my">${p.my}</span>${p.pali}`;
      b.onclick = () => { activePitaka = p.id; activeSutta = null; renderPitakaNav(); renderContent(); };
      nav.appendChild(b);
    });
  }

  function renderContent() {
    const c = $('content');
    c.innerHTML = '';

    // If a sutta is open, show that
    if (activeSutta) {
      c.appendChild(renderSuttaCard(activeSutta));
      updateStats();
      return;
    }

    // Otherwise render the current pitaka's books
    const pitaka = PITAKAS.find(p => p.id === activePitaka);
    const header = document.createElement('div');
    header.innerHTML = `
      <div class="section-title">${pitaka.my}</div>
      <div class="section-sub">${pitaka.pali} — ${pitaka.en}</div>
      <div class="section-intro">${pitaka.intro}</div>
    `;
    c.appendChild(header);

    const list = document.createElement('div');
    list.className = 'book-list';

    pitaka.books.forEach((book, idx) => {
      const card = document.createElement('div');
      card.className = 'book-card';
      card.innerHTML = `
        <div class="b-head">
          <div>
            <span class="b-my">${book.my}</span>
            <span class="b-name">· ${book.pali}</span>
          </div>
          <div>
            ${book.suttaCount ? `<span class="b-count">${book.suttaCount} entries</span> ` : ''}
            ${book.children?.length || SUTTAS[book.key] ? '<span class="b-chev">▶</span>' : ''}
          </div>
        </div>
        <div class="b-desc">${book.desc || ''}</div>
        <div class="b-children"></div>
      `;
      const children = card.querySelector('.b-children');
      if (book.children?.length) {
        book.children.forEach(ch => {
          const row = document.createElement('div');
          row.className = 'child-row' + (SUTTAS[ch.key] || ch.link ? ' has-content' : '');
          const link = ch.link || (SUTTAS[ch.key] ? '#sutta:' + ch.key : null);
          row.innerHTML = `
            <span><span class="c-name">${ch.my}</span> <span class="c-pali">· ${ch.pali}</span></span>
            <span class="c-pali">${ch.count} ${SUTTAS[ch.key] ? '· 📖 ဖတ်ရန်' : ch.link ? '· 🔗 ဖွင့်ရန်' : ''}</span>
          `;
          if (ch.link) row.onclick = () => location.href = ch.link;
          else if (SUTTAS[ch.key]) row.onclick = (e) => { e.stopPropagation(); activeSutta = ch.key; renderContent(); };
          children.appendChild(row);
        });
      }
      // Whole card click toggles expand
      card.querySelector('.b-head').onclick = () => card.classList.toggle('open');
      list.appendChild(card);
    });
    c.appendChild(list);

    // External resource links
    const ext = document.createElement('div');
    ext.className = 'external-links';
    ext.innerHTML = `
      <div class="el-title">🔗 ပြင်ပ အရင်းအမြစ်များ · External Sources</div>
      <a href="https://tipitaka.org" target="_blank" rel="noopener">tipitaka.org — Chaṭṭha Saṅgāyana Pāḷi (official Myanmar edition)</a>
      <a href="https://suttacentral.net/pitaka/sutta?lang=en" target="_blank" rel="noopener">SuttaCentral — English translations + Pāḷi</a>
      <a href="https://www.dhammatalks.org/suttas/index.html" target="_blank" rel="noopener">Dhamma Talks — Ajahn Ṭhānissaro's translations</a>
      <a href="https://www.myanmarttw.com" target="_blank" rel="noopener">Myanmar Tipiṭaka Translation — မြန်မာဘာသာပြန်</a>
    `;
    c.appendChild(ext);

    updateStats();
  }

  function renderSuttaCard(key) {
    const s = SUTTAS[key];
    if (!s) return document.createTextNode('');
    const favs = favSet();
    const isFav = favs.has(key);

    const wrap = document.createElement('div');
    const close = document.createElement('button');
    close.className = 'close-sutta';
    close.textContent = '← ပြန်သွားရန်';
    close.onclick = () => { activeSutta = null; renderContent(); };
    wrap.appendChild(close);

    const card = document.createElement('article');
    card.className = 'sutta';
    card.innerHTML = `
      <div class="s-head">
        <div>
          <div class="s-my">${s.my}</div>
          <div class="s-pali">${s.pali}</div>
        </div>
        <div class="s-source">${s.source}</div>
      </div>
      ${s.context ? `<div class="s-context">${s.context}</div>` : ''}
      <div class="s-body">
        <div class="lang my"><span class="lbl">မြန်မာ ဘာသာပြန်</span></div>
        <div class="lang pali"><span class="lbl">Pāḷi</span></div>
      </div>
      <div class="s-actions">
        <button class="mini-btn ${isFav ? 'active' : ''}" data-act="fav">${isFav ? '★ ကြိုက်နှစ်သက်' : '☆ ကြိုက်နှစ်သက်ရန်'}</button>
        <button class="mini-btn" data-act="copy">📋 ကူးရန်</button>
      </div>
    `;
    const bodies = card.querySelectorAll('.lang');
    // Myanmar body — join with double line breaks for readability
    bodies[0].appendChild(document.createTextNode('\n' + s.my_body.join('\n\n')));
    bodies[1].appendChild(document.createTextNode('\n' + s.pali_body.join('\n\n')));

    card.querySelector('[data-act="fav"]').onclick = () => {
      const f = favSet();
      f.has(key) ? f.delete(key) : f.add(key);
      saveFav(f);
      renderContent();
      toast(f.has(key) ? '★ Favorited' : '☆ Removed');
    };
    card.querySelector('[data-act="copy"]').onclick = () => {
      const txt = `${s.my} · ${s.pali}\n${s.source}\n\n${s.my_body.join('\n\n')}\n\n---\n\n${s.pali_body.join('\n\n')}`;
      navigator.clipboard.writeText(txt).then(() => toast('📋 Copied'));
    };
    wrap.appendChild(card);
    return wrap;
  }

  function updateStats() {
    const favs = favSet();
    const suttaCount = Object.keys(SUTTAS).length;
    $('stats').textContent = `${suttaCount} suttas included · ${favs.size} favorited · Full Tipiṭaka structure indexed`;
  }

  // Search
  $('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim().toLowerCase();
    if (!searchQuery) { renderContent(); return; }
    // Simple search across sutta names + book names
    const c = $('content');
    c.innerHTML = '';
    const header = document.createElement('div');
    header.innerHTML = `<div class="section-title">Search results</div><div class="section-sub">for "${searchQuery}"</div>`;
    c.appendChild(header);

    const list = document.createElement('div');
    list.className = 'book-list';
    let hits = 0;

    // Search suttas
    Object.entries(SUTTAS).forEach(([key, s]) => {
      const hay = (s.my + ' ' + s.pali + ' ' + s.source + ' ' + s.context + ' ' + s.my_body.join(' ') + ' ' + s.pali_body.join(' ')).toLowerCase();
      if (hay.includes(searchQuery)) {
        const row = document.createElement('div');
        row.className = 'book-card';
        row.innerHTML = `<div class="b-head"><div><span class="b-my">${s.my}</span> <span class="b-name">· ${s.pali}</span></div><div><span class="b-count">📖 open</span></div></div><div class="b-desc">${s.source}</div>`;
        row.onclick = () => { activeSutta = key; searchQuery = ''; $('searchInput').value = ''; renderContent(); };
        list.appendChild(row);
        hits++;
      }
    });
    // Search books
    PITAKAS.forEach(p => {
      p.books.forEach(b => {
        const hay = (b.my + ' ' + b.pali + ' ' + (b.desc || '')).toLowerCase();
        if (hay.includes(searchQuery)) {
          const row = document.createElement('div');
          row.className = 'book-card';
          row.innerHTML = `<div class="b-head"><div><span class="b-my">${b.my}</span> <span class="b-name">· ${b.pali}</span></div><div><span class="b-count">${p.my}</span></div></div><div class="b-desc">${b.desc || ''}</div>`;
          row.onclick = () => { activePitaka = p.id; searchQuery = ''; $('searchInput').value = ''; renderPitakaNav(); renderContent(); };
          list.appendChild(row);
          hits++;
        }
      });
    });

    if (!hits) list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--ink-mute);font-style:italic;">မတွေ့ပါ။ (No matches.)</div>';
    c.appendChild(list);
  });

  $('favToggle').onclick = () => {
    const favs = favSet();
    if (!favs.size) { toast('No favorites yet'); return; }
    const c = $('content');
    c.innerHTML = '';
    const header = document.createElement('div');
    header.innerHTML = `<div class="section-title">⭐ ကြိုက်နှစ်သက်ရာ · Favorites</div><div class="section-sub">${favs.size} suttas</div>`;
    c.appendChild(header);
    const list = document.createElement('div'); list.className = 'book-list';
    favs.forEach(key => {
      const s = SUTTAS[key]; if (!s) return;
      const row = document.createElement('div');
      row.className = 'book-card';
      row.innerHTML = `<div class="b-head"><div><span class="b-my">${s.my}</span> <span class="b-name">· ${s.pali}</span></div><div><span class="b-count">📖 open</span></div></div><div class="b-desc">${s.source}</div>`;
      row.onclick = () => { activeSutta = key; renderContent(); };
      list.appendChild(row);
    });
    c.appendChild(list);
  };

  // Init
  renderPitakaNav();
  renderContent();
</script>
</body>
</html>
