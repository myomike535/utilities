တ်","summary":"ဘုရားလောင်း ပဒုမမင်းသားသည် ဘေးဒုက္ခရောက်စဉ် မိမိဇနီးကို အသက်ပဓာနမထား စောင့်ရှောက်ခဲ့သော်လည်း ဇနီးသည် ကိုယ်လက်အင်္ဂါ ချို့တဲ့သော ရာဇဝတ်သားနှင့် ဖောက်ပြန်ကာ မင်းသားကို ချောက်ကမ်းပါးမှ တွန်းချသည်။ မင်းသားသည် အသက်ချမ်းသာရာရ၍ မင်းဖြစ်လာသောအခါ ထိုမိန်းမ၏ သစ္စာဖောက်မှုကို ဖော်ထုတ်တော်မူလေသည်။","moral":"ကျေးဇူးကန်း သစ္စာဖောက်ခြင်းသည် နောက်ဆုံး၌ ပေါ်လွင်၍ အကျိုးယုတ်စေ၏။"},{"no":194,"pali":"Maṇicorajātaka","mm":"မဏိစောရဇာတ်","summary":"မတရားသောမင်းသည် ဘုရားလောင်း၏ ဇနီးကို လိုချင်သဖြင့် ပတ္တမြားခိုးမှုဖြင့် မတရားစွပ်စွဲကာ သတ်စေရန် အမိန့်ချသည်။ သိကြားမင်း ကြွဆင်းလာ၍ မတရားသောမင်းကို အပြစ်ဒဏ်သင့်စေပြီး ဘုရားလောင်းကို မင်းအဖြစ် တင်မြှောက်လေသည်။","moral":"မတရားပြုသောသူသည် မိမိပြုသောဒဏ်ကို မိမိသာ ပြန်၍ခံရ၏။"},{"no":195,"pali":"Pabbatūpattharajātaka","mm":"ပဗ္ဗတူပတ္ထရဇာတ်","summary":"တောင်ခြေရှိ ရေကန်၌ပွင့်သော ကြာပန်း ဥပမာဖြင့် ဘုရားလောင်းအမတ်က မင်းကြီးအား အကြံဉာဏ်ပေးသောဇာတ် ဖြစ်သည်။ မိမိ ချစ်မြတ်နိုးရသော အနီးအပါးရှိသူတို့၏ မှားယွင်းမှုကို သည်းခံခွင့်လွှတ်သင့်ကြောင်း ဆုံးမ၏။","moral":"ချစ်ခင်ရသူတို့၏ အမှားကို သည်းခံခွင့်လွှတ်တတ်ခြင်းသည် မြတ်၏။"},{"no":196,"pali":"Valāhakassajātaka","mm":"ဝလာဟကဿဇာတ်","summary":"သင်္ဘောပျက်၍ ဘီလူးမတို့ ကျွန်းသို့ ရောက်နေသော ကုန်သည်တို့အား ဘုရားလောင်း ဝလာဟက မြင်းပျံမင်းက မိမိနှင့် လိုက်ပါလျှင် ကယ်တင်မည်ဟု ကြွေးကြော်သည်။ လိုက်ပါသောသူတို့သည် ဘေးလွတ်ရာသို့ ရောက်ကြပြီး ကာမဂုဏ်၌ တွယ်တာ၍ ကျန်ရစ်သူတို့မူကား ဘီလူးမတို့၏ စားခြင်းကို ခံကြရလေသည်။","moral":"ပညာရှိ၏ စကားကို နာယူလိုက်နာသောသူသည် ဘေးမှ လွတ်မြောက်၏။"},{"no":197,"pali":"Mittāmittajātaka","mm":"မိတ္တာမိတ္တဇာတ်","summary":"မိတ်ဆွေစစ်နှင့် ရန်သူတို့၏ လက္ခဏာများကို ခွဲခြားသိမြင်နိုင်ပုံကို ဘုရားလောင်းရသေ့ကြီးက ဟောကြားပြသသော ဇာတ်ဖြစ်သည်။ မျက်နှာမသာခြင်း၊ မကြိုဆိုခြင်း အစရှိသော အမူအရာတို့ဖြင့် ရန်သူကို သိနိုင်ကြောင်း ညွှန်ပြ၏။","moral":"အမူအရာ အပြုအမူအားဖြင့် မိတ်ဆွေနှင့် ရန်သူကို ခွဲခြားသိအပ်၏။"},{"no":198,"pali":"Rādhajātaka","mm":"ရာဓဇာတ်","summary":"ပုဏ္ဏားအိမ်၌ မွေးမြူထားသော ကျေးညီနောင်တို့သည် အိမ်ရှင်မ၏ အကျင့်ကို စောင့်ကြည့်ရန် တာဝန်ပေးအပ်ခြင်း ခံရသည်။ အိမ်ရှင်မ ဖောက်ပြန်သောအခါ ပညာရှိကျေးက အဆုံးအမကို လက်မခံနိုင်သူအား ဆုံးမစကားဆိုခြင်းသည် အကျိုးမရှိသည့်ပြင် ဘေးပင်ရောက်စေတတ်ကြောင်း ဆင်ခြင်လေသည်။","moral":"အဆုံးအမကို ခံယူနိုင်သောသူအားသာ ဆုံးမစကား ဆိုအပ်၏။"},{"no":199,"pali":"Gahapatijātaka","mm":"ဂဟပတိဇာတ်","summary":"ဘုရားလောင်း အိမ်ရှင်အမျိုးသား၏ ဇနီးသည် ရွာသူကြီးနှင့် ဖောက်ပြန်ကာ လင်ဖြစ်သူကို လှည့်စားရန် ကြံစည်သည်။ ဘုရားလောင်းသည် ပရိယာယ်ဉာဏ်ဖြင့် သူတို့၏ မကောင်းမှုကို လက်ရဖမ်းမိစေ၍ ရွာသူကြီးကို အပြစ်ဒဏ်ပေး ဆုံးမလေသည်။","moral":"မကောင်းမှုသည် ကာလကြာလျှင် ပေါ်လွင်၍ အပြစ်ဒဏ် သင့်စေ၏။"},{"no":200,"pali":"Sādhusīlajātaka","mm":"သာဓုသီလဇာတ်","summary":"ပုဏ္ဏားတစ်ဦးသည် မိမိ၏ သမီးလေးယောက်ကို အဆင်းလှသူ၊ အသက်ကြီးသူ၊ အမျိုးမြတ်သူ၊ သီလရှိသူဟူသော လူလေးဦးအနက် မည်သူ့အား ပေးစားသင့်သနည်းဟု ဘုရားလောင်းဆရာကြီးအား မေးလျှောက်သည်။ ဆရာကြီးက သီလရှိသူသည်သာ အမြတ်ဆုံးဖြစ်၍ သူ့အားသာ ပေးစားသင့်ကြောင်း ဖြေကြားလေသည်။","moral":"အဆင်း၊ အသက်၊ အမျိုးတို့ထက် သီလဂုဏ်သည်သာ မြတ်၏။"},{"no":201,"pali":"Bandhanāgārajātaka","mm":"ဗန္ဓနာဂါရဇာတ်","summary":"ဘုရားလောင်းသည် ဆင်းရဲသောအမျိုး၌ ဖွားမြင်၍ မိခင်ကို လုပ်ကျွေးပြုစုနေစဉ် အလိုမတူဘဲ အိမ်ထောင်ချပေးခြင်း ခံရသည်။ သံကြိုးသံခြေချင်းတို့ထက် သားမယားတို့အပေါ်ထားသော တွယ်တာမှုသည်သာ အခိုင်မြဲဆုံး အနှောင်အဖွဲ့ဖြစ်ကြောင်း ဆင်ခြင်မိ၍ တောထွက်ကာ ရသေ့ရဟန်းပြုတော်မူသည်။","moral":"တဏှာတွယ်တာမှုသည် သံကြိုးထက် ခိုင်မြဲသော အနှောင်အဖွဲ့ဖြစ်၏။"},{"no":202,"pali":"Keḷisīlajātaka","mm":"ကေဠိသီလဇာတ်","summary":"ဗာရာဏသီမင်းသည် သက်ကြီးရွယ်အိုတို့ကို ပြက်ရယ်ပြု၍ ကျီစယ်လေ့ရှိရာ ဘုရားလောင်း သိကြားမင်းသည် အိုမင်းသောသူ အသွင်ဆောင်လာပြီး မင်းကြီးအား အရှက်တကွဲဖြစ်စေကာ သက်ကြီးသူတို့ကို ရိုသေလေးစားရမည်ဟု ဆုံးမတော်မူသည်။","moral":"သက်ကြီးရွယ်အိုတို့ကို မထီမဲ့မြင်မပြုဘဲ ရိုသေလေးစားအပ်၏။"},{"no":203,"pali":"Khaṇḍajātaka","mm":"ခဏ္ဍဇာတ်","summary":"ရသေ့တစ်ပါး မြွေကိုက်ခံရ၍ သေဆုံးသောအခါ ဘုရားလောင်း ဆရာရသေ့ကြီးသည် မြွေမင်းအမျိုးလေးပါးနှင့် သတ္တဝါအားလုံးတို့အပေါ် မေတ္တာပွားများခြင်းဖြင့် အဆိပ်ဘေးရန်မှ ကာကွယ်နည်းကို တပည့်တို့အား ဟောကြားတော်မူသည်။","moral":"မေတ္တာတရားသည် ဘေးရန်အပေါင်းကို ကာကွယ်နိုင်၏။"},{"no":204,"pali":"Vīrakajātaka","mm":"ဝီရကဇာတ်","summary":"ဘုရားလောင်းသည် ရေ၌ငုပ်၍ ငါးဖမ်းစားနိုင်သော ရေကျီး ဝီရကဖြစ်၏။ သာမန်ကျီးတစ်ကောင်သည် သူ့ကို အတုယူ၍ ရေထဲငုပ်ရာ ရေမြက်ပင်တို့တွင် ငြိတွယ်ကာ သေဆုံးရသည်။","moral":"မိမိစွမ်းရည်ထက် လွန်၍ သူတစ်ပါးကို အတုမယူအပ်။"},{"no":205,"pali":"Gaṅgeyyajātaka","mm":"ဂင်္ဂေယျဇာတ်","summary":"ဂင်္ဂါမြစ်နေငါးနှင့် ယမုနာမြစ်နေငါးတို့သည် မည်သူ ပို၍လှသနည်းဟု ငြင်းခုံကြပြီး လိပ်ကြီးအား အဆုံးအဖြတ်ခံရာ လိပ်ကြီးက မိမိသည်သာ နှစ်ဦးစလုံးထက်လှသည်ဟု ဖြေဆိုသဖြင့် ငြင်းခုံမှု အချည်းနှီးဖြစ်ရသည်။","moral":"အဆင်းအလှ၌ ဂုဏ်ပြိုင်ထောင်လွှားခြင်းသည် အကျိုးမဲ့သာဖြစ်၏။"},{"no":206,"pali":"Kuruṅgamigajātaka","mm":"ကုရုင်္ဂမိဂဇာတ်","summary":"မုဆိုးထောင်သော ကျော့ကွင်း၌မိသော ဘုရားလောင်း ကုရုင်္ဂသားကောင်ကို လိပ်က ကြိုးကို ကိုက်ဖြတ်ပေးပြီး သစ်တောက်ငှက်က မုဆိုးကို နှောင့်နှေးအောင် ပြုလုပ်ကာ ကယ်တင်ကြသည်။ နောက်ပိုင်း လိပ် အဖမ်းခံရသောအခါ သားကောင်ကလည်း ကျေးဇူးဆပ်၍ ပြန်လည်ကယ်တင်သည်။","moral":"မိတ်ဆွေကောင်းတို့ ညီညွတ်စွာ ကူညီခြင်းဖြင့် ဘေးမှ လွတ်မြောက်နိုင်၏။"},{"no":207,"pali":"Assakajātaka","mm":"အဿကဇာတ်","summary":"အဿကမင်းသည် ကွယ်လွန်သော မိဖုရားကို အလွန်တမ်းတ ငိုကြွေးနေရာ ဘုရားလောင်းရသေ့က မိဖုရားသည် ယခုဘဝ၌ ပိုးကောင်ငယ်ဖြစ်နေပြီး ယခင်ဘဝကို မတမ်းတတော့ကြောင်း ပြသသဖြင့် မင်းကြီး၏ ပူဆွေးသောက ငြိမ်းအေးသွားသည်။","moral":"ချစ်ခြင်းတွယ်တာမှုသည် မမြဲ၊ ပူဆွေးခြင်းကို ပညာဖြင့် ဖြေအပ်၏။"},{"no":208,"pali":"Susumārajātaka","mm":"သုသုမာရဇာတ်","summary":"မိကျောင်းမသည် မျောက်နှလုံးကို စားလိုသဖြင့် မိကျောင်းက ဘုရားလောင်းမျောက်မင်းကို မြစ်တစ်ဖက်ကမ်းသို့ ပို့ဆောင်မည်ဟု လှည့်ဖြားသည်။ မျောက်မင်းက မိမိနှလုံးကို သဖန်းပင်ပေါ်၌ ချိတ်ဆွဲထားသည်ဟု ပညာဖြင့် ပြန်လည်လှည့်ဖြား၍ ဘေးမှ လွတ်မြောက်သည်။","moral":"ပညာရှိသည် ဘေးအန္တရာယ်၌ မတုန်လှုပ်ဘဲ လွတ်မြောက်နိုင်၏။"},{"no":209,"pali":"Kukkuṭajātaka","mm":"ကုက္ကုဋဇာတ်","summary":"မုဆိုးသည် သစ်ခက်သစ်ရွက်တို့ဖြင့် ကိုယ်ကို ဖုံးကွယ်လျက် ငှက်ဖမ်းရန် ချဉ်းကပ်ရာ ဘုရားလောင်းငှက်က လမ်းလျှောက်တတ်သော သစ်ပင်ကို မမြင်ဖူးသေးဟုဆိုကာ ရှောင်လွှဲသွားသဖြင့် မုဆိုး လက်ချည်းသက်သက် ပြန်ရသည်။","moral":"သတိပညာရှိသူကို လှည့်ဖြားဖုံးကွယ်၍ မရနိုင်။"},{"no":210,"pali":"Kandagalakajātaka","mm":"ကန္ဒဂလကဇာတ်","summary":"ဘုရားလောင်း သစ်တောက်ငှက်သည် သစ်မာပင်တို့ကိုပင် ထိုးဖောက်နိုင်၏။ အပင်ပျော့တို့ကိုသာ ထိုးဖူးသော မိတ်ဆွေ ကန္ဒဂလက သစ်တောက်ငှက်သည် သူ့ကိုအတုယူ၍ ခဒိရသစ်မာပင်ကို ထိုးရာ နှုတ်သီးကျိုးကာ သေဆုံးရသည်။","moral":"မိမိစွမ်းရည်ကို ချင့်ချိန်၍သာ ဆောင်ရွက်အပ်၏။"},{"no":211,"pali":"Somadattajātaka","mm":"သောမဒတ္တဇာတ်","summary":"မင်းမှုထမ်း ဘုရားလောင်း သောမဒတ္တသည် နွားတစ်ကောင်သေဆုံးသော ဖခင်ပုဏ္ဏားအိုအား မင်းထံ နွားတောင်းခံရန် တစ်နှစ်ပတ်လုံး စကားလေ့ကျင့်ပေးသော်လည်း ဖခင်သည် မင်းရှေ့မှောက်၌ နွားပေးပါဟု ဆိုမည့်အစား နွားယူပါဟု မှားယွင်းစွာ လျှောက်တင်မိသည်။ မင်းကြီးက သဘောပေါက်၍ နွားများ ချီးမြှင့်သည်။","moral":"လေ့ကျင့်မှု မရင့်ကျက်သူသည် အရေးအခါ၌ မှားယွင်းတတ်၏။"},{"no":212,"pali":"Ucchiṭṭhabhattajātaka","mm":"ဥစ္ဆိဋ္ဌဘတ္တဇာတ်","summary":"ပုဏ္ဏားတစ်ဦး၏ မယားသည် ချစ်သူကို အိမ်၌ဝှက်ထားပြီး ခင်ပွန်းအား စားကြွင်းထမင်းအပေါ်၌ ထမင်းပူအုပ်၍ ကျွေးရာ လှည့်လည်တောင်းစားသော ဘုရားလောင်းက ထမင်းအပေါ်ပူ အောက်အေးနေသည်ကို ထောက်ရှု၍ ဝှက်ထားသောသူကို ဖော်ထုတ်ပေးသည်။","moral":"မကောင်းမှုကို ကြာရှည်စွာ ဖုံးကွယ်၍ မရနိုင်။"},{"no":213,"pali":"Bharujātaka","mm":"ဘရုဇာတ်","summary":"ဘရုတိုင်းမင်းသည် ရသေ့အုပ်စုနှစ်စုတို့၏ နေရာအငြင်းပွားမှု၌ တံစိုးလက်ဆောင်ယူ၍ မတရားစီရင်သဖြင့် နတ်တို့ အမျက်ထွက်ကာ တိုင်းပြည်ကို ပင်လယ်ရေ လွှမ်းမိုးဖျက်ဆီးသည်။","moral":"တံစိုးလက်ဆောင်စား၍ မတရားစီရင်ခြင်းသည် ပျက်စီးခြင်း၏ အကြောင်းရင်းဖြစ်၏။"},{"no":214,"pali":"Puṇṇanadījātaka","mm":"ပုဏ္ဏနဒီဇာတ်","summary":"ဗာရာဏသီမင်းသည် ကုန်းချောစကားကြောင့် ပညာရှိပုရောဟိတ် ဘုရားလောင်းကို ရာထူးမှ ချခဲ့ပြီးနောက် စကားဝှက်လင်္ကာဖြင့် စမ်းသပ်မေးမြန်းသည်။ ဘုရားလောင်းသည် အနက်ကို မှန်ကန်စွာ ဖြေဆိုနိုင်၍ မူလရာထူးသို့ ပြန်လည်ရောက်ရှိသည်။","moral":"ပညာရှိ၏ တန်ဖိုးသည် အခါခပ်သိမ်း မလျော့မယုတ်။"},{"no":215,"pali":"Kacchapajātaka","mm":"ကစ္ဆပဇာတ်","summary":"လိပ်သည် ဟင်္သာနှစ်ကောင်နှင့် မိတ်ဖွဲ့၍ တုတ်ချောင်းကို ကိုက်ကာ ကောင်းကင်ခရီး လိုက်ပါစဉ် အောက်မှလူတို့၏ စကားကိုကြား၍ ပြန်ပြောလိုသဖြင့် ပါးစပ်ဟမိရာ ကျ၍ သေဆုံးရသည်။ ဘုရားလောင်းအမတ်ကြီးသည် ဤဖြစ်ရပ်ဖြင့် စကားများသော မင်းကြီးကို ဆုံးမသည်။","moral":"နှုတ်ကို မစောင့်စည်းသူသည် ပျက်စီးခြင်းသို့ ရောက်တတ်၏။"},{"no":216,"pali":"Macchajātaka","mm":"မစ္ဆဇာတ်","summary":"ကွန်၌မိသော ငါးသည် သေဘေးထက် မိမိမယား သံသယဝင်မည်ကိုသာ ညည်းတွားနေရာ ဘုရားလောင်း ပုရောဟိတ်သည် ကာမတွယ်တာမှု၏ အပြစ်ကို သိမြင်စေလျက် ငါးကို လွှတ်ပေးလိုက်သည်။","moral":"ကာမတဏှာသည် သေဘေးထက်ပင် ပူလောင်စေတတ်၏။"},{"no":217,"pali":"Seggujātaka","mm":"သေဂ္ဂုဇာတ်","summary":"သီလရှိသော ဟင်းရွက်သည်ကုန်သည်သည် သမီးငယ်၏ အကျင့်သီလကို စမ်းသပ်လို၍ အကဲစမ်းရာ သမီးငယ်သည် ငိုကြွေးလျက် မိမိ၏ စင်ကြယ်မှုကို ထင်ရှားပြသဖြင့် သင့်တော်သူနှင့် ထိမ်းမြားပေးသည်။","moral":"သီလစင်ကြယ်မှုသည် စမ်းသပ်ခြင်း၌သာ ထင်ရှား၏။"},{"no":218,"pali":"Kūṭavāṇijajātaka","mm":"ကူဋဝါဏိဇဇာတ်","summary":"မရိုးသားသော ကုန်သည်က အပ်နှံထားသော ထွန်သွားသံတို့ကို ကြွက်စားသွားပြီဟု လိမ်လည်ရာ ရိုးသားသောကုန်သည်က ထိုသူ၏သားငယ်ကို ဝှက်ထားပြီး စွန်ချီသွားသည်ဟု ပြန်လည်ဖြေဆိုသည်။ ဘုရားလောင်း တရားသူကြီးက အမှုကို စစ်ဆေး၍ လိမ်လည်သူကို ဖော်ထုတ်သည်။","moral":"လိမ်လည်သူသည် မိမိ၏ လိမ်လည်မှုဖြင့်ပင် အရေးနိမ့်ရ၏။"},{"no":219,"pali":"Garahitajātaka","mm":"ဂရဟိတဇာတ်","summary":"ဘုရားလောင်း မျောက်မင်းသည် လူတို့ထံ ဖမ်းဆီးထားရာမှ လွတ်မြောက်၍ တောသို့ ပြန်ရောက်သောအခါ လူတို့သည် ရွှေငွေဥစ္စာနှင့် ကာမဂုဏ်တို့အတွက် အချင်းချင်း လိမ်လည်ရုန်းကန်နေကြောင်း ပြောပြရာ မျောက်အပေါင်းတို့သည် ကြားနာရန်ပင် မခံသာသဖြင့် နားပိတ်ကြသည်။","moral":"လောဘနှင့် ကာမဂုဏ်လိုက်စားမှုသည် ကဲ့ရဲ့အပ်သော တရားဖြစ်၏။"},{"no":220,"pali":"Dhammadhajajātaka","mm":"ဓမ္မဓဇဇာတ်","summary":"မင်းကြီးသည် ကုန်းချောသူ၏ တိုက်တွန်းချက်ကြောင့် သီလရှိသော ပုရောဟိတ် ဘုရားလောင်း ဓမ္မဓဇအား တစ်ညအတွင်း ဥယျာဉ်၊ ရေကန်စသည် ဖန်တီးရမည်ဟု မဖြစ်နိုင်သော အမိန့်များချမှတ်၍ သတ်ရန်ကြံသော်လည်း သိကြားမင်း၏ ကူညီမှုဖြင့် အလုံးစုံ ပြီးမြောက်ကာ ကုန်းချောသူသာ အပြစ်ဒဏ် ခံရသည်။","moral":"သီလရှိသူကို မကောင်းကြံသူသည် မိမိသာလျှင် ပျက်စီးရ၏။"},{"no":221,"pali":"Kāsāvajātaka","mm":"ကာသာဝဇာတ်","summary":"မုဆိုးသည် ဆင်တို့ကို သတ်ဖြတ်ရန် ဖန်ရည်ဆိုးအဝတ်ကို ဝတ်ဆင်၍ လှည့်ဖြားရာ ဘုရားလောင်း ဆင်မင်းသည် သိရှိသော်လည်း ကာသာဝအဝတ်ကို ရိုသေသဖြင့် အသက်ချမ်းသာပေးပြီး ကိလေသာမကင်းသူသည် ကာသာဝကို မဝတ်ထိုက်ဟု ဆုံးမသည်။","moral":"ကိလေသာအညစ်အကြေး ကင်းသူသာ ဖန်ရည်ဆိုးအဝတ်ကို ဝတ်ဆင်ထိုက်၏။"},{"no":222,"pali":"Cūḷanandiyajātaka","mm":"စူဠနန္ဒိယဇာတ်","summary":"ဘုရားလောင်း မျောက်မင်း နန္ဒိယနှင့် ညီ စူဠနန္ဒိယတို့သည် မျက်မမြင် မိခင်ကြီးကို လုပ်ကျွေးကြ၏။ ရက်စက်သော မုဆိုးက မိခင်ကို ပစ်ခတ်မည်ပြုရာ ညီအစ်ကိုနှစ်ဦးသည် မိမိတို့ကိုယ်ကို အစားထိုးပေးကြသော်လည်း မုဆိုးသည် သုံးဦးစလုံးကို သတ်ဖြတ်ပြီး ကြမ်းကြုတ်မှု၏ ဆိုးကျိုးကို ချက်ချင်းခံရသည်။","moral":"မိဘကျေးဇူးဆပ်ခြင်းသည် မြတ်၍ ရက်စက်ကြမ်းကြုတ်မှုသည် ဆိုးကျိုးပေး၏။"},{"no":223,"pali":"Puṭabhattajātaka","mm":"ပုဋဘတ္တဇာတ်","summary":"မင်းသားသည် ခရီးသွားစဉ် ကြင်ယာတော်အား ထမင်းမမျှဘဲ တစ်ဦးတည်း စားခဲ့ရာ မင်းဖြစ်သောအခါ ဘုရားလောင်း အမတ်ကြီးသည် ထိုမတရားမှုကို ထောက်ပြ၍ မိဖုရားအား ထိုက်တန်စွာ ဂုဏ်ပြုချီးမြှင့်စေသည်။","moral":"နီးစပ်သူတို့အား မျှဝေထောက်ပံ့ခြင်းသည် မွန်မြတ်သော ကျင့်ဝတ်ဖြစ်၏။"},{"no":224,"pali":"Kumbhilajātaka","mm":"ကုမ္ဘိလဇာတ်","summary":"မိကျောင်းသည် ဘုရားလောင်းကို လှည့်ဖြားတိုက်ခိုက်ရန် ကြံစည်သော်လည်း သစ္စာ၊ တရား၊ ကြံ့ခိုင်မှု၊ စွန့်ကြဲမှုဟူသော ဂုဏ်လေးပါးနှင့် ပြည့်စုံသူကို ရန်သူက မအောင်နိုင်ကြောင်း ဟောကြားသော ဇာတ်တော်တိုဖြစ်သည်။","moral":"သစ္စာနှင့် တရားဂုဏ်တို့နှင့် ပြည့်စုံသူကို ရန်သူ မလွှမ်းမိုးနိုင်။"},{"no":225,"pali":"Khantivaṇṇajātaka","mm":"ခန္တိဝဏ္ဏဇာတ်","summary":"ဗာရာဏသီမင်း ဘုရားလောင်းသည် အမှုတော်ထမ်း ကောင်းစွာထမ်းရွက်သော အမတ်တစ်ဦး၏ အပြစ်ကို သည်းခံလျက်ရှိရာ ထိုအမတ်ကလည်း မိမိအစေခံ၏ တူညီသောအပြစ်ကို လျှောက်တင်လာသောအခါ မင်းကြီးက မိမိလည်း သည်းခံနေရကြောင်း ဖွင့်ဟသဖြင့် အပြစ်ရှိသူတို့ နောင်တရ၍ ဖြောင့်မတ်လာကြသည်။","moral":"သည်းခံခြင်းခန္တီသည် အမြတ်ဆုံးသော အကျင့်ဖြစ်၏။"},{"no":226,"pali":"Kosiyajātaka","mm":"ကောသိယဇာတ်","summary":"အချိန်အခါမကျမီ နေ့အချိန်၌ ထွက်လာသော ဇီးကွက်သည် ကျီးအုပ်၏ ဝိုင်းဝန်းထိုးဆိတ်ခြင်းခံရ၍ သေဆုံးရသည်။ ဘုရားလောင်း အမတ်ကြီးသည် ဤဥပမာဖြင့် အခါမဲ့ စစ်ချီလိုသော မင်းကြီးကို ဆုံးမသည်။","moral":"အမှုကိစ္စကို အချိန်အခါ သင့်လျော်မှသာ ဆောင်ရွက်အပ်၏။"},{"no":227,"pali":"Gūthapāṇajātaka","mm":"ဂူထပါဏဇာတ်","summary":"အရက်သောက်၍ မူးယစ်နေသော နွားချေးပိုးသည် ဆင်ပြောင်ကြီးအား စစ်ထိုးရန် စိန်ခေါ်ရာ ဆင်ကြီးက နွားချေးစွန့်ချ၍ သတ်ပစ်လိုက်သည်။ ဘုရားလောင်းသည် ရုက္ခစိုးနတ်ဖြစ်၍ ဤအဖြစ်ကို မြင်တွေ့သည်။","moral":"မိမိအင်အားကို မချင့်ချိန်သော မာန်ထောင်လွှားမှုသည် ဆုံးရှုံးခြင်း၏ အကြောင်းဖြစ်၏။"},{"no":228,"pali":"Kāmanītajātaka","mm":"ကာမနီတဇာတ်","summary":"မင်းကြီးသည် နိုင်ငံများကို ထပ်မံသိမ်းပိုက်လိုသော လောဘကြောင့် စိတ်မချမ်းမြေ့ဘဲ နာမကျန်းဖြစ်နေရာ ဘုရားလောင်း ပညာရှိလုလင်က လောဘသည် ရလေတိုးလေဖြစ်၍ မည်သည့်အခါမျှ မရောင့်ရဲနိုင်ကြောင်း ဟောကြားသဖြင့် မင်းကြီး သဘောပေါက်ကာ ရောဂါငြိမ်းသည်။","moral":"တဏှာလောဘသည် အဆုံးမရှိ၊ ရောင့်ရဲမှသာ ချမ်းသာ၏။"},{"no":229,"pali":"Palāyitajātaka","mm":"ပလာယိတဇာတ်","summary":"ကြီးမားသော စစ်သည်အလုံးအရင်းဖြင့် ချီတက်လာသော ရန်သူမင်းသည် ဘုရားလောင်းမင်း၏ ခိုင်ခံ့သော မြို့တော်နှင့် တည်ငြိမ်ရဲရင့်မှုကို မြင်သောအခါ မတိုက်ဝံ့ဘဲ ဆုတ်ခွာ ထွက်ပြေးသွားသည်။","moral":"ရဲရင့်တည်ကြည်မှုသည် မတိုက်ဘဲပင် ရန်ကို အောင်နိုင်၏။"},{"no":230,"pali":"Dutiyapalāyitajātaka","mm":"ဒုတိယပလာယိတဇာတ်","summary":"ဝါကြွားလျက် ချီတက်လာသော ရန်သူမင်းအား ဘုရားလောင်းမင်းက မိမိ၏ အင်အားနှင့် အသင့်ရှိမှုကို ထုတ်ဖော်ပြသရာ ရန်သူမင်းသည် ကြောက်ရွံ့၍ ထွက်ပြေးသွားသည်။","moral":"ဝါကြွားစကားသက်သက်ဖြင့် စစ်မနိုင်၊ ပြင်ဆင်ထားမှုကသာ အနိုင်ယူ၏။"},{"no":231,"pali":"Upāhanajātaka","mm":"ဥပါဟနဇာတ်","summary":"ဆင်ပညာဆရာ ဘုရားလောင်းထံ ပညာသင်ယူပြီးသော တပည့်သည် ကျေးဇူးမသိဘဲ ဆရာနှင့် အစွမ်းပြိုင်ရန် စိန်ခေါ်သည်။ ဆရာက ဆင်ကို အမိန့်နှင့် ဆန့်ကျင်ဆောင်ရွက်စေရန် လျှို့ဝှက်လေ့ကျင့်ထားသဖြင့် ပြိုင်ပွဲ၌ တပည့် အရေးနိမ့်ကာ လူအများ၏ ဒဏ်ကို ခံရသည်။","moral":"ကျေးဇူးမသိသူ၏ ပညာသည် ချွတ်ယွင်းသောဖိနပ်ကဲ့သို့ မိမိကိုယ်ကိုသာ နာကျင်စေ၏။"},{"no":232,"pali":"Vīṇāguṇajātaka","mm":"ဝီဏာဂုဏဇာတ်","summary":"သူဌေးသမီးသည် အပြင်ပန်းနိမိတ်ကို မှားယွင်းစွာ အနက်ကောက်ကာ ကျောကုန်းသောသူသည် ယောက်ျားမြတ်ဖြစ်မည်ဟု ယူဆ၍ လိုက်ပါသွားရာ ဘုရားလောင်း ပညာရှိ၏ စကားကြောင့် မိမိအမှားကို သိမြင်ပြန်လာသည်။","moral":"အပြင်ပန်းနိမိတ်ကို ကြည့်၍ အဆုံးအဖြတ် မမှားအပ်။"},{"no":233,"pali":"Vikaṇṇajātaka","mm":"ဝိကဏ္ဏဇာတ်","summary":"ဗာရာဏသီမင်း ဘုရားလောင်းသည် ရေကန်၌ ငါးတို့ကို စည်တီး၍ အစာကျွေးမွေးစေရာ မိကျောင်းတစ်ကောင်သည် လောဘဖြင့် ငါးတို့ကို လိုက်လံစားသောက်နေသဖြင့် ကန်စောင့်၏ သွားခက်လှံဖြင့် အထိုးခံရကာ ဒဏ်ရာဖြင့် သေဆုံးရသည်။","moral":"အာသာလောဘ လိုက်စားခြင်းသည် ပျက်စီးခြင်းသို့ ဆောင်၏။"},{"no":234,"pali":"Asitābhūjātaka","mm":"အသိတာဘူဇာတ်","summary":"မင်းသားသည် ကြင်ယာတော် အသိတာဘူကို စွန့်၍ ကိန္နရီမတစ်ဦး၏ နောက်သို့ လိုက်သွားရာ မိဖုရားသည် ဘုရားလောင်းရသေ့ထံ တရားနာ၍ ဈာန်ရကာ ထွက်ခွာသွားသည်။ မင်းသားသည် ကိန္နရီမကိုလည်း မရ၊ ကြင်ယာတော်ကိုလည်း ဆုံးရှုံးရသည်။","moral":"ရှိပြီးသည်ကို စွန့်၍ တပ်မက်မှုနောက် လိုက်လျှင် နှစ်ဖက်စလုံး ဆုံးရှုံး၏။"},{"no":235,"pali":"Vacchanakhajātaka","mm":"ဝစ္ဆနခဇာတ်","summary":"သူကြွယ်မိတ်ဆွေက ရသေ့ ဝစ္ဆနခ ဘုရားလောင်းအား လူ့ဘောင်သို့ ပြန်ဝင်၍ စည်းစိမ်ခံစားရန် ဖိတ်ခေါ်ရာ ရသေ့က အိမ်ထောင်စည်းစိမ်သည် ဆင်းရဲနှောင်ဖွဲ့မှုနှင့် ယှဉ်တွဲနေကြောင်း ဟောကြား၍ ငြင်းပယ်သည်။","moral":"ရဟန်း၏ လွတ်လပ်မှုသည် လောကီစည်းစိမ်ထက် မြတ်၏။"},{"no":236,"pali":"Bakajātaka","mm":"ဗကဇာတ်","summary":"ဗျိုင်းသည် ငါးတို့ကို စားလို၍ သူတော်ကောင်းသဖွယ် ငြိမ်သက်စွာ ရပ်တည်နေရာ ဘုရားလောင်းငါးက ထိုစဉ်းလဲကောက်ကျစ်မှုကို သိမြင်၍ ငါးအပေါင်းအား သတိပေးသည်။","moral":"သူတော်ကောင်း အသွင်ဆောင်သူတို့ကို သတိထား ရှောင်ရှားအပ်၏။"},{"no":237,"pali":"Sāketajātaka","mm":"သာကေတဇာတ်","summary":"သာကေတမြို့သား ပုဏ္ဏားအိုသည် မြတ်စွာဘုရားကို မြင်လျှင်ပင် သားအရင်းကဲ့သို့ ချစ်ခင်ရာ ရှေးဘဝများစွာ၌ ဆွေမျိုးတော်စပ်ခဲ့ဖူး၍ ဖြစ်ကြောင်း၊ ချစ်ခင်မှုသည် ရှေးက ပေါင်းသင်းဖူးမှုနှင့် ယခုဘဝ ကျေးဇူးပြုမှုတို့ကြောင့် ဖြစ်ပေါ်ကြောင်း ဟောတော်မူသည်။","moral":"ချစ်ခင်မှုသည် ရှေးဘဝ အဆက်အနွယ်ကြောင့် ဖြစ်ပေါ်တတ်၏။"},{"no":238,"pali":"Ekapadajātaka","mm":"ဧကပဒဇာတ်","summary":"သားငယ်က အနက်များစွာကို ချုပ်ငုံသော ပုဒ်တစ်ပုဒ်ကို မေးမြန်းရာ ကုန်သည်ကြီး ဘုရားလောင်းက ကျွမ်းကျင်လိမ္မာမှုသည် အကျိုးစီးပွားအားလုံး၏ အရင်းမူလဖြစ်ကြောင်း ဖြေကြားဆုံးမသည်။","moral":"ကျွမ်းကျင်လုံ့လသည် စီးပွားချမ်းသာ၏ အခြေခံဖြစ်၏။"},{"no":239,"pali":"Haritamaṇḍūkajātaka","mm":"ဟရိတမဏ္ဍူကဇာတ်","summary":"ရေမြွေသည် ငါးဖမ်းထောင်ချောက်ထဲ ကျရောက်၍ ငါးတို့၏ ကိုက်ခဲခြင်းကို ခံရသောအခါ ဘုရားလောင်း ဖားစိမ်းအား တရားမျှတမှု မေးရာ ဖားစိမ်းက သင်လည်း အခွင့်ရစဉ်က ငါးတို့ကို စားခဲ့သည် မဟုတ်လောဟု ဖြေဆိုသည်။ ငါးတို့သည် မြွေကို ဝိုင်းဝန်းသတ်ဖြတ်ကြသည်။","moral":"သူတစ်ပါးကို ညှဉ်းဆဲသူသည် အခွင့်လွန်သောအခါ ပြန်၍ ညှဉ်းဆဲခြင်း ခံရ၏။"},{"no":240,"pali":"Mahāpiṅgalajātaka","mm":"မဟာပိင်္ဂလဇာတ်","summary":"ရက်စက်ကြမ်းကြုတ်သော ပိင်္ဂလမင်းကြီး သေဆုံးသောအခါ တစ်ပြည်လုံး ဝမ်းမြောက်ကြ၏။ တံခါးစောင့်တစ်ဦးသာ ငိုနေရာ မင်းကြီးသည် ငရဲမင်းကိုပင် ညှဉ်းဆဲ၍ ပြန်လွှတ်ခံရမည်ကို စိုးရိမ်သောကြောင့်ဟု ဆိုသည်။ ဘုရားလောင်းသည် သားတော်ဖြစ်၍ တရားသဖြင့် မင်းပြုသည်။","moral":"ရက်စက်သောမင်းကို အဘယ်သူမျှ မတမ်းတ၊ တရားသောမင်းကိုသာ ချစ်ခင်ကြ၏။"},{"no":241,"pali":"Sabbadāṭhijātaka","mm":"သဗ္ဗဒါဌိဇာတ်","summary":"မြေခွေးသည် ဘုရားလောင်း ပုရောဟိတ် ရွတ်ဆိုသော မန္တန်ကို ခိုးနားထောင် တတ်မြောက်၍ သားရဲအပေါင်းကို စုရုံးကာ ဗာရာဏသီမြို့ကို ဝိုင်းရံတိုက်ခိုက်သည်။ ပုရောဟိတ်၏ အကြံဉာဏ်ဖြင့် ခြင်္သေ့ဟောက်သံကြောင့် မြေခွေးစီးနင်းသော ဆင်တို့ လန့်ဖျပ်ကာ မြေခွေးကို နင်းချေလိုက်သည်။","moral":"ငှားရမ်းရသော တန်ခိုးဖြင့် ထောင်လွှားသူသည် မိမိကြောင့်ပင် ပျက်စီး၏။"},{"no":242,"pali":"Sunakhajātaka","mm":"သုနခဇာတ်","summary":"သားရေကြိုးဖြင့် ချည်နှောင်ခံထားရသော ခွေးအား ဘုရားလောင်း ပညာရှိက ကြိုးကို မကိုက်ဖြတ်သော ခွေးသည် မိုက်၏ဟု ဆိုရာ ခွေးသည် ညဉ့်နက်၍ လူတို့အိပ်ချိန်၌ ကြိုးကို ကိုက်ဖြတ်ကာ လွတ်မြောက်သွားသည်။","moral":"မိမိစွမ်းရည်ကို အသုံးချ၍ အနှောင်အဖွဲ့မှ လွတ်အောင် ကြိုးစားအပ်၏။"},{"no":243,"pali":"Guttilajātaka","mm":"ဂုတ္တိလဇာတ်","summary":"ဗာရာဏသီ၏ စောင်းဆရာကြီး ဂုတ္တိလ ဘုရားလောင်း၏ တပည့် မူသိလသည် ဆရာ့ကျေးဇူးကို မသိဘဲ အစွမ်းပြိုင်ရန် စိန်ခေါ်သည်။ သိကြားမင်း၏ ကူညီမှုဖြင့် ဆရာကြီးသည် စောင်းကြိုးများ တစ်ချောင်းစီ ဖြတ်လျက်ပင် သာယာစွာ တီးမှုတ်နိုင်၍ အနိုင်ရပြီး ကျေးဇူးကန်းသော တပည့်သည် လူအများ၏ ဒဏ်ကို ခံရသည်။","moral":"ဆရာသမား ကျေးဇူးကို မသိသူသည် ကြီးပွားခြင်း မရှိ။"},{"no":244,"pali":"Vigaticchajātaka","mm":"ဝိဂတိစ္ဆဇာတ်","summary":"မြင်တွေ့ရသည်ကို မနှစ်သက်ဘဲ မမြင်ရသေးသည်ကိုသာ တောင့်တတတ်သော တဏှာ၏ သဘောကို ဘုရားလောင်းက ဟောကြား၍ အငြင်းအခုံဝါဒီ ပရိဗိုဇ်တစ်ဦး၏ မာန်ကို ချိုးနှိမ်သော ဇာတ်တော်ဖြစ်သည်။","moral":"တဏှာသည် အဆုံးမရှိ၊ လိုချင်မှုကို ပယ်သတ်မှသာ ငြိမ်းချမ်း၏။"},{"no":245,"pali":"Mūlapariyāyajātaka","mm":"မူလပရိယာယဇာတ်","summary":"တက္ကသိုလ်ဆရာကြီး ဘုရားလောင်းသည် ပညာတတ်ပြီဟု မာနထောင်လွှားလာသော တပည့်တို့အား ကာလသည် သတ္တဝါအားလုံးကို စား၏၊ မိမိကိုယ်ကိုလည်း စား၏ဟူသော ပုစ္ဆာမေးမြန်းရာ မဖြေဆိုနိုင်သဖြင့် မာနကျိုးကာ ပညာကို ဆက်လက် ဆည်းပူးကြသည်။","moral":"အတတ်ပညာ ရသည်နှင့် မာန်မတက်ဘဲ ဆက်လက် သင်ယူအပ်၏။"},{"no":246,"pali":"Bālovādajātaka","mm":"ဗာလောဝါဒဇာတ်","summary":"သူတစ်ပါး သတ်၍ လှူဒါန်းသော အမဲသားကို သုံးဆောင်သော ရသေ့ ဘုရားလောင်းအား အပြစ်ရှိသည်ဟု စွပ်စွဲရာ ရသေ့က အပြစ်သည် သတ်ဖြတ်သူ၌သာ ရှိ၍ တွယ်တာမှုကင်းစွာ သုံးဆောင်သူ၌ မရှိကြောင်း ဖြေကြားသည်။","moral":"မကောင်းမှု၏ အပြစ်သည် ပြုလုပ်သူ၌သာ တည်၏။"},{"no":247,"pali":"Pādañjalījātaka","mm":"ပါဒဉ္ဇလီဇာတ်","summary":"မင်းကြီး နတ်ရွာစံသောအခါ ဘုရားလောင်း အမတ်ကြီးတို့သည် သားတော် ပါဒဉ္ဇလီကို စမ်းသပ်ကြရာ မင်းသားသည် မှန်သောစီရင်ချက်၌လည်းကောင်း မှားသောစီရင်ချက်၌လည်းကောင်း နှုတ်ခမ်းစူရုံသာ ပြုသဖြင့် အသိပညာမဲ့ကြောင်း ထင်ရှား၍ ထီးနန်းကို မအပ်နှင်းကြ။","moral":"တိတ်ဆိတ်နေရုံဖြင့် ပညာရှိ မမည်၊ စမ်းသပ်မှု၌သာ အသိဉာဏ် ထင်ရှား၏။"},{"no":248,"pali":"Kiṁsukopamajātaka","mm":"ကိံသုကောပမဇာတ်","summary":"မင်းသားလေးပါးတို့သည် ရာသီအသီးသီး၌ ကိံသုကပင် (ပေါက်ပင်) ကို တစ်ဦးစီ မြင်တွေ့ခဲ့ကြ၍ အသွင်ကွဲလွဲစွာ ဖော်ပြငြင်းခုံကြရာ ခမည်းတော် ဘုရားလောင်းမင်းကြီးက အားလုံး မှန်ကန်ကြောင်း၊ တစ်စိတ်တစ်ဒေသသာ မြင်ခြင်းကြောင့် ကွဲလွဲရကြောင်း ရှင်းလင်းပြသည်။","moral":"တစ်စိတ်တစ်ဒေသ အမြင်ဖြင့် အလုံးစုံမှန်သည်ဟု မဆိုအပ်။"},{"no":249,"pali":"Sālakajātaka","mm":"သာလကဇာတ်","summary":"မွေးမြူစဉ်က ရိုက်နှက်ညှဉ်းဆဲခဲ့သော ဆရာက မျောက်ငယ် သာလကအား သားကဲ့သို့ မွေးမြူမည်ဟု ချော့မော့ ပြန်ခေါ်သော်လည်း မျောက်သည် ယခင် ညှဉ်းဆဲခံရမှုကို ထောက်ရှု၍ မယုံကြည်ဘဲ တောထဲသို့ ဝင်ရောက်သွားသည်။","moral":"ညှဉ်းဆဲဖူးသူ၏ ချိုသာသောစကားကို မယုံအပ်။"},{"no":250,"pali":"Kapijātaka","mm":"ကပိဇာတ်","summary":"မိုးရွာ၍ ချမ်းအေးသောည၌ မျောက်တစ်ကောင်သည် ရသေ့အဝတ်ကို ဝတ်ဆင်ကာ ရသေ့ယောင်ဆောင်၍ ဘုရားလောင်း ရသေ့ကြီး၏ ကျောင်းသို့ ဝင်ရောက်ခိုလှုံရန် ကြံစည်ရာ ရသေ့ကြီး၏ သားငယ်က မျောက်ဖြစ်ကြောင်း သိမြင်ဖော်ထုတ်၍ နှင်ထုတ်လိုက်သည်။","moral":"အဝတ်အသွင် ဆောင်ရုံဖြင့် သူတော်ကောင်း မဖြစ်နိုင်။"},{"no":251,"pali":"Saṅkapparāgajātaka","mm":"သင်္ကပ္ပရာဂဇာတ်","summary":"ဘုရားအလောင်းသည် ဈာန်အဘိညာဉ်ရ ရသေ့ဖြစ်၍ ဗာရာဏသီမင်း၏ ဥယျာဉ်၌ နေထိုင်စဉ် မိဖုရားကို မြင်သောအခါ ကာမရာဂစိတ် ဝင်ရောက်သဖြင့် ဈာန်လျှောက်ပျက်လေသည်။ နောက်တွင် မိမိစိတ်ကို ပြင်းထန်စွာ ဆုံးမ၍ ဈာန်ကို ပြန်လည်ရရှိပြီး ရာဂအကြံသည် မြားကဲ့သို့ စူးဝင်တတ်ကြောင်း မင်းကြီးအား ဟောကြားကာ ဟိမဝန္တာသို့ ပြန်ကြွသွားလေသည်။","moral":"ကာမရာဂသည် တည်ကြည်သောစိတ်ကိုပင် ဖျက်ဆီးတတ်သဖြင့် စိတ်ကို အမြဲစောင့်ထိန်းအပ်၏။"},{"no":252,"pali":"Tilamuṭṭhijātaka","mm":"တိလမုဋ္ဌိဇာတ်","summary":"ဘုရားအလောင်းသည် တက္ကသိုလ်ပြည့်ရှင် ဆရာကြီးဖြစ်စဉ် ပညာသင်ယူနေသော ဗာရာဏသီမင်းသားကို နှမ်းတစ်လက်ဆုပ် ခိုးယူစားမှုကြောင့် ဆုံးမရိုက်နှက်ခဲ့လေသည်။ မင်းသားသည် မင်းဖြစ်သောအခါ ရန်ငြိုးဖြင့် ဆရာကို ခေါ်ယူသော်လည်း ဆရာက ဆုံးမခြင်း၏ အကျိုးကို ရဲရင့်စွာ ရှင်းလင်းဟောပြသဖြင့် မင်းကြီး ကြည်ညိုပြီး ချီးမြှောက်လေသည်။","moral":"အချိန်မီ ဆုံးမပဲ့ပြင်ခြင်းသည် ရန်မဟုတ်၊ ကျေးဇူးပင်ဖြစ်၏။"},{"no":253,"pali":"Maṇikaṇṭhajātaka","mm":"မဏိကဏ္ဌဇာတ်","summary":"ဘုရားအလောင်း ရသေ့၏ ညီဖြစ်သော ရသေ့ထံသို့ မဏိကဏ္ဌနဂါးမင်းသည် ချစ်ခင်စွာ လာရောက်ပွေ့ဖက်လေ့ရှိသဖြင့် ညီရသေ့သည် ကြောက်ရွံ့ငြီးငွေ့လေသည်။ အစ်ကို၏ အကြံပေးချက်အတိုင်း နဂါးမင်း၏ လည်ဆွဲပတ္တမြားကို အဖန်ဖန် တောင်းသောအခါ နဂါးမင်းသည် နောက်တစ်ဖန် မလာတော့ချေ။","moral":"အလွန်အကျွံ တောင်းဆိုခြင်းသည် ချစ်ခင်သူကိုပင် ဝေးကွာစေတတ်၏။"},{"no":254,"pali":"Kuṇḍakakucchisindhavajātaka","mm":"ကုဏ္ဍကကုစ္ဆိသိန္ဓဝဇာတ်","summary":"ဘုရားအလောင်းသည် အမယ်အိုတစ်ဦးက ဖွဲနုဆန်မှုန့်ဖြင့် မွေးမြူသော သိန္ဓောမြင်းပျိုဖြစ်၍ မြင်းကုန်သည်၏ လက်မှတစ်ဆင့် မင်းထံ ဆက်သခြင်းခံရလေသည်။ မျိုးရိုးနှင့်လျော်စွာ ဂုဏ်သိက္ခာရှိစွာ ပြုမူပြသသဖြင့် မင်းကြီးက မြင့်မြတ်စွာ ပြုစုကာ မြင်းတော်အဖြစ် ချီးမြှောက်လေသည်။","moral":"မြင့်မြတ်သောသဘောရှိသူကို ဇာတိနိမ့်မြင့် မကြည့်ဘဲ လျော်ကန်စွာ ရိုသေထောက်ပံ့အပ်၏။"},{"no":255,"pali":"Sukajātaka","mm":"သုကဇာတ်","summary":"ဘုရားအလောင်းသည် ကျေးငှက်မင်းဖြစ်၍ အိုမင်းသောအခါ သားတော်က ပင်လယ်တစ်ဖက်ကမ်းမှ အစာရှာဖွေ ကျွေးမွေးလေသည်။ အလွန်အကျွံ မစားရန် ဆုံးမထားသော်လည်း သားကျေးသည် လောဘဖြင့် စားသုံးလွန်ကဲကာ ပြန်ပျံလာစဉ် အားကုန်၍ ပင်လယ်ထဲသို့ ကျဆုံးလေသည်။","moral":"အစားအသောက်၌ အတိုင်းအရှည်မသိသော လောဘသည် ပျက်စီးခြင်းသို့ ရောက်စေ၏။"},{"no":256,"pali":"Jarūdapānajātaka","mm":"ဇရူဒပါနဇာတ်","summary":"ကုန်သည်တို့သည် ခရီးလမ်း၌ ရေတွင်းဟောင်းကို တူးဖော်ရာ ရတနာများ ရရှိသော်လည်း လောဘကြီးစွာ ဆက်လက်တူးဖော်သဖြင့် အောက်၌နေသော နဂါးမင်း အမျက်ထွက်၍ ဖျက်ဆီးခြင်းခံရလေသည်။ ရောင့်ရဲရန် ဆုံးမခဲ့သော ဘုရားအလောင်း ကုန်သည်ကြီးသာ ဘေးမှ လွတ်မြောက်၍ ရတနာတို့ကို ဆောင်ယူနိုင်ခဲ့လေသည်။","moral":"အလွန်အကျွံ လောဘသည် ရရှိပြီးသော စည်းစိမ်ကိုပင် ဆုံးရှုံးစေ၏။"},{"no":257,"pali":"Gāmaṇicandajātaka","mm":"ဂါမဏိစန္ဒဇာတ်","summary":"ဂါမဏိစန္ဒအမည်ရှိ အမှုထမ်းဟောင်းသည် အမှုတစ်ခုဖြင့် ရုံးတော်သို့ လာရောက်ရာ လမ်းခရီး၌ တွေ့ကြုံသူများ၏ မေးခွန်းအမျိုးမျိုးကိုပါ ယူဆောင်လာလေသည်။ ဘုရားအလောင်း အာဒါသမုခမင်းပျိုသည် အမှုကိုလည်းကောင်း၊ မေးခွန်းအားလုံးကိုလည်းကောင်း ထက်မြက်သော ပညာဉာဏ်ဖြင့် ဖြေရှင်းဆုံးဖြတ်ပေးလေသည်။","moral":"ပညာရှိ၏ ဆင်ခြင်ဉာဏ်သည် ခက်ခဲသောပြဿနာဟူသမျှကို ဖြေရှင်းနိုင်၏။"},{"no":258,"pali":"Mandhātujātaka","mm":"မန္ဓာတုဇာတ်","summary":"ဘုရားအလောင်း မန္ဓာတုမင်းသည် စကြဝတေးမင်းအဖြစ်မှ တာဝတိံသာနတ်ပြည်၌ သိကြားမင်းနှင့် ထက်ဝက်စိုးစံသည့်တိုင်အောင် ရောင့်ရဲမှုမရှိဘဲ သိကြားမင်း၏ နေရာကိုပင် လိုချင်လေသည်။ ထိုလောဘစိတ်ကြောင့် လူ့ပြည်သို့ ပြန်လည်ကျရောက်ကာ ကွယ်လွန်ရလေသည်။","moral":"ကာမဂုဏ်တဏှာသည် မည်သည့်အခါမျှ ပြည့်ဝရောင့်ရဲခြင်း မရှိနိုင်။"},{"no":259,"pali":"Tirīṭavacchajātaka","mm":"တိရီဋဝစ္ဆဇာတ်","summary":"ဘုရားအလောင်း တိရီဋဝစ္ဆရသေ့သည် စစ်ရှုံး၍ ထွက်ပြေးစဉ် ရေတွင်းထဲသို့ ကျရောက်နေသော မင်းကြီးကို ကယ်တင်ခဲ့လေသည်။ မင်းကြီးက ကြီးစွာချီးမြှောက်သည်ကို မှူးမတ်တို့ မကျေနပ်ကြသော်လည်း ကျေးဇူးပြုခဲ့ပုံကို သိရသောအခါ အားလုံး ကြည်ညိုကြလေသည်။","moral":"ကျေးဇူးပြုသူအား ကျေးဇူးဆပ်တတ်ခြင်းသည် သူတော်ကောင်းတို့၏ တရားဖြစ်၏။"},{"no":260,"pali":"Dūtajātaka","mm":"ဒူတဇာတ်","summary":"ဘုရားအလောင်း ဗာရာဏသီမင်းသည် အစားအသောက်၌ အလွန်စည်းကမ်းကြီးသဖြင့် စားတော်ခေါ်ချိန်၌ မည်သူမျှ မချဉ်းကပ်ဝံ့ချေ။ လူတစ်ယောက်သည် \"တမန်လာပါသည်\" ဟုဆိုကာ ဝင်ရောက်ပြီး သတ္တဝါအားလုံးသည် ဝမ်းဗိုက်၏ တမန်များသာဖြစ်ကြောင်း လျှောက်ထားရာ မင်းကြီး နှစ်သက်၍ ချီးမြှင့်လေသည်။","moral":"သတ္တဝါတို့သည် ဝမ်းရေးတဏှာ၏ စေခိုင်းရာသို့ လိုက်ပါနေရသည်ကို ဆင်ခြင်အပ်၏။"},{"no":261,"pali":"Padumajātaka","mm":"ပဒုမဇာတ်","summary":"သူဌေးသားညီနောင်သုံးဦးသည် ရေကန်စောင့်ထံမှ ပဒုမ္မာကြာပန်းကို တောင်းကြရာ အစ်ကိုနှစ်ဦးသည် မမှန်သော ချော့မော့စကားဖြင့် တောင်းသဖြင့် မရကြချေ။ ဘုရားအလောင်း သူဌေးသားငယ်သည် မှန်ကန်ဖြောင့်မတ်သော စကားကိုသာ ဆိုသဖြင့် ကြာပန်းတို့ကို ရရှိလေသည်။","moral":"မုသားချော့မော့ခြင်းထက် ဖြောင့်မတ်မှန်ကန်သော စကားကသာ အကျိုးပေး၏။"},{"no":262,"pali":"Mudupāṇijātaka","mm":"မုဒုပါဏိဇာတ်","summary":"ဘုရားအလောင်း ဗာရာဏသီမင်းသည် သမီးတော်နှင့် တူတော်တို့ ချစ်ကြိုက်နေသည်ကို သိ၍ ခွဲခြားစောင့်ရှောက်စေသော်လည်း ထိုနှစ်ဦးသည် ပရိယာယ်အမျိုးမျိုးဖြင့် ဆက်သွယ်၍ ထွက်ပြေးကြလေသည်။ မင်းကြီးသည် မိန်းမတို့ကို စောင့်ကြပ်ရုံမျှဖြင့် မထိန်းသိမ်းနိုင်ကြောင်း သဘောပေါက်ကာ သမီးတော်ကို တူတော်အားပင် ပေးစားလိုက်လေသည်။","moral":"စောင့်ကြပ်ခြင်းမျှဖြင့် သူတစ်ပါး၏ စိတ်ဆန္ဒကို ချုပ်တည်း၍ မရနိုင်။"},{"no":263,"pali":"Cūḷapalobhanajātaka","mm":"စူဠပလောဘနဇာတ်","summary":"ဘုရားအလောင်းသည် မိန်းမတို့ကို ရွံရှာသော မင်းသားအဖြစ် ဖွားမြင်၍ မိန်းမကင်းစွာ ကြီးပြင်းလာသော်လည်း ပရိယာယ်ကြွယ်ဝသော မိန်းမတစ်ဦး၏ ဖြားယောင်းမှုကြောင့် ကာမဂုဏ်၌ ငြိကပ်သွားလေသည်။ နောက်ဆုံးတွင် ကာမဂုဏ်၏ အပြစ်ကို ထိုးထွင်းသိမြင်ကာ တောထွက်၍ ရသေ့ရဟန်းပြုလေသည်။","moral":"ကာမဂုဏ်၏ ဖြားယောင်းမှုကို မမေ့မလျော့ စောင့်ရှောက်အပ်၏။"},{"no":264,"pali":"Mahāpanādajātaka","mm":"မဟာပနာဒဇာတ်","summary":"မဟာပနာဒမင်းသည် ရွှေရတနာဖြင့် ပြီးသော နန်းတော်ကြီးကို ပိုင်ဆိုင်ခဲ့သည်မှာ ရှေးဘဝက ပစ္စေကဗုဒ္ဓါအား တဲကျောင်း ဆောက်လုပ်လှူဒါန်းခဲ့သော ကုသိုလ်ကံကြောင့်ဖြစ်ကြောင်း ဟောကြားတော်မူသော ဇာတ်တော်ဖြစ်သည်။","moral":"သဒ္ဓါတရားဖြင့် ပေးလှူသော ဒါနသည် ကြီးမားသော အကျိုးကို ပေးတတ်၏။"},{"no":265,"pali":"Khurappajātaka","mm":"ခုရပ္ပဇာတ်","summary":"ဘုရားအလောင်းသည် တောခရီးလမ်းပြ သူရဲကောင်းဖြစ်၍ ကုန်သည်တို့၏ လှည်းအစုကို ခိုးသားတို့ ကျင်လည်ရာ တောအရပ်ကို ဖြတ်၍ ပို့ဆောင်ပေးလေသည်။ ခိုးသားအများ ဝိုင်းဝန်းတိုက်ခိုက်သောအခါ မကြောက်မရွံ့ လေးမြားဖြင့် ခုခံနှင်ထုတ်ကာ ကုန်သည်တို့ကို ဘေးကင်းစွာ ပို့ဆောင်နိုင်ခဲ့လေသည်။","moral":"တာဝန်၌ ရဲရင့်ခြင်းနှင့် သစ္စာရှိခြင်းသည် သူရဲကောင်းတို့၏ အင်္ဂါဖြစ်၏။"},{"no":266,"pali":"Vātaggasindhavajātaka","mm":"ဝါတဂ္ဂသိန္ဓဝဇာတ်","summary":"မြည်းမတစ်ကောင်သည် ဝါတဂ္ဂအမည်ရှိ မင်းမြင်းမြတ်ကို ချစ်ကြိုက်၍ အစာရေစာဖြတ်ကာ ပူဆွေးနေလေသည်။ မြင်းမြတ် လာရောက်သောအခါ မာနဖြင့် ဟန်ဆောင်တွန်းလှန်မိသဖြင့် မြင်းမြတ်သည် ထွက်ခွာသွားပြီး မြည်းမသည် ပူဆွေးလျက် ကျန်ရစ်လေသည်။","moral":"အခါမဲ့ မာနထောင်လွှားခြင်းသည် မိမိလိုရာကို ဆုံးရှုံးစေ၏။"},{"no":267,"pali":"Kakkaṭakajātaka","mm":"ကက္ကဋကဇာတ်","summary":"ရေကန်ကြီးတစ်ခု၌ ကဏန်းကြီးတစ်ကောင်သည် ဆင်တို့ကို ဖမ်းယူသတ်ဖြတ်လေ့ရှိရာ ဘုရားအလောင်း ဆင်ပျိုသည် ကဏန်း၏ ညှပ်ဖမ်းခြင်းကို ခံရလေသည်။ သစ္စာရှိသော ဆင်မက မထွက်ပြေးဘဲ ကဏန်းကို ချော့မော့စကားဆို၍ လက်လျှော့စေပြီး ဆင်ပျိုက နင်းချေဖျက်ဆီးနိုင်ခဲ့လေသည်။","moral":"သစ္စာရှိသော အဖော်၏ အကူအညီသည် ဘေးရန်မှ ကယ်တင်နိုင်၏။"},{"no":268,"pali":"Ārāmadūsakajātaka","mm":"အာရာမဒူသကဇာတ်","summary":"ဥယျာဉ်စောင့်ရန် တာဝန်ပေးခြင်းခံရသော မျောက်တို့သည် ပျိုးပင်တို့ကို ရေလောင်းရာ၌ အမြစ်အရှည်အတိုကို ကြည့်၍ လောင်းမည်ဟုဆိုကာ ပင်ပေါင်းများစွာကို ဆွဲနုတ်ဖျက်ဆီးမိကြလေသည်။ ဘုရားအလောင်း ပညာရှိသည် ထိုအဖြစ်ကိုမြင်၍ မိုက်မဲသူတို့၏ ကောင်းမှုပြုခြင်းသည်ပင် ဖျက်ဆီးမှုဖြစ်တတ်ကြောင်း ဆိုလေသည်။","moral":"အသိပညာမပါသော လုံ့လသည် အကျိုးမပြုဘဲ ဖျက်ဆီးမှုသာ ဖြစ်တတ်၏။"},{"no":269,"pali":"Sujātajātaka","mm":"သုဇာတဇာတ်","summary":"ဘုရားအလောင်း ဗာရာဏသီမင်းသည် စကားကြမ်းတမ်းသော မယ်တော်ကို တိုက်ရိုက်မဆုံးမဝံ့သဖြင့် အသံချိုသာသော ဥဩငှက်နှင့် အသံကြမ်းတမ်းသော ငှက်တို့ကို ဥပမာပြု၍ သွယ်ဝိုက်စွာ ဆုံးမလေသည်။ မယ်တော်လည်း သဘောပေါက်ကာ ချိုသာစွာ ပြောဆိုတတ်လာလေသည်။","moral":"ချိုသာသောစကားကို လူတိုင်းချစ်ခင်၍ ကြမ်းတမ်းသောစကားကို မုန်းတီးကြ၏။"},{"no":270,"pali":"Ulūkajātaka","mm":"ဥလူကဇာတ်","summary":"ရှေးကမ္ဘာဦးအခါ ငှက်အပေါင်းတို့သည် ဇီးကွက်ကို မင်းမြှောက်ရန် စည်းဝေးတိုင်ပင်ကြရာ ကျီးက ဇီးကွက်၏ မျက်နှာထားကို ကဲ့ရဲ့ကန့်ကွက်လေသည်။ ထိုအချိန်မှစ၍ ဇီးကွက်နှင့် ကျီးတို့သည် ဘဝဆက်တိုင်း ရန်ငြိုးဖွဲ့ကြရကြောင်း ဟောကြားသော ဇာတ်တော်ဖြစ်သည်။","moral":"စော်ကားကဲ့ရဲ့သော စကားသည် ကြာရှည်သော ရန်ငြိုးကို ဖြစ်စေတတ်၏။"},{"no":271,"pali":"Udapānadūsakajātaka","mm":"ဥဒပါနဒူသကဇာတ်","summary":"ရသေ့တို့ သောက်သုံးသော ရေတွင်းကို ခွေးအတစ်ကောင်သည် ညစ်ညမ်းအောင် ပြုလေ့ရှိရာ ဖမ်းမိသောအခါ ညစ်ညမ်းစေခြင်းသည် မိမိတို့အမျိုး၏ ဓလေ့ပင်ဖြစ်ကြောင်း ဆိုလေသည်။ ဘုရားအလောင်း ရသေ့ကြီးက ယုတ်မာသူတို့၏ ပြုမြဲသဘောကို ထောက်ပြဆုံးမလေသည်။","moral":"ယုတ်ညံ့သူသည် မိမိအား ကျေးဇူးပြုရာကိုပင် ဖျက်ဆီးတတ်သော သဘောရှိ၏။"},{"no":272,"pali":"Byagghajātaka","mm":"ဗျဂ္ဃဇာတ်","summary":"ဘုရားအလောင်း ရုက္ခစိုးနတ်၏ တောအုပ်အနီး၌ ခြင်္သေ့နှင့် ကျားတို့ နေထိုင်ကြရာ အနံ့ဆိုးကို မခံနိုင်သော နတ်တစ်ပါးက ၎င်းတို့ကို နှင်ထုတ်လိုက်လေသည်။ သားရဲတို့ မရှိတော့ကြောင်း သိသော လူတို့သည် တောကို ခုတ်ထွင်ကြသဖြင့် နတ်နှစ်ပါးလုံး နေရာပျက်စီးဆုံးရှုံးရလေသည်။","moral":"မနှစ်သက်ဖွယ်ဖြစ်စေကာမူ အကာအကွယ်ပေးနေသော အပေါင်းအဖော်ကို မစွန့်ပယ်အပ်။"},{"no":273,"pali":"Kacchapajātaka","mm":"ကစ္ဆပဇာတ်","summary":"မျောက်တစ်ကောင်သည် လိပ်ကို စော်ကားကျီစယ်ရာ လိပ်က ကိုက်ချုပ်ထားသဖြင့် ပြင်းစွာ ဆင်းရဲရလေသည်။ ဘုရားအလောင်း ရသေ့သည် နှစ်ဦးသားကို ဖျန်ဖြေပေး၍ လိပ်ကို လွှတ်စေပြီး ရန်ငြိုးမဖွဲ့ကြရန် ဆုံးမလေသည်။","moral":"သူတစ်ပါးကို မစော်ကားအပ်၊ ဖြစ်ပြီးသောရန်ကိုလည်း ခွင့်လွှတ်ခြင်းဖြင့် ငြိမ်းစေအပ်၏။"},{"no":274,"pali":"Lolajātaka","mm":"လောလဇာတ်","summary":"ဘုရားအလောင်း ချိုးငှက်သည် သူဌေးအိမ် ထမင်းချက်တဲ၌ ခြင်းတောင်းသိုက်နှင့် နေထိုင်ရာ လောဘကြီးသော ကျီးတစ်ကောင်သည် ငါးအမဲဟင်းကို မက်မော၍ အဆွေဖွဲ့ကာ လိုက်ပါနေထိုင်လေသည်။ ချိုး၏ ဆုံးမစကားကို နားမထောင်ဘဲ ဟင်းကို ခိုးစားရန် ကြံစဉ် ထမင်းချက်၏ ဖမ်းဆီးအပြစ်ပေးခြင်းကို ခံရ၍ ပျက်စီးလေသည်။","moral":"လောဘလွန်ကဲသူသည် မိမိကိုယ်ကို ပျက်စီးစေ၏။"},{"no":275,"pali":"Rucirajātaka","mm":"ရုစိရဇာတ်","summary":"ရှေးဇာတ်နှင့် အလားတူပင် လောဘကြီးသော ကျီးတစ်ကောင်သည် ဘုရားအလောင်း ချိုးငှက်၏ ဆုံးမခြင်းကို နားမထောင်ဘဲ ထမင်းချက်တဲမှ အမဲဟင်းကို မက်မောသဖြင့် ဖမ်းဆီးအပြစ်ပေးခြင်းကို ခံရလေသည်။","moral":"လောဘကို မချုပ်တည်းနိုင်သူသည် ဆင်းရဲဒုက္ခသို့ ရောက်ရ၏။"},{"no":276,"pali":"Garudhammajātaka","mm":"ဂရုဓမ္မဇာတ်","summary":"ဘုရားအလောင်း ဓနဉ္စယကုရုမင်းမှစ၍ မိဖုရား၊ အိမ်ရှေ့မင်း၊ ပရောဟိတ်ပုဏ္ဏား အစရှိသော ကုရုတိုင်းသူတို့သည် ကုရုဓမ္မဟုခေါ်သော ငါးပါးသီလကို အလွန်စင်ကြယ်စွာ စောင့်ထိန်းကြလေသည်။ မိုးခေါင်နေသော ကာလိင်္ဂတိုင်းမှ တမန်တို့သည် ထိုသီလကျင့်စဉ်ကို လာရောက်သင်ယူ၍ မင်းနှင့်တကွ လိုက်နာကျင့်သုံးသောအခါ မိုးကောင်းစွာ ရွာသွန်းလေသည်။","moral":"စင်ကြယ်စွာ သီလစောင့်ထိန်းခြင်းသည် တိုင်းပြည်ကိုပင် စည်ပင်သာယာစေ၏။"},{"no":277,"pali":"Romakajātaka","mm":"ရောမကဇာတ်","summary":"ဘုရားအလောင်း ခိုငှက်မင်းသည် သီလရှိသော ရသေ့တစ်ပါးနှင့် ချစ်ခင်ရင်းနှီးစွာ နေထိုင်ခဲ့ရာ ထိုရသေ့ ကြွသွားပြီးနောက် ရောက်လာသော ရသေ့အတုသည် ခိုငှက်တို့ကို စားလို၍ ကြံစည်လေသည်။ ဘုရားအလောင်းသည် ထိုသူ၏ မကောင်းသောအကြံကို သိမြင်၍ ဖော်ထုတ်ပြစ်တင်ကာ အခြွေအရံနှင့်တကွ ဘေးမှ လွတ်မြောက်လေသည်။","moral":"ဟန်ဆောင်ကောင်းသူတို့၏ စိတ်ထားကို သတိပညာဖြင့် ခွဲခြားသိမြင်အပ်၏။"},{"no":278,"pali":"Mahiṁsarājajātaka","mm":"မဟိံသရာဇဇာတ်","summary":"ဘုရားအလောင်း ကျွဲမင်းသည် မျောက်ဆိုးတစ်ကောင်၏ အဖန်ဖန် စော်ကားညစ်ညမ်းပြုမှုကို သည်းခံလျက် နေလေသည်။ နောက်အခါ ထိုနေရာသို့ ရောက်လာသော ကြမ်းကြုတ်သည့် ကျွဲတစ်ကောင်က ထိုမျောက်ကို သတ်ဖြတ်လိုက်သဖြင့် မျောက်သည် မိမိအပြုအမူကြောင့်ပင် ပျက်စီးရလေသည်။","moral":"သူတော်ကောင်းသည် သည်းခံ၏၊ ယုတ်မာသူကား မိမိအမှုဖြင့်ပင် ပျက်စီး၏။"},{"no":279,"pali":"Satapattajātaka","mm":"သတပတ္တဇာတ်","summary":"လမ်းခရီး၌ လုလင်တစ်ဦးသည် အကျိုးလို၍ သစ္စာရှိစွာ သတိပေးသည်ကို အမင်္ဂလာဟု ထင်မှတ်ပြီး သတပတ္တငှက်၏ အော်မြည်သံကိုမူ မင်္ဂလာဟု မှားယွင်းစွာ ထင်မှတ်လေသည်။ ဘုရားအလောင်းက အကျိုးလိုသူနှင့် ရန်လိုသူကို မှားယွင်းစွာ မှတ်ထင်တတ်သော လူတို့၏ သဘောကို ထောက်ပြဟောကြားလေသည်။","moral":"အသွင်အပြင်ကို မကြည့်ဘဲ အကျိုးလိုသူနှင့် ရန်လိုသူကို ဉာဏ်ဖြင့် ခွဲခြားသိအပ်၏။"},{"no":280,"pali":"Puṭadūsakajātaka","mm":"ပုဋဒူသကဇာတ်","summary":"ဥယျာဉ်စောင့် ပြုလုပ်ထားသော ဖက်ရွက်ထုပ်တောင်းတို့ကို မျောက်စုသည် အကြောင်းမဲ့ ဆုတ်ဖြဲဖျက်ဆီးကြလေသည်။ ဘုရားအလောင်းက ကောင်းကျိုးမပြုတတ်ဘဲ ဖျက်ဆီးခြင်း၌သာ မွေ့လျော်သော မိုက်မဲသူတို့၏ သဘောကို ထောက်ပြလေသည်။","moral":"လူမိုက်သည် အကျိုးပြုသည်ဟု ထင်မှတ်လျက်ပင် ဖျက်ဆီးတတ်၏။"},{"no":281,"pali":"Abbhantarajātaka","mm":"အဗ္ဘန္တရဇာတ်","summary":"မိဖုရားသည် အဗ္ဘန္တရဟုခေါ်သော အလယ်သရက်သီးမြတ်ကို စားလိုသဖြင့် မင်းကြီး မွေးမြူထားသော ကျေးငှက်သည် ခဲယဉ်းသောခရီးကို သွားရောက်ကာ ရသေ့တို့၏ အကူအညီဖြင့် သရက်သီးကို ဆောင်ယူပေးနိုင်ခဲ့ကြောင်း ဟောကြားသော ဇာတ်တော်ဖြစ်သည်။","moral":"ဇွဲလုံ့လနှင့် ဉာဏ်ပညာရှိလျှင် ခဲယဉ်းသောကိစ္စကိုလည်း ပြီးမြောက်စေနိုင်၏။"},{"no":282,"pali":"Seyyajātaka","mm":"သေယျဇာတ်","summary":"ဘုရားအလောင်း ဗာရာဏသီမင်းသည် ရန်သူမင်း၏ ဖမ်းဆီးချုပ်နှောင်ခြင်းကို ခံရသော်လည်း အမျက်မထွက်ဘဲ မေတ္တာကို ပွားများလျက် နေလေသည်။ ရန်သူမင်း၌ ကိုယ်ပူလောင်ခြင်း ဖြစ်ပေါ်လာသဖြင့် နောင်တရ၍ မင်းကြီးအား ပြန်လည်လွှတ်ပေးကာ နိုင်ငံကိုလည်း ပြန်လည်အပ်နှင်းလေသည်။","moral":"မေတ္တာတရားသည် ရန်သူကိုပင် အောင်နိုင်၏။"},{"no":283,"pali":"Vaḍḍhakīsūkarajātaka","mm":"ဝဍ္ဎကီသူကရဇာတ်","summary":"လက်သမားတစ်ဦး မွေးမြူခဲ့သော ဝက်လိမ္မာသည် တောသို့ရောက်သောအခါ ဝက်အပေါင်းကို စည်းရုံး၍ တိုက်ခိုက်နည်းဗျူဟာ သင်ကြားကာ ဝက်တို့ကို ကိုက်စားနေသော ကျားကို ဝိုင်းဝန်းသတ်ဖြတ်နိုင်ခဲ့လေသည်။ ကျား၏ကျောထောက်နောက်ခံဖြစ်သော ရသေ့အတုကိုလည်း နှိမ်နင်းပြီး ဝက်အပေါင်း ငြိမ်းချမ်းစွာ နေထိုင်ကြရလေသည်။","moral":"စည်းလုံးညီညွတ်မှုနှင့် အကြံဉာဏ်သည် အားကြီးသောရန်ကိုပင် အောင်နိုင်စေ၏။"},{"no":284,"pali":"Sirijātaka","mm":"သိရိဇာတ်","summary":"စည်းစိမ်လာဘ်လာဘ၏ အကြောင်းရင်းကို ရှာဖွေမေးမြန်းသူတို့အား ဘုရားအလောင်း ရသေ့ပညာရှိက ပြုခဲ့ဖူးသော ကောင်းမှုကံနှင့် သီလဂုဏ်ကြောင့်သာ သိရီခေါ် ကံကောင်းခြင်း ဖြစ်ထွန်းကြောင်း၊ သူတစ်ပါး၏ ကံကောင်းခြင်းကို ခိုးယူ၍ မရနိုင်ကြောင်း ဟောကြားလေသည်။","moral":"စီးပွားချမ်းသာသည် မိမိပြုခဲ့သော ကောင်းမှုကံ၏ အကျိုးသာဖြစ်၏။"},{"no":285,"pali":"Maṇisūkarajātaka","mm":"မဏိသူကရဇာတ်","summary":"ဝက်တို့သည် ကျောက်သလင်းဂူ၏ တောက်ပသောအရောင်ကို မနှစ်သက်သဖြင့် ရွှံ့နွံဖြင့် ပွတ်တိုက်၍ ညစ်ညမ်းအောင် ပြုကြသော်လည်း ကျောက်သလင်းသည် ပို၍သာ တောက်ပလာလေသည်။ စင်ကြယ်သောအရာကို ညစ်ညမ်းအောင် မပြုနိုင်ကြောင်း ပညာရှိက ထောက်ပြဟောကြားလေသည်။","moral":"စင်ကြယ်သော သူတော်ကောင်းကို ယုတ်မာသူတို့ မည်သို့မျှ မညစ်ညမ်းစေနိုင်။"},{"no":286,"pali":"Sālūkajātaka","mm":"သာလူကဇာတ်","summary":"နွားပျိုညီဖြစ်သူသည် ကောင်းမွန်စွာ ကျွေးမွေးခြင်းခံရသော သာလူကဝက်ကို မနာလိုဖြစ်ရာ အစ်ကိုဖြစ်သော ဘုရားအလောင်း နွားလားက ထိုဝက်သည် မင်္ဂလာဆောင်ပွဲ၌ သတ်၍ချက်ပြုတ်ရန် မွေးမြူထားခြင်းသာဖြစ်ကြောင်း ရှင်းပြလေသည်။ ကောက်ရိုးမြက်ခြောက်ကိုသာ စားရသော်လည်း အသက်ရှည်စွာ ဘေးကင်းစွာ နေရခြင်းက မြတ်ကြောင်း ဆုံးမလေသည်။","moral":"ပျက်စီးခြင်းအကြောင်းပါသော စည်းစိမ်ကို မတောင့်တဘဲ ရိုးစင်းသော ဘေးကင်းမှုကို နှစ်သက်အပ်၏။"},{"no":287,"pali":"Lābhagarahajātaka","mm":"လာဘဂရဟဇာတ်","summary":"တပည့်က လာဘ်လာဘရရှိရေး နည်းလမ်းကို မေးလျှောက်သောအခါ ဘုရားအလောင်း ဆရာကြီးက ရှက်ကြောက်ခြင်းကင်းမဲ့စွာ လိမ်လည်ချော့မော့ ကုန်းချောတတ်မှသာ လောကတွင် လာဘ်ပေါများတတ်ကြောင်း ဆိုကာ ထိုမတရားသော လာဘ်ရှာနည်းကို ပြင်းထန်စွာ ကဲ့ရဲ့ပြစ်တင်လေသည်။","moral":"မတရားသဖြင့် ရသောလာဘ်ထက် ဖြောင့်မတ်စွာ အသက်မွေးခြင်းက မြတ်၏။"},{"no":288,"pali":"Macchuddānajātaka","mm":"မစ္ဆုဒ္ဒါနဇာတ်","summary":"ဘုရားအလောင်း ကုန်သည်၏ ညီသည် ငွေထုပ်ကို တစ်ဦးတည်း သိမ်းယူလို၍ လှည့်စားရာမှ မှားယွင်း၍ ငွေထုပ်ကိုပင် မြစ်ထဲသို့ ပစ်ချမိလေသည်။ ငါးတစ်ကောင်က ထိုငွေထုပ်ကို မျိုထားရာ တံငါတို့ ဖမ်းမိသော ထိုငါးသည် ဘုရားအလောင်း၏ အိမ်သို့ပင် ရောက်လာသဖြင့် ဖြောင့်မတ်သော ဘုရားအလောင်းသည် ဥစ္စာကို ပြန်လည်ရရှိလေသည်။","moral":"ဖြောင့်မတ်သူ၏ ဥစ္စာသည် မပျောက်ပျက်၊ လှည့်စားသူကား ဆုံးရှုံး၏။"},{"no":289,"pali":"Nānāchandajātaka","mm":"နာနာဆန္ဒဇာတ်","summary":"ဘုရားအလောင်း ဗာရာဏသီမင်းသည် ကျေးဇူးရှိခဲ့သော ပုဏ္ဏားမိသားစုအား ဆုပေးရာ မိသားစုဝင်တစ်ဦးစီက ရွာ၊ နွားမ၊ ရထား၊ နားတောင်း စသည်ဖြင့် အလိုဆန္ဒ အသီးသီးကွဲပြားစွာ တောင်းကြသည်ကို တွေ့ရလေသည်။ မင်းကြီးသည် အားလုံး၏ ဆန္ဒအသီးသီးကို ဖြည့်ဆည်းပေးလေသည်။","moral":"သတ္တဝါတို့၏ အလိုဆန္ဒသည် တစ်ဦးနှင့်တစ်ဦး မတူကွဲပြားကြ၏။"},{"no":290,"pali":"Sīlavīmaṁsakajātaka","mm":"သီလဝီမံသကဇာတ်","summary":"ဘုရားအလောင်း ပရောဟိတ်ပုဏ္ဏားသည် မင်းကြီးက မိမိအား ချီးမြှောက်ခြင်းသည် အမျိုးဇာတ်ကြောင့်လော သီလကြောင့်လော သိလို၍ ငွေတိုက်မှ ငွေဒင်္ဂါးကို သုံးရက်တိုင်တိုင် ယူကြည့်လေသည်။ ဖမ်းဆီးခံရသောအခါ စမ်းသပ်ခြင်းသာဖြစ်ကြောင်း ထုတ်ဖော်ကာ သီလသာလျှင် မြတ်ကြောင်း သိမြင်၍ တောထွက်ရသေ့ပြုလေသည်။","moral":"အမျိုးဇာတ်ထက် သီလသည်သာ အမြတ်ဆုံးဖြစ်၏။"},{"no":291,"pali":"Surāghaṭajātaka","mm":"သုရာဃဋဇာတ်","summary":"မိဘစဉ်ဆက် ဥစ္စာကို ဖြုန်းတီးခဲ့သော လုလင်တစ်ဦးသည် ဆုတောင်းပြည့် အိုးမြတ်ကို ရရှိသော်လည်း သေရည်ယစ်မူးလျက် ပေါ့ဆစွာ မြှောက်ကစားရာမှ အိုးကွဲကြေ၍ တစ်ဖန် ဆင်းရဲသားဘဝသို့ ပြန်ရောက်ရလေသည်။","moral":"မေ့လျော့ပေါ့ဆသူသည် ရရှိပြီးသော စည်းစိမ်ကိုပင် ဖျက်ဆီးမိတတ်၏။"},{"no":292,"pali":"Supattajātaka","mm":"သုပတ္တဇာတ်","summary":"ဘုရားအလောင်း ကျီးမင်း သုပတ္တ၏ မိဖုရားကျီးမသည် ကိုယ်ဝန်အလိုဆန္ဒဖြင့် ဗာရာဏသီမင်း၏ စားတော်ငါးဟင်းကို စားလိုလေသည်။ စစ်သူကြီးကျီးသည် အသက်စွန့်၍ ဆောင်ယူပေးရာ ဖမ်းမိသောအခါ သခင့်အပေါ် သစ္စာစောင့်သိပုံကို လျှောက်ထားသဖြင့် မင်းကြီး ကြည်ညို၍ ကျီးအပေါင်းကို ကျွေးမွေးစောင့်ရှောက်လေသည်။","moral":"သစ္စာစောင့်သိခြင်းနှင့် အနစ်နာခံခြင်းသည် ရန်သူကိုပင် ကြည်ညိုစေ၏။"},{"no":293,"pali":"Kāyanibbindajātaka","mm":"ကာယနိဗ္ဗိန္ဒဇာတ်","summary":"ဘုရားအလောင်း ပုဏ္ဏားသည် ပြင်းထန်သော အနာရောဂါကို ခံစားရပြီးနောက် ခန္ဓာကိုယ်၏ မမြဲသောသဘောနှင့် ဆင်းရဲခြင်းသဘောကို ထိုးထွင်းသိမြင်လေသည်။ ထို့ကြောင့် ကာမဂုဏ်ကို စွန့်၍ ရသေ့ရဟန်းပြုကာ ဈာန်ကို ရရှိလေသည်။","moral":"ခန္ဓာကိုယ်၏ မမြဲသောသဘောကို ဆင်ခြင်လျှင် စွဲလမ်းမှု ကင်းဝေး၏။"},{"no":294,"pali":"Jambukhādakajātaka","mm":"ဇမ္ဗုခါဒကဇာတ်","summary":"ခွေးအသည် သပြေပင်ပေါ်၌ သီးစားနေသော ကျီးကို အသံချိုသာသော ငှက်မင်းဟု ချော့မော့ချီးမွမ်း၍ အသီးကို ရအောင်ယူလေသည်။ ကျီးကလည်း ခွေးအကို ခြင်္သေ့ကဲ့သို့သော သားရဲမင်းဟု ပြန်လည်ချီးမွမ်းရာ ဘုရားအလောင်း ရုက္ခစိုးနတ်က မဟုတ်မမှန် အချင်းချင်း ချီးမွမ်းနေသော လိမ်လည်သူနှစ်ဦးကို ပြစ်တင်ဆုံးမလေသည်။","moral":"မမှန်သော ချီးမွမ်းမြှောက်ပင့်ခြင်းသည် ယုတ်မာသူတို့၏ အလေ့သာဖြစ်၏။"},{"no":295,"pali":"Antajātaka","mm":"အန္တဇာတ်","summary":"ကျီးနှင့် ခွေးအတို့သည် ယုတ်ညံ့သော ကြက်ဆူပင်၌ တွေ့ဆုံကြပြီး အချင်းချင်း လွန်ကဲစွာ ချီးမွမ်းမြှောက်ပင့်ကြပြန်လေသည်။ ဘုရားအလောင်း ရုက္ခစိုးနတ်က ငှက်တို့တွင် အယုတ်ဆုံးကျီး၊ သားရဲတို့တွင် အယုတ်ဆုံးခွေးအ၊ အပင်တို့တွင် အယုတ်ဆုံးကြက်ဆူပင်တို့ စုဝေးမိကြပြီဟု ကဲ့ရဲ့ဆုံးမလေသည်။","moral":"ယုတ်ညံ့သူတို့သည် ယုတ်ညံ့သူချင်းသာ ပေါင်းဖော်တတ်ကြ၏။"},{"no":296,"pali":"Samuddajātaka","mm":"သမုဒ္ဒဇာတ်","summary":"ရေကျီးငှက်တစ်ကောင်သည် သမုဒ္ဒရာရေပြင်ထက် ပျံဝဲလျက် မိမိသောက်ရန်ရေ ကုန်မည်စိုး၍ သမုဒ္ဒရာရေကို မသောက်ကြရန် သတ္တဝါတို့ကို တားမြစ်အော်မြည်နေလေသည်။ ဘုရားအလောင်း သမုဒ္ဒရာစောင့်နတ်က မည်သူမျှ ကုန်ခန်းအောင် မသောက်နိုင်သော သမုဒ္ဒရာကို စိုးရိမ်နေသော ထိုငှက်၏ မိုက်မဲမှုကို ထောက်ပြဆုံးမလေသည်။","moral":"အပိုင်းအခြားမသိသော လောဘနှင့် စိုးရိမ်မှုသည် အချည်းနှီးသာဖြစ်၏။"},{"no":297,"pali":"Kāmavilāpajātaka","mm":"ကာမဝိလာပဇာတ်","summary":"အပြစ်ဒဏ်စီရင်ခြင်းခံရသော ယောက်ျားတစ်ဦးသည် သေခါနီးအချိန်၌ပင် ချစ်သောမယားကို အောက်မေ့တသလျက် ကာမဂုဏ်ကို ငိုကြွေးမြည်တမ်းနေလေသည်။ ကာမတဏှာသည် သေခြင်းတရား၏ အနီး၌ပင် သတ္တဝါတို့ကို စွဲမြဲစွာ ဖွဲ့ချည်ထားတတ်ကြောင်း ပြဆိုသော ဇာတ်တော်ဖြစ်သည်။","moral":"ကာမတဏှာ၌ ကပ်ငြိစွဲလမ်းခြင်းသည် သေခါနီးတိုင်အောင် ဆင်းရဲစေ၏။"},{"no":298,"pali":"Udumbarajātaka","mm":"ဥဒုမ္ဗရဇာတ်","summary":"မျောက်တစ်ကောင်သည် မိုးလေမှ ကွယ်ကာရာ ကျောက်ဂူကို ရလိုသဖြင့် ဂူ၌နေသော မျောက်အား ရေသဖန်းသီးများ မှည့်နေပြီဟု လှည့်ဖြားကာ ဂူကို သိမ်းယူလေသည်။ လှည့်စားခြင်းခံရသော မျောက်သည် နောက်တစ်ကြိမ် ထပ်မံဖြားယောင်းသည်ကို မယုံကြည်တော့ချေ။","moral":"တစ်ကြိမ်လှည့်စားဖူးသူ၏ စကားကို နောက်တစ်ဖန် မယုံအပ်။"},{"no":299,"pali":"Komāraputtajātaka","mm":"ကောမာရပုတ္တဇာတ်","summary":"ရွှင်ပျပြက်ရယ်တတ်သော ရသေ့တို့ထံ၌ နေသောမျောက်သည် ပြက်လုံးဟန်ပန်တို့ကိုသာ တတ်မြောက်ခဲ့သော်လည်း တည်ကြည်သော ကောမာရပုတ္တရသေ့ထံ ရောက်သောအခါ ငြိမ်သက်တည်ကြည်စွာ နေတတ်လာလေသည်။ ဆည်းကပ်ရာ ပတ်ဝန်းကျင်၏ အကျင့်သည် မိမိအပေါ် သက်ရောက်တတ်ကြောင်း ပြဆိုသော ဇာတ်တော်ဖြစ်သည်။","moral":"ပေါင်းဖော်ဆည်းကပ်ရာ ပတ်ဝန်းကျင်ကောင်းမှ အကျင့်ကောင်းကို ရ၏။"},{"no":300,"pali":"Vakajātaka","mm":"ဝကဇာတ်","summary":"ဝံပုလွေတစ်ကောင်သည် ရေလွှမ်းမိုး၍ ကျောက်ဆောင်ပေါ်၌ ပိတ်မိနေစဉ် အစာမရသောကြောင့် ဥပုသ်စောင့်မည်ဟု အဓိဋ္ဌာန်ပြုလေသည်။ ဘုရားအလောင်း သိကြားမင်းသည် ဆိတ်အသွင်ဖန်ဆင်း၍ စမ်းသပ်ရာ ဝံပုလွေသည် ချက်ချင်းပင် အဓိဋ္ဌာန်ကိုစွန့်၍ လိုက်ဖမ်းသော်လည်း မမိသောအခါ ဥပုသ်ကား မပျက်သေးဟု ပြန်ဆိုလေသည်။","moral":"စေတနာစစ်မပါသော အကျင့်ဟန်ဆောင်မှုသည် အနှစ်သာရ မရှိ။"},{"no":301,"pali":"Cūḷakāliṅgajātaka","mm":"စူဠကာလိင်္ဂဇာတ်","summary":"ကာလိင်္ဂမင်းနှင့် အဿကမင်းတို့ စစ်ဖြစ်ကြရာ သိကြားမင်းက ကာလိင်္ဂမင်း အနိုင်ရလိမ့်မည်ဟု ကြိုတင်ဟောကြားခဲ့သော်လည်း အဿကမင်းဘက်မှ လုံ့လဝီရိယဖြင့် ကြိုးစားတိုက်ခိုက်သဖြင့် ဟောကြားချက်နှင့်ဆန့်ကျင်၍ အဿကမင်း အနိုင်ရလေသည်။ ဘုရားလောင်းသည် ထိုအခါက ရသေ့ဖြစ်တော်မူ၏။","moral":"ကံကြမ္မာအဟောကို အားကိုးခြင်းထက် လုံ့လဝီရိယက အရေးကြီး၏။"},{"no":302,"pali":"Mahāassārohajātaka","mm":"မဟာအဿာရောဟဇာတ်","summary":"စစ်ရေးနိမ့်၍ တောရွာသို့ရောက်သော ဗာရာဏသီမင်းကြီး (ဘုရားလောင်း) အား မင်းမှန်းမသိသော ရွာသားတစ်ဦးက စေတနာဖြင့် ဧည့်ဝတ်ပြု ကျွေးမွေးပြုစုခဲ့ရာ၊ နောင်အခါ မင်းကြီးက ထိုကျေးဇူးရှင်ကို နန်းတော်သို့ခေါ်၍ ကြီးစွာသောစည်းစိမ်ဖြင့် ကျေးဇူးဆပ်တော်မူသည်။","moral":"ပြုဖူးသောကျေးဇူးကို မမေ့ဘဲ ထိုက်တန်စွာ ဆပ်တတ်ရာ၏။"},{"no":303,"pali":"Ekarājajātaka","mm":"ဧကရာဇဇာတ်","summary":"ဗာရာဏသီရှင် ဧကရာဇမင်း (ဘုရားလောင်း) သည် ရန်သူမင်း၏ ဖမ်းဆီးနှိပ်စက်ခြင်းကို ခံရသော်လည်း အမျက်မထွက်ဘဲ မေတ္တာပွားများ သည်းခံနေသဖြင့် ရန်သူမင်း ကြောက်ရွံ့နောင်တရ၍ နိုင်ငံတော်ကို ပြန်လည်ဆက်ကပ်ပြီး ခွင့်လွှတ်ရန် တောင်းပန်လေသည်။","moral":"မေတ္တာနှင့် သည်းခံခြင်းသည် ရန်သူကိုပင် အနိုင်ယူနိုင်၏။"},{"no":304,"pali":"Daddarajātaka","mm":"ဒဒ္ဒရဇာတ်","summary":"ဘုရားလောင်း ဒဒ္ဒရနဂါးမင်းသားသည် ညီတော်၏အပြစ်ကြောင့် နဂါးပြည်မှ နှင်ထုတ်ခြင်းခံရ၍ လူ့ပြည်၌ သုံးနှစ်ပတ်လုံး ကဲ့ရဲ့ရှုတ်ချခြင်းကို သည်းခံစွာ နေထိုင်ခဲ့ရပြီးမှ နဂါးပြည်သို့ ပြန်လည်ရောက်ရှိလေသည်။","moral":"ဂုဏ်ရှိသူသည် ဒုက္ခနှင့် ကဲ့ရဲ့ခြင်းကိုပင် သည်းခံနိုင်ရ၏။"},{"no":305,"pali":"Sīlavīmaṁsanajātaka","mm":"သီလဝီမံသနဇာတ်","summary":"ဆရာက တပည့်တို့၏သီလကို စမ်းသပ်လို၍ မည်သူမျှမမြင်သောအခါ ခိုးယူခဲ့ကြရန် စေခိုင်းရာ၊ ဘုရားလောင်းတပည့်တစ်ဦးသာ မကောင်းမှုပြုရာ၌ ဆိတ်ကွယ်ရာဟူ၍ မရှိဟုဆိုကာ ငြင်းဆန်ခဲ့သဖြင့် ဆရာက ချီးမွမ်း၍ သမီးတော်နှင့် ထိမ်းမြားပေးလေသည်။","moral":"မကောင်းမှုအတွက် ဆိတ်ကွယ်ရာမရှိ၊ သီလသည်သာ အမြတ်ဆုံးဖြစ်၏။"},{"no":306,"pali":"Sujātājātaka","mm":"သုဇာတာဇာတ်","summary":"ဟင်းသီးဟင်းရွက်သည်၏သမီး သုဇာတာသည် မိဖုရားကြီးဖြစ်လာသောအခါ မိမိဇာစ်မြစ်ကိုမေ့၍ မာနထောင်လွှားလာသဖြင့် မင်းကြီးအမျက်ထွက်ရာ၊ ပညာရှိအမတ် (ဘုရားလောင်း) က လိမ္မာစွာဖြန်ဖြေ၍ နှစ်ဦးသား ပြန်လည်သင့်မြတ်စေခဲ့သည်။","moral":"မိမိဇာစ်မြစ်ကို မမေ့ဘဲ နှိမ့်ချစွာ နေထိုင်ရာ၏။"},{"no":307,"pali":"Palāsajātaka","mm":"ပလာသဇာတ်","summary":"ဆင်းရဲသောပုဏ္ဏားတစ်ဦးသည် ပေါက်ပင်ကြီးကို ရိုသေစွာ လုပ်ကျွေးပူဇော်လေ့ရှိရာ၊ သစ်ပင်စောင့်နတ် (ဘုရားလောင်း) က ထိုစေတနာကို ကျေးဇူးတုံ့ပြန်သောအားဖြင့် မြှုပ်ထားသောရွှေအိုးရှိရာကို ညွှန်ပြပေး၍ ချမ်းသာစေလေသည်။","moral":"ကျေးဇူးသိတတ်၍ ရိုသေပူဇော်တတ်သူသည် ကောင်းကျိုးချမ်းသာ ရ၏။"},{"no":308,"pali":"Sakuṇajātaka","mm":"သကုဏဇာတ်","summary":"ခြင်္သေ့လည်ချောင်း၌ စူးနေသောအရိုးကို သစ်တောက်ငှက် (ဘုရားလောင်း) က ထုတ်ပေးကယ်ဆယ်ခဲ့သော်လည်း၊ နောင်အခါ ကျေးဇူးတောင်းသောအခါ ခြင်္သေ့က ငါ့ခံတွင်းထဲမှ အသက်ရှင်လျက် ထွက်ခွင့်ရသည်ကိုပင် ကျေးဇူးဟုမှတ်လော့ဟု ပြန်ပြောလေသည်။","moral":"သူယုတ်မာထံမှ ကျေးဇူးတုံ့ပြန်ခြင်းကို မမျှော်လင့်ရာ။"},{"no":309,"pali":"Chavakajātaka","mm":"ဆဝကဇာတ်","summary":"ဒွန်းစဏ္ဍားအမျိုးသား ဘုရားလောင်းသည် မင်း၏ဥယျာဉ်၌ ဖမ်းဆီးခံရစဉ်၊ နိမ့်သောနေရာ၌ထိုင်လျက် မြင့်သောနေရာရှိတပည့်အား တရားသင်ပေးနေသော ပုရောဟိတ်၏ မလျောက်ပတ်မှုကို မင်းကြီးအား ရဲရင့်စွာထောက်ပြ၍ တရားဓမ္မအပေါ် ရိုသေမှုကို ပြန်လည်တည်စေသည်။","moral":"တရားဓမ္မနှင့် ဆရာသမားကို လျောက်ပတ်စွာ ရိုသေရာ၏။"},{"no":310,"pali":"Seyyajātaka","mm":"သေယျဇာတ်","summary":"ဘုရားလောင်းပုဏ္ဏားလုလင်သည် မိတ်ဆွေမင်းသား မင်းဖြစ်လာသောအခါ ပုရောဟိတ်ရာထူးဖြင့် ချီးမြှင့်လိုသည်ကို ငြင်းပယ်ကာ ရသေ့ရဟန်းပြုခဲ့ပြီး၊ စည်းစိမ်ဖြင့် ပြန်လည်ခေါ်ယူရန် လာရောက်သော အမတ်ကိုလည်း ငြင်းဆန်ခဲ့လေသည်။","moral":"လောကီစည်းစိမ်ထက် ငြိမ်းချမ်းသော တောထွက်ခြင်းက မြတ်၏။"},{"no":311,"pali":"Pucimandajātaka","mm":"ပုစိမန္ဒဇာတ်","summary":"ဘုရားလောင်း တမာပင်စောင့်နတ်သည် ခိုးရာပါပစ္စည်းနှင့်တကွ သစ်ပင်ရင်း၌ အိပ်နေသောခိုးသူကို ဤနေရာ၌ဖမ်းမိလျှင် သစ်ပင်ပါ ဘေးဒုက္ခရောက်နိုင်သည်ဟု ကြိုတင်မြင်၍ နိုးဆော်နှင်ထုတ်လိုက်လေသည်။","moral":"ဘေးရန်ကို မဆိုက်ရောက်မီ ကြိုတင်ကာကွယ်ရာ၏။"},{"no":312,"pali":"Kassapamandiyajātaka","mm":"ကဿပမန္ဒိယဇာတ်","summary":"ရသေ့ရဟန်းပြုကြသော သားအဖသုံးဦးတွင် ညီငယ်နှင့် အဖအိုတို့ အချင်းများကြရာ၊ ဘုရားလောင်း ရသေ့ကြီးဖြစ်သောသားက အသက်ကြီးသူနှင့် ငယ်ရွယ်သူတို့သည် အချင်းချင်း၏အမှားကို အပြန်အလှန် သည်းခံခွင့်လွှတ်ကြရမည်ဟု ဆုံးမလေသည်။","moral":"ကြီးသူနှင့်ငယ်သူ အပြန်အလှန် သည်းခံခွင့်လွှတ်ရာ၏။"},{"no":313,"pali":"Khantīvādījātaka","mm":"ခန္တီဝါဒီဇာတ်","summary":"ခန္တီတရားကိုဟောသော ဘုရားလောင်း ခန္တီဝါဒီရသေ့သည် ကလာဗုမင်း၏ ညှဉ်းပန်း၍ လက်ခြေနားနှာ ဖြတ်တောက်ခြင်းကို ခံရသော်လည်း အမျက်ဒေါသ လုံးဝမထွက်ဘဲ သည်းခံတော်မူ၏။ ယုတ်မာသောမင်းမှာ မြေမျိုခြင်းခံရလေသည်။","moral":"ခန္တီသည်းခံခြင်းသည် အမြတ်ဆုံးသော အကျင့်ဖြစ်၏။"},{"no":314,"pali":"Lohakumbhijātaka","mm":"လောဟကုမ္ဘိဇာတ်","summary":"ညဉ့်အခါ ကြောက်မက်ဖွယ်အသံလေးသံကို ကြားရ၍ ထိတ်လန့်နေသောမင်းကြီးအား ဘုရားလောင်းပုဏ္ဏားက ထိုအသံတို့သည် သူတစ်ပါးသားမယားကို ပြစ်မှားခဲ့သူတို့ လောဟကုမ္ဘီငရဲ၌ ခံစားနေရသောအသံများဖြစ်ကြောင်း ရှင်းပြ၍ သတ္တဝါတို့ကို ယဇ်ပူဇော်သတ်ဖြတ်မည့်အကြံကို ဖျက်သိမ်းစေသည်။","moral":"ကာမဂုဏ်ပြစ်မှားခြင်း၏ အကျိုးဆက်သည် ကြောက်မက်ဖွယ်ကောင်း၏။"},{"no":315,"pali":"Sabbamaṁsalābhajātaka","mm":"သဗ္ဗမံသလာဘဇာတ်","summary":"မုဆိုးထံ အမဲသားတောင်းသော သူဌေးသားလေးဦးတွင် ကြမ်းတမ်းစွာနှင့် မဆီလျော်စွာ ပြောဆိုသူတို့သည် အသားအနည်းငယ်စီသာ ရကြပြီး၊ အဆွေဟု ချစ်ခင်လေးစားစွာ ခေါ်ဝေါ်ပြောဆိုသော ဘုရားလောင်းသူဌေးသားမှာ လှည်းတစ်စီးလုံးသောအသားကို ရလေသည်။","moral":"ချိုသာလျောက်ပတ်သောစကားသည် အလိုရှိရာကို ပြည့်စုံစေ၏။"},{"no":316,"pali":"Sasapaṇḍitajātaka","mm":"သသပဏ္ဍိတဇာတ်","summary":"ဘုရားလောင်း ယုန်ပညာရှိသည် ဥပုသ်နေ့၌ အလှူခံရန် ပုဏ္ဏားအသွင်ဖြင့်လာသော သိကြားမင်းအား လှူဖွယ်မရှိသဖြင့် မိမိကိုယ်ကိုပင် မီးပုံထဲသို့ခုန်ချ၍ လှူဒါန်းရန် စွန့်လွှတ်ခဲ့သည်။ သိကြားမင်းက ထိုစွန့်လွှတ်မှုကို အမှတ်ရစေရန် လမင်း၌ ယုန်ရုပ်ပုံကို ရေးမှတ်ခဲ့လေသည်။","moral":"ကိုယ်ကျိုးစွန့်၍ ပေးလှူခြင်းသည် အမြတ်ဆုံးသော ဒါနဖြစ်၏။"},{"no":317,"pali":"Matarodanajātaka","mm":"မတရောဒနဇာတ်","summary":"ဆွေမျိုးတစ်ဦး ကွယ်လွန်သောအခါ အိမ်သူအိမ်သားတို့ ပြင်းစွာ ငိုကြွေးပူဆွေးနေကြရာ၊ ဘုရားလောင်းက မွေးဖွားလာသူတိုင်း သေခြင်းတရားသည် မလွဲဧကန်ရှိသည်ဟု ဆုံးမဟောကြား၍ ပူဆွေးသောကကို ငြိမ်းစေလေသည်။","moral":"သေဆုံးပြီးသူအတွက် ငိုကြွေးပူဆွေးခြင်းသည် အကျိုးမရှိ။"},{"no":318,"pali":"Kaṇaverajātaka","mm":"ကဏဝေရဇာတ်","summary":"ပြည့်တန်ဆာမ သာမာသည် ချစ်သူဓားပြဗိုလ် (ဘုရားလောင်း) ကို ကယ်တင်ရန် အခြားယောက်ျားတစ်ဦး၏အသက်ကို စတေးခဲ့ရာ၊ ဓားပြဗိုလ်က ငါ့အတွက် သူတစ်ပါးကို သစ္စာဖောက်နိုင်သူသည် ငါ့ကိုလည်း ဖောက်နိုင်လိမ့်မည်ဟု ဆင်ခြင်၍ သူမထံမှ ထွက်ခွာသွားလေသည်။","moral":"သူတစ်ပါးကို သစ္စာဖောက်ဖူးသူကို အကြွင်းမဲ့ မယုံရာ။"},{"no":319,"pali":"Tittirajātaka","mm":"တိတ္တိရဇာတ်","summary":"မုဆိုး၏ အယောင်ပြငှက်အဖြစ် အသုံးချခံရသဖြင့် မိမိအော်သံကြောင့် အခြားငှက်တို့ အသတ်ခံရသည်ကို အပြစ်ဖြစ်မည်လောဟု စိုးရိမ်သော တိတ္တိရငှက်အား ဘုရားလောင်းရသေ့က မကောင်းသောစေတနာမပါလျှင် အပြစ်မသင့်ဟု ဖြေကြားတော်မူသည်။","moral":"ကံ၏အပြစ်သည် စေတနာအပေါ်၌ တည်၏။"},{"no":320,"pali":"Succajajātaka","mm":"သုစ္စဇဇာတ်","summary":"ဒုက္ခရောက်စဉ် မိမိနှင့်အတူ သစ္စာရှိစွာ လိုက်ပါခဲ့သော ဇနီးသည်အား မင်းသားက စေတနာမဲ့စွာ ဆက်ဆံခဲ့ရာ၊ မင်းဖြစ်သောအခါ ပညာရှိအမတ် (ဘုရားလောင်း) ၏ ထောက်ပြဆုံးမချက်ကြောင့် နောင်တရ၍ မိဖုရားအား ကြီးစွာ ချီးမြှင့်ပြန်လေသည်။","moral":"မိမိအား သစ္စာရှိသူ၏ ကျေးဇူးကို မမေ့အပ်။"},{"no":321,"pali":"Kuṭidūsakajātaka","mm":"ကုဋိဒူသကဇာတ်","summary":"မိုးထဲလေထဲ ချမ်းအေးတုန်လှုပ်နေသော မျောက်အား ဘုရားလောင်းငှက်က အိမ်ဆောက်၍နေပါလော့ဟု စေတနာဖြင့် အကြံပေးရာ၊ မျောက်သည် အိမ်မဆောက်နိုင်သည့်အပြင် မနာလိုစိတ်ဖြင့် ငှက်၏အသိုက်ကိုပင် ဖျက်ဆီးပစ်လေသည်။","moral":"သူယုတ်မာအား အကြံကောင်းပေးခြင်းသည် အကျိုးမရှိ။"},{"no":322,"pali":"Duddubhajātaka","mm":"ဒုဒ္ဒုဘဇာတ်","summary":"သစ်သီးကြီးတစ်လုံး ကြွေကျသံကို မြေကြီးပြိုကွဲပြီဟု ထင်မှတ်သောယုန်ကြောင့် တောသတ္တဝါအပေါင်း ထိတ်လန့်ပြေးကြရာ၊ ဘုရားလောင်း ခြင်္သေ့မင်းက အကြောင်းရင်းကို လိုက်လံစုံစမ်း၍ အမှန်တရားကို ဖော်ထုတ်ကာ သတ္တဝါတို့ကို ငြိမ်းချမ်းစေလေသည်။","moral":"ကောလာဟလကို မစိစစ်ဘဲ ယုံကြည်လိုက်ပါခြင်း မပြုရာ။"},{"no":323,"pali":"Brahmadattajātaka","mm":"ဗြဟ္မဒတ္တဇာတ်","summary":"ဘုရားလောင်းရသေ့သည် မင်းကြီးထံ ဖိနပ်နှင့်ထီးကို တောင်းခံလိုသော်လည်း တောင်းခံရမည်ကို ရှက်ကြောက်သဖြင့် ဆယ့်နှစ်နှစ်ကြာအောင် မတောင်းရဲဘဲနေခဲ့ပြီး၊ နောက်ဆုံး၌ တောင်းခံခြင်းသည်လည်းကောင်း ငြင်းပယ်ခံရခြင်းသည်လည်းကောင်း မျက်ရည်ကျဖွယ်ဖြစ်ကြောင်း လျှောက်ထားလေသည်။","moral":"တောင်းခံခြင်းသည် ရှက်ဖွယ်ဖြစ်၍ ရှောင်နိုင်သမျှ ရှောင်ရာ၏။"},{"no":324,"pali":"Cammasāṭakajātaka","mm":"စမ္မသာဋကဇာတ်","summary":"သိုးထီးတစ်ကောင် ဝှေ့ခတ်ရန် နောက်သို့ဆုတ်နေသည်ကို ငါ့အားရိုသေ၍ ဦးညွှတ်နေသည်ဟု ထင်မှတ်သော သားရေဝတ်ရုံသည့် သူတော်ယောင်သည် ဘုရားလောင်းပညာရှိ၏ သတိပေးချက်ကို နားမထောင်သဖြင့် ပြင်းထန်စွာ ဝှေ့ခတ်ခြင်းခံရလေသည်။","moral":"အကြောင်းကို မဆင်ခြင်ဘဲ အထင်မှားခြင်းသည် ဘေးရောက်စေ၏။"},{"no":325,"pali":"Godharājajātaka","mm":"ဂေါဓရာဇဇာတ်","summary":"ရသေ့အသွင်ဆောင်လျက် ဖွတ်သားကို စားလိုသော သူတော်ယောင်၏အကြံကို ဘုရားလောင်း ဖွတ်မင်းက သိမြင်၍ ရှောင်လွှဲပြီး၊ အကျင့်သီလမပါသော ရသေ့အသွင်သည် အချည်းနှီးသာဖြစ်ကြောင်း ကဲ့ရဲ့ဆုံးမလေသည်။","moral":"အသွင်ဆောင်ရုံမျှဖြင့် သူတော်ကောင်း မဖြစ်နိုင်။"},{"no":326,"pali":"Kakkārujātaka","mm":"ကက္ကာရုဇာတ်","summary":"နတ်ပြည်မှ ကက္ကာရုပန်းကို သီလဂုဏ်နှင့် ပြည့်စုံသူသာ ဝတ်ဆင်ထိုက်ရာ၊ ဂုဏ်မရှိဘဲ ဝတ်ဆင်မိသူတို့မှာ ဆင်းရဲဒုက္ခရောက်၍ မိမိတို့အပြစ်ကို ဝန်ခံကြရလေသည်။ ဘုရားလောင်းသည် ထိုပန်းကိုဆောင်သော နတ်သားဖြစ်၏။","moral":"မိမိ၌မရှိသောဂုဏ်ကို ဟန်ဆောင်ခြင်းသည် ဘေးဖြစ်စေ၏။"},{"no":327,"pali":"Kākavatījātaka","mm":"ကာကဝတီဇာတ်","summary":"ကာကဝတီမိဖုရားကို ဂဠုန်မင်းက ဆောင်ယူသွားရာ၊ လိုက်ပါသွားခဲ့သော သီချင်းသည်တော် နဋကုဝေရက အကြောင်းစုံကို သီချင်းဖြင့် ဖွင့်ဟသီဆိုသဖြင့် လျှို့ဝှက်ချက် ပေါ်လွင်၍ မိဖုရားလည်း နန်းတော်သို့ ပြန်လည်ရောက်ရှိလာလေသည်။ ဘုရားလောင်းသည် မင်းကြီးဖြစ်၏။","moral":"မကောင်းမှုသည် မည်မျှဖုံးကွယ်စေကာမူ ပေါ်လွင်တတ်၏။"},{"no":328,"pali":"Ananusociyajātaka","mm":"အနနုသောစိယဇာတ်","summary":"ဘုရားလောင်းပုဏ္ဏားသည် သီလဂုဏ်နှင့်ပြည့်စုံသော ဇနီးသည် ကွယ်လွန်သောအခါ ခိုင်မြဲခြင်းမရှိသော သင်္ခါရတရားတို့အတွက် ပူဆွေးခြင်းသည် အချည်းနှီးသာဖြစ်သည်ဟု ဆင်ခြင်၍ မငိုကြွေးဘဲ နေတော်မူသည်။","moral":"အနိစ္စတရားကို ဆင်ခြင်လျှင် သောကငြိမ်း၏။"},{"no":329,"pali":"Kāḷabāhujātaka","mm":"ကာဠဗာဟုဇာတ်","summary":"မင်းကြီးထံ ချီးမြှောက်ခံရသော ကြက်တူရွေးညီနောင် (ဘုရားလောင်းသည် အစ်ကြီး ရာဓ) တို့သည် ကာဠဗာဟုမည်သော မျောက်ရောက်လာသောအခါ အရေးမပေးခံရတော့သော်လည်း၊ မျောက်၏ ရိုင်းစိုင်းသောအမူအရာကြောင့် မကြာမီ မျက်နှာပျက်၍ ကြက်တူရွေးတို့သာ ပြန်လည်ချီးမြှောက်ခံရလေသည်။","moral":"အသစ်အဆန်းကို မက်မောခြင်းသည် မတည်မြဲ၊ ဂုဏ်ရည်သာ တည်မြဲ၏။"},{"no":330,"pali":"Sīlavīmaṁsajātaka","mm":"သီလဝီမံသဇာတ်","summary":"ဘုရားလောင်းပုရောဟိတ်သည် မင်းကြီးရိုသေသည်မှာ အမျိုးဇာတ်ကြောင့်လော သီလကြောင့်လောဟု စမ်းသပ်လိုသဖြင့် ဘဏ္ဍာစိုး၏ အသပြာကို သုံးရက်တိုင်တိုင် ယူပြရာ တတိယနေ့၌ ဖမ်းဆီးခံရသောအခါ သီလသည်သာမြတ်သည်ဟု ဆုံးဖြတ်ကာ တောထွက်တော်မူလေသည်။","moral":"အမျိုးဇာတ်နှင့် အတတ်ပညာထက် သီလက မြတ်၏။"},{"no":331,"pali":"Kokilajātaka","mm":"ကောကိလဇာတ်","summary":"ကျီးအသိုက်၌ ကြီးပြင်းခဲ့သော ဥဩငှက်ပေါက်သည် အချိန်မတန်မီ အသံပြုမိသဖြင့် ကျီးတို့သိရှိ၍ အသတ်ခံရလေသည်။ ဘုရားလောင်းအမတ်က ဤဥပမာဖြင့် စကားကို အချိန်အခါသင့်မှသာ ဆိုသင့်ကြောင်း မင်းကြီးအား လျှောက်တင်ဆုံးမသည်။","moral":"စကားကို အချိန်ကာလ လျောက်ပတ်မှသာ ဆိုအပ်၏။"},{"no":332,"pali":"Rathalaṭṭhijātaka","mm":"ရထလဋ္ဌိဇာတ်","summary":"မင်းကြီးသည် တစ်ဖက်သတ် တိုင်ကြားချက်ကိုသာ ကြားနာ၍ အမှုကို စီရင်လုနီးရာ၊ ဘုရားလောင်းအမတ်ကြီးက အမှုအခင်းကို နှစ်ဖက်သောစကားကို စေ့စေ့စပ်စပ် ကြားနာစိစစ်ပြီးမှသာ စီရင်ဆုံးဖြတ်သင့်ကြောင်း လျှောက်ထားဆုံးမလေသည်။","moral":"နှစ်ဖက်စကားကို မကြားနာဘဲ အမှုမဆုံးဖြတ်ရာ။"},{"no":333,"pali":"Pakkagodhajātaka","mm":"ပက္ကဂေါဓဇာတ်","summary":"ဒုက္ခရောက်စဉ် ဇနီးသည်မသိအောင် ဖွတ်ကင်ကို တစ်ဦးတည်း စားခဲ့သောမင်းသားသည် မင်းဖြစ်သောအခါ ဇနီးသည်အား ကျေးဇူးမဲ့ ဆက်ဆံနေရာ၊ ဘုရားလောင်းအမတ်က ထိုအကြောင်းကို ဖော်ထုတ်လျှောက်တင်သဖြင့် မင်းကြီး နောင်တရ၍ မိဖုရားအား ပြန်လည်ချီးမြှင့်လေသည်။","moral":"ကျေးဇူးကန်းခြင်းသည် ယုတ်ညံ့သောအကျင့်ဖြစ်၏။"},{"no":334,"pali":"Rājovādajātaka","mm":"ရာဇောဝါဒဇာတ်","summary":"ဘုရားလောင်းရသေ့က မင်းတို့ တရားသဖြင့် အုပ်ချုပ်လျှင် သစ်သီးတို့ပင် ချိုမြိန်၍ မတရားအုပ်ချုပ်လျှင် အရသာပျက်ကုန်သည်ဟူသော ဥပမာဖြင့် မင်းကျင့်တရားကို မင်းကြီးအား ဟောကြားဆုံးမတော်မူသည်။","moral":"မင်းတရားသဖြင့် အုပ်ချုပ်မှသာ တိုင်းပြည်စည်ပင်၏။"},{"no":335,"pali":"Jambukajātaka","mm":"ဇမ္ဗုကဇာတ်","summary":"ခြင်္သေ့ကဲ့သို့ ဟန်ဆောင်၍ ဆင်ကြီးကို ခုန်အုပ်တိုက်ခိုက်သော မြေခွေးသည် ဘုရားလောင်းခြင်္သေ့၏ ကြိုတင်တားမြစ်ချက်ကို နားမထောင်ခဲ့သဖြင့် ဆင်၏ခြေဖြင့် နင်းချေခံရ၍ သေဆုံးလေသည်။","moral":"မိမိအစွမ်းထက် လွန်ကဲသောအမှုကို မပြုရာ။"},{"no":336,"pali":"Brahāchattajātaka","mm":"ဗြဟာဆတ္တဇာတ်","summary":"ဆတ္တမည်သော မင်းသားသည် ရသေ့အသွင်ဖြင့် မင်းကြီး၏ယုံကြည်မှုကိုရယူပြီး ခမည်းတော်ထံမှ သိမ်းယူထားသော ဘဏ္ဍာတော်ကို ပြန်လည်ရယူသွားရာ၊ နှမြောတသ ညည်းညူနေသော မင်းကြီးအား ဘုရားလောင်းအမတ်က ပညာစကားဖြင့် ဖြေသိမ့်ဆုံးမလေသည်။","moral":"လက်လွတ်ပြီးသောအရာအတွက် ပူဆွေးနေခြင်းသည် အကျိုးမရှိ။"},{"no":337,"pali":"Pīṭhajātaka","mm":"ပီဌဇာတ်","summary":"ဘုရားလောင်းရသေ့ ကြွရောက်လာစဉ် နေရာထိုင်ခင်းဖြင့် ဧည့်ဝတ်မပြုလိုက်ရသော သူဌေးက နောင်တရ၍ နောက်တစ်ကြိမ်၌ ရိုသေစွာ ပင့်ဖိတ်ပူဇော်ကာ တရားစကားကို နာယူလေသည်။","moral":"သူတော်ကောင်းတို့အား အခွင့်ကြုံတိုင်း မဆိုင်းမတွ ရိုသေပူဇော်ရာ၏။"},{"no":338,"pali":"Thusajātaka","mm":"ထုသဇာတ်","summary":"ဘုရားလောင်းဆရာကြီး သင်ပေးထားသောဂါထာတို့ကို မင်းကြီးက အခါအားလျော်စွာ ရွတ်ဆိုနေမိသဖြင့်၊ လုပ်ကြံရန် ချဉ်းကပ်လာသော သားတော်သည် မိမိအကြံကို သိနေပြီဟုထင်ကာ အကြိမ်ကြိမ် လက်လျှော့ခဲ့ရပြီး နောက်ဆုံး၌ အပြစ်ကို ဝန်ခံလေသည်။","moral":"သတိမမေ့သူသည် ဘေးရန်မှ လွတ်မြောက်နိုင်၏။"},{"no":339,"pali":"Bāverujātaka","mm":"ဗာဝေရုဇာတ်","summary":"ငှက်မရှိသော ဗာဝေရုတိုင်းပြည်သို့ ကုန်သည်တို့ ဆောင်ယူလာသော ကျီးကို ပြည်သူတို့ အံ့ဩမြတ်နိုး ပူဇော်ကြသော်လည်း၊ နောင်အခါ အဆင်းလှသော ဥဒေါင်းမင်း (ဘုရားလောင်း) ရောက်လာသောအခါ ကျီးမှာ အရေးမပါတော့ဘဲ မှေးမှိန်သွားလေသည်။","moral":"ဂုဏ်ရည်မြင့်သူ ပေါ်ထွန်းလာလျှင် ဂုဏ်ရည်နိမ့်သူ မှေးမှိန်တတ်၏။"},{"no":340,"pali":"Visayhajātaka","mm":"ဝိသယှဇာတ်","summary":"ဘုရားလောင်း ဝိသယှသူဌေးကြီး၏ လှူဒါန်းမှုကို သိကြားမင်းက စမ်းသပ်လို၍ စည်းစိမ်ဥစ္စာအားလုံးကို ကွယ်ပျောက်စေသော်လည်း၊ သူဌေးကြီးသည် မြက်ရိတ်ရောင်းချ၍ရသော ငွေဖြင့်ပင် ဆက်လက်လှူဒါန်းနေသဖြင့် သိကြားမင်းက ကြည်ညို၍ စည်းစိမ်ဥစ္စာတို့ကို ပြန်လည်ပေးအပ်လေသည်။","moral":"ဆင်းရဲသည်ဖြစ်စေ ချမ်းသာသည်ဖြစ်စေ စွန့်ကြဲလှူဒါန်းလိုစိတ် မလျော့စေရာ။"},{"no":341,"pali":"Kaṇḍarījātaka","mm":"ကဏ္ဍရီဇာတ်","summary":"ကဏ္ဍရီမင်းနှင့် ကိန္နရာမိဖုရားတို့၏ အကြောင်းကို အကျဉ်းမျှသာ ပြဆိုသောဇာတ်ဖြစ်၍ မိဖုရား၏ သစ္စာမဲ့မှု ပေါ်လွင်ပုံကို ပြသည်။ အကျယ်ကို ကုဏာလဇာတ်တော်၌ ဟောကြားထားလေသည်။","moral":"ကာမဂုဏ်၌ မမေ့မလျော့ ဆင်ခြင်ရာ၏။"},{"no":342,"pali":"Vānarajātaka","mm":"ဝါနရဇာတ်","summary":"ဘုရားလောင်း မျောက်ပညာရှိသည် မိမိကိုစားလို၍ ချဉ်းကပ်လာသော မိကျောင်း၏ ပရိယာယ်ကို ကြိုတင်သိမြင်၍ ဉာဏ်ပညာဖြင့် ရှောင်လွှဲကာ ဘေးမှ လွတ်မြောက်ခဲ့လေသည်။","moral":"ပညာရှိသည် ဘေးရန်ကို ဉာဏ်ဖြင့် လွန်မြောက်နိုင်၏။"},{"no":343,"pali":"Kuntinījātaka","mm":"ကုန္တိနီဇာတ်","summary":"မင်းကြီး၏အမှုတော်ကို ထမ်းဆောင်နေသော ကုန္တိနီငှက်မကြီး၏ သားငယ်တို့ကို မင်းသားငယ်တို့က သတ်ဖြတ်မိရာ၊ ငှက်မကြီးသည် လက်စားချေပြီးနောက် ရန်ငြိုးဖြစ်ပြီးသောနေရာ၌ မနေသင့်တော့ဟုဆိုကာ မင်းကြီးထံမှ ထွက်ခွာသွားလေသည်။ ဘုရားလောင်းသည် မင်းကြီးဖြစ်၏။","moral":"အချင်းချင်း ပြစ်မှားပြီးသောအရပ်၌ ဆက်လက်မနေရာ။"},{"no":344,"pali":"Ambajātaka","mm":"အမ္ဗဇာတ်","summary":"သရက်ဥယျာဉ်ကို စောင့်ရှောက်ရသော သူတော်ယောင်ရသေ့သည် သရက်သီးပျောက်သောအခါ အပြစ်ကို အပြစ်မဲ့သူတို့အပေါ် လွှဲချရာ၊ စစ်ဆေးမေးမြန်းခြင်းဖြင့် သူ၏မရိုးသားမှု ပေါ်လွင်၍ အရှက်ကွဲရလေသည်။","moral":"မရိုးသားမှုသည် နောက်ဆုံး၌ ပေါ်လွင်တတ်၏။"},{"no":345,"pali":"Gajakumbhajātaka","mm":"ဂဇကုမ္ဘဇာတ်","summary":"အလွန်ဖင့်နွှဲလေးလံသော ဂဇကုမ္ဘလိပ်ကြီးကို ဥပမာပြု၍ ဘုရားလောင်းအမတ်ကြီးက ပျင်းရိဖင့်နွှဲသော မင်းကြီးအား လုံ့လဝီရိယနှင့် လျင်မြန်ဖြတ်လတ်စွာ ဆောင်ရွက်တတ်ရန် ဆုံးမလျှောက်တင်လေသည်။","moral":"ပျင်းရိဖင့်နွှဲခြင်းသည် ဆုံးရှုံးခြင်း၏ အကြောင်းဖြစ်၏။"},{"no":346,"pali":"Kesavajātaka","mm":"ကေသဝဇာတ်","summary":"ကေသဝရသေ့ကြီးသည် မင်းကြီး၏ စည်းစိမ်ပြည့်စုံသော ပြုစုကုသမှုဖြင့် ရောဂါမပျောက်ဘဲ၊ ချစ်ခင်ရင်းနှီးသော တပည့်ကြီး ကပ္ပ (ဘုရားလောင်း) ထံ ပြန်ရောက်၍ ရိုးရိုးအစားအစာကို စားရသော်လည်း ရောဂါပျောက်ကင်းလေသည်။","moral":"ချစ်ခင်ယုံကြည်ရင်းနှီးမှုသည် အကောင်းဆုံးသော ဆေးဖြစ်၏။"},{"no":347,"pali":"Ayakūṭajātaka","mm":"အယကူဋဇာတ်","summary":"သတ္တဝါတို့ကို သတ်၍ နတ်ပူဇော်သည့်ဓလေ့ကို ပယ်ဖျက်ခဲ့သော ဘုရားလောင်းမင်းကြီးအား သံတူကြီးကိုင်ဆောင်သော ဘီလူးက သတ်ဖြတ်ရန် ချဉ်းကပ်လာသော်လည်း၊ မင်းကြီး၏ တရားစောင့်ထိန်းမှုတန်ခိုးကြောင့် အန္တရာယ် မပြုနိုင်ဘဲ ဆုတ်ခွာသွားရလေသည်။","moral":"တရားကို စောင့်သောသူကို တရားက ပြန်လည်စောင့်ရှောက်၏။"},{"no":348,"pali":"Araññajātaka","mm":"အရညဇာတ်","summary":"တော၌ ကြီးပြင်းခဲ့သော ရသေ့လုလင်သည် လူ့ရွာမှလာသော မကောင်းသောအပေါင်းအသင်း၏ ဖျားယောင်းသွေးဆောင်မှုကြောင့် လမ်းမှားလုနီးရာ၊ ဖခင် ဘုရားလောင်းရသေ့ကြီးက ဆုံးမသွန်သင်၍ ကောင်းရာလမ်းသို့ ပြန်လည်ရောက်စေလေသည်။","moral":"မကောင်းသော အပေါင်းအသင်းကို ရှောင်ကြဉ်ရာ၏။"},{"no":349,"pali":"Sandhibhedajātaka","mm":"သန္ဓိဘေဒဇာတ်","summary":"ခြင်္သေ့နှင့် နွားလားဥဿဘတို့ ချစ်ကြည်စွာ ပေါင်းသင်းနေကြရာ၊ မြေခွေးက ကုန်းချောစကားဖြင့် သွေးခွဲသဖြင့် နှစ်ဦးသား အချင်းချင်း တိုက်ခိုက်၍ သေဆုံးကြရလေသည်။ ဘုရားလောင်းအမတ်က ဤဖြစ်ရပ်ကိုပြ၍ ကုန်းချောစကား၏အပြစ်ကို မင်းကြီးအား ဟောကြားသည်။","moral":"ကုန်းချောစကားကို နားမယောင်ရာ။"},{"no":350,"pali":"Devatāpañhajātaka","mm":"ဒေဝတာပဉှဇာတ်","summary":"နတ်တစ်ဦး မေးမြန်းသော နက်နဲသောပုစ္ဆာတို့ကို ပညာရှိ မဟောသဓာ (ဘုရားလောင်း) ကသာ ဖြေဆိုနိုင်ခဲ့ကြောင်း အကျဉ်းပြဆိုသောဇာတ်ဖြစ်၍ အကျယ်ကို မဟောသဓ (ဥမ္မဂ္ဂ) ဇာတ်တော်ကြီး၌ ဟောကြားထားလေသည်။","moral":"ပညာသည် အရာရာ၌ အမြတ်ဆုံးဖြစ်၏။"},{"no":351,"pali":"Maṇikuṇḍalajātaka","mm":"မဏိကုဏ္ဍလဇာတ်","summary":"ဘုရားလောင်း ဗာရာဏသီမင်းသည် ရန်သူမင်း၏ သိမ်းပိုက်ခြင်းခံရ၍ မဏိနားတောင်းအစရှိသော စည်းစိမ်ဥစ္စာအားလုံး ဆုံးရှုံးသော်လည်း စိုးရိမ်ပူဆွေးခြင်း အလျှင်းမရှိဘဲ သင်္ခါရတရားတို့၏ မမြဲသောသဘောကို ဟောကြား၏။ ထိုတည်ကြည်မှုကို မြင်သော ရန်သူမင်းသည် ကြည်ညိုလျက် နိုင်ငံတော်ကို ပြန်လည်ဆက်သ၏။","moral":"ဆုံးရှုံးမှု၌ မပူဆွေးဘဲ တည်ကြည်ခြင်းသည် ရန်သူကိုပင် အောင်နိုင်၏။"},{"no":352,"pali":"Sujātajātaka","mm":"သုဇာတဇာတ်","summary":"ဘုရားလောင်း သုဇာတသတို့သားသည် အဖိုးသေဆုံး၍ ပြင်းစွာပူဆွေးနေသော ဖခင်အား သေပြီးသောနွားကို မြက်ကျွေးဟန်ပြုပြသဖြင့် သေသူအတွက် ငိုကြွေးခြင်း၏ အချည်းနှီးဖြစ်ကြောင်း သိမြင်စေ၏။ ဖခင်လည်း သောကမှ လွတ်မြောက်၏။","moral":"သေဆုံးပြီးသူအတွက် ပူဆွေးငိုကြွေးခြင်းသည် အကျိုးမရှိ။"},{"no":353,"pali":"Venasākhajātaka","mm":"ဝေနသာခဇာတ်","summary":"မင်းသားတစ်ပါးသည် ဆရာဖြစ်သော ဘုရားလောင်း၏ သတိပေးဆုံးမစကားကို လျစ်လျူရှုကာ ရက်စက်ကြမ်းကြုတ်စွာ ကျင့်သုံးအုပ်စိုးသဖြင့် နောက်ဆုံး၌ မိမိပြုခဲ့သော ရက်စက်မှုတို့၏ အကျိုးဆက်ကြောင့်ပင် ပျက်စီးဆုံးရှုံးရ၏။","moral":"ရက်စက်ကြမ်းကြုတ်သူသည် မိမိအကုသိုလ်ကြောင့်ပင် ပျက်စီးရ၏။"},{"no":354,"pali":"Uragajātaka","mm":"ဥရဂဇာတ်","summary":"ဘုရားလောင်း လယ်လုပ်ပုဏ္ဏားနှင့် မိသားစုတို့သည် သေခြင်းတရားကို အမြဲနှလုံးသွင်း ဆင်ခြင်လေ့ရှိသဖြင့် သားဖြစ်သူ မြွေကိုက်၍ သေဆုံးသောအခါ တစ်ဦးမျှ မငိုကြွေးဘဲ တရားသဘောဖြင့် ဆင်ခြင်ကြ၏။ သိကြားမင်းသည် အံ့ဩကြည်ညို၍ စည်းစိမ်ဥစ္စာဖြင့် ချီးမြှင့်၏။","moral":"သေခြင်းတရားကို ကြိုတင်နှလုံးသွင်းထားသူသည် ဘေးဆိုက်သောအခါ မတုန်လှုပ်။"},{"no":355,"pali":"Ghaṭajātaka","mm":"ဃဋဇာတ်","summary":"ဘုရားလောင်း ဃဋမင်းသည် ရန်သူ၏ ဖမ်းဆီးချုပ်နှောင်ခြင်းခံရသော်လည်း စိုးရိမ်ကြောင့်ကြခြင်း အလျှင်းမရှိ။ ပူဆွေးခြင်းသည် အကျိုးတစ်စုံတစ်ရာ မဆောင်ကြောင်း ဟောကြားသဖြင့် ရန်သူမင်းပင် ကြည်ညိုကာ လွှတ်၍ နိုင်ငံတော်ကို ပြန်လည်ပေးအပ်၏။","moral":"ပူဆွေးသောကသည် အကျိုးမဆောင်ကြောင်း သိသောသူသည် ဘေး၌ပင် အေးချမ်း၏။"},{"no":356,"pali":"Koraṇḍiyajātaka","mm":"ကောရဏ္ဍိယဇာတ်","summary":"ဆရာဖြစ်သူက နာယူလိုစိတ်မရှိသူတိုင်းကိုပါ တရားဟောနေသည်ကို မြင်သော ဘုရားလောင်း ကောရဏ္ဍိယလုလင်သည် တောင်ကုန်းချိုင့်ဝှမ်းတို့ကို ကျောက်ခဲပစ်၍ ညီညာအောင်ပြုမည်ဟု ဟန်ပြုကာ မလိုလားသူအား တရားဟောခြင်း၏ အချည်းနှီးဖြစ်ကြောင်း ဆရာအား သိမြင်စေ၏။","moral":"နာယူလိုစိတ်ရှိသူအားသာ တရားဟောအပ်၏။"},{"no":357,"pali":"Laṭukikajātaka","mm":"လဋုကိကဇာတ်","summary":"ဘုရားလောင်း ဆင်မင်းသည် ငုံးမငယ်၏ သားငယ်တို့ကို စောင့်ရှောက်ခဲ့သော်လည်း ဆိုးသွမ်းသော ဆင်တစ်ကောင်သည် ငုံးသားငယ်တို့ကို တောင်းပန်သံကိုပင် မညှာဘဲ နင်းချေဖျက်ဆီး၏။ ငုံးမသည် ကျီးကန်း၊ ယင်၊ ဖားတို့၏ အကူအညီဖြင့် အစီအမံပြု၍ ထိုဆင်ဆိုးကို ပျက်စီးစေ၏။","moral":"အားနည်းသူဟူ၍ မထီမဲ့မြင် မပြုအပ်။"},{"no":358,"pali":"Cūḷadhammapālajātaka","mm":"စူဠဓမ္မပါလဇာတ်","summary":"မဟာပတာပမင်းသည် မိဖုရားက သားတော်ငယ် ဓမ္မပါလကို ချစ်မြတ်နိုးလွန်းသည်ကို မနာလိုဒေါသဖြစ်ကာ ဘုရားလောင်း သူငယ်တော်ကလေးအား ရက်စက်စွာ ကွပ်မျက်စေ၏။ မိဖုရားလည်း ရင်ကွဲသေဆုံး၍ မင်းကြီးသည် ငရဲသို့ ကျရောက်ရ၏။","moral":"အမျက်ဒေါသနှင့် မနာလိုမှုသည် ကြီးလေးသော အပျက်စီးသို့ ဆိုက်ရောက်စေ၏။"},{"no":359,"pali":"Suvaṇṇamigajātaka","mm":"သုဝဏ္ဏမိဂဇာတ်","summary":"ဘုရားလောင်း ရွှေသမင်သည် မုဆိုး၏ ကျော့ကွင်း၌ မိသောအခါ ဇနီးသမင်မသည် မပြေးမရှောင်ဘဲ မိမိအသက်ကို အစားပေးပါမည်ဟု မုဆိုးအား တောင်းပန်၏။ မုဆိုးသည် ထိုသစ္စာမေတ္တာကို ကြည်ညို၍ နှစ်ကောင်စလုံးကို ဘေးမဲ့လွှတ်ပေး၏။","moral":"သစ္စာရှိသော မေတ္တာသည် ရန်သူ့နှလုံးကိုပင် ပြေငြိမ်းစေ၏။"},{"no":360,"pali":"Suyonandījātaka","mm":"သုယောနန္ဒီဇာတ်","summary":"ဂဠုန်မင်းသည် မင်းတစ်ပါး၏ မိဖုရား သုယောနန္ဒီကို မိမိနေရာကျွန်းသို့ ခိုးဆောင်သွား၏။ မင်း၏ စောင်းသမားသည် ရှာဖွေရင်း ထိုကျွန်းသို့ရောက်၍ မိဖုရား၏ ဖောက်ပြန်မှုကို ဂဠုန်မင်း သိရသောအခါ မည်သို့မျှ စောင့်ထိန်း၍မရနိုင်ကြောင်း သဘောပေါက်ကာ မိဖုရားကို ပြန်လည်အပ်နှံ၏။","moral":"တပ်မက်သောစိတ်ကို အစောင့်အနေအထားဖြင့် မတားဆီးနိုင်။"},{"no":361,"pali":"Vaṇṇārohajātaka","mm":"ဝဏ္ဏာရောဟဇာတ်","summary":"ခြင်္သေ့နှင့် ကျားတို့သည် ချစ်ကြည်စွာ ပေါင်းဖော်နေထိုင်ကြရာ မြေခွေးတစ်ကောင်သည် တစ်ဖက်နှင့်တစ်ဖက် အသရေဖျက်စကားများ လုပ်ကြံပြောဆိုကာ ရန်တိုက်၏။ နှစ်ကောင်တို့သည် အချင်းချင်း တိုက်ရိုက်မေးမြန်း စိစစ်ကြသဖြင့် မိတ်မပျက်ဘဲ မြေခွေးသာ ထွက်ပြေးရ၏။","moral":"ကုန်းချောစကားကို မစိစစ်ဘဲ မယုံကြည်အပ်။"},{"no":362,"pali":"Sīlavīmaṁsajātaka","mm":"သီလဝီမံသဇာတ်","summary":"ဘုရားလောင်း ပုဏ္ဏားပညာရှိသည် အတတ်ပညာနှင့် သီလတို့တွင် မည်သည်က မြတ်သနည်းဟု စမ်းသပ်လိုသဖြင့် ဘဏ္ဍာစိုး၏ ငွေဒင်္ဂါးများကို တိတ်တဆိတ် ယူပြ၏။ တတိယနေ့၌ ဖမ်းဆီးခံရသောအခါ သီလသာလျှင် အမြတ်ဆုံးဖြစ်ကြောင်း ထုတ်ဖော်ကြေညာ၍ ရသေ့ရဟန်းပြု၏။","moral":"အတတ်ပညာထက် သီလသည် မြတ်၏။"},{"no":363,"pali":"Hirijātaka","mm":"ဟိရိဇာတ်","summary":"ဘုရားလောင်း ဗာရာဏသီသူဌေးသည် စကားအားဖြင့်သာ မိတ်ဆွေဟန်ဆောင်၍ ပြုကျင့်မှုမပါသော မိတ်ဆွေတု၏ အဖြစ်ကို အကြောင်းပြုကာ မိတ်ဆွေစစ်သည် စကားဖြင့်မဟုတ်ဘဲ ပြုလုပ်ဆောင်ရွက်မှုဖြင့်သာ ထင်ရှားကြောင်း ဟောကြား၏။","moral":"မိတ်ဆွေစစ်ကို စကားဖြင့်မဟုတ်၊ အမှုဖြင့်သာ သိအပ်၏။"},{"no":364,"pali":"Khajjopanakajātaka","mm":"ခဇ္ဇောပနကဇာတ်","summary":"လူမိုက်သည် ညအခါ တောက်ပနေသော ပိုးစုန်းကြူးကို မီးဟု ထင်မှတ်ကာ လောင်စာထည့်၍ မီးမွှေးရန် အချည်းနှီး ကြိုးစား၏။ အနှစ်မရှိသောအရာကို အနှစ်ဟု ထင်မှတ်မှားသော မိုက်မဲမှုကို ပြဆိုသော ဇာတ်တော်ဖြစ်၏။","moral":"အနှစ်နှင့်အခွံကို ခွဲခြားမသိသူသည် အကျိုးကို မရနိုင်။"},{"no":365,"pali":"Ahituṇḍikajātaka","mm":"အဟိတုဏ္ဍိကဇာတ်","summary":"မြွေကျင်သမားသည် မိမိမွေးမြူထားသော မျောက်ငယ်ဖြစ်သည့် ဘုရားလောင်းကို ရိုက်နှက်ညှဉ်းဆဲ၏။ မျောက်သည် လွတ်မြောက်၍ သစ်ပင်ပေါ်ရောက်သောအခါ မည်မျှ ချော့မော့သော်လည်း နောက်တစ်ဖန် မယုံကြည်တော့ဘဲ တောထဲသို့ ထွက်ခွာသွား၏။","moral":"ညှဉ်းဆဲဖူးသူ၏ ချိုသာသောစကားကို မယုံကြည်အပ်။"},{"no":366,"pali":"Gumbiyajātaka","mm":"ဂုမ္ဗိယဇာတ်","summary":"ဂုမ္ဗိယဘီလူးသည် ခရီးလမ်း၌ အဆိပ်ခတ်ထားသော ပျားရည်အစရှိသည်တို့ကို ချထား၍ လူတို့ကို သေစေ၏။ ဘုရားလောင်း ကုန်သည်ကြီးသည် အဖော်တို့အား ပိုင်ရှင်မဲ့အစာကို မစားရန် တားမြစ်ခဲ့ရာ လောဘကြီးသူတို့သာ စားမိ၍ ဘေးရောက်ကြ၏။","moral":"ကာမဂုဏ်တို့သည် အဆိပ်ခတ်ထားသော စားဖွယ်နှင့် တူ၏။"},{"no":367,"pali":"Sāḷiyajātaka","mm":"သာဠိယဇာတ်","summary":"စဉ်းလဲသော ဆေးသမားသည် ကျေးရွာသူငယ်ဖြစ်သော ဘုရားလောင်းအား သစ်ခေါင်းအတွင်းက မြွေကို သာဠိကငှက်ပျိုဟု လှည့်ဖြား၍ ဆုပ်ကိုင်စေ၏။ သူငယ်သည် မြွေမှန်းသိ၍ ပစ်လွှတ်လိုက်ရာ ဆေးသမား၏ ကိုယ်ပေါ်ကျကာ မြွေကိုက်ခံရ၍ သေဆုံး၏။","moral":"သူတစ်ပါးအား ပြုသော မကောင်းမှုသည် ပြုသူထံသို့ပင် ပြန်ကျ၏။"},{"no":368,"pali":"Tacasārajātaka","mm":"တစသာရဇာတ်","summary":"ဆေးသမား သေဆုံးမှုကြောင့် ရွာသားတို့သည် ကလေးသူငယ်တို့ကို ဝါးနှောင်ကြိုးဖြင့် ချည်နှောင်၍ မင်းထံ ပို့ဆောင်ကြ၏။ ဘုရားလောင်းသူငယ်သည် မတုန်လှုပ်ဘဲ ပညာရှိစွာ ဖြေကြားလျှောက်ထားသဖြင့် မင်းကြီး ကြည်ညို၍ အားလုံး လွတ်ငြိမ်းချမ်းသာခွင့် ရကြ၏။","moral":"ဘေးဆိုက်သောအခါ တည်ငြိမ်သော ပညာသည် ကယ်တင်နိုင်၏။"},{"no":369,"pali":"Mittavindakajātaka","mm":"မိတ္တဝိန္ဒကဇာတ်","summary":"လောဘကြီးသော မိတ္တဝိန္ဒကသည် မိခင်၏စကားကို နားမထောင်ဘဲ ပင်လယ်ကူးရာ သင်္ဘောပျက်၍ ဘုံဗိမာန်အဆင့်ဆင့်၌ ကာမချမ်းသာကို တပ်မက်လိုက်စားပြီးနောက် နောက်ဆုံး၌ လည်နေသော စက်ဝန်းကို ဦးခေါင်းထက်၌ ဆောင်ရသောဘေး ရောက်ရ၏။ ဘုရားလောင်းနတ်သားက ထိုဆင်းရဲသည် မိမိကံ၏ အကျိုးပင်ဖြစ်ကြောင်း ဟော၏။","moral":"လောဘလွန်ကဲ၍ မိဘစကား နားမထောင်သူသည် ကြီးစွာသောဆင်းရဲသို့ ရောက်၏။"},{"no":370,"pali":"Palāsajātaka","mm":"ပလာသဇာတ်","summary":"ဘုရားလောင်း ရွှေဟင်္သာသည် ပေါက်ပင်စောင့်နတ်အား သင့်အပင်၌ ပေါက်ရောက်စ ညောင်ပင်ပျိုးငယ်ကို စောစီးစွာ နုတ်ပယ်ရန် သတိပေး၏။ နတ်သည် ဂရုမစိုက်သဖြင့် ညောင်ပင် ကြီးထွားလာ၍ ပေါက်ပင်ကြီး ပြိုကွဲပျက်စီးရ၏။","moral":"မကောင်းမှုအညွန့်ကို ငယ်စဉ်ကပင် ဖြတ်တောက်အပ်၏။"},{"no":371,"pali":"Dīghītikosalajātaka","mm":"ဒီဃီတိကောသလဇာတ်","summary":"ကာသိမင်းသည် ဒီဃီတိကောသလမင်းကို သတ်ခဲ့ရာ သားတော် ဒီဃာဝုမင်းသားဖြစ်သော ဘုရားလောင်းသည် ရန်သူမင်း အိပ်ပျော်နေချိန် သတ်ခွင့်ရသော်လည်း ရန်ကို ရန်ဖြင့် မငြိမ်းဟူသော ဖခင်၏ဩဝါဒကို အောက်မေ့၍ အသက်ချမ်းသာပေး၏။ မင်းနှစ်ပါးလည်း ပြန်လည် သင့်မြတ်ကြ၏။","moral":"ရန်သည် ရန်ဖြင့် မငြိမ်း၊ မေတ္တာဖြင့်သာ ငြိမ်း၏။"},{"no":372,"pali":"Migapotakajātaka","mm":"မိဂပေါတကဇာတ်","summary":"ရသေ့တစ်ပါးသည် မွေးမြူထားသော သမင်ငယ် သေဆုံးသဖြင့် ပြင်းစွာ ငိုကြွေးပူဆွေး၏။ ဘုရားလောင်း သိကြားမင်းသည် ဆင်းသက်လာ၍ ရဟန်းရသေ့အဖြစ်နှင့် သေသူအတွက် ပူဆွေးခြင်း မလျောက်ပတ်ကြောင်း ဆုံးမသဖြင့် ရသေ့သည် သောကမှ လွတ်မြောက်၏။","moral":"ချစ်ခင်တွယ်တာမှုသည် သောကပူဆွေးခြင်း၏ အကြောင်းရင်းဖြစ်၏။"},{"no":373,"pali":"Mūsikajātaka","mm":"မူသိကဇာတ်","summary":"ဘုရားလောင်း တက္ကသိုလ်ဆရာသည် တပည့်ဖြစ်သော မင်းကြီးအား အန္တရာယ်ကာကွယ်ရာ ဂါထာစကားများကို သင်ပေးထား၏။ ထီးနန်းကို လောဘတက်သော သားတော်က ခမည်းတော်ကို လုပ်ကြံရန် ချောင်းမြောင်းသည့်အခါတိုင်း မင်းကြီး ရွတ်ဆိုသော ထိုစကားများကြောင့် မိမိအကြံ ပေါက်ကြားပြီဟု ထင်ကာ ကြောက်ရွံ့၍ အပြစ်ကို ဝန်ခံ၏။","moral":"ပညာရှိ၏ အဆုံးအမသည် အသက်ကိုပင် စောင့်ရှောက်၏။"},{"no":374,"pali":"Cūḷadhanuggahajātaka","mm":"စူဠဓနုဂ္ဂဟဇာတ်","summary":"လေးအတတ်ပညာရှင်၏ ဇနီးသည် ခင်ပွန်းကို သစ္စာဖောက်၍ ဓားပြနောက်သို့ လိုက်ရာ ဓားပြကလည်း သူမကို မြစ်တစ်ဖက်ကမ်း၌ စွန့်ပစ်ထားခဲ့၏။ ဘုရားလောင်း သိကြားမင်းသည် မြေခွေးအသွင်ဖြင့် အမဲသားနှင့် ငါး နှစ်မျိုးလုံး လက်လွတ်ဆုံးရှုံးပုံကို ပြ၍ သူမ၏ လောဘဒုစရိုက်ကို ထင်ရှားစေ၏။","moral":"ရပြီးသည်ကို မရောင့်ရဲဘဲ လောဘလိုက်သူသည် နှစ်ဖက်စလုံး ဆုံးရှုံး၏။"},{"no":375,"pali":"Kapotajātaka","mm":"ကပေါတဇာတ်","summary":"ဘုရားလောင်း ချိုးငှက်သည် စားဖိုဆောင်၌ ခြင်းတောင်းငယ်တွင် နေထိုင်ရာ လောဘကြီးသော ကျီးကန်းသည် ငါးအမဲသားကို မက်မော၍ ချိုး၏နေရာ၌ ဝင်ရောက်ခိုအောင်းကာ ခိုးစားရန် ကြံ၏။ စားဖိုမှူး ဖမ်းမိသဖြင့် အမွေးနုတ်ခံရ၍ ဆုံးရှုံးပျက်စီး၏။","moral":"လောဘအလိုသို့ လိုက်သူသည် ပျက်စီးခြင်းသို့ ရောက်၏။"},{"no":376,"pali":"Avāriyajātaka","mm":"အဝါရိယဇာတ်","summary":"ဘုရားလောင်း ရသေ့သည် မြစ်ကူးခအဖြစ် လှေသမားအား အမျက်မထွက်ရန်နှင့် လောဘမကြီးရန် အဖိုးထိုက်တန်သော ဩဝါဒကို ပေး၏။ လူမိုက်လှေသမားသည် အခကြေးငွေ မရဟု အမျက်ထွက်ကာ ရသေ့ကို ရိုက်နှက်သဖြင့် ဆုံးမစကား၏တန်ဖိုးကို လူမိုက် မသိကြောင်း ထင်ရှား၏။","moral":"လူမိုက်အား ပေးသော ဆုံးမစကားသည် အကျိုးမပြု။"},{"no":377,"pali":"Setaketujātaka","mm":"သေတကေတုဇာတ်","summary":"သေတကေတုလုလင်သည် အမျိုးဇာတ်ကို ထောင်လွှားလျက် ကျင့်ကြံမှုအစစ်မရှိဘဲ အသွင်ဆောင် ရသေ့အဖြစ်ဖြင့် လူအများကို လှည့်ဖြား၏။ ဘုရားလောင်း ဆရာကြီးက အမျိုးဇာတ်ကြောင့် မမြတ်၊ သီလနှင့် အကျင့်ကြောင့်သာ မြတ်ကြောင်း ဆုံးမ၏။","moral":"အမျိုးဇာတ်ထက် အကျင့်သီလသည်သာ မြတ်၏။"},{"no":378,"pali":"Darīmukhajātaka","mm":"ဒရီမုခဇာတ်","summary":"ဘုရားလောင်း မင်းသားနှင့် ငယ်သူငယ်ချင်း ဒရီမုခတို့ တက္ကသိုလ်၌ အတူပညာသင်ကြပြီးနောက် ဒရီမုခသည် ပစ္စေကဗုဒ္ဓါ ဖြစ်၏။ ဘုရားလောင်း မင်းဖြစ်သောအခါ ဒရီမုခပစ္စေကဗုဒ္ဓါက ကာမဂုဏ်တို့သည် ညွန်ပျောင်းနှင့်တူကြောင်း ဟောကြားသဖြင့် မင်းကြီးသည် စည်းစိမ်ကို စွန့်၍ ရသေ့ရဟန်းပြု၏။","moral":"ကာမဂုဏ်သည် ညွန်နှင့်တူ၍ စွန့်လွှတ်ခြင်းသည်သာ ချမ်းသာ၏။"},{"no":379,"pali":"Nerujātaka","mm":"နေရုဇာတ်","summary":"ဘုရားလောင်း ရွှေဟင်္သာနှင့် ညီငယ်တို့သည် နေရုတောင်သို့ ရောက်ကြရာ ထိုတောင်၏ အရောင်ကြောင့် ကျီးကန်းအစရှိသော ငှက်အပေါင်းပင် ရွှေရောင်တစ်မျိုးတည်း ဖြစ်ကုန်၏။ မြတ်သူ ယုတ်သူ ခွဲခြားမှုမရှိရာအရပ်၌ မနေထိုက်ဟု ဆိုကာ ထွက်ခွာသွားကြ၏။","moral":"ဂုဏ်ရှိသူနှင့် ဂုဏ်မဲ့သူကို ခွဲခြားမသိသောအရပ်၌ ပညာရှိ မနေအပ်။"},{"no":380,"pali":"Āsaṅkajātaka","mm":"အာသင်္ကဇာတ်","summary":"ဘုရားလောင်း ရသေ့သည် ကြာပန်းမှရသော သတို့သမီးငယ် အာသင်္ကာကို မွေးမြူပြုစု၏။ ဗာရာဏသီမင်းသည် သူမကို တောင်းရာ အမည်ကို မှန်ကန်စွာ မသိသေးသမျှ မရနိုင်ဘဲ သုံးနှစ်တိုင် စောင့်ဆိုင်း ရှာဖွေရပြီးမှ အမည်ကို သိ၍ မိဖုရားအဖြစ် ဆောင်ယူနိုင်၏။","moral":"မလျှော့သော လုံ့လရှိသူသည် လိုရာဆန္ဒ ပြည့်၏။"},{"no":381,"pali":"Migālopajātaka","mm":"မိဂါလောပဇာတ်","summary":"လင်းတငယ် မိဂါလောပသည် ဖခင်ဖြစ်သော ဘုရားလောင်း၏ အလွန်မြင့်သောအရပ်သို့ မပျံတက်ရန် သတိပေးစကားကို နားမထောင်ဘဲ မိုးကောင်းကင် အလွန်မြင့်ရာသို့ ပျံတက်သဖြင့် ဝေရမ္ဘလေပြင်း တိုက်ခတ်၍ ကြေမွပျက်စီးရ၏။","moral":"လူကြီးမိဘတို့၏ စကားကို နားမထောင်သူသည် ပျက်စီးရ၏။"},{"no":382,"pali":"Sirikāḷakaṇṇijātaka","mm":"သိရိကာဠကဏ္ဏိဇာတ်","summary":"ကံကောင်းခြင်း နတ်သမီး သိရီနှင့် ကံဆိုးခြင်း နတ်သမီး ကာဠကဏ္ဏီတို့သည် ဘုရားလောင်း သူဌေးထံ အလည်တည်းခိုခွင့် တောင်းကြရာ သူဌေးသည် သီလဂုဏ်နှင့် ပြည့်စုံသော သိရီကိုသာ ကြိုဆိုလက်ခံ၍ ယုတ်ညံ့သော ကာဠကဏ္ဏီကို ပယ်ရှား၏။","moral":"ကောင်းမြတ်သော အပေါင်းအသင်းကိုသာ ရွေးချယ် ဆည်းကပ်အပ်၏။"},{"no":383,"pali":"Kukkuṭajātaka","mm":"ကုက္ကုဋဇာတ်","summary":"ကြောင်မသည် ကြက်ဖဖြစ်သော ဘုရားလောင်းကို စားလို၍ ဇနီးအဖြစ် ပေါင်းသင်းပါမည်ဟု ချိုသာစွာ ဖြားယောင်း၏။ ကြက်ဖသည် ရန်သူ၏ လှည့်စားမှုကို ထိုးထွင်းသိမြင်၍ ပယ်ရှားသဖြင့် ဘေးမှ လွတ်မြောက်၏။","moral":"ရန်သူ၏ ချိုသာသော ဖြားယောင်းစကားကို မယုံကြည်အပ်။"},{"no":384,"pali":"Dhammadhajajātaka","mm":"ဓမ္မဓဇဇာတ်","summary":"ကျီးကန်းတစ်ကောင်သည် သီလရှိဟန်ဆောင်၍ ခြေတစ်ဖက်တည်းရပ်ကာ လေကိုသာ စား၏ဟု ဝါကြွားသဖြင့် ငှက်တို့သည် ဥနှင့် သားငယ်တို့ကို ယုံကြည်စွာ အပ်နှံကြ၏။ ကျီးကန်း ခိုးစားနေသည်ကို သိရှိသောအခါ ဘုရားလောင်း ငှက်မင်း ဦးဆောင်သော ငှက်အပေါင်းက ထိုသူယုတ်ကို သုတ်သင်ကြ၏။","moral":"တရားဟန်ဆောင်သော သူယုတ်ကို သတိထားအပ်၏။"},{"no":385,"pali":"Nandiyamigarājajātaka","mm":"နန္ဒိယမိဂရာဇဇာတ်","summary":"ဘုရားလောင်း နန္ဒိယသမင်သည် မိဘနှစ်ပါးကို လုပ်ကျွေးပြုစုသော သားကောင်းဖြစ်၏။ မင်း၏ လေးမြားရှေ့၌ပင် ကြောက်ရွံ့ခြင်းမရှိဘဲ တည်ကြည်စွာ ရင်ဆိုင်သဖြင့် မင်းကြီး ကြည်ညိုကာ သမင်အပေါင်းအား ဘေးမဲ့ပေး၏။","moral":"မိဘကို လုပ်ကျွေးခြင်းနှင့် တည်ကြည်ရဲရင့်ခြင်းသည် ဘေးမှ ကယ်တင်နိုင်၏။"},{"no":386,"pali":"Kharaputtajātaka","mm":"ခရပုတ္တဇာတ်","summary":"သေနကမင်းသည် နဂါးမင်း၏ ကျေးဇူးကြောင့် တိရစ္ဆာန်ဘာသာစကားကို နားလည်သော အတတ်ကို ရ၏။ ထိုအတတ်ကို သူတစ်ပါးအား ပြောကြားလျှင် သေရမည်ဖြစ်သော်လည်း မိဖုရားက ပူဆာသဖြင့် အသက်စွန့်၍ ပြောမည်ပြုရာ ဘုရားလောင်း သိကြားမင်းသည် ဆိတ်အသွင်ဖြင့် လာရောက်ကာ မိုက်မဲသောအလိုသို့ မလိုက်ရန် သတိပေးသဖြင့် မင်းကြီး အသက်ချမ်းသာရ၏။","moral":"သူတစ်ပါး၏ မတရားသောအလိုကြောင့် မိမိအသက်ကို မစွန့်အပ်။"},{"no":387,"pali":"Sūcijātaka","mm":"သူစိဇာတ်","summary":"ဘုရားလောင်း ပန်းပဲဆရာငယ်သည် အံ့ဩဖွယ်ကောင်းအောင် သိမ်မွေ့ထက်မြက်သော အပ်ကို ကျွမ်းကျင်စွာ ထုလုပ်၍ အတတ်ပညာကို ပြသသဖြင့် ပန်းပဲအကြီးအမှူး၏ သမီးကို ရ၏။","moral":"ကျွမ်းကျင်သော အတတ်ပညာသည် ကြီးပွားချမ်းသာကြောင်း ဖြစ်၏။"},{"no":388,"pali":"Tuṇḍilajātaka","mm":"တုဏ္ဍိလဇာတ်","summary":"ဝက်ညီနောင်ဖြစ်ကြသော ဘုရားလောင်း မဟာတုဏ္ဍိလနှင့် စူဠတုဏ္ဍိလတို့ သတ်ခြင်းခံရမည့်အချိန် နီးသောအခါ ညီငယ် ကြောက်ရွံ့ငိုကြွေးရာ အစ်ကိုက သေခြင်းတရားကို မကြောက်ဘဲ စိတ်စင်ကြယ်စွာ ရင်ဆိုင်ရန် တရားဟော၏။ ထိုတရားစကားကို ကြားသော လူအပေါင်း ကြည်ညိုကြ၏။","moral":"သီလစင်ကြယ်သူသည် သေခြင်းကိုပင် မကြောက်။"},{"no":389,"pali":"Suvaṇṇakakkaṭajātaka","mm":"သုဝဏ္ဏကက္ကဋဇာတ်","summary":"ဘုရားလောင်း လယ်လုပ်ပုဏ္ဏားသည် ရွှေဂဏန်းနှင့် မိတ်ဖွဲ့၏။ ကျီးကန်းနှင့် မြွေတို့ လျှို့ဝှက်ကြံစည်၍ မြွေက ပုဏ္ဏားကို ကိုက်သောအခါ ရွှေဂဏန်းသည် ရန်သူတို့ကို ညှပ်ကိုင်ကာ အဆိပ်ကို ပြန်လည်ရုပ်သိမ်းစေပြီး မိတ်ဆွေ၏ အသက်ကို ကယ်ဆယ်၏။","moral":"မိတ်ဆွေစစ်သည် ဘေးရောက်သောအခါ အသက်ကိုပင် ကယ်တင်၏။"},{"no":390,"pali":"Mayhakajātaka","mm":"မယှကဇာတ်","summary":"မယှကငှက်သည် သစ်သီးပင်၌ အခြားငှက်တို့ စားသုံးနေချိန် ငါ့ဥစ္စာ ငါ့ဥစ္စာဟု အချည်းနှီး အော်မြည်နေ၏။ ဥစ္စာရှိလျက် မိမိလည်း မသုံးစွဲ၊ သူတစ်ပါးအားလည်း မပေးလှူသော သူဝန်တိုကို ထိုငှက်နှင့် နှိုင်းယှဉ်ပြ၍ ပေးလှူစွန့်ကြဲခြင်း၏ အကျိုးကို ဟောကြားသော ဇာတ်တော်ဖြစ်၏။","moral":"မသုံးစွဲ မပေးလှူသော ဥစ္စာသည် အချည်းနှီးသာ ဖြစ်၏။"},{"no":391,"pali":"Vijjādharajātaka","mm":"ဝိဇ္ဇာဓရဇာတ်","summary":"ဝိဇ္ဇာအတတ်ဖြင့် ရုပ်ဖျက်လှည့်စား၍ မကောင်းမှုပြုသော သူယုတ်ကြောင့် အပြစ်မဲ့သော ရဟန်းရသေ့အပေါင်း စွပ်စွဲနှင်ထုတ်ခြင်း ခံရ၍ တိုင်းပြည်လည်း ဆုတ်ယုတ်ရ၏။ သိကြားမင်းက အမှန်တရားကို ဖော်ထုတ်ပေးသဖြင့် သူတော်ကောင်းတို့ ပြန်လည် ချီးမြှောက်ခြင်းခံရ၏။","moral":"အပြစ်မဲ့သော သူတော်ကောင်းတို့ကို စွပ်စွဲညှဉ်းဆဲလျှင် တိုင်းပြည် ပျက်၏။"},{"no":392,"pali":"Siṅghapupphajātaka","mm":"သိင်္ဃပုပ္ဖဇာတ်","summary":"ဘုရားလောင်း ရသေ့သည် ရေကန်၌ ကြာပန်း၏ ရနံ့ကို ရှူရှိုက်မိရာ နတ်သမီးက ပန်းရနံ့ကို ခိုးယူသူဟု ဆုံးမ၏။ ရသေ့သည် အမျက်မထွက်ဘဲ ထိုသတိပေးဆုံးမမှုကို ကျေးဇူးတင်စွာ ခံယူ၏။","moral":"စင်ကြယ်သူသည် အနည်းငယ်သော အပြစ်ကိုပင် ကြီးလေးစွာ ရှုမြင်၏။"},{"no":393,"pali":"Vighāsādajātaka","mm":"ဝိဃာသာဒဇာတ်","summary":"ရသေ့အသွင်ဆောင်လျက် စားသောက်ပျော်ပါးမှု၌သာ မွေ့လျော်နေသူတို့အား သိကြားမင်းသည် ကြက်တူရွေးအသွင်ဖြင့် လာရောက်၍ အကျင့်စစ်မရှိဘဲ ဟန်ဆောင်နေခြင်း၏ အပြစ်ကို ဖော်ပြဆုံးမ၏။","moral":"အသွင်ဆောင်ရုံမျှဖြင့် သူတော်ကောင်း မမည်၊ အကျင့်စစ်သာ ပဓာနဖြစ်၏။"},{"no":394,"pali":"Vaṭṭakajātaka","mm":"ဝဋ္ဋကဇာတ်","summary":"လောဘကြီးသော ကျီးကန်းသည် ငုံးဖြစ်သော ဘုရားလောင်း ဆူဖြိုးနေရခြင်း၏ အကြောင်းကို မေးရာ ငုံးက ရရှိသောအစာဖြင့် ရောင့်ရဲ၍ စိုးရိမ်ကြောင့်ကြခြင်း ကင်းသောကြောင့်ဖြစ်ကြောင်း ဖြေကြား၏။","moral":"ရောင့်ရဲလွယ်ခြင်းသည် ကိုယ်စိတ်နှစ်ပါး ချမ်းသာစေ၏။"},{"no":395,"pali":"Pārāvatajātaka","mm":"ပါရာဝတဇာတ်","summary":"ဘုရားလောင်း ချိုးငှက် တည်းခိုနေထိုင်ရာ စားဖိုဆောင်၌ ကျီးကန်းသည် ငါးအမဲသားကို လောဘဖြင့် ခိုးစားရန် ကြံစည်သဖြင့် စားဖိုမှူး၏ ဖမ်းဆီးခြင်းကို ခံရကာ အမွေးနုတ်ခံရ၍ ဆုံးရှုံးပျက်စီး၏။","moral":"မရောင့်ရဲသော လောဘသည် ပျက်စီးကြောင်း ဖြစ်၏။"},{"no":396,"pali":"Kukkujātaka","mm":"ကုက္ကုဇာတ်","summary":"ဘုရားလောင်း အမတ်ပညာရှိသည် အမိုးထိပ်သည် အခြင်တို့၏ ထောက်မခြင်းဖြင့်သာ တည်နိုင်သကဲ့သို့ မင်းသည်လည်း တရားသဖြင့် အုပ်စိုးမှသာ တည်တံ့နိုင်ကြောင်း ဥပမာများဖြင့် လျှောက်ထားဆုံးမသဖြင့် မင်းကြီးသည် တရားသဖြင့် အုပ်စိုး၏။","moral":"မင်းသည် တရားဖြင့်သာ တည်တံ့နိုင်၏။"},{"no":397,"pali":"Manojajātaka","mm":"မနောဇဇာတ်","summary":"ခြင်္သေ့ငယ် မနောဇသည် မိဘတို့၏ တားမြစ်စကားကို နားမထောင်ဘဲ မြေခွေးယုတ်နှင့် ပေါင်းဖော်ကာ မင်း၏ မြင်းတို့ကို ဖမ်းယူလုယက်စဉ် လေးသည်တော်၏ မြားဖြင့် အသတ်ခံရ၏။","moral":"သူယုတ်နှင့် ပေါင်းဖော်သူသည် ပျက်စီးရ၏။"},{"no":398,"pali":"Sutanujātaka","mm":"သုတနုဇာတ်","summary":"ဆင်းရဲသော လုလင် သုတနုဖြစ်သော ဘုရားလောင်းသည် မိခင်ကို လုပ်ကျွေးရန် မင်းပေးသောဆုကို ခံယူ၍ လူကိုစားသော ဘီလူးထံ ရဲရင့်စွာ သွားရောက်ကာ ပညာသတ္တိဖြင့် တရားဟောဆုံးမသဖြင့် ဘီလူးသည် ယဉ်ကျေး၍ လူသတ်ခြင်းမှ ရပ်စဲ၏။","moral":"ပညာနှင့် သတ္တိသည် ကြမ်းကြုတ်သူကိုပင် ယဉ်ကျေးစေနိုင်၏။"},{"no":399,"pali":"Mātuposakagijjhajātaka","mm":"မာတုပေါသကဂိဇ္ဈဇာတ်","summary":"ဘုရားလောင်း လင်းတသည် အိုမင်း၍ မျက်စိမမြင်သော မိဘနှစ်ပါးကို လုပ်ကျွေးပြုစု၏။ မုဆိုး၏ ကျော့ကွင်း၌ မိသောအခါ မိမိအတွက် မဟုတ်ဘဲ မိဘတို့အတွက်သာ ငိုကြွေးသဖြင့် မုဆိုးသည် ကြည်ညို၍ လွှတ်ပေး၏။","moral":"မိဘကျေးဇူးကို ဆပ်ခြင်းသည် ဘေးမှ လွတ်မြောက်ကြောင်း မင်္ဂလာဖြစ်၏။"},{"no":400,"pali":"Dabbhapupphajātaka","mm":"ဒဗ္ဘပုပ္ဖဇာတ်","summary":"ဖျံနှစ်ကောင်သည် ဖမ်းမိသော ငါးကြီးကို ဝေဖန်ခြင်းငှာ ငြင်းခုံကြရာ မြေခွေးအား အဆုံးအဖြတ် ခံကြ၏။ မြေခွေးသည် ဦးခေါင်းပိုင်းနှင့် အမြီးပိုင်းကို နှစ်ကောင်အား ဝေပေး၍ အလယ်ကိုယ်ထည်ကြီးကို မိမိ ယူဆောင်သွား၏။","moral":"အချင်းချင်း ငြင်းခုံရန်ဖြစ်ကြလျှင် သူတစ်ပါးသာ အကျိုးရ၏။"},{"no":401,"pali":"Paṇṇakajātaka","mm":"ပဏ္ဏကဇာတ်","summary":"မင်းတစ်ပါးသည် တပ်မက်မှုကြောင့် ပူလောင်နာကျင်နေရာ ပညာရှိတို့က ထက်သောဓားကို မျိုချခြင်းထက် မိမိချစ်မြတ်နိုးရာကို စွန့်လွှတ်ပေးကမ်းခြင်းက သာ၍ ခဲယဉ်းသော်လည်း ငြိမ်းချမ်းကြောင်းဖြစ်သည်ဟု ပြသဖြင့် မင်းကြီးသည် တပ်မက်မှုကို ဖြေလွှတ်နိုင်၏။","moral":"စွန့်လွှတ်ခြင်းသည် အခက်ခဲဆုံးဖြစ်သော်လည်း ငြိမ်းချမ်းမှုကို ပေး၏။"},{"no":402,"pali":"Sattubhastajātaka","mm":"သတ္တုဘသ္တဇာတ်","summary":"ပုဏ္ဏားအိုတစ်ဦး၏ မုန့်ညက်အိတ်ထဲသို့ မြွေဟောက် ဝင်နေသည်ကို ဘုရားလောင်း သေနကပညာရှိသည် ဉာဏ်ဖြင့် စူးစမ်းဆင်ခြင် သိမြင်၍ လူပရိသတ်ရှေ့၌ ဖော်ထုတ်ပြသကာ ပုဏ္ဏားအို၏ အသက်ကို ကယ်ဆယ်၏။","moral":"ထက်မြက်သော ဉာဏ်ပညာသည် သူတစ်ပါး၏ အသက်ကိုပင် ကယ်တင်နိုင်၏။"},{"no":403,"pali":"Aṭṭhisenakajātaka","mm":"အဋ္ဌိသေနကဇာတ်","summary":"ဘုရားလောင်း အဋ္ဌိသေနရသေ့သည် မင်းကြီးက အလိုရှိရာကို တောင်းပါဟု ဖိတ်ကြားသော်လည်း တစ်စုံတစ်ရာ မတောင်းခံ။ ပညာရှိသူတော်ကောင်းတို့သည် တောင်းခံခြင်းကို ရှောင်ကြဉ်ကြောင်းနှင့် တောင်းခံသူသည် သူတစ်ပါး မနှစ်သက်သောသူ ဖြစ်ကြောင်း မင်းအား ဟောကြား၏။","moral":"မတောင်းခံခြင်းသည် သူတော်ကောင်းတို့၏ အလေ့ဖြစ်၏။"},{"no":404,"pali":"Kapijātaka","mm":"ကပိဇာတ်","summary":"ရန်ငြိုးထားတတ်သော ပုဏ္ဏားအား မျောက်တစ်ကောင်က စော်ကားမိသဖြင့် ထိုသူ၏ လက်စားချေမှုကြောင့် မျောက်အုပ်တစ်အုပ်လုံး ဘေးဆိုက်ပျက်စီးရ၏။ ဘုရားလောင်းသည် ရန်ငြိုးထားတတ်သူကို မစော်ကားဘဲ ဝေးစွာရှောင်အပ်ကြောင်း ဟောကြား၏။","moral":"ရန်ငြိုးထားတတ်သူကို မစော်ကားဘဲ ဝေးစွာ ရှောင်အပ်၏။"},{"no":405,"pali":"Bakajātaka","mm":"ဗကဇာတ်","summary":"ဗကဗြဟ္မာသည် မိမိ၏ ဗြဟ္မာ့ဘုံသက်တမ်းကို နိစ္စမြဲ၏ဟု မှားယွင်းစွာ ယူဆ၏။ မြတ်စွာဘုရားသည် ဗြဟ္မာ့ဘုံသို့ ကြွတော်မူ၍ ဗကဗြဟ္မာ မမှတ်မိတော့သော ရှေးဘဝ ကောင်းမှုတို့ကို ပြန်လည်ဖော်ပြကာ မည်သည့်ဘဝမျှ မမြဲကြောင်း ဟောကြားသဖြင့် ဗကဗြဟ္မာ အယူမှန် ရ၏။","moral":"အသက်ရှည်သောဘဝပင်ဖြစ်စေ နိစ္စမြဲသည်ဟူ၍ မရှိ။"},{"no":406,"pali":"Gandhārajātaka","mm":"ဂန္ဓာရဇာတ်","summary":"ဘုရားလောင်း ဂန္ဓာရမင်းနှင့် ဝိဒေဟမင်းတို့သည် စည်းစိမ်ကို စွန့်၍ ရသေ့ပြုကြ၏။ ဆားကို သိုမှီးထားမိသော ဝိဒေဟရသေ့အား ဂန္ဓာရရသေ့က ရဟန်းရသေ့တို့ ပစ္စည်းသိုမှီးခြင်း မသင့်ကြောင်း ဆုံးမရာ အပြန်အလှန် ဆွေးနွေးပြီးနောက် ဆုံးမစကားကို ကျေနပ်စွာ လက်ခံကြ၏။","moral":"ဆုံးမစကားကို ကျေနပ်စွာ ခံယူတတ်သူသည် မြတ်၏။"},{"no":407,"pali":"Mahākapijātaka","mm":"မဟာကပိဇာတ်","summary":"ဘုရားလောင်း မျောက်မင်းသည် မင်း၏ လေးသည်တော်တို့ ဝိုင်းရံဖမ်းဆီးမည်ပြုသောအခါ မိမိကိုယ်ကို တံတားသဖွယ်ပြု၍ မျောက်အပေါင်းကို မြစ်တစ်ဖက်သို့ ကူးမြောက်စေ၏။ ရန်ငြိုးရှိသော မျောက်တစ်ကောင်၏ ဆောင့်ခုန်မှုကြောင့် ပြင်းစွာ ဒဏ်ရာရ၍ သေအံ့ဆဲဆဲဖြစ်သော်လည်း မင်းကြီးအား အုပ်စိုးသူ၏ ကျင့်ဝတ်ကို ဟောကြားပြီးမှ ကွယ်လွန်၏။","moral":"ခေါင်းဆောင်ကောင်းသည် အခြွေအရံအတွက် မိမိအသက်ကိုပင် စွန့်၏။"},{"no":408,"pali":"Kumbhakārajātaka","mm":"ကုမ္ဘကာရဇာတ်","summary":"ဘုရားလောင်း အိုးထိန်းသည်သည် ပစ္စေကဗုဒ္ဓါ လေးဆူတို့ထံမှ သူတို့ စွန့်လွှတ်တောထွက်ရခြင်း၏ အကြောင်းတရားများကို ကြားနာရ၍ ထိုအာရုံတို့ကို ဆင်ခြင်ကာ ကြည်ညိုသံဝေဂရသဖြင့် ဇနီးနှင့်တကွ စည်းစိမ်ကို စွန့်၍ ရသေ့ရဟန်းပြု၏။","moral":"လောကအဖြစ်အပျက်ကို ဆင်ခြင်သူအား စွန့်လွှတ်လိုစိတ် ဖြစ်ပေါ်၏။"},{"no":409,"pali":"Daḷhadhammajātaka","mm":"ဒဠှဓမ္မဇာတ်","summary":"ဒဠှဓမ္မမင်း၏ ဆင်မကြီးသည် ငယ်စဉ်က များစွာ ကျေးဇူးပြုခဲ့သော်လည်း အိုမင်းသောအခါ ဂုဏ်သိက္ခာမဲ့ လျစ်လျူရှုခြင်း ခံရ၏။ ဘုရားလောင်း အမတ်သည် ကျေးဇူးရှင်ကို မမေ့လျော့အပ်ကြောင်း မင်းအား လျှောက်ထားဆုံးမသဖြင့် ဆင်မကြီးသည် ဂုဏ်ပြန်လည် ရ၏။","moral":"ကျေးဇူးပြုဖူးသူကို အိုမင်းသောအခါ မစွန့်ပစ်အပ်။"},{"no":410,"pali":"Somadattajātaka","mm":"သောမဒတ္တဇာတ်","summary":"ရသေ့ကြီးသည် မွေးမြူထားသော ဆင်ငယ် သောမဒတ္တ သေဆုံးသဖြင့် အစာမစားနိုင်အောင် ငိုကြွေးပူဆွေး၏။ သိကြားမင်းသည် ဆင်းသက်လာ၍ ရဟန်းရသေ့အဖြစ်နှင့် တွယ်တာပူဆွေးခြင်း မလျောက်ပတ်ကြောင်း ဆုံးမသဖြင့် ရသေ့သည် သောကမှ လွတ်မြောက်၏။","moral":"တွယ်တာစွဲလမ်းမှုသည် ဆင်းရဲပူဆွေးခြင်း၏ အကြောင်းဖြစ်၏။"},{"no":411,"pali":"Susīmajātaka","mm":"သုသီမဇာတ်","summary":"သုသီမမင်း၏ ဆင်ပွဲသဘင်ဆိုင်ရာ ပုရောဟိတ်ရာထူးအမွေကို အခြားပုဏ္ဏားတို့ လုယူမည်ပြုရာ ကွယ်လွန်သော ပုရောဟိတ်၏ သားငယ်ဖြစ်သော ဘုရားလောင်းသည် တက္ကသိုလ်သို့ သွား၍ ဝေဒနှင့် ဆင်အတတ်ကို လျင်မြန်စွာ တတ်မြောက်ပြီး အချိန်မီ ပြန်လာကာ မိမိ၏ အမွေရာထူးကို ပြန်လည် ရယူ၏။","moral":"ကြိုးစားအားထုတ်၍ ရသော ပညာသည် မိမိအခွင့်အရေးကို စောင့်ရှောက်၏။"},{"no":412,"pali":"Koṭasimbalijātaka","mm":"ကောဋသိမ္ဗလိဇာတ်","summary":"ဘုရားလောင်း လက်ပံပင်စောင့်နတ်သည် ဂဠုန်မင်းနှင့် နဂါးကြီး၏ ကြီးလေးသော အလေးချိန်ကိုပင် မကြောက်ဘဲ ငှက်ချေးမှ ကျလာသော ညောင်စေ့ကလေးကြောင့် အပင်လုံး ပျက်စီးမည်ကိုသာ စိုးရိမ်၏။","moral":"သေးငယ်သော မကောင်းမှုမျိုးစေ့သည် ကြီးထွား၍ ဖျက်ဆီးတတ်၏။"},{"no":413,"pali":"Dhūmakārijātaka","mm":"ဓူမကာရိဇာတ်","summary":"ဆိတ်ထိန်းပုဏ္ဏား ဓူမကာရိသည် အသစ်ရောက်လာသော တောဆိတ်တို့ကို မြတ်နိုး၍ မိမိ၏ ဆိတ်ဟောင်းတို့ကို လျစ်လျူရှုရာ တောဆိတ်တို့ တောသို့ ပြန်သွားသောအခါ ဆိတ်အုပ်ဟောင်းလည်း ပျက်စီး၍ ဆင်းရဲနွမ်းပါးရ၏။ ဤဥပမာဖြင့် ဘုရားလောင်း ပညာရှိသည် အသစ်ကို မက်၍ အဟောင်းကို စွန့်ခြင်း၏ အပြစ်ကို မင်းအား ပြသ၏။","moral":"မိတ်ဆွေဟောင်းကို စွန့်၍ အသစ်ကို မမက်မောအပ်။"},{"no":414,"pali":"Jāgarajātaka","mm":"ဇာဂရဇာတ်","summary":"နတ်တစ်ပါးက အိပ်နေသူတို့တွင် နိုးနေသူ၊ နိုးနေသူတို့တွင် အိပ်နေသူ မည်သူနည်းဟု ပြဿနာမေးရာ ဘုရားလောင်း ရသေ့သည် သတိတရားနှင့် ပြည့်စုံသူသည် အိပ်နေသူတို့ အလယ်၌ နိုးကြားနေသူ ဖြစ်ကြောင်း ဖြေကြား၏။","moral":"သတိရှိခြင်းသည် အမြဲနိုးကြားခြင်း မည်၏။"},{"no":415,"pali":"Kummāsapiṇḍijātaka","mm":"ကုမ္မာသပိဏ္ဍိဇာတ်","summary":"ဘုရားလောင်း ဗာရာဏသီမင်းသည် ရှေးဘဝက ဆင်းရဲသားအဖြစ် မုယောမုန့်ဆုပ် လေးဆုပ်ကို ပစ္စေကဗုဒ္ဓါ လေးဆူအား လှူဒါန်းခဲ့သော ကုသိုလ်ကြောင့် မင်းစည်းစိမ်ကို ရသည်ဟု အောက်မေ့ဆင်ခြင်၍ မိဖုရားနှင့်တကွ အလှူဒါနကို ကြီးစွာ ပြု၏။","moral":"သူတော်ကောင်းအား လှူသော အနည်းငယ်သောဒါနပင် အကျိုးကြီး၏။"},{"no":416,"pali":"Parantapajātaka","mm":"ပရန္တပဇာတ်","summary":"သစ္စာဖောက် အစေခံ ပရန္တပသည် မိမိသခင်မင်းကို လျှို့ဝှက် လုပ်ကြံသတ်ဖြတ်၏။ ကာလကြာသော် ထိုအမှုကို သိသောသက်သေ ပေါ်ပေါက်လာသဖြင့် မင်းသားက အမှန်ကို သိရှိကာ ပရန္တပသည် မိမိအပြစ်နှင့်အညီ ဆုံးရှုံးရ၏။","moral":"မကောင်းမှုသည် ကာလကြာသော်လည်း ဖုံးကွယ်၍ မရ။"},{"no":417,"pali":"Kaccānijātaka","mm":"ကစ္စာနိဇာတ်","summary":"အိုမင်းသော ကစ္စာနိအမည်ရှိ မိခင်ကြီးအား သားဖြစ်သူသည် ဇနီး၏ တိုက်တွန်းချက်ကြောင့် အိမ်မှ နှင်ထုတ်သဖြင့် မိခင်သည် သင်္ချိုင်း၌ \"တရားသေဆုံးလေပြီ\" ဟူ၍ ပူဇော်ပသလျက် နေလေသည်။ ဘုရားလောင်း သိကြားမင်းသည် ဆင်းသက်လာ၍ သားအား ခြောက်လှန့်ဆုံးမပြီး မိခင်ကြီးကို ပြန်လည် ရိုသေမြတ်နိုးစေလေသည်။","moral":"မိဘကျေးဇူးကို မမေ့မလျော့ ပြုစုလုပ်ကျွေးအပ်၏။"},{"no":418,"pali":"Aṭṭhasaddajātaka","mm":"အဋ္ဌသဒ္ဒဇာတ်","summary":"ဗာရာဏသီမင်းကြီးသည် ညဉ့်အခါ အသံရှစ်မျိုးကို ကြားရ၍ ကြောက်လန့်နေရာ ပုဏ္ဏားတို့က သတ္တဝါများစွာကို ယဇ်ပူဇော်ရန် တိုက်တွန်းကြလေသည်။ ဘုရားလောင်း ရသေ့သည် အသံတစ်ခုစီ၏ ဘေးဥပဒ်ကင်းသော အကြောင်းရင်းကို ရှင်းလင်းဟောပြ၍ သတ္တဝါတို့ကို သေဘေးမှ ကယ်တင်လေသည်။","moral":"မသိနားမလည်မှုကြောင့်ဖြစ်သော ကြောက်ရွံ့မှုကို ပညာဖြင့်သာ ဖြေရှင်းအပ်၏။"},{"no":419,"pali":"Sulasājātaka","mm":"သုလသာဇာတ်","summary":"ပြည့်တန်ဆာမ သုလသာသည် သေဒဏ်ခံရမည့် ဓားပြကို ကယ်ဆယ်၍ လင်အဖြစ် ပေါင်းသင်းခဲ့ရာ ထိုသူက သူမ၏ ရတနာတန်ဆာများကို လိုချင်သဖြင့် တောင်ထိပ်မှ တွန်းချသတ်ရန် ကြံစည်လေသည်။ သုလသာသည် ဉာဏ်ကွန့်မြူးကာ ဓားပြကိုသာ ချောက်ကမ်းပါးမှ တွန်းချနိုင်ခဲ့သည်။","moral":"အန္တရာယ်နှင့် ကြုံသောအခါ ဉာဏ်ပညာဖြင့် မိမိကိုယ်ကို ကာကွယ်အပ်၏။"},{"no":420,"pali":"Sumaṅgalajātaka","mm":"သုမင်္ဂလဇာတ်","summary":"ဥယျာဉ်စောင့် သုမင်္ဂလသည် မှားယွင်း၍ ပစ္စေကဗုဒ္ဓါကို သတ်မိသဖြင့် ကြောက်လန့်ကာ ထွက်ပြေးလေသည်။ ဘုရားလောင်း မင်းကြီးသည် အမျက်ထွက်နေချိန်၌ စီရင်ဆုံးဖြတ်ခြင်း မပြုဘဲ စိတ်ငြိမ်းအေးမှသာ စစ်ဆေး၍ အမှားမှန်း သိသောကြောင့် ခွင့်လွှတ်လေသည်။","moral":"အမျက်ထွက်နေချိန်၌ အရေးကြီးသော ဆုံးဖြတ်ချက်ကို မချအပ်။"},{"no":421,"pali":"Gaṅgamālajātaka","mm":"ဂင်္ဂမာလဇာတ်","summary":"ဘုရားလောင်း ဥဒယမင်း လက်ထက်၌ ဆံသ ဂင်္ဂမာလသည် ဥပုသ်သီလကို
