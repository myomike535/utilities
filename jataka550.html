<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>၅၅၀ ဇာတ်တော် — 550 Jataka Tales</title>
<style>
  :root {
    --bg: #faf7f2;
    --panel: #ffffff;
    --ink: #2b2622;
    --muted: #7a6f66;
    --accent: #8b5a2b;
    --accent-soft: #f2e6d5;
    --border: #e8dfd3;
    --pali: #5d3a1a;
    --mm: #1f3a5f;
    --shadow: 0 2px 8px rgba(139, 90, 43, 0.08);
    --shadow-lift: 0 8px 24px rgba(139, 90, 43, 0.15);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  [data-theme="dark"] {
    --bg: #1a1815;
    --panel: #24211d;
    --ink: #e8e2d8;
    --muted: #a09488;
    --accent: #d4a574;
    --accent-soft: #3a2f22;
    --border: #3a342c;
    --pali: #e2c299;
    --mm: #a8c5e8;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-lift: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  [data-theme="royal"] {
    --bg: #26100f;
    --panel: #38181a;
    --ink: #f5e8c8;
    --muted: #c9a86a;
    --accent: #e6b93c;
    --accent-soft: #4d2418;
    --border: #6b3d20;
    --pali: #f0d178;
    --mm: #f7e6b8;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
    --shadow-lift: 0 8px 28px rgba(230, 185, 60, 0.18);
  }
  [data-theme="royal"] header { border-bottom: 2px solid var(--accent); }
  [data-theme="royal"] .story-card { border: 1px solid var(--border); box-shadow: inset 0 0 0 1px rgba(230,185,60,0.12), var(--shadow); }
  [data-theme="royal"] .story-card:hover { box-shadow: inset 0 0 0 1px rgba(230,185,60,0.3), var(--shadow-lift); }
  [data-theme="royal"] .nipata-title, [data-theme="royal"] h1 { text-shadow: 0 0 18px rgba(230,185,60,0.35); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", "Padauk", "Myanmar Text", Roboto, sans-serif; }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 18px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 10;
    box-shadow: var(--shadow);
  }
  h1 { font-size: 19px; margin: 0; color: var(--accent); white-space: nowrap; }
  h1 small { font-size: 12px; color: var(--muted); font-weight: normal; }
  .spacer { flex: 1; }
  .btn {
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; font-size: 13px; cursor: pointer;
    font-family: inherit;
    transition: all 0.25s var(--ease);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  [data-theme="royal"] .btn.active { color: #26100f; }
  #search {
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 8px 16px; font-size: 14px; width: 220px;
    font-family: inherit; outline: none;
    transition: all 0.3s var(--ease);
  }
  #search:focus { border-color: var(--accent); width: 280px; box-shadow: 0 0 0 3px var(--accent-soft); }
  .prog { flex-basis: 100%; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.5s var(--ease); }

  .layout { display: flex; max-width: 1200px; margin: 0 auto; gap: 18px; padding: 18px; align-items: flex-start; }
  aside {
    width: 285px; flex-shrink: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; position: sticky; top: 76px;
    max-height: calc(100vh - 96px); overflow-y: auto;
    box-shadow: var(--shadow);
  }
  aside h3 { margin: 4px 6px 10px; font-size: 14px; color: var(--muted); }
  .nipata-list { list-style: none; margin: 0; padding: 0; }
  .nipata-list li {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 9px; border-radius: 9px; cursor: pointer; font-size: 13px;
    transition: background 0.2s var(--ease);
  }
  .nipata-list li:hover { background: var(--accent-soft); }
  .nipata-list li.active { background: var(--accent); color: #fff; }
  [data-theme="royal"] .nipata-list li.active { color: #26100f; }
  .nipata-list li.active .np-en, .nipata-list li.active .range, .nipata-list li.active .prog-pct { color: inherit; opacity: 0.85; }
  .np-badge {
    width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); border-radius: 8px; font-size: 15px;
  }
  .nipata-list li.active .np-badge { background: rgba(255,255,255,0.22); }
  .np-info { flex: 1; line-height: 1.45; }
  .np-en { font-size: 11px; color: var(--muted); }
  .range { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .prog-pct { font-size: 10px; color: var(--muted); margin-left: 4px; }
  .nipata-list .prog { margin-top: 5px; }

  section.content { flex: 1; min-width: 0; }
  .nipata-banner {
    display: flex; align-items: center; gap: 16px;
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .nipata-banner svg { width: 52px; height: 52px; color: var(--accent); flex-shrink: 0; opacity: 0.9; }
  .nipata-title { margin: 0 0 4px; font-size: 21px; color: var(--accent); }
  .nipata-sub { margin: 0; font-size: 13px; color: var(--muted); }

  .story-card {
    position: relative; overflow: hidden;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 14px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s var(--ease), transform 0.3s var(--ease);
    animation: rise 0.4s var(--ease) both;
  }
  .story-card:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .story-card.bookmarked { border-left: 3px solid var(--accent); }
  .story-card.read-done { opacity: 0.88; }
  .watermark {
    position: absolute; right: -14px; bottom: -14px; width: 110px; height: 110px;
    color: var(--accent); opacity: 0.06; pointer-events: none;
  }
  .card-head { display: flex; align-items: flex-start; gap: 10px; }
  .no-chip {
    background: var(--accent-soft); color: var(--accent);
    font-weight: bold; font-size: 13px;
    border-radius: 9px; padding: 6px 10px; flex-shrink: 0;
  }
  .titles { flex: 1; min-width: 0; }
  .t-pali { font-size: 15px; color: var(--pali); font-style: italic; }
  .t-mm { font-size: 17px; color: var(--mm); font-weight: 600; line-height: 1.6; }
  .np-chip { font-size: 11px; color: var(--muted); }
  .maha-chip {
    display: inline-block; font-size: 11px; margin-left: 6px;
    background: var(--accent); color: #fff; border-radius: 10px; padding: 2px 9px;
  }
  [data-theme="royal"] .maha-chip { color: #26100f; }
  .bookmark-btn {
    background: none; border: none; font-size: 21px; cursor: pointer;
    color: var(--muted); transition: transform 0.2s var(--ease), color 0.2s;
    padding: 0 2px; line-height: 1;
  }
  .bookmark-btn:hover { transform: scale(1.25); }
  .bookmark-btn.on { color: var(--accent); }
  .summary { font-size: 14.5px; line-height: 2; margin: 10px 0 0; }
  .moral {
    margin-top: 10px; padding: 9px 13px; font-size: 13.5px; line-height: 1.9;
    background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
  }
  .parami {
    display: inline-block; margin-top: 10px; font-size: 12.5px;
    border: 1px dashed var(--accent); color: var(--accent);
    border-radius: 14px; padding: 3px 12px;
  }
  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .action-btn {
    background: none; border: 1px solid var(--border); border-radius: 16px;
    color: var(--muted); font-size: 12px; padding: 5px 12px; cursor: pointer;
    font-family: inherit; transition: all 0.2s var(--ease);
  }
  .action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .action-btn.done { background: var(--accent); color: #fff; border-color: var(--accent); }
  [data-theme="royal"] .action-btn.done { color: #26100f; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 15px; line-height: 2; }

  .daily-stage { max-width: 640px; margin: 0 auto; }
  .daily-buddha { width: 90px; height: 90px; margin: 0 auto 8px; color: var(--accent); opacity: 0.75; }
  .daily-badge {
    background: var(--accent); color: #fff; font-size: 10px;
    border-radius: 8px; padding: 2px 8px; margin-left: 6px; vertical-align: middle;
  }
  [data-theme="royal"] .daily-badge { color: #26100f; }

  #toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: var(--bg);
    border-radius: 22px; padding: 10px 22px; font-size: 13.5px;
    opacity: 0; transition: all 0.35s var(--ease); z-index: 50;
    max-width: 86vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .menu-toggle { display: none; font-size: 18px; padding: 6px 10px; }
  #drawer-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 19;
    opacity: 0; transition: opacity 0.3s;
  }
  #drawer-backdrop.show { opacity: 1; }

  .pager { display: flex; justify-content: center; gap: 8px; margin: 14px 0 30px; flex-wrap: wrap; }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 12px 40px; line-height: 2; }

  @media (max-width: 820px) {
    .layout { padding: 12px; }
    aside {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 20;
      width: 300px; max-height: none; border-radius: 0 12px 12px 0;
      transform: translateX(-105%); transition: transform 0.35s var(--ease);
    }
    aside.open { transform: none; }
    #drawer-backdrop { display: block; pointer-events: none; }
    #drawer-backdrop.show { pointer-events: auto; }
    .menu-toggle { display: inline-block; }
    #search { width: 140px; }
    #search:focus { width: 170px; }
    h1 small { display: none; }
  }
</style>

<header>

</header>

<div id="drawer-backdrop"></div>

<div class="layout">
  <aside>

  </aside>
  <section class="content">
    <div id="banner"></div>
    <div id="cards"></div>
    <div class="pager" id="pager"></div>
  </section>
</div>

<footer>

</footer>

const EMBEDDED_JATAKA = [{"no":1,"pali":"Apaṇṇakajātaka","mm":"အပဏ္ဏကဇာတ်","summary":"ဘုရားလောင်းသည် ကုန်သည်ကြီးဖြစ်၍ ခရီးလမ်းခုလတ်တွင် ဘီလူးတို့၏ \"ရှေ့၌ ရေရှိသည်\" ဟူသော လှည့်စားစကားကို မယုံဘဲ ရေကို မစွန့်သဖြင့် အခြွေအရံနှင့်တကွ ဘေးမှ လွတ်မြောက်လေသည်။ မိုက်မဲသော အခြားကုန်သည်ကြီးမူ ထိုစကားကို ယုံကြည်ကာ ရေကို စွန့်ပစ်သဖြင့် အခြွေအရံနှင့်တကွ ဘီလူးတို့၏ အစာ ဖြစ်ရလေသည်။","moral":"စိစစ်ဆင်ခြင်၍ လမ်းမှန်ကို ရွေးချယ်တတ်သူသည် ဘေးအန္တရာယ်မှ လွတ်မြောက်နိုင်၏။"},{"no":2,"pali":"Vaṇṇupathajātaka","mm":"ဝဏ္ဏုပထဇာတ်","summary":"သဲကန္တာရခရီးတွင် ရေကုန်ခန်းသဖြင့် ကုန်သည်တို့ ရေတွင်းတူးရာ ကျောက်ဖျာကြီးနှင့် တွေ့၍ လက်လျှော့ကြသော်လည်း ဘုရားလောင်း ကုန်သည်ကြီး၏ တိုက်တွန်းချက်အရ လုလင်ငယ်တစ်ဦးက ဇွဲမလျှော့ဘဲ ကျောက်ကို ထုခွဲရာ ရေထွက်လာ၍ အားလုံး အသက်ချမ်းသာရာ ရလေသည်။","moral":"ဇွဲလုံ့လ မလျှော့သူသည် ရည်မှန်းချက်ပန်းတိုင်သို့ ရောက်၏။"},{"no":3,"pali":"Serivavāṇijajātaka","mm":"သေရိဝဝါဏိဇဇာတ်","summary":"ကုန်စည်လှည့်လည်ရောင်းချသော ကုန်သည်နှစ်ဦးအနက် လောဘကြီးသူက ဆင်းရဲသောအိမ်မှ ရွှေခွက်ကို တန်ဖိုးမဲ့သဖွယ် လိမ်လည်ဝယ်ယူရန် ကြံစည်၍ မအောင်မြင်ဘဲ၊ ဖြောင့်မတ်သော ဘုရားလောင်းကုန်သည်က တန်ဖိုးမှန်ပေး၍ ရရှိလေသည်။ လိမ်လည်သူမူ နှမြောပူဆွေးလွန်းသဖြင့် နှလုံးကွဲ၍ သေရလေသည်။","moral":"လောဘနှင့် လိမ်လည်မှုသည် မိမိကိုယ်ကိုသာ ပျက်စီးစေ၏။"},{"no":4,"pali":"Cūḷaseṭṭhijātaka","mm":"စူဠသေဋ္ဌိဇာတ်","summary":"ဘုရားလောင်း စူဠသေဋ္ဌိသူဌေးကြီး၏ \"ကြွက်သေတစ်ကောင်ဖြင့်ပင် စီးပွားတည်ဆောက်နိုင်၏\" ဟူသော စကားကို ကြားနာသော လုလင်တစ်ဦးသည် ကြွက်သေကို ရောင်းချခြင်းမှ အစပြု၍ ဉာဏ်ပညာနှင့် လုံ့လဖြင့် တစ်ဆင့်ပြီးတစ်ဆင့် စီးပွားရှာကာ သူဌေးကြီး ဖြစ်လာလေသည်။","moral":"ဉာဏ်ပညာနှင့် လုံ့လရှိလျှင် အရင်းအနှီး နည်းသော်လည်း ကြီးပွားနိုင်၏။"},{"no":5,"pali":"Taṇḍulanāḷijātaka","mm":"တဏ္ဍုလနာဠိဇာတ်","summary":"မိုက်မဲသော တန်ဖိုးဖြတ်အမတ်သည် မင်းကြီး၏ မြင်းငါးရာကို ဆန်တစ်ခွက်တည်းနှင့် တန်ဖိုးဖြတ်ပြီးနောက် ထိုဆန်တစ်ခွက်ကိုမူ ဗာရာဏသီပြည်တစ်ခုလုံးနှင့် ထိုက်တန်သည်ဟု ဖြတ်သဖြင့် လူတို့၏ ပြက်ရယ်ပြုခြင်းကို ခံရလေသည်။ ဘုရားလောင်းမှာ ပညာရှိသော တန်ဖိုးဖြတ်အမတ်ဟောင်းဖြစ်၍ မင်းကြီးက ရာထူး ပြန်လည်အပ်နှင်းလေသည်။","moral":"မိုက်မဲသူကို ရာထူးအပ်နှင်းလျှင် ဆုံးရှုံးနစ်နာရ၏။"},{"no":6,"pali":"Devadhammajātaka","mm":"ဒေဝဓမ္မဇာတ်","summary":"ရေကန်စောင့်ဘီလူးသည် \"ဒေဝဓမ္မ\" ကို မဖြေဆိုနိုင်သူတို့ကို ဖမ်းယူစားသောက်ရာ ဘုရားလောင်း မင်းသားကြီးက ဟိရီဩတ္တပ္ပတရားနှင့် ပြည့်စုံသော သူတော်ကောင်းတို့သည်သာ ဒေဝဓမ္မနှင့် ပြည့်စုံသူများ ဖြစ်ကြောင်း ဖြေကြားနိုင်သဖြင့် ညီတော်တို့ကို ကယ်တင်၍ ဘီလူးကိုလည်း တရားရစေလေသည်။","moral":"မကောင်းမှုမှ ရှက်ကြောက်သော ဟိရီဩတ္တပ္ပတရားသည် မြင့်မြတ်သူတို့၏ တရားဖြစ်၏။"},{"no":7,"pali":"Kaṭṭhahārijātaka","mm":"ကဋ္ဌဟာရိဇာတ်","summary":"ဗာရာဏသီမင်းကြီးနှင့် ထင်းခွေသည် အမျိုးသမီးတို့မှ ဖွားမြင်သော ဘုရားလောင်း သားငယ်ကို မင်းကြီးက သားတော်အဖြစ် ငြင်းပယ်ရာ မိခင်က သစ္စာဆိုကာ ကလေးကို ကောင်းကင်သို့ ပစ်လွှင့်ရာ ကလေးသည် ကောင်းကင်၌ တင့်တယ်စွာ ရပ်တည်နေသဖြင့် မင်းကြီးက သားတော်အဖြစ် လက်ခံ၍ နောင်အခါ ထီးနန်းကိုပင် အပ်နှင်းလေသည်။","moral":"သစ္စာတရား၏ တန်ခိုးသည် ကြီးမား၏။"},{"no":8,"pali":"Gāmaṇijātaka","mm":"ဂါမဏိဇာတ်","summary":"သားတော်တစ်ရာအနက် အငယ်ဆုံးဖြစ်သော ဂါမဏိမင်းသားသည် ဘုရားလောင်း ဆရာကြီး၏ အဆုံးအမကို လိုက်နာလျက် စိတ်ရှည်စွာ စောင့်ဆိုင်းသဖြင့် နောက်ဆုံးတွင် ထီးနန်းကို ရရှိလေသည်။","moral":"ပညာရှိ၏ အဆုံးအမကို ခံယူ၍ စိတ်ရှည်စွာ စောင့်ဆိုင်းသူသည် အလိုပြည့်၏။"},{"no":9,"pali":"Maghadevajātaka","mm":"မဃဒေဝဇာတ်","summary":"ဘုရားလောင်း မဃဒေဝမင်းကြီးသည် ဆံဖြူတစ်ပင်ကို မြင်ရသောအခါ သေမင်း၏ စေတမန် ရောက်လာပြီဟု နှလုံးသွင်းကာ ထီးနန်းကို သားတော်အား လွှဲအပ်၍ ရသေ့ရဟန်းပြုပြီးလျှင် ဗြဟ္မာ့ပြည်သို့ ရောက်လေသည်။","moral":"အနိစ္စသဘောကို ဆင်ခြင်၍ အချိန်မီ ကုသိုလ်တရား ရှာမှီးအပ်၏။"},{"no":10,"pali":"Sukhavihārijātaka","mm":"သုခဝိဟာရိဇာတ်","summary":"ထီးနန်းစွန့်၍ ဘုရားလောင်း ရသေ့ကြီးထံ ရသေ့ပြုသော မင်းကြီးတစ်ပါးသည် \"အလွန်ချမ်းသာပါတကား\" ဟု အဖန်ဖန် ဥဒါန်းကျူးရင့်ရာ စည်းစိမ်ဟောင်းကို တမ်းတသည်ဟု ထင်ကြသော်လည်း စိုးရိမ်ကြောင့်ကြမှု ကင်းသောကြောင့် ဆိုခြင်းဖြစ်ကြောင်း ရှင်းပြလေသည်။","moral":"စိုးရိမ်ကြောင့်ကြ ကင်းသော စွန့်လွှတ်ခြင်း၌ စစ်မှန်သော ချမ်းသာရှိ၏။"},{"no":11,"pali":"Lakkhaṇamigajātaka","mm":"လက္ခဏမိဂဇာတ်","summary":"ဘုရားလောင်း သမင်မင်း၏ သားနှစ်ကောင်အနက် လက္ခဏသည် အခြွေအရံသမင်တို့ကို သတိပညာဖြင့် ညအချိန်၌သာ သွားလာစေ၍ ဦးဆောင်သဖြင့် အားလုံး ဘေးကင်းစွာ ပြန်ရောက်ကြပြီး ကာဠမူ ပေါ့ဆစွာ ဦးဆောင်သဖြင့် အခြွေအရံအားလုံး ပျက်စီးဆုံးရှုံးလေသည်။","moral":"သတိပညာရှိသော ခေါင်းဆောင်၏ အခြွေအရံသည် ချမ်းသာရ၏။"},{"no":12,"pali":"Nigrodhamigajātaka","mm":"နိဂြောဓမိဂဇာတ်","summary":"ဘုရားလောင်း နိဂြောဓသမင်မင်းသည် သတ်ရန် အလှည့်ကျသော ကိုယ်ဝန်ဆောင် သမင်မကိုယ်စား မိမိအသက်ကို စွန့်၍ အစားဝင်ပေးရာ မင်းကြီးသည် အလွန်ကြည်ညိုသဖြင့် သမင်အားလုံးမှစ၍ သတ္တဝါအပေါင်းတို့အား ဘေးမဲ့ ပေးလေသည်။","moral":"သူတစ်ပါးအတွက် ကိုယ်ကျိုးစွန့်သော မေတ္တာကရုဏာသည် အမြတ်ဆုံးဖြစ်၏။"},{"no":13,"pali":"Kaṇḍijātaka","mm":"ကဏ္ဍိဇာတ်","summary":"တောင်၌နေသော သမင်ထီးသည် သမင်မကို တပ်မက်၍ နောက်သို့ အစဉ်လိုက်ပါရာ ရွာနီးသို့ ရောက်သောအခါ မုဆိုး၏ မြားဖြင့် အသတ်ခံရလေသည်။ ဘုရားလောင်း တောစောင့်နတ်သားက ကာမဂုဏ်နောက်သို့ လိုက်ပါသူ၏ ပျက်စီးခြင်းကို မြင်၍ တရားစကား ဆိုလေသည်။","moral":"ကာမရာဂနောက်သို့ လိုက်ပါသူသည် ပျက်စီးခြင်းသို့ ရောက်တတ်၏။"},{"no":14,"pali":"Vātamigajātaka","mm":"ဝါတမိဂဇာတ်","summary":"အလွန်ကြောက်တတ်၍ တောနက်၌သာ နေတတ်သော လေသမင်သည် ဥယျာဉ်မှူး၏ ပျားရည်သုတ်မြက်ကို တပ်မက်စွဲလမ်းသဖြင့် နန်းတော်အတွင်းသို့ပင် လိုက်ပါလာရလေသည်။ ဘုရားလောင်း မင်းကြီးက အရသာတဏှာလောက် ဆိုးဝါးသောအရာ မရှိကြောင်း ဆင်ခြင်၍ သမင်ကို တောသို့ ပြန်လွှတ်ပေးလေသည်။","moral":"အရသာတဏှာ၌ စွဲလမ်းခြင်းသည် သူ့ကျွန်ဖြစ်ခြင်း၏ အကြောင်းတည်း။"},{"no":15,"pali":"Kharādiyajātaka","mm":"ခရာဒိယဇာတ်","summary":"ဘုရားလောင်း သမင်ပညာရှိသည် နှမ ခရာဒိယာ၏ သားအား သမင်တို့၏ ပရိယာယ်ပညာ သင်ပေးရန် ဝန်ခံသော်လည်း တူတော်သည် သင်ကြားရန် မလာဘဲ ပေါ့ဆနေသဖြင့် မုဆိုး၏ ကျော့ကွင်း၌မိ၍ အသတ်ခံရလေသည်။","moral":"အဆုံးအမကို နာယူလိုစိတ် မရှိသူကို မည်သူမျှ မကယ်နိုင်။"},{"no":16,"pali":"Tipallatthamigajātaka","mm":"တိပလ္လတ္ထမိဂဇာတ်","summary":"ဘုရားလောင်း သမင်မင်းသည် တူတော်သမင်ငယ်အား သမင်တို့၏ ပရိယာယ်များကို စေ့စပ်စွာ သင်ပေးထားသဖြင့် တူတော်သည် ကျော့ကွင်း၌ မိသောအခါ သေဟန်ဆောင်ကာ မုဆိုးလက်မှ လွတ်မြောက်လေသည်။","moral":"ဆရာ့အဆုံးအမကို ရိုသေစွာ သင်ယူသူသည် ဘေးရောက်သောအခါ လွတ်မြောက်ရာ ရ၏။"},{"no":17,"pali":"Mālutajātaka","mm":"မာလုတဇာတ်","summary":"ခြင်္သေ့နှင့် ကျားတို့သည် အအေးဓာတ်သည် လဆန်း၌လော လဆုတ်၌လော ဟူ၍ ငြင်းခုံကြရာ ဘုရားလောင်း ရသေ့က အအေးသည် လေကြောင့်သာ ဖြစ်၍ နှစ်ဦးလုံး၏ စကား မမှားကြောင်း ဆုံးဖြတ်ပေးသဖြင့် ခိုက်ရန် ငြိမ်းလေသည်။","moral":"ပညာရှိသည် အငြင်းပွားမှုကို မျှတစွာ ဖြေရှင်း၍ ငြိမ်းချမ်းစေနိုင်၏။"},{"no":18,"pali":"Matakabhattajātaka","mm":"မတကဘတ္တဇာတ်","summary":"သေသူတို့အား ရည်စူး၍ ပူဇော်ရန် သတ်မည့်ဆိတ်သည် ရှေးဘဝက ဆိတ်တစ်ကောင် သတ်ခဲ့ဖူးသည့်အတွက် ဘဝပေါင်းများစွာ ဦးခေါင်းဖြတ်ခြင်း ခံခဲ့ရသည်ကို အောက်မေ့၍ ရယ်လိုက် ငိုလိုက် ပြုလေသည်။ ပုဏ္ဏားက မသတ်တော့သော်လည်း ဆိတ်သည် ကံအလျောက်ပင် သေဆုံးရ၍ ဘုရားလောင်း သစ်ပင်စောင့်နတ်က သတ္တဝါ မသတ်ကြရန် လူအပေါင်းအား ဆုံးမလေသည်။","moral":"သူ့အသက်သတ်ခြင်း၏ အကျိုးဆက်သည် ဘဝများစွာ ဆင်းရဲစေ၏။"},{"no":19,"pali":"Āyācitabhattajātaka","mm":"အာယာစိတဘတ္တဇာတ်","summary":"ခရီးအောင်မြင်ရေးအတွက် နတ်တို့အား သတ္တဝါများ သတ်၍ ပူဇော်ပသကြသော ရွာသူရွာသားတို့အား ဘုရားလောင်း သစ်ပင်စောင့်နတ်က သူ့အသက်သတ်ခြင်းဖြင့် လွတ်မြောက်ခြင်း မရနိုင်ကြောင်း ဆုံးမလေသည်။","moral":"သတ္တဝါတို့၏ အသက်ကို သတ်၍ ရအပ်သော ကောင်းကျိုးဟူ၍ မရှိ။"},{"no":20,"pali":"Naḷapānajātaka","mm":"နဠပါနဇာတ်","summary":"ဘုရားလောင်း မျောက်မင်းသည် ရေကန်စောင့်ဘီလူး ရှိသောကန်၌ မျောက်ရှစ်သောင်းတို့ကို ရေထဲ မဆင်းစေဘဲ သစ္စာဓိဋ္ဌာန်ဖြင့် အဆစ်ပေါက်သွားသော ကျူရိုးတို့ဖြင့် ရေစုပ်သောက်စေသဖြင့် အားလုံး ဘီလူးဘေးမှ လွတ်မြောက်ကြလေသည်။","moral":"ဆင်ခြင်သတိရှိသော ခေါင်းဆောင်ကြောင့် အပေါင်းအဖော်တို့ ဘေးလွတ်ကြ၏။"},{"no":21,"pali":"Kuruṅgamigajātaka","mm":"ကုရုင်္ဂမိဂဇာတ်","summary":"ဘုရားလောင်း ကုရင်္ဂသမင်သည် သစ်သီးစားနေကျ သစ်ပင်ပေါ်၌ မုဆိုး စောင့်ချောင်းနေသည်ကို သစ်သီးများ ပုံမှန်မဟုတ်ဘဲ ကျလာသည့် အရိပ်လက္ခဏာဖြင့် ရိပ်မိကာ ရှောင်လွှဲသွားသဖြင့် မုဆိုး၏ လှံဘေးမှ လွတ်မြောက်လေသည်။","moral":"အကဲခတ်၍ သတိထားတတ်သူသည် ရန်သူ၏ ကျော့ကွင်းမှ လွတ်၏။"},{"no":22,"pali":"Kukkurajātaka","mm":"ကုက္ကုရဇာတ်","summary":"နန်းတော်တွင်း ရထားကြိုးသားရေများကို ခွေးများ ကိုက်ဖျက်သည်ဟုဆိုကာ မင်းကြီးက ခွေးအားလုံး သတ်ရန် အမိန့်ချရာ ဘုရားလောင်း ခွေးမင်းသည် နန်းတော်သို့ ရဲရင့်စွာဝင်၍ နန်းတွင်းမွေး ခွေးများ၏ အပြစ်သာ ဖြစ်ကြောင်း သက်သေထင်ရှား ပြသဖြင့် ခွေးအပေါင်း ဘေးမဲ့ ရကြလေသည်။","moral":"မစိစစ်ဘဲ အပြစ်မပေးအပ်၊ တရားမျှတမှုသည် အားလုံးကို ကယ်တင်၏။"},{"no":23,"pali":"Bhojājānīyajātaka","mm":"ဘောဇာဇာနီယဇာတ်","summary":"ဘုရားလောင်း အာဇာနည်စစ်မြင်းသည် မင်းခြောက်ပါးကို ဖမ်းဆီးပြီးနောက် ဒဏ်ရာပြင်းစွာ ရသော်လည်း အခြားမြင်းဖြင့် မအောင်မြင်နိုင်ဟု သိသဖြင့် မိမိကိုယ်တိုင် ဆက်လက်တိုက်ခိုက်စေကာ သတ္တမမြောက် မင်းကို ဖမ်းဆီးပြီးမှ အသက်ချုပ်လေသည်။","moral":"အာဇာနည်တို့သည် တာဝန်ပြီးဆုံးသည်အထိ ဇွဲမလျှော့ကြ။"},{"no":24,"pali":"Ājaññajātaka","mm":"အာဇညဇာတ်","summary":"ဘုရားလောင်း အာဇာနည်စစ်မြင်းသည် စစ်မြေပြင်၌ ဒဏ်ရာပြင်းစွာ ရသော်လည်း \"အာဇာနည်မြင်းသည် မည်သည့်အခါမျှ မဆုတ်နစ်\" ဟုဆိုကာ တိုက်ပွဲအောင်မြင်သည်အထိ ဆောင်ရွက်ပြီးမှ ကျဆုံးလေသည်။","moral":"လေ့ကျင့်ပြီးသော အာဇာနည်သည် ဆင်းရဲဒုက္ခ၌ပင် တာဝန်မပျက်။"},{"no":25,"pali":"Titthajātaka","mm":"တိတ္ထဇာတ်","summary":"မင်္ဂလာမြင်းတော်သည် ယုတ်ညံ့သောမြင်း ရေချိုးခဲ့သည့် ဆိပ်၌ ရေချိုးရန် ငြင်းဆန်နေရာ ဘုရားလောင်း အမတ်ပညာရှိက အကြောင်းရင်းကို သိမြင်၍ အခြားဆိပ်၌ ချိုးစေသဖြင့် ပြေလည်လေသည်။","moral":"သူတစ်ပါး၏ စိတ်သဘောကို သိအောင် ဆင်ခြင်လျှင် ပြဿနာ ပြေလည်၏။"},{"no":26,"pali":"Mahiḷāmukhajātaka","mm":"မဟိဠာမုခဇာတ်","summary":"ယဉ်ကျေးသော မဟိဠာမုခ ဆင်တော်သည် ဓားပြတို့၏ ကြမ်းကြုတ်သော စကားများကို ညစဉ် ကြားနာရသဖြင့် ကြမ်းကြုတ်လာပြီး လူသတ်တတ်လာရာ ဘုရားလောင်း အမတ်က အကြောင်းရင်းကို သိမြင်၍ သီလရှိသော သူတော်ကောင်းတို့၏ စကားကို ကြားနာစေသဖြင့် ပြန်လည် ယဉ်ကျေးလာလေသည်။","moral":"ပေါင်းသင်းသော အပေါင်းအသင်းအလိုက် စိတ်သဘောထား ပြောင်းလဲတတ်၏။"},{"no":27,"pali":"Abhiṇhajātaka","mm":"အဘိဏှဇာတ်","summary":"ဆင်တော်နှင့် ခွေးတစ်ကောင်တို့သည် အလွန် ခင်မင်ရင်းနှီးကြရာ ခွေးကို သူတစ်ပါးက ဝယ်ယူသွားသောအခါ ဆင်တော်သည် အစာရေစာပင် မစားနိုင်အောင် ဖြစ်နေလေသည်။ ဘုရားလောင်း အမတ်က အကြောင်းရင်းကို သိမြင်၍ ခွေးကို ပြန်လည်ခေါ်ဆောင်စေသဖြင့် နှစ်ဦးလုံး ရွှင်လန်းကြပြန်လေသည်။","moral":"မိတ်ဆွေချစ်ကြည်မှုသည် တိရစ္ဆာန်တို့၌ပင် အားကြီး၏။"},{"no":28,"pali":"Nandivisālajātaka","mm":"နန္ဒိဝိသာလဇာတ်","summary":"ဘုရားလောင်း နန္ဒိဝိသာလ နွားလားဥသဘသည် လှည်းအစီးတစ်ရာ ဆွဲနိုင်သော်လည်း သခင်က ကြမ်းတမ်းသော စကားဖြင့် ခိုင်းသောအခါ မဆွဲဘဲ၊ ချိုသာသော စကားဖြင့် ခိုင်းသောအခါမှ ဆွဲပေးသဖြင့် သခင် အလောင်းအစား နိုင်လေသည်။","moral":"ချိုသာသောစကားသည် အောင်မြင်စေ၍ ကြမ်းတမ်းသောစကားသည် ဆုံးရှုံးစေ၏။"},{"no":29,"pali":"Kaṇhajātaka","mm":"ကဏှဇာတ်","summary":"ဘုရားလောင်း ကဏှ နွားနက်ကြီးသည် မိမိကို ကျွေးမွေးပြုစုခဲ့သော အဘွားအိုအား ကျေးဇူးဆပ်လိုသဖြင့် လှည်းငါးရာကို ဆွဲတင်ပေး၍ ရသောအခကြေးငွေများကို အဘွားအိုအား ပေးလေသည်။","moral":"ကျေးဇူးရှင်၏ ကျေးဇူးကို သိတတ် ဆပ်တတ်အပ်၏။"},{"no":30,"pali":"Munikajātaka","mm":"မုနိကဇာတ်","summary":"နွားညီနောင်တို့ ကောက်ရိုးသာ စားရချိန်၌ မုနိကဝက်ကလေးမူ ထမင်းဆန်ပြုတ် ကောင်းကောင်း ကျွေးခြင်းခံရသည်ကို နွားငယ်က အားကျရာ ဘုရားလောင်း နွားအစ်ကိုကြီးက ဝက်ကလေးသည် မင်္ဂလာဆောင်ပွဲအတွက် သတ်ရန် မွေးမြူထားခြင်းသာ ဖြစ်ကြောင်း ရှင်းပြလေသည်။","moral":"သေဘေးပါသော စည်းစိမ်ထက် ဘေးကင်းသော ရိုးရိုးအသက်မွေးမှုက မြတ်၏။"},{"no":31,"pali":"Kulāvakajātaka","mm":"ကုလာဝကဇာတ်","summary":"ဘုရားလောင်း မဃလုလင်သည် အဖော်သုံးကျိပ်သုံးယောက်နှင့်အတူ ကောင်းမှုပြု၍ သိကြားမင်း ဖြစ်လာပြီးလျှင် အသုရာတို့နှင့် စစ်ဖြစ်စဉ် ဂဠုန်ငှက်ငယ်တို့၏ အသိုက်များ မပျက်စီးစေရန် ရထားကို ပြန်လှည့်စေရာ အသုရာတို့က တပ်ကြီးချီလာသည်ဟု ထင်မှတ်ကာ ထွက်ပြေးကြသဖြင့် အောင်ပွဲရလေသည်။","moral":"သတ္တဝါငယ်တို့အပေါ် ထားသော ကရုဏာသည် အောင်မြင်ခြင်းကို ဆောင်တတ်၏။"},{"no":32,"pali":"Naccajātaka","mm":"နစ္စဇာတ်","summary":"ဘုရားလောင်း ဟင်္သာမင်း၏ သမီးတော် လင်ရွေးပွဲ၌ ဒေါင်းသည် ရွှင်မြူးလွန်းသဖြင့် အရှက်မဲ့စွာ အတောင်ဖြန့်၍ ကပြရာ ဟင်္သာမင်းက အရှက်တရား ကင်းမဲ့သူအား သမီး မပေးစားနိုင်ဟုဆိုကာ ငြင်းပယ်လေသည်။","moral":"အရှက်အကြောက်တရား ကင်းသူသည် ရအပ်သောအရာကိုပင် ဆုံးရှုံး၏။"},{"no":33,"pali":"Sammodamānajātaka","mm":"သမ္မောဒမာနဇာတ်","summary":"ဘုရားလောင်း ငုံးမင်း၏ အကြံပေးချက်အတိုင်း ငုံးတို့သည် မုဆိုး၏ ပိုက်ကွန်မိသောအခါ ညီညွတ်စွာ တစ်ပြိုင်နက် ပျံတက်၍ ကွန်ကို ချီဆောင်သွားသဖြင့် လွတ်မြောက်ကြသော်လည်း နောင်အခါ အချင်းချင်း ခိုက်ရန်ဖြစ်ကြသောအခါ မုဆိုး၏ ဖမ်းဆီးခြင်းကို ခံကြရလေသည်။","moral":"ညီညွတ်ခြင်းသည် အင်အား၊ ကွဲပြားခြင်းသည် ပျက်စီးခြင်း အကြောင်းဖြစ်၏။"},{"no":34,"pali":"Macchajātaka","mm":"မစ္ဆဇာတ်","summary":"ငါးထီးသည် မယားငါးမကို တွယ်တာလွန်းသဖြင့် ပိုက်ကွန်၌ မိသောအခါ သေဘေးထက် မယားက အထင်လွဲမည်ကိုသာ ပူဆွေးမြည်တမ်းနေရာ ဘုရားလောင်း ပုရောဟိတ်ပုဏ္ဏားက သနား၍ လွှတ်ပေးလိုက်လေသည်။","moral":"တဏှာတွယ်တာမှုသည် ဘေးအန္တရာယ်၏ အရင်းခံ ဖြစ်၏။"},{"no":35,"pali":"Vaṭṭakajātaka","mm":"ဝဋ္ဋကဇာတ်","summary":"ဘုရားလောင်း ငုံးငယ်ကလေးသည် တောမီးလောင်လာသောအခါ အတောင်မစုံ၍ မပျံနိုင်သေးသဖြင့် ဘုရားရှင်တို့၏ ဂုဏ်တော်နှင့် သစ္စာတရားကို အာရုံပြုကာ သစ္စာဆိုရာ မီးသည် ဆုတ်ခွာသွားလေသည်။","moral":"စင်ကြယ်သော သစ္စာတရား၏ တန်ခိုးသည် အတိုင်းမသိ ကြီးမား၏။"},{"no":36,"pali":"Sakuṇajātaka","mm":"သကုဏဇာတ်","summary":"ငှက်တို့ နေထိုင်ရာ သစ်ပင်ကြီး၏ အကိုင်းချင်း ပွတ်တိုက်ရာမှ မီးခိုးထွက်လာသည်ကို ဘုရားလောင်း ငှက်ပညာရှိ မြင်၍ ဘေးလွတ်ရာသို့ ပြောင်းရွှေ့ကြရန် သတိပေးရာ နာယူသောငှက်တို့ လွတ်မြောက်၍ ပေါ့ဆသောငှက်တို့မူ မီးလောင်၍ သေဆုံးကြလေသည်။","moral":"ပညာရှိ၏ သတိပေးစကားကို နာယူသူသည် ဘေးမှ လွတ်၏။"},{"no":37,"pali":"Tittirajātaka","mm":"တိတ္တိရဇာတ်","summary":"ခါငှက်၊ မျောက်၊ ဆင်တို့သည် ပညောင်ပင်ကြီးကို အမှတ်ပြု၍ မည်သူ အသက်အကြီးဆုံးဖြစ်သည်ကို စိစစ်ကြရာ ဘုရားလောင်း ခါငှက် အသက်အကြီးဆုံး ဖြစ်ကြောင်း သိကြသဖြင့် ငယ်သူနှစ်ဦးက ရိုသေစွာ ဆည်းကပ်၍ အတူ ချစ်ခင်စွာ နေထိုင်ကြလေသည်။","moral":"အသက်အရွယ်နှင့် ဂုဏ်ကြီးသူတို့ကို ရိုသေခြင်းသည် မင်္ဂလာဖြစ်၏။"},{"no":38,"pali":"Bakajātaka","mm":"ဗကဇာတ်","summary":"ဗျိုင်းသည် ငါးတို့ကို ရေကောင်းသောကန်သို့ ပို့ဆောင်ပေးမည်ဟု လှည့်ဖြား၍ တစ်ကောင်ပြီးတစ်ကောင် စားပစ်ရာ နောက်ဆုံး၌ ဂဏန်းကို ချီဆောင်စဉ် ဂဏန်းက လည်ပင်းကို ညှပ်ဖြတ်သဖြင့် သေရလေသည်။ ဘုရားလောင်း သစ်ပင်စောင့်နတ်က ထိုအဖြစ်ကို မြင်၍ လှည့်ဖြားသူ၏ အကျိုးပေးကို တရားစကား ဆိုလေသည်။","moral":"သူတစ်ပါးကို လှည့်ဖြားသူသည် နောက်ဆုံး၌ မိမိကိုယ်တိုင် ပျက်စီးရ၏။"},{"no":39,"pali":"Nandajātaka","mm":"နန္ဒဇာတ်","summary":"ကျွန်နန္ဒသည် သခင်ဟောင်း မြှုပ်နှံထားသော ရွှေအိုးတည်ရာကို တစ်ဦးတည်း သိသဖြင့် ထိုနေရာ၌ ရပ်မိတိုင်း သခင့်သားကို မာန်တက်၍ ဆဲရေးတတ်ရာ ဘုရားလောင်း ပညာရှိက နန္ဒ ဆဲရေးရာအရပ်၌ပင် တူးဖော်ကြည့်စေသဖြင့် ရွှေအိုးကို ရရှိလေသည်။","moral":"ယုတ်မာသူသည် အခွင့်ရသောအခါ မာန်တက်၍ မိမိကိုယ်ကို ဖော်ပြတတ်၏။"},{"no":40,"pali":"Khadiraṅgārajātaka","mm":"ခဒိရင်္ဂါရဇာတ်","summary":"ဘုရားလောင်း သူဌေးကြီးသည် ပစ္စေကဗုဒ္ဓါအား ဆွမ်းလှူမည်ပြုစဉ် မာရ်နတ်က ရှားမီးကျီးတွင်းကြီးကို ဖန်ဆင်း၍ တားဆီးသော်လည်း အသက်ကိုပင် စွန့်လျက် လှမ်းသွားရာ ကြာပွင့်ကြီး ပေါ်ထွက်လာ၍ ဘေးမသီဘဲ ဆွမ်းလှူနိုင်လေသည်။","moral":"ဒါနစေတနာ မြဲမြံသူကို မည်သည့်အန္တရာယ်ကမျှ မတားဆီးနိုင်။"},{"no":41,"pali":"Losakajātaka","mm":"လောသကဇာတ်","summary":"ရှေးဘဝက ရဟန္တာအား မနာလိုစိတ်ဖြင့် ဆွမ်းကို ဖျက်ဆီးခဲ့သော ရဟန်းသည် ဘဝများစွာ ဆင်းရဲပြီးနောက် မိတ္တဝိန္ဒက အဖြစ် ဖြစ်ရပြန်ရာ လောဘကြီး၍ ဆရာ့စကားကို မနာယူသဖြင့် နောက်ဆုံး၌ ဓားစက်ထမ်းရသော ဘေးကြီးသို့ ရောက်ရလေသည်။ ဘုရားလောင်းသည် သူ၏ဆရာ ဒိသာပါမောက္ခ ဖြစ်သည်။","moral":"မနာလိုမှုနှင့် လောဘသည် ဘဝများစွာ ဆင်းရဲစေတတ်၏။"},{"no":42,"pali":"Kapotajātaka","mm":"ကပေါတဇာတ်","summary":"ထမင်းချက်သူ ကျွေးမွေးထားသော ခြင်းတောင်း၌နေသည့် ဘုရားလောင်း ချိုးငှက်ထံ ကျီးကန်းသည် ငါးဟင်းကို တပ်မက်သဖြင့် မိတ်ဆွေယောင်ဆောင်၍ လာနေပြီး ချိုး၏ သတိပေးစကားကို နားမထောင်ဘဲ ခိုးစားရာ ထမင်းချက်၏ အပြစ်ပေးခြင်းကို ခံရ၍ သေဆုံးရလေသည်။","moral":"လောဘကြီး၍ မိတ်ဆွေ၏ စကားကို နားမထောင်သူသည် ပျက်စီးရ၏။"},{"no":43,"pali":"Veḷukajātaka","mm":"ဝေဠုကဇာတ်","summary":"ရသေ့တစ်ပါးသည် ဆရာဖြစ်သော ဘုရားလောင်း၏ တားမြစ်စကားကို နားမထောင်ဘဲ မြွေဆိုးငယ်ကို ဝေဠုကဟု အမည်ပေး၍ သားသဖွယ် မွေးမြူထားရာ တစ်နေ့သ၌ ထိုမြွေ၏ အကိုက်ခံရ၍ သေဆုံးရလေသည်။","moral":"ဆိုဆုံးမ၍ မရသော ခေါင်းမာမှုသည် သေဘေးကို ဆောင်တတ်၏။"},{"no":44,"pali":"Makasajātaka","mm":"မကသဇာတ်","summary":"မိုက်မဲသောသားသည် ဖခင်၏ ဦးခေါင်းပေါ်နားသော ခြင်ကို ပုဆိန်ဖြင့် ခုတ်သတ်ရာ ခြင်နှင့်အတူ ဖခင်ပါ သေဆုံးရလေသည်။ ဘုရားလောင်း ကုန်သည်ပညာရှိက ပညာမဲ့သော မိတ်ဆွေထက် ပညာရှိသော ရန်သူက သာ၍ကောင်းကြောင်း ဆိုလေသည်။","moral":"မိုက်မဲသော မိတ်ဆွေသည် ရန်သူထက်ပင် အန္တရာယ်ကြီး၏။"},{"no":45,"pali":"Rohiṇijātaka","mm":"ရောဟိဏိဇာတ်","summary":"ကျွန်မ ရောဟိဏီသည် အိပ်နေသော မိခင်၏ ကိုယ်ပေါ်နားသော ယင်ကို ဆန်ထောင်းကျည်ပွေ့ဖြင့် ရိုက်သတ်ရာ မိခင်ပါ သေဆုံးရလေသည်။ ဘုရားလောင်း သူဌေးကြီးက ပညာမဲ့သော ဆွေမျိုးထက် ပညာရှိသော ရန်သူက မြတ်ကြောင်း ဆိုလေသည်။","moral":"ပညာမဲ့သူ၏ အကူအညီသည် အကျိုးထက် ဘေးကို ဆောင်တတ်၏။"},{"no":46,"pali":"Ārāmadūsakajātaka","mm":"အာရာမဒူသကဇာတ်","summary":"ပွဲသဘင်သွားသော ဥယျာဉ်မှူးက မျောက်တို့အား ပျိုးပင်များ ရေလောင်းရန် အပ်နှံခဲ့ရာ မျောက်ကြီးက အမြစ်အရှည်အတိုအလိုက် ရေလောင်းရမည်ဟုဆိုကာ ပျိုးပင်တို့ကို နုတ်၍ ကြည့်စေသဖြင့် ဥယျာဉ်တစ်ခုလုံး ပျက်စီးလေသည်။ ဘုရားလောင်း ပညာရှိက ထိုအဖြစ်ကိုမြင်၍ တရားစကား ဆိုလေသည်။","moral":"အသိပညာ မပါသော စေတနာနှင့် လုံ့လသည် အကျိုးပျက်စေတတ်၏။"},{"no":47,"pali":"Vāruṇidūsakajātaka","mm":"ဝါရုဏိဒူသကဇာတ်","summary":"သေရည်ရောင်းသော သူဌေး၏ တပည့်သည် သေရည်ကို ပို၍ကောင်းစေလိုသဖြင့် ဆားခတ်လိုက်ရာ သေရည်တစ်အိုးလုံး ပျက်စီး၍ အရောင်းပျက်လေသည်။ ဘုရားလောင်း သူဌေးကြီးက မိုက်မဲသူ၏ ကောင်းစေလိုသော ပြုလုပ်မှုသည်ပင် ဖျက်ဆီးမှုသာ ဖြစ်ကြောင်း ဆိုလေသည်။","moral":"မသိနားမလည်ဘဲ ပြုပြင်ခြင်းသည် ဖျက်ဆီးခြင်းသာ ဖြစ်၏။"},{"no":48,"pali":"Vedabbajātaka","mm":"ဝေဒဗ္ဗဇာတ်","summary":"ဝေဒဗ္ဗမန္တန်တတ်သော ပုဏ္ဏားသည် တပည့်ဖြစ်သော ဘုရားလောင်း၏ တားမြစ်ချက်ကို နားမထောင်ဘဲ ဓားပြတို့ လက်တွင်း၌ အချိန်အခါမဲ့ မန္တန်ရွတ်၍ ရတနာမိုး ရွာစေရာ မိမိလည်း အသတ်ခံရပြီး ဓားပြတို့လည်း ရတနာကြောင့် အချင်းချင်း သတ်ဖြတ်ကြကုန်၍ အားလုံး ပျက်စီးကြလေသည်။","moral":"အချိန်အခါမဲ့ လောဘအလို့ငှာ ပြုသောအမှုသည် ပျက်စီးခြင်းကို ဆောင်၏။"},{"no":49,"pali":"Nakkhattajātaka","mm":"နက္ခတ္တဇာတ်","summary":"သတို့သမီး ဆောင်ယူရန်နေ့ကို မေးမြန်းရာ စိတ်ကောက်နေသော ရသေ့က နက္ခတ်မကောင်းဟု ဆိုသဖြင့် ချိန်းဆိုထားသည့်နေ့၌ မသွားဘဲနေရာ သတို့သမီးကို အခြားသူအား ပေးစားလိုက်ကြလေသည်။ ဘုရားလောင်း ပညာရှိက အကျိုးစီးပွားသည်ပင် နက္ခတ်ဖြစ်၍ ကြယ်တာရာတို့သည် အဘယ်ကိုမျှ မပြုနိုင်ကြောင်း ဆိုလေသည်။","moral":"နက္ခတ်ကို မျှော်၍ အခွင့်ကောင်းကို လက်လွတ်မခံအပ်။"},{"no":50,"pali":"Dummedhajātaka","mm":"ဒုမ္မေဓဇာတ်","summary":"ဘုရားလောင်း မင်းသားသည် မကောင်းမှုပြုသူ တစ်ထောင်ကို နတ်ပူဇော်ရန် ကတိထားသည်ဟု ကြေညာထားရာ ထီးနန်းရသောအခါ ထိုကတိကို ကြားသိကြသော ပြည်သူတို့ မကောင်းမှုကို မပြုဝံ့ကြသဖြင့် လူတစ်ဦးကိုမျှ မသတ်ရဘဲ တိုင်းပြည်၌ မကောင်းမှု ကင်းစင်သွားလေသည်။","moral":"ပညာရှိသည် အကြမ်းမဖက်ဘဲ ပရိယာယ်ဖြင့် မကောင်းမှုကို ငြိမ်းစေနိုင်၏။"},{"no":51,"pali":"Mahāsīlavajātaka","mm":"မဟာသီလဝဇာတ်","summary":"ဘုရားလောင်းသည် ဗာရာဏသီပြည့်ရှင် မဟာသီလဝမင်းဖြစ်၍ သီလနှင့်မေတ္တာကို အလေးထားသဖြင့် စစ်မတိုက်ဘဲ ကောသလမင်း၏ သိမ်းပိုက်ခြင်းကို ခံခဲ့ရသည်။ သင်္ချိုင်း၌ မြှုပ်နှံခံရသော်လည်း ဇွဲမလျှော့ဘဲ လွတ်မြောက်ကာ နန်းပြန်ရ၍ ရန်သူမင်းကိုပင် မေတ္တာနှင့် သည်းခံခြင်းဖြင့် အနိုင်ယူလေသည်။","moral":"လုံ့လဝီရိယ မလျှော့ဘဲ ကြိုးစားလျှင် အောင်မြင်ခြင်းသို့ ရောက်၏။"},{"no":52,"pali":"Cūḷajanakajātaka","mm":"စူဠဇနကဇာတ်","summary":"ဘုရားလောင်း ဇနကမင်းသားသည် ပင်လယ်ခရီးတွင် သင်္ဘောပျက်သော်လည်း စိတ်မလျှော့ဘဲ အားထုတ်ကူးခတ်သဖြင့် အသက်ချမ်းသာရာရပြီး နောက်ဆုံးတွင် မင်းအဖြစ်သို့ ရောက်လေသည်။","moral":"ပညာရှိသည် မျှော်လင့်ချက်မပြတ် အားထုတ်မြဲ အားထုတ်ရာ၏။"},{"no":53,"pali":"Puṇṇapātijātaka","mm":"ပုဏ္ဏပါတိဇာတ်","summary":"ဗာရာဏသီမြို့ရှိ လူဆိုးတို့သည် ဘုရားလောင်းသူဌေးကို မူးယစ်ဆေးခတ်ထားသော အရက်တိုက်၍ လုယက်ရန် ကြံစည်ကြသည်။ သူဌေးသည် အရက်အိုးများ ပြည့်လျက်ရှိနေပြီး သူတို့ကိုယ်တိုင် မသောက်ကြသည်ကို သတိပြုမိ၍ လှည့်စားမှုကို ဖော်ထုတ်လိုက်သည်။","moral":"သတိပညာရှိသူကို လှည့်ဖြားခြင်းငှာ မတတ်နိုင်။"},{"no":54,"pali":"Kiṁphalajātaka","mm":"ကိံဖလဇာတ်","summary":"ကုန်သည်ကြီး ဘုရားလောင်းသည် ခရီးလမ်း၌ ရွာနီးပါးရှိ သရက်သီးနှင့်တူသော အသီးများကို ကုန်သားတို့ မစားမိစေရန် တားမြစ်သည်။ ရွာနှင့်နီးလျက် အသီးမခူးဘဲ ကျန်နေသောအပင်သည် အဆိပ်ပင်ဖြစ်ရမည်ဟု ဆင်ခြင်ဉာဏ်ဖြင့် သိသဖြင့် လူများ၏အသက်ကို ကယ်တင်နိုင်ခဲ့သည်။","moral":"ဆင်ခြင်တုံတရားဖြင့် စူးစမ်းသုံးသပ်တတ်လျှင် ဘေးမှ လွတ်၏။"},{"no":55,"pali":"Pañcāvudhajātaka","mm":"ပဉ္စာဝုဓဇာတ်","summary":"ဘုရားလောင်း ပဉ္စာဝုဓမင်းသားသည် တောလမ်း၌ အမွေးစေးကပ်သော သိလေသလောမဘီလူးနှင့် တွေ့ဆုံ၍ လက်နက်ငါးပါးလုံး ကပ်ငြိကုန်သော်လည်း ကြောက်ရွံ့ခြင်းမရှိဘဲ ရဲရင့်စွာ ရင်ဆိုင်သည်။ ထိုရဲရင့်မှုကြောင့် ဘီလူးက လွှတ်ပေးကာ ဆုံးမခြင်းကိုခံယူ၍ ကောင်းရာသို့ တည်လေသည်။","moral":"ကြောက်ရွံ့ခြင်းကင်းသော ရဲရင့်မှုသည် အန္တရာယ်ကို အောင်နိုင်၏။"},{"no":56,"pali":"Kañcanakkhandhajātaka","mm":"ကဉ္စနက္ခန္ဓဇာတ်","summary":"လယ်သမား ဘုရားလောင်းသည် လယ်ထဲတွင် ရွှေတုံးကြီးတစ်ခုကို တွေ့သော်လည်း တစ်ခုလုံးကို မသယ်နိုင်သဖြင့် လေးပိုင်းပိုင်း၍ တစ်ပိုင်းစီ သယ်ဆောင်သွားနိုင်ခဲ့သည်။","moral":"ကြီးလေးသောကိစ္စကို အပိုင်းပိုင်းခွဲ၍ ဆောင်ရွက်လျှင် ပြီးမြောက်နိုင်၏။"},{"no":57,"pali":"Vānarindajātaka","mm":"ဝါနရိန္ဒဇာတ်","summary":"မျောက်မင်း ဘုရားလောင်းသည် မြစ်လယ်ကျောက်ဆောင်ပေါ်၌ ချောင်းမြောင်းနေသော မိချောင်းကြောင့် ကျောက်ဆောင် မြင့်တက်နေသည်ကို သတိပြုမိသည်။ ကျောက်ဆောင်ကို နှုတ်ဆက်ခေါ်ဝေါ်ရာ မိချောင်းက ပြန်ထူးမိသဖြင့် ပရိယာယ်ဖြင့် လှည့်ကာ ဘေးမှ လွတ်မြောက်သွားလေသည်။","moral":"အသင့်ရှိသော ဉာဏ်ပညာသည် အသက်ကို ကယ်၏။"},{"no":58,"pali":"Tayodhammajātaka","mm":"တယောဓမ္မဇာတ်","summary":"မျောက်မင်းသား ဘုရားလောင်းသည် သားတို့ကို ရန်သူဟု သဘောထားသော ဖခင်မျောက်မင်း၏ ဘေးမှ လွတ်မြောက်ပြီးနောက် ရေကန်စောင့်ဘီလူးကို ဉာဏ်ပညာဖြင့် အောင်နိုင်ကာ မျောက်အုပ်ကို ဘေးကင်းစွာ အုပ်ချုပ်လေသည်။","moral":"လိမ္မာမှု၊ ရဲရင့်မှု၊ ဉာဏ်ပညာဟူသော တရားသုံးပါးနှင့် ပြည့်စုံသူသည် ရန်ကို လွန်မြောက်နိုင်၏။"},{"no":59,"pali":"Bherivādakajātaka","mm":"ဘေရိဝါဒကဇာတ်","summary":"စည်တီးဆရာ ဘုရားလောင်းသည် ပွဲမှအပြန် ဓားပြတောကို ဖြတ်စဉ် စည်ကို အလွန်အကျွံ မတီးရန် သားကို သတိပေးသည်။ သားက နားမထောင်ဘဲ မရပ်မနား တီးမိသဖြင့် ရိုးရိုးစည်တီးသမားများသာဖြစ်ကြောင်း ဓားပြတို့ သိသွားကာ ရသမျှဥစ္စာ လုယက်ခြင်း ခံကြရလေသည်။","moral":"အလွန်အကျွံ ပြုမူခြင်းသည် ပျက်စီးခြင်း၏ အကြောင်းဖြစ်၏။"},{"no":60,"pali":"Saṅkhadhamajātaka","mm":"သင်္ခဓမဇာတ်","summary":"ခရုသင်းမှုတ်သမား သားအဖတို့သည် ပွဲမှအပြန် ဓားပြတော၌ ခရုသင်းကို အဆက်မပြတ် မှုတ်မိသဖြင့် ဓားပြတို့ အမှန်ကို သိသွား၍ ဥစ္စာများ လုယက်ခြင်း ခံကြရသည်။ အလွန်အကျွံ ပြုမူခြင်း၏ အပြစ်ကို ပြသော ဇာတ်ဖြစ်သည်။","moral":"အတိုင်းအရှည်ကို သိ၍ ပြုမူသူသာ ဘေးမှ လွတ်၏။"},{"no":61,"pali":"Asātamantajātaka","mm":"အသာတမန္တဇာတ်","summary":"တက္ကသိုလ်ဆရာကြီး ဘုရားလောင်းသည် တပည့်အား ကာမဂုဏ်၏အပြစ်ကို ပြသရန် မိမိ၏ အသက်ကြီးရင့်သော မိခင်အိုကို ပြုစုစေသည်။ မိခင်အိုသည်ပင် ရာဂစိတ်ကြောင့် သားအရင်းကို သတ်ရန်တိုင်အောင် ကြံစည်လာသည်ကို တွေ့မြင်စေ၍ ကာမ၏ ဆိုးကျိုးကို သင်ကြားပေးလေသည်။","moral":"ရာဂတဏှာသည် ဆွေမျိုးမေတ္တာကိုပင် ဖျက်ဆီးတတ်၏။"},{"no":62,"pali":"Aṇḍabhūtajātaka","mm":"အဏ္ဍဘူတဇာတ်","summary":"ရှင်ဘုရင် ဘုရားလောင်းသည် အန်စာတုံးကစားရာတွင် ဂါထာတစ်ပုဒ်ကြောင့် အမြဲအနိုင်ရနေသဖြင့် ပုရောဟိတ်သည် ထိုဂါထာကို ချေဖျက်ရန် မိန်းကလေးတစ်ဦးကို မွေးစကတည်းက အခြားယောက်ျား မမြင်စေဘဲ စောင့်ကြပ်ကြီးပြင်းစေသည်။ သို့သော် ထိုမိန်းမသည်ပင် ချစ်သူနှင့် လျှို့ဝှက်ပေါင်းသင်း၍ ပုရောဟိတ်ကို လှည့်စားနိုင်ခဲ့လေသည်။","moral":"အပြင်မှ စောင့်ကြပ်ရုံမျှဖြင့် တဏှာကို မတားနိုင်၊ မိမိစိတ်ကိုသာ ထိန်းသိမ်းအပ်၏။"},{"no":63,"pali":"Takkapaṇḍitajātaka","mm":"တက္ကပဏ္ဍိတဇာတ်","summary":"ရသေ့ ဘုရားလောင်းသည် မြစ်ရေစီး၌ မျောပါလာသော မင်းသမီးကို ကယ်တင်ခဲ့ရာ သူမ၏ ဖြားယောင်းမှုကြောင့် ရသေ့ဘဝမှ ဆုတ်ယုတ်ခဲ့ရသည်။ နောင်တွင် ထိုမိန်းမသည် ဓားပြဗိုလ်နှင့်ပေါင်း၍ ကျေးဇူးရှင်ကိုပင် သစ္စာဖောက်သောကြောင့် ဘုရားလောင်းသည် ကာမ၏အပြစ်ကို ထင်ရှားစွာမြင်ကာ တောသို့ပြန်ဝင်၍ ရသေ့ပြုလေသည်။","moral":"ကျေးဇူးမသိတတ်သူနှင့် ပေါင်းဖော်ခြင်းသည် ဆင်းရဲခြင်း၏ အကြောင်းဖြစ်၏။"},{"no":64,"pali":"Durājānajātaka","mm":"ဒုရာဇာနဇာတ်","summary":"တက္ကသိုလ်ဆရာကြီး ဘုရားလောင်းသည် ဇနီး၏ ဖောက်ပြန်တတ်သော စိတ်နေစိတ်ထားကြောင့် စိတ်ဆင်းရဲနေသော တပည့်အား မိန်းမတို့၏ စိတ်သဘောကို သိနိုင်ခဲကြောင်း ဟော၍ ချစ်သည်ဝမ်းသာ မုန်းသည်ဝမ်းနည်း မဖြစ်ဘဲ ဥပေက္ခာထားရန် ဆုံးမလေသည်။","moral":"သိနိုင်ခဲသောအရာ၌ စိတ်မချောက်ချားဘဲ ဥပေက္ခာထားအပ်၏။"},{"no":65,"pali":"Anabhiratijātaka","mm":"အနဘိရတိဇာတ်","summary":"ဇနီး၏ အကျင့်ဖောက်ပြန်မှုကြောင့် စိတ်ညစ်၍ ပညာမသင်နိုင်ဖြစ်နေသော တပည့်အား ဆရာကြီး ဘုရားလောင်းက မြစ်၊ လမ်းမ ကဲ့သို့ အများနှင့်ဆိုင်သော သဘောရှိကြောင်း ပြဆို၍ အမျက်မထွက် စိတ်မပူဘဲ နေတတ်ရန် ဆုံးမလေသည်။","moral":"ပြောင်းလဲ၍မရသော သဘာဝကြောင့် စိတ်ဆင်းရဲခြင်း မဖြစ်စေအပ်။"},{"no":66,"pali":"Mudulakkhaṇajātaka","mm":"မုဒုလက္ခဏဇာတ်","summary":"ဈာန်ရ ရသေ့ ဘုရားလောင်းသည် မုဒုလက္ခဏာမိဖုရားကို မြင်၍ ရာဂစိတ်ဝင်ကာ ဈာန်ပျက်လေသည်။ မင်းကြီးက မိဖုရားကို ပေးအပ်လိုက်ရာ မိဖုရား၏ ခိုင်းစေမှုများကြောင့် ဆင်းရဲပင်ပန်းရသည်ကို တွေ့သောအခါ ကာမ၏အပြစ်ကို ဆင်ခြင်မိ၍ မိဖုရားကို ပြန်အပ်ကာ ဈာန်ကို ပြန်လည်ရရှိလေသည်။","moral":"ကာမတဏှာကို စွန့်လွှတ်မှသာ စိတ်၏ ငြိမ်းချမ်းမှုကို ပြန်ရ၏။"},{"no":67,"pali":"Ucchaṅgajātaka","mm":"ဥစ္ဆင်္ဂဇာတ်","summary":"လင်၊ သား၊ မောင် သုံးဦးလုံး အဖမ်းခံရသော အမျိုးသမီးအား မင်းကြီးက တစ်ဦးတည်းသာ လွှတ်ပေးမည်ဟု ဆိုရာ လင်နှင့်သားကို နောက်ထပ်ရနိုင်သေးသော်လည်း မိဘမရှိတော့သဖြင့် မောင်ကို နောက်ထပ်မရနိုင်ဟု ဖြေဆိုသည်။ မင်းကြီး နှစ်သက်၍ သုံးဦးလုံးကို လွှတ်ပေးလိုက်သည်။ ဘုရားလောင်းသည် ထိုမင်းကြီးဖြစ်သည်။","moral":"ဉာဏ်ပညာနှင့်ယှဉ်သော စကားသည် ဘေးမှ ကယ်တင်နိုင်၏။"},{"no":68,"pali":"Sāketajātaka","mm":"သာကေတဇာတ်","summary":"သာကေတမြို့တွင် ပုဏ္ဏားအိုနှစ်ဦးသည် မြတ်စွာဘုရားကို မိမိတို့၏ သားအရင်းကဲ့သို့ ချစ်ခင်ကြည်ညိုကြသည်။ ရှေးဘဝပေါင်းများစွာက မိဘအရင်းများ ဖြစ်ခဲ့ဖူးသောကြောင့် ဤသို့ ချစ်ခင်မှုဖြစ်ပေါ်ကြောင်း မြတ်စွာဘုရား ဟောကြားတော်မူသည်။","moral":"ချစ်ခြင်းမေတ္တာသည် ရှေးက ပေါင်းသင်းဆက်ဆံဖူးခြင်းကြောင့် ဖြစ်ပေါ်၏။"},{"no":69,"pali":"Visavantajātaka","mm":"ဝိသဝန္တဇာတ်","summary":"ဆေးဆရာ ဘုရားလောင်းသည် မြွေကိုက်ခံရသူကို ကုသရာတွင် မြွေကို မိမိထုတ်ပြီးသော အဆိပ်ကို ပြန်စုပ်စေရန် ခိုင်းသော်လည်း မြွေက တစ်ကြိမ်ထွေးအန်ပြီးသော အဆိပ်ကို သေရသော်မှ ပြန်မယူဟု ခိုင်မာစွာ ငြင်းဆန်လေသည်။","moral":"တစ်ကြိမ်စွန့်လွှတ်ပြီးသောအရာကို ပြန်မယူသော ခိုင်မြဲသည့် အဓိဋ္ဌာန်ရှိအပ်၏။"},{"no":70,"pali":"Kuddālajātaka","mm":"ကုဒ္ဒါလဇာတ်","summary":"ကုဒ္ဒါလပဏ္ဍိတ ဘုရားလောင်းသည် တောထွက်ရန် ခြောက်ကြိမ်တိုင် ကြိုးစားသော်လည်း ပေါက်တူးတစ်လက်နှင့် ဟင်းသီးဟင်းရွက်ခင်းကို မစွန့်နိုင်၍ ပြန်ပြန်လာခဲ့သည်။ နောက်ဆုံးတွင် ပေါက်တူးကို မြစ်ထဲပစ်ချလိုက်ပြီး ငါအနိုင်ရပြီဟု ကြွေးကြော်ကာ တဏှာကို အောင်မြင်၍ ရသေ့ရဟန်း ပြုလေသည်။","moral":"မိမိစိတ်၏ တဏှာကို အောင်နိုင်ခြင်းသည်သာ စစ်မှန်သော အောင်ပွဲဖြစ်၏။"},{"no":71,"pali":"Varuṇajātaka","mm":"ဝရုဏဇာတ်","summary":"တက္ကသိုလ်ဆရာကြီး ဘုရားလောင်း၏ တပည့်တစ်ဦးသည် ထင်းခွေရမည့်အချိန်တွင် အိပ်ပျော်နေပြီး နောက်ဆုံးမှ စိမ်းစိုနေသေးသော ဝရုဏပင် ကိုင်းများကို ချိုးယူလာသဖြင့် နောက်တစ်နေ့ ခရီးအစီအစဉ်နှင့် ကိစ္စများ ပျက်ပြားကုန်လေသည်။","moral":"အချိန်မှန် မဆောင်ရွက်ဘဲ ပျင်းရိလျှင် ကိစ္စတို့ ပျက်ပြား၏။"},{"no":72,"pali":"Sīlavahatthijātaka","mm":"သီလဝဟတ္ထိဇာတ်","summary":"ဘုရားလောင်းသည် သီလရှိသော ဆင်မင်းဖြစ်၍ တောတွင်း လမ်းပျောက်နေသော ယောက်ျားတစ်ဦးကို ကယ်ဆယ်ပို့ဆောင်ပေးသည်။ ထိုသူသည် ကျေးဇူးကန်း၍ ဆင်မင်း၏ အစွယ်ကို အကြိမ်ကြိမ် လာရောက်ဖြတ်ယူရာ နောက်ဆုံးအကြိမ်တွင် မြေကြီးကွဲအက်၍ ထိုကျေးဇူးကန်းသူကို မျိုချလိုက်လေသည်။","moral":"ကျေးဇူးကန်းခြင်းသည် မိမိကိုယ်ကို ဖျက်ဆီးရာ ရောက်၏။"},{"no":73,"pali":"Saccaṁkirajātaka","mm":"သစ္စံကိရဇာတ်","summary":"ရသေ့ ဘုရားလောင်းသည် ရေကြီး၍ မျောပါလာသော မင်းသား၊ မြွေ၊ ကြွက်၊ ကျေးငှက်တို့ကို ကယ်တင်ခဲ့သည်။ တိရစ္ဆာန်တို့က ကျေးဇူးဆပ်ကြသော်လည်း မင်းသားမူ မင်းဖြစ်သောအခါ ကျေးဇူးရှင်ရသေ့ကို ရိုက်နှက်စေသဖြင့် ပြည်သူတို့ ဒေါသထွက်ကာ ထိုမင်းကို ပယ်ရှား၍ ရသေ့ကို မင်းအဖြစ် တင်မြှောက်ကြလေသည်။","moral":"ကျေးဇူးသိခြင်းသည် သူတော်ကောင်းတရားဖြစ်၍ ကျေးဇူးကန်းခြင်းသည် ပျက်စီးကြောင်းတရားဖြစ်၏။"},{"no":74,"pali":"Rukkhadhammajātaka","mm":"ရုက္ခဓမ္မဇာတ်","summary":"သစ်ပင်စောင့်နတ်မင်း ဘုရားလောင်းသည် ဆွေမျိုးနတ်တို့အား တောအုပ်ထဲ၌ စုပေါင်းနေထိုင်ရန် အကြံပေးသည်။ စကားနားမထောင်ဘဲ လွင်ပြင်၌ တစ်ပင်တည်း တည်နေသော သစ်ပင်ကြီးများသည် လေမုန်တိုင်း ကျရောက်သောအခါ ပြိုလဲကုန်ပြီး စုပေါင်းနေသော သစ်ပင်တို့မူ ဘေးမရှိကြချေ။","moral":"ညီညွတ်သော ဆွေမျိုးတို့သည် ရန်ဘေးကို ခံနိုင်ရည်ရှိ၏။"},{"no":75,"pali":"Macchajātaka","mm":"မစ္ဆဇာတ်","summary":"ဘုရားလောင်းသည် ငါးမင်းဖြစ်၍ မိုးခေါင်သဖြင့် ရေကန်ခန်းခြောက်ကာ ဆွေမျိုးငါးတို့ ကျီးကန်းတို့၏ ဘေးသို့ ရောက်သောအခါ တစ်ပါးသောငါးကို တစ်ခါမျှ မစားဖူးသည့် မိမိ၏သီလကို အမှီပြု၍ သစ္စာဆိုသည်။ ထိုသစ္စာကြောင့် မိုးကြီးရွာသွန်း၍ ဆွေမျိုးတို့ ဘေးမှ လွတ်ကြလေသည်။","moral":"သစ္စာနှင့် သီလ၏တန်ခိုးသည် ဘေးရန်ကို ပယ်ဖျောက်နိုင်၏။"},{"no":76,"pali":"Asaṁkiyajātaka","mm":"အသံကိယဇာတ်","summary":"ရသေ့ ဘုရားလောင်းသည် ကုန်သည်စုနှင့်အတူ ခရီးသွားစဉ် ညအခါ မအိပ်ဘဲ သတိတရားဖြင့် စင်္ကြံလျှောက်လျက် နေသည်။ ဓားပြတို့ လာရောက်ဝိုင်းရံသော်လည်း နိုးကြားစောင့်ကြပ်နေသည်ကို မြင်၍ မလုယက်ဝံ့ဘဲ ပြန်သွားကြသည်။ ရသေ့မှာ စိုးရိမ်ကြောင့်ကြမှု လုံးဝမရှိချေ။","moral":"သီလနှင့် သတိရှိသူသည် ကြောက်ရွံ့စိုးရိမ်ခြင်း ကင်း၏။"},{"no":77,"pali":"Mahāsupinajātaka","mm":"မဟာသုပိနဇာတ်","summary":"မင်းကြီးသည် ထူးဆန်းသော အိပ်မက်ကြီး ဆယ့်ခြောက်ချက်ကို မြင်မက်၍ ကြောက်ရွံ့နေရာ ပုဏ္ဏားတို့က ယဇ်ပူဇော်ရန် တိုက်တွန်းကြသည်။ ရသေ့ ဘုရားလောင်းက ထိုအိပ်မက်တို့သည် နောင်အခါ လောက၌ တရားပျက်ယွင်းမည့် နိမိတ်များသာဖြစ်၍ မင်းကြီးအတွက် ဘေးရန်မရှိကြောင်း ဖြေရှင်းပေးသဖြင့် ယဇ်ပူဇော်မှုကြီး ရပ်ဆိုင်း၍ သတ္တဝါများစွာ ချမ်းသာရာရလေသည်။","moral":"ပညာရှိ၏ မှန်ကန်သောအဖြေသည် အကြောက်တရားနှင့် အယူမှားကို ပယ်ဖျောက်၏။"},{"no":78,"pali":"Illisajātaka","mm":"ဣလ္လိသဇာတ်","summary":"စေးနှဲသော သူဌေးကြီး ဣလ္လိသ၏ ဖခင်သည် ရှေးက ပေးကမ်းလှူဒါန်းမှုကြောင့် သိကြားမင်းဖြစ်နေရာ သား၏စေးနှဲမှုကို မြင်၍ ဣလ္လိသ၏ အသွင်ကိုဆောင်ကာ သူ၏ဥစ္စာများကို လှူဒါန်းပစ်လေသည်။ နောက်ဆုံးတွင် မိမိကိုယ်ကို ထုတ်ဖော်ပြီး စေးနှဲခြင်း၏အပြစ်ကို ဆုံးမသဖြင့် ဣလ္လိသသည် ပေးကမ်းလှူဒါန်းသူ ဖြစ်လာလေသည်။","moral":"စေးနှဲခြင်းသည် ပျက်စီးကြောင်းဖြစ်၍ ပေးကမ်းလှူဒါန်းခြင်းသည် ချမ်းသာကြောင်းဖြစ်၏။"},{"no":79,"pali":"Kharassarajātaka","mm":"ခရဿရဇာတ်","summary":"မင်းအမတ်တစ်ဦးသည် အခွန်ကောက်ရန် စေလွှတ်ခြင်းခံရသော ရွာကိုပင် ဓားပြတို့နှင့် ကြံရာပါပြုလုပ်ကာ လုယက်စေခဲ့သည်။ ပညာရှိအမတ် ဘုရားလောင်းက ထိုသစ္စာဖောက်မှုကို သိမြင်၍ ထုတ်ဖော်ကဲ့ရဲ့လေသည်။","moral":"ယုံကြည်အပ်နှံခြင်းကို သစ္စာဖောက်သူသည် ဂုဏ်သိက္ခာ ပျက်ရ၏။"},{"no":80,"pali":"Bhīmasenajātaka","mm":"ဘီမသေနဇာတ်","summary":"ဉာဏ်ပညာနှင့် လေးအတတ်၌ ထူးချွန်သော်လည်း ကိုယ်လုံးသေးငယ်သော လေးသည်တော် ဘုရားလောင်းသည် ကိုယ်ကာယ ထွားကျိုင်းသော ရက်ကန်းသမား ဘီမသေနကို ရှေ့တန်းတင်ကာ အမှုထမ်းသည်။ ဘီမသေန ဂုဏ်မောက်လာသော်လည်း စစ်ပွဲရောက်သောအခါ ကြောက်ရွံ့တုန်လှုပ်နေသဖြင့် လေးသည်တော်ငယ်ကသာ စစ်ကို အောင်နိုင်ခဲ့လေသည်။","moral":"ဝါကြွားရုံမျှဖြင့် မပြီး၊ စွမ်းရည်အစစ်သာ ပဓာနဖြစ်၏။"},{"no":81,"pali":"Surāpānajātaka","mm":"သုရာပါနဇာတ်","summary":"ရသေ့ဆရာကြီး ဘုရားလောင်း မရှိခိုက် တပည့်ရသေ့တို့သည် ရွာတွင် သေအရက်သောက်မိကြရာ ကခုန်အော်ဟစ်ကာ အရှက်တကွဲ ဖြစ်ကြကုန်၏။ ဆရာပြန်ရောက်သောအခါ နောင်တရ၍ သေအရက်ကို ရှောင်ကြဉ်ရန် ဆုံးမလေသည်။","moral":"သေအရက်သည် သတိပညာကို ဖျက်ဆီး၍ အရှက်ကို ပျက်စေ၏။"},{"no":82,"pali":"Mittavindakajātaka","mm":"မိတ္တဝိန္ဒကဇာတ်","summary":"မိတ္တဝိန္ဒကသည် မိခင်၏စကားကို နားမထောင်ဘဲ ပင်လယ်ကူးထွက်ရာ သင်္ဘောရပ်တန့်၍ ပင်လယ်ထဲ ပစ်ချခံရသည်။ နတ်သမီးဗိမာန်များ၌ တစ်ဆင့်ထက်တစ်ဆင့် သာယာမှုကို လောဘဖြင့် လိုက်ရှာရင်း နောက်ဆုံးတွင် ဦးခေါင်းပေါ်၌ သံစက်လည်နေသော ငရဲသို့ ရောက်ရလေသည်။","moral":"မရောင့်ရဲနိုင်သော လောဘသည် ပျက်စီးရာသို့ ပို့ဆောင်၏။"},{"no":83,"pali":"Kāḷakaṇṇijātaka","mm":"ကာဠကဏ္ဏိဇာတ်","summary":"သူဌေးကြီး ဘုရားလောင်းသည် ကာဠကဏ္ဏီ (အမင်္ဂလာ) ဟု အမည်ရသော ငယ်သူငယ်ချင်းကို အမည်ဆိုးကြောင့် စွန့်ပစ်ရန် တိုက်တွန်းခြင်းကို လက်မခံဘဲ ဆက်လက်ပေါင်းဖော်သည်။ ထိုမိတ်ဆွေသည် သူဌေးအိမ်ကို စောင့်ကြပ်နေခိုက် ဓားပြတို့ လာရောက်တိုက်ခိုက်ရာ ဉာဏ်ပညာဖြင့် နှင်ထုတ်နိုင်ခဲ့လေသည်။","moral":"အမည်ကို မကြည့်ဘဲ ကိုယ်ကျင့်သီလကိုသာ ကြည့်၍ မိတ်ဆွေဖွဲ့အပ်၏။"},{"no":84,"pali":"Atthassadvārajātaka","mm":"အတ္ထဿဒွါရဇာတ်","summary":"သူဌေးကြီး ဘုရားလောင်း၏ ခုနစ်နှစ်အရွယ် ပညာရှိသားငယ်က အကျိုးစီးပွား၏ တံခါးပေါက်တို့ကို မေးမြန်းရာ ဖခင်က ကျန်းမာခြင်း၊ သီလရှိခြင်း၊ သူတော်ကောင်းတို့၏ စကားကို နာယူခြင်း၊ အကြားအမြင်များခြင်း၊ တရားနှင့်အညီ ကျင့်ခြင်း စသော အကျိုးစီးပွား၏ တံခါးပေါက်ခြောက်ပါးကို သင်ကြားပေးလေသည်။","moral":"သီလ၊ ပညာ၊ လုံ့လတို့သည် စီးပွားချမ်းသာ၏ အခြေခံဖြစ်၏။"},{"no":85,"pali":"Kiṁpakkajātaka","mm":"ကိံပက္ကဇာတ်","summary":"ကုန်သည်ကြီး ဘုရားလောင်းသည် ခရီးသွားကုန်သားတို့အား သရက်သီးနှင့်တူသော ကိံပက္ကအသီးများကို မစားရန် တားမြစ်သည်။ တားမြစ်ချက်ကို နားမထောင်ဘဲ စားမိသူတို့သည် အဆိပ်သင့်၍ သေကြရလေသည်။","moral":"ကာမဂုဏ်တို့သည် ကိံပက္ကသီးကဲ့သို့ အပ၌ချိုမြိန်၍ အတွင်း၌ အဆိပ်ဖြစ်၏။"},{"no":86,"pali":"Sīlavīmaṁsakajātaka","mm":"သီလဝီမံသကဇာတ်","summary":"မင်း၏ပုဏ္ဏားပညာရှိ ဘုရားလောင်းသည် မိမိအား ရှိသေခြင်းသည် အမျိုးဇာတ်ကြောင့်လော သီလကြောင့်လော စမ်းသပ်လိုသဖြင့် ဘဏ္ဍာစိုး၏ငွေကို သုံးရက်တိုင် ယူပြသည်။ ဖမ်းဆီးခံရသောအခါ သီလသာလျှင် ရှိသေခြင်း၏ အကြောင်းရင်းဖြစ်ကြောင်း သိမြင်၍ ရသေ့ရဟန်း ပြုလေသည်။","moral":"အမျိုးဇာတ်ထက် သီလသည်သာ မြတ်၏။"},{"no":87,"pali":"Maṅgalajātaka","mm":"မင်္ဂလဇာတ်","summary":"ကြွက်ကိုက်သောအဝတ်ကို အမင်္ဂလာဟု ယူဆတတ်သော ပုဏ္ဏား၏ အယူသီးမှုကို ရသေ့ ဘုရားလောင်းက အတိတ်နိမိတ်တို့၌ တန်ခိုးမရှိကြောင်း၊ ကံနှင့် ကိုယ်ကျင့်တရားသာ အဓိကဖြစ်ကြောင်း ဟောပြော၍ အယူမှားကို ပယ်ဖျောက်ပေးလေသည်။","moral":"အတိတ်နိမိတ်တို့၌ တန်ခိုးမရှိ၊ ကိုယ်ကျင့်တရားသာ ပဓာနဖြစ်၏။"},{"no":88,"pali":"Sārambhajātaka","mm":"သာရမ္ဘဇာတ်","summary":"ဘုရားလောင်းသည် သာရမ္ဘအမည်ရှိ နွားလားဥသဘဖြစ်၍ ကျေးဇူးရှင်ပုဏ္ဏားအတွက် လှည်းတစ်ရာကို ဆွဲပေးမည်ဟု အလောင်းအစား ဝင်စေသည်။ ပုဏ္ဏားက ကြမ်းတမ်းသောစကားဖြင့် ခိုင်းသောအခါ မဆွဲဘဲ ချိုသာသောစကားဖြင့် ခိုင်းသောအခါမှ ဆွဲပေး၍ အနိုင်ရစေလေသည်။","moral":"ချိုသာသောစကားသည် အကျိုးပြု၍ ကြမ်းတမ်းသောစကားသည် အကျိုးပျက်စေ၏။"},{"no":89,"pali":"Kuhakajātaka","mm":"ကုဟကဇာတ်","summary":"ဇဋိလရသေ့အယောင်ဆောင်သည် သူဌေး၏ယုံကြည်မှုကို ရယူ၍ အပ်နှံထားသော ရွှေများကို ခိုးယူပြီး မြက်တစ်ပင်မျှပင် မယူဟု ဟန်ဆောင်ပြသည်။ ပညာရှိကုန်သည် ဘုရားလောင်းက ထိုဟန်ဆောင်မှုကို သိမြင်ဖော်ထုတ်၍ ရွှေများကို ပြန်လည်ရယူပေးလေသည်။","moral":"သီလကြွား အယောင်ဆောင်သူတို့ကို သတိထားအပ်၏။"},{"no":90,"pali":"Akataññujātaka","mm":"အကတညုဇာတ်","summary":"ဗာရာဏသီသူဌေးကြီး ဘုရားလောင်း၏ ကျေးဇူးပြုခြင်းကို ခံရဖူးသော နယ်ခြားကုန်သည်သည် သူဌေး၏ကုန်သည်တို့ အကူအညီလိုသောအခါ မကူညီဘဲ ကျေးဇူးကန်းခဲ့သည်။ နောင်တွင် ထိုကျေးဇူးကန်းသူ၏ ကုန်စည်များ ဆုံးရှုံးပျက်စီး၍ ဒုက္ခရောက်ရလေသည်။","moral":"ကျေးဇူးကန်းသူသည် နောင်အခါ မိမိကိုယ်တိုင် ဒုက္ခရောက်ရ၏။"},{"no":91,"pali":"Littajātaka","mm":"လိတ္တဇာတ်","summary":"အန်စာတုံးကစားရာတွင် ရှုံးလျှင် အန်စာတုံးကို မျိုချ၍ လိမ်လည်တတ်သောသူကို ဆုံးမရန် ပညာရှိကစားသမား ဘုရားလောင်းသည် အန်စာတုံးကို အဆိပ်လိမ်းထားရာ ထိုသူ မျိုချမိ၍ ပြင်းထန်စွာ နာကျင်လေသည်။ ဘုရားလောင်းက ဆေးဖြင့် ပြန်လည်ကုသပေးပြီး မလိမ်လည်ရန် ဆုံးမလေသည်။","moral":"လိမ်လည်မှုသည် မိမိထံသို့သာ ပြန်ရောက်တတ်၏။"},{"no":92,"pali":"Mahāsārajātaka","mm":"မဟာသာရဇာတ်","summary":"နန်းတော်ဥယျာဉ်တွင် မိဖုရား၏ ပုလဲတန်ဆာ ပျောက်ဆုံးရာ မျောက်မတစ်ကောင် ခိုးယူထားခြင်းဖြစ်ကြောင်း ပညာရှိအမတ် ဘုရားလောင်း ရိပ်မိသည်။ မျောက်တို့အား ပုတီးတန်ဆာများ ဝေပေးစေရာ ဂုဏ်ပြိုင်လိုသော ခိုးသည့်မျောက်မက ပုလဲအစစ်ကို ထုတ်ဝတ်ပြသဖြင့် ရတနာကို ပြန်လည်ရရှိလေသည်။","moral":"အရေးအခင်း ကြုံမှသာ ပညာရှိ၏တန်ဖိုးကို သိရ၏။"},{"no":93,"pali":"Visāsabhojanajātaka","mm":"ဝိသာသဘောဇနဇာတ်","summary":"ခြင်္သေ့တစ်ကောင်သည် သမင်မတစ်ကောင်ကို စွဲလမ်းတွယ်တာ၍ အနီးကပ်လိုက်နေရာ နွားကျောင်းသားတို့သည် သမင်မ၏ကိုယ်၌ အဆိပ်လိမ်းထားကြသည်။ ခြင်္သေ့သည် ချစ်စိတ်ဖြင့် သမင်မကို လျက်မိသောကြောင့် အဆိပ်သင့်၍ သေရလေသည်။","moral":"စူးစမ်းဆင်ခြင်ခြင်းမရှိဘဲ အလွန်ယုံကြည်စွဲလမ်းခြင်းသည် ဘေးရောက်ကြောင်းဖြစ်၏။"},{"no":94,"pali":"Lomahaṁsajātaka","mm":"လောမဟံသဇာတ်","summary":"ဘုရားလောင်းသည် ရှေးဘဝတစ်ခုက အဝတ်မဝတ်သော တက္ကတွန်းအယူဝါဒီဖြစ်၍ အအေးအပူဒဏ်ခံခြင်း စသော ပြင်းထန်သည့် ခြိုးခြံမှုတို့ကို ကျင့်ခဲ့သည်။ သေခါနီးတွင် ငရဲနိမိတ်ကို မြင်၍ ထိုအကျင့်တို့ အချည်းနှီးဖြစ်ကြောင်း သိမြင်ခဲ့ရလေသည်။","moral":"ပညာမပါသော ကိုယ်ပင်ပန်း ခြိုးခြံအကျင့်သည် အကျိုးမရှိ။"},{"no":95,"pali":"Mahāsudassanajātaka","mm":"မဟာသုဒဿနဇာတ်","summary":"ဘုရားလောင်းသည် ကုသာဝတီပြည့်ရှင် မဟာသုဒဿန စကြဝတေးမင်းဖြစ်၍ စည်းစိမ်ချမ်းသာ အလုံးစုံနှင့် ပြည့်စုံခဲ့သော်လည်း သေခါနီးအခါ မိဖုရားကြီးအား သင်္ခါရတရားအားလုံး မမြဲကြောင်း ဟောကြားလျက် ငြိမ်သက်စွာ စုတေတော်မူလေသည်။","moral":"သင်္ခါရတရားတို့ မမြဲသည်ကို ဆင်ခြင်၍ မမေ့မလျော့ နေအပ်၏။"},{"no":96,"pali":"Telapattajātaka","mm":"တေလပတ္တဇာတ်","summary":"မင်းသား ဘုရားလောင်းသည် ဆီပြည့်လျှံနေသောခွက်ကို တစ်စက်မျှ မဖိတ်စေဘဲ လူအုပ်ကြီးနှင့် ပွဲသဘင်များအလယ်မှ ဖြတ်၍ ယူဆောင်သွားရသည်။ ဘီလူးမတို့၏ ဖြားယောင်းမှုနှင့် အလှအပတို့ကို ဂရုမစိုက်ဘဲ သတိတရား လုံခြုံစွာဖြင့် ပန်းတိုင်သို့ရောက်၍ မင်းအဖြစ်ကို ရလေသည်။","moral":"ဆီပြည့်ခွက်ကို စောင့်သကဲ့သို့ သတိကို စောင့်ရှောက်အပ်၏။"},{"no":97,"pali":"Nāmasiddhijātaka","mm":"နာမသိဒ္ဓိဇာတ်","summary":"ပါပက (ယုတ်မာသူ) ဟု အမည်ရသော တပည့်သည် အမည်ကောင်းတစ်ခု ရလိုသဖြင့် ခရီးထွက်ရှာဖွေရာ ဇီဝက (အသက်ရှင်သူ) မည်သော လူသေ၊ ဓနပါလီ (ဥစ္စာစောင့်) မည်သော ဆင်းရဲသူကျွန်မ၊ ပန္ထက (လမ်းပြ) မည်သော လမ်းပျောက်သူတို့ကို တွေ့ရ၍ အမည်သည် အဓိကမကျကြောင်း သိကာ ပြန်လာလေသည်။ ဘုရားလောင်းသည် ဆရာကြီးဖြစ်သည်။","moral":"အမည်ကြောင့်မဟုတ်၊ ပြုသောကံကြောင့်သာ လူ၏တန်ဖိုးကို သတ်မှတ်၏။"},{"no":98,"pali":"Kūṭavāṇijajātaka","mm":"ကူဋဝါဏိဇဇာတ်","summary":"ကုန်သည်နှစ်ဦး စီးပွားတူလုပ်ရာ အတိပဏ္ဍိတမည်သော ကောက်ကျစ်သူက ဝေစုပိုရလိုသဖြင့် မိမိဖခင်ကို သစ်ခေါင်းထဲ ဝှက်ထား၍ သစ်ပင်စောင့်နတ်အဖြစ် အဆုံးအဖြတ်ပေးစေသည်။ ပညာရှိ ပဏ္ဍိတ ဘုရားလောင်းက သစ်ပင်ရင်း၌ မီးရှို့လိုက်ရာ ဖခင်အို ထွက်ပြေးလာ၍ လိမ်လည်မှု ပေါ်လွင်သွားလေသည်။","moral":"ကောက်ကျစ်စဉ်းလဲမှုသည် နောက်ဆုံးတွင် ပေါ်လွင်၍ အရှက်ရစေ၏။"},{"no":99,"pali":"Parosahassajātaka","mm":"ပရောသဟဿဇာတ်","summary":"ရသေ့ဆရာကြီး ဘုရားလောင်းသည် သေခါနီးတွင် အာကိဉ္စညာယတနဈာန်ကို ရည်၍ တစ်စုံတစ်ခုမျှ မရှိဟု မိန့်ဆိုရာ တပည့်များစွာတို့ အဓိပ္ပာယ် လွဲမှားစွာ ယူဆကြသော်လည်း တပည့်ကြီးတစ်ဦးတည်းသာ မှန်ကန်စွာ နားလည်လေသည်။","moral":"လူမိုက်ထောင်ပေါင်းများစွာထက် ပညာရှိတစ်ယောက်က မြတ်၏။"},{"no":100,"pali":"Asātarūpajātaka","mm":"အသာတရူပဇာတ်","summary":"မင်းသားတစ်ပါးသည် ဖခင်မင်း အသတ်ခံရ၍ ပြည်တော် ဆုံးရှုံးပြီးနောက် မယ်တော်၏ အကြံပေးချက်အတိုင်း မြို့ကို ခုနစ်ရက်တိုင် ပိတ်ဆို့ဝိုင်းရံခြင်းဖြင့် ပြန်လည်သိမ်းပိုက်နိုင်ခဲ့သည်။ ထိုကံကြောင့် နောင်ဘဝတွင် သီဝလိမထေရ်နှင့် မယ်တော်သုပ္ပဝါသာအဖြစ် ကိုယ်ဝန်ခုနစ်နှစ် ဆောင်ရ၍ ခုနစ်ရက် သားဖွားဆင်းရဲ ခံစားရကြောင်း ဤဇာတ်၌ ဟောကြားထားသည်။","moral":"သာယာဟန်ဆောင်သော အရာတို့၌ ဆင်းရဲခြင်းသည် ကိန်းအောင်းတတ်၏။"},{"no":101,"pali":"Parosatajātaka","mm":"ပရောသတဇာတ်","summary":"ဘုရားလောင်းသည် ရသေ့ဆရာကြီးဖြစ်၍ တပည့်များစွာတို့အနက် ပညာရှိတပည့်ကြီးတစ်ပါးသာ ဆရာ၏နက်နဲသောစကားကို နားလည်သည်။ လူမိုက်တစ်ရာထက် စကားအနက်ကိုသိသော ပညာရှိတစ်ယောက်က သာ၍မြတ်ကြောင်း ပြဆိုသောဇာတ်ဖြစ်သည်။","moral":"လူမိုက်များစွာထက် ပညာရှိတစ်ဦးက ပို၍တန်ဖိုးရှိ၏။"},{"no":102,"pali":"Paṇṇikajātaka","mm":"ပဏ္ဏိကဇာတ်","summary":"ဟင်းရွက်သည်ကြီးသည် သမီး၏အကျင့်သီလကို စမ်းသပ်လိုသဖြင့် မဖွယ်မရာပြုဟန်ဆောင်ရာ သမီးက ငိုကြွေးတောင်းပန်၍ မိမိ၏စင်ကြယ်မှုကို ထင်ရှားစေသည်။ ဖခင်လည်း စိတ်ချမ်းသာစွာ သမီးကို ကောင်းရာသို့ ထိမ်းမြားပေးသည်။","moral":"အကျင့်သီလစင်ကြယ်မှုသည် စမ်းသပ်မှုကို ခံနိုင်၏။"},{"no":103,"pali":"Verijātaka","mm":"ဝေရိဇာတ်","summary":"ဘုရားလောင်းသုဌေးကြီးသည် ကြွေးမြီများသိမ်းယူပြီး ပြန်လာစဉ် ဓားပြရန်သူတို့ ချောင်းမြောင်းရာအရပ်ကို မဆိုင်းမတွ လျင်မြန်စွာ ကျော်ဖြတ်သွားသဖြင့် ဘေးရန်မှ လွတ်မြောက်သည်။","moral":"ရန်သူရှိရာအရပ်၌ ကြာမြင့်စွာ မနေထိုင်ရာ။"},{"no":104,"pali":"Mittavindakajātaka","mm":"မိတ္တဝိန္ဒကဇာတ်","summary":"မိတ္တဝိန္ဒကသည် မိခင်၏စကားကို နားမထောင်ဘဲ လောဘကြီးစွာ တစ်ဆင့်ထက်တစ်ဆင့် စည်းစိမ်ရှာလိုက်စားရာ နောက်ဆုံး၌ ဓားစက်ဝန်းကို ဦးခေါင်းပေါ်၌ တင်ဆောင်ခံရသည်။ ဘုရားလောင်းသည် နတ်သားအဖြစ်ဖြင့် ထိုအဖြစ်ကိုမြင်၍ လောဘ၏အပြစ်ကို ဟောကြားသည်။","moral":"အလိုမပြည့်နိုင်သော လောဘသည် ပျက်စီးခြင်းသို့ ပို့ဆောင်၏။"},{"no":105,"pali":"Dubbalakaṭṭhajātaka","mm":"ဒုဗ္ဗလကဋ္ဌဇာတ်","summary":"တောသို့ ထွက်ပြေးလွတ်မြောက်လာသော ဆင်တစ်ကောင်သည် လေတိုက်၍ သစ်ကိုင်းသေးများ ကျိုးကျသံကိုပင် ကြောက်ရွံ့တုန်လှုပ်နေရာ သစ်ပင်စောင့်နတ်ဖြစ်သော ဘုရားလောင်းက အကြောင်းမဲ့ ကြောက်ရွံ့မှုကို ပယ်ရှားရန် ဆုံးမသည်။","moral":"အကြောင်းမဲ့ ကြောက်ရွံ့မှုသည် မိမိကိုယ်ကိုသာ ညှဉ်းဆဲ၏။"},{"no":106,"pali":"Udañcanījātaka","mm":"ဥဒဉ္စနီဇာတ်","summary":"ရသေ့အဖြစ် ကျင့်ကြံနေသော လုလင်ငယ်သည် မိန်းမပျိုတစ်ဦး၏ ဖြားယောင်းမှုကြောင့် လူ့ဘောင်သို့ လိုက်ပါသွားပြီး ရေခပ်ခြင်းစသော အိမ်ထောင်မှုဝန်ထုပ်ကို ပင်ပန်းစွာ ထမ်းဆောင်ရပြီးနောက် ဖခင်ရသေ့ဖြစ်သော ဘုရားလောင်းထံ ပြန်လည်ရောက်ရှိလာသည်။","moral":"ကာမဂုဏ်နှင့် အိမ်ထောင်မှုသည် ဝန်ထုပ်ဝန်ပိုးသာ ဖြစ်၏။"},{"no":107,"pali":"Sālittakajātaka","mm":"သာလိတ္တကဇာတ်","summary":"ခြေမစွမ်းသောသူတစ်ဦးသည် ကျောက်ခဲပစ်သည့်အတတ်၌ ထူးချွန်သဖြင့် စကားအလွန်များသော ပုဏ္ဏားကို ထိုအတတ်ဖြင့် ဆုံးမပေးနိုင်၍ မင်းကြီးထံမှ ဆုလာဘ်ရရှိသည်။ မည်သည့်အတတ်ပညာမဆို တန်ဖိုးရှိကြောင်း ပြဆိုသောဇာတ်ဖြစ်သည်။","moral":"အတတ်ပညာဟူသမျှ လေ့လာထားလျှင် အကျိုးပေးနိုင်၏။"},{"no":108,"pali":"Bāhiyajātaka","mm":"ဗာဟိယဇာတ်","summary":"တောသူမိန်းမတစ်ဦးသည် ကိုယ်အမူအရာ သိမ်မွေ့လျောက်ပတ်စွာ ပြုမူသည်ကို မင်းကြီးမြင်၍ ချီးမြှောက်တော်မူသည်။ လျောက်ပတ်သော အမူအကျင့်ကိုပင် သင်ယူထိုက်ကြောင်း ဘုရားလောင်းပညာရှိအမတ်က လျှောက်ထားသည်။","moral":"လျောက်ပတ်သော အမူအရာသည်လည်း သင်ယူထိုက်သော အတတ်ပညာဖြစ်၏။"},{"no":109,"pali":"Kuṇḍapūvajātaka","mm":"ကုဏ္ဍပူဝဇာတ်","summary":"ဆင်းရဲသားတစ်ဦးသည် ဖွဲနုမုန့်ညံ့ကိုပင် သစ်ပင်စောင့်နတ်ဖြစ်သော ဘုရားလောင်းအား ကြည်ညိုစွာ လှူဒါန်းရာ နတ်မင်းက ကျေးဇူးတုံ့ပြန်၍ မြှုပ်ထားသောရွှေအိုးကို ညွှန်ပြသဖြင့် ချမ်းသာကြွယ်ဝသွားသည်။","moral":"သဒ္ဓါတရားဖြင့် လှူသောအလှူသည် အနည်းငယ်ပင်ဖြစ်စေ အကျိုးကြီး၏။"},{"no":110,"pali":"Sabbasaṁhārakapañhajātaka","mm":"သဗ္ဗသံဟာရကပဉှဇာတ်","summary":"ဘုရားလောင်း မဟောသဓပညာရှိသည် နံ့သာပေါင်းနှင့်စပ်သော ပဉှာအမှုကို ဉာဏ်ဖြင့် စစ်ဆေးဆုံးဖြတ်၍ အမှန်တရားကို ဖော်ထုတ်ခဲ့သည်။ အကျယ်ကို မဟောသဓပညာရှိ၏ ဇာတ်တော်ကြီး၌ လာရှိသည်။","moral":"ပညာဉာဏ်သည် ဖုံးကွယ်ထားသော အမှန်တရားကို ဖော်ထုတ်နိုင်၏။"},{"no":111,"pali":"Gadrabhapañhajātaka","mm":"ဂဒြဘပဉှဇာတ်","summary":"ဘုရားလောင်း မဟောသဓပညာရှိ၏ ဉာဏ်ပညာထက်မြက်မှုကို ပြသသော မြည်းနှင့်စပ်သည့် ပဉှာဖြစ်၍ အကျယ်ကို မဟောသဓပညာရှိ၏ ဇာတ်တော်ကြီး၌ လာရှိသည်။","moral":"နက်နဲသောပြဿနာကို ပညာရှိ၏ဉာဏ်ဖြင့်သာ ဖြေရှင်းနိုင်၏။"},{"no":112,"pali":"Amarādevīpañhajātaka","mm":"အမရာဒေဝီပဉှဇာတ်","summary":"ဘုရားလောင်း မဟောသဓပညာရှိ၏ဇနီး ပညာရှိအမရာဒေဝီသည် နက်နဲစွာမေးသော ပဉှာစကားတို့ကို ဉာဏ်ဖြင့် မှန်ကန်စွာ ဖြေကြားခဲ့သည်။ အကျယ်ကို မဟောသဓပညာရှိ၏ ဇာတ်တော်ကြီး၌ လာရှိသည်။","moral":"ပညာရှိတို့၏ နက်နဲသောစကားကို ပညာရှိသာ သိနားလည်နိုင်၏။"},{"no":113,"pali":"Siṅgālajātaka","mm":"သိင်္ဂါလဇာတ်","summary":"သစ္စာမဲ့သော မြေခွေးသည် မိမိကိုယုံကြည်သော ပုဏ္ဏားတစ်ဦးအား လှည့်စားဖောက်ပြန်သည်။ ထိုအဖြစ်ကို မြင်သော သစ်ပင်စောင့်နတ်ဘုရားလောင်းက သစ္စာမဲ့သူကို မယုံကြည်ရာဟု ဆုံးမသည်။","moral":"သစ္စာမဲ့သူကို အဘယ်အခါမျှ မယုံကြည်ရာ။"},{"no":114,"pali":"Mitacintijātaka","mm":"မိတစိန္တိဇာတ်","summary":"ငါးသုံးကောင်အနက် အမြော်အမြင်ရှိသော မိတစိန္တီငါးဖြစ်သည့် ဘုရားလောင်းသည် တံငါသည်၏ ပိုက်ကွန်ထဲ ပါသွားသော အဖော်နှစ်ကောင်ကို ဉာဏ်ဖြင့် ကယ်တင်လွတ်မြောက်စေသည်။","moral":"အမြော်အမြင်ရှိမှုသည် ဘေးရန်မှ ကယ်တင်၏။"},{"no":115,"pali":"Anusāsikajātaka","mm":"အနုသာသိကဇာတ်","summary":"ငှက်မတစ်ကောင်သည် အခြားငှက်တို့အား ဘေးရှိသောလမ်းကို ရှောင်ရန် ဆုံးမပြီး မိမိကိုယ်တိုင်မူ လောဘဖြင့် ထိုလမ်း၌ အစာရှာနေစဉ် လှည်းကြိတ်ခံရ၍ သေဆုံးသည်။ ဘုရားလောင်းသည် ငှက်တို့၏ အကြီးအကဲဖြစ်သည်။","moral":"သူတစ်ပါးကို ဆုံးမပြီး မိမိမကျင့်လျှင် ပျက်စီးရ၏။"},{"no":116,"pali":"Dubbacajātaka","mm":"ဒုဗ္ဗစဇာတ်","summary":"လှံတံကျော်ကပြသည့် ဆရာသည် သေရည်ယစ်မူးလျက် မိမိတတ်စွမ်းသော လှံလေးစင်းထက်ပို၍ ငါးစင်းကျော် ကခုန်မည်ဟု ဆိုရာ တပည့်ဖြစ်သော ဘုရားလောင်း၏ တားမြစ်စကားကို နားမထောင်ဘဲ ကခုန်သဖြင့် ပဉ္စမလှံဖျား၌ စူးဝင်သေဆုံးသည်။","moral":"ကောင်းသော အဆုံးအမကို နားမထောင်သူသည် ပျက်စီးရ၏။"},{"no":117,"pali":"Tittirajātaka","mm":"တိတ္တိရဇာတ်","summary":"အသံကျယ်လောင်စွာ မဆင်မခြင် မြည်တွန်သော တိတ္တိရငှက်သည် မိမိတည်နေရာကို မုဆိုးအား ဖော်ပြရာရောက်၍ အသတ်ခံရသည်။ ရသေ့ဆရာကြီးဖြစ်သော ဘုရားလောင်းက မဆင်ခြင်သောစကားကြောင့် ပျက်စီးရကြောင်း ဟောကြားသည်။","moral":"မဆင်မခြင် ပြောဆိုသောစကားသည် ဘေးရန်ကို ဆောင်၏။"},{"no":118,"pali":"Vaṭṭakajātaka","mm":"ဝဋ္ဋကဇာတ်","summary":"မုဆိုးဖမ်းမိသော ငုံးငှက်ဘုရားလောင်းသည် အစာမစားဘဲ ပိန်ချုံးအောင်နေသဖြင့် ရောင်း၍မရနိုင်ဟု ထင်မှတ်ကာ မုဆိုးက လက်ဝါးပေါ်တင်၍ ကြည့်ရှုနေစဉ် ပျံတက်လွတ်မြောက်သွားသည်။","moral":"ဉာဏ်ပညာဖြင့် ဘေးအန္တရာယ်မှ လွတ်မြောက်နိုင်၏။"},{"no":119,"pali":"Akālarāvijātaka","mm":"အကာလရာဝိဇာတ်","summary":"အချိန်အခါမဲ့ တွန်ကျူးသော ကြက်ဖသည် တက္ကသိုလ်ကျောင်းသားတို့၏ အိပ်စက်သင်ကြားမှုကို နှောင့်ယှက်သဖြင့် အသတ်ခံရသည်။ ဒိသာပါမောက္ခဆရာကြီးဖြစ်သော ဘုရားလောင်းက အချိန်အခါသိခြင်း၏ အရေးကြီးမှုကို ဟောကြားသည်။","moral":"အချိန်အခါမသိသော အပြုအမူသည် ပျက်စီးခြင်းကို ဆောင်၏။"},{"no":120,"pali":"Bandhanamokkhajātaka","mm":"ဗန္ဓနမောက္ခဇာတ်","summary":"မိဖုရားသည် မိမိ၏ဖြားယောင်းမှုကို ငြင်းပယ်သော ပုရောဟိတ်ဘုရားလောင်းအား မဟုတ်မမှန် စွပ်စွဲသော်လည်း ဘုရားလောင်းက အမှန်တရားကို ထုတ်ဖော်လျှောက်ထား၍ အနှောင်အဖွဲ့မှ လွတ်မြောက်ပြီးနောက် ရသေ့ရဟန်းပြုသည်။","moral":"သစ္စာစကားသည် အနှောင်အဖွဲ့မှ လွတ်မြောက်စေ၏။"},{"no":121,"pali":"Kusanāḷijātaka","mm":"ကုသနာဠိဇာတ်","summary":"မြက်ပင်စောင့်နတ်ဖြစ်သော ဘုရားလောင်းသည် မိတ်ဆွေသစ်ပင်ကြီးစောင့်နတ်၏ ဗိမာန်သစ်ပင် ခုတ်လှဲခံရမည့်ဘေးမှ ပုတ်သင်ညိုအသွင်ဆောင်ကာ သစ်ပင်ဆွေးမြေ့ဟန် ပြုလုပ်ပြသ၍ ကယ်တင်သည်။","moral":"မိတ်ဆွေကောင်းသည် အဆင့်အတန်းမရွေး ကျေးဇူးပြုနိုင်၏။"},{"no":122,"pali":"Dummedhajātaka","mm":"ဒုမ္မေဓဇာတ်","summary":"မနာလိုသောမင်းသည် လူအများ ချီးမွမ်းခံရသော မင်္ဂလာဆင်ဖြူတော်ဘုရားလောင်းကို ချောက်ကမ်းပါးမှ ကျစေရန် ကြံစည်ရာ ဆင်တော်သည် ဆင်ထိန်းနှင့်အတူ ကောင်းကင်ခရီးဖြင့် ဗာရာဏသီမင်းထံ ထွက်ခွာသွားသည်။","moral":"မနာလိုမှုသည် မိမိ၏စည်းစိမ်ကိုသာ ဆုံးရှုံးစေ၏။"},{"no":123,"pali":"Naṅgalīsajātaka","mm":"နင်္ဂလီသဇာတ်","summary":"ဉာဏ်ထိုင်းသော တပည့်တစ်ဦးသည် \"ထွန်တုံးနှင့်တူ၏\" ဟူသော ဥပမာတစ်ခုတည်းကို နေရာမရွေး သုံးစွဲမိသဖြင့် ရယ်ဖွယ်ဖြစ်ရသည်။ ဘုရားလောင်းသည် ဒိသာပါမောက္ခ ဆရာကြီးဖြစ်သည်။","moral":"သင့်လျော်ရာအခါအခွင့်ကို မသိသောပညာသည် အကျိုးမပေး။"},{"no":124,"pali":"Ambajātaka","mm":"အမ္ဗဇာတ်","summary":"မိုးခေါင်ရေရှားသောအခါ ရသေ့တစ်ပါးသည် တိရစ္ဆာန်တို့အား ရေခပ်တိုက်ကျွေးရာ ကျေးဇူးသိသော တိရစ္ဆာန်တို့က သရက်သီးစသော အသီးအနှံများ ဆောင်ယူလာသဖြင့် ရသေ့အပေါင်း စားသုံးဖူလုံကြသည်။ ဘုရားလောင်းသည် ရသေ့တို့၏ ဆရာဖြစ်သည်။","moral":"မေတ္တာစေတနာဖြင့် ကျေးဇူးပြုသူသည် ကျေးဇူးတုံ့ပြန်ခြင်းကို ခံရ၏။"},{"no":125,"pali":"Kaṭāhakajātaka","mm":"ကဋာဟကဇာတ်","summary":"ကျွန်ကဋာဟကသည် စာချွန်အတုဖြင့် သူဌေးသားအယောင်ဆောင်ကာ နယ်စွန်သူဌေး၏သမီးနှင့် ထိမ်းမြားပြီး မာန်ထောင်လွှားနေရာ သခင်သူဌေးကြီးဖြစ်သော ဘုရားလောင်းက ဂါထာတစ်ပုဒ်ဖြင့် လိမ္မာစွာ သတိပေးနှိမ့်ချသည်။","moral":"ဟန်ဆောင်ထောင်လွှားမှုသည် ကြာရှည်မတည်နိုင်။"},{"no":126,"pali":"Asilakkhaṇajātaka","mm":"အသိလက္ခဏဇာတ်","summary":"ဓားကိုအနံ့ခံ၍ လက္ခဏာကောင်းဆိုး စစ်ဆေးတတ်သော ပုဏ္ဏားသည် ဓားကိုနမ်းရှုစဉ် ချေဆတ်မိသဖြင့် နှာခေါင်းဖျားပြတ်လေသည်။ ဆက်စပ်ဖြစ်ပျက်သော အကြောင်းအရာတို့က တူညီသောအမှုပင် တစ်ဦးအတွက်ကံကောင်း၍ တစ်ဦးအတွက် ကံဆိုးနိုင်ကြောင်း ပြသည်။","moral":"တူညီသောအကြောင်းပင် တစ်ဦးအတွက်ဆိုး၍ တစ်ဦးအတွက်ကောင်း ဖြစ်နိုင်၏။"},{"no":127,"pali":"Kalaṇḍukajātaka","mm":"ကလဏ္ဍုကဇာတ်","summary":"ကျွန်ကလဏ္ဍုကသည် အမျိုးကောင်းသားအယောင်ဆောင်၍ သူဌေးသမီးနှင့် ထိမ်းမြားနေထိုင်ရာ သခင်သူဌေးကြီး၏ ကြက်တူရွေးက မှတ်မိဖော်ထုတ်သဖြင့် အမှန်ပေါ်ကာ ကျွန်ဘဝသို့ ပြန်ရောက်ရသည်။ ဘုရားလောင်းသည် သခင်သူဌေးကြီး ဖြစ်သည်။","moral":"မုသားဖြင့် တည်ဆောက်သောဘဝသည် မတည်မြဲ။"},{"no":128,"pali":"Biḷāravatajātaka","mm":"ဗိဠာရဝတဇာတ်","summary":"ကြွက်တို့ကို စားလိုသဖြင့် သူတော်ကောင်းအယောင်ဆောင် ကျင့်ကြံဟန်ပြုနေသော သားရဲကို ကြွက်မင်းဖြစ်သော ဘုရားလောင်းက ကြွက်အရေအတွက် လျော့နည်းလာသည်ကို ထောက်၍ အကဲခတ်သိရှိကာ ဖော်ထုတ်အဆုံးစီရင်သည်။","moral":"သီလကို အယောင်ဆောင်၍ လှည့်စားသူသည် ပျက်စီးရ၏။"},{"no":129,"pali":"Aggikabhāradvājajātaka","mm":"အဂ္ဂိကဘာရဒွါဇဇာတ်","summary":"မီးလောင်၍ ဦးခေါင်း၌ ဆံစုကျန်ရစ်သော မြေခွေးသည် မီးကိုးကွယ်သော သူတော်စင်အယောင်ဆောင်ကာ ကြွက်တို့ကို စားရန်ကြံစည်ရာ ကြွက်မင်းဖြစ်သော ဘုရားလောင်းက သိမြင်ဖော်ထုတ်သည်။","moral":"အယောင်ဆောင်လှည့်စားမှုသည် ပညာရှိ၏ရှေ့၌ မတည်နိုင်။"},{"no":130,"pali":"Kosiyajātaka","mm":"ကောသိယဇာတ်","summary":"နာမကျန်းဟန်ဆောင်၍ လင်ယောက်ျားကို လှည့်စားနေသော ပုဏ္ဏေးမအား ပညာရှိဆရာဖြစ်သော ဘုရားလောင်း၏ အကြံဉာဏ်အတိုင်း ခါးသီးသောဆေးကို တိုက်ကျွေးမည်ဟု ခိုင်မာစွာပြောဆိုရာ ဟန်ဆောင်နာမကျန်းမှု ချက်ချင်းပျောက်ကင်းသည်။","moral":"ဟန်ဆောင်လှည့်စားမှုသည် ထင်ရှားပေါ်လွင်လာမြဲ ဖြစ်၏။"},{"no":131,"pali":"Asampadānajātaka","mm":"အသမ္ပဒါနဇာတ်","summary":"ဘုရားလောင်းသူဌေးကြီးသည် ပျက်စီးဆင်းရဲနေသော မိတ်ဆွေအား ဥစ္စာဝေမျှ ကူညီခဲ့သော်လည်း နောင်အခါ မိမိဆင်းရဲသောအခါ ထိုမိတ်ဆွေက ကျေးဇူးမသိ ငြင်းပယ်သည်။ မင်းကြီးက အမှန်သိသောအခါ ကျေးဇူးမသိသူကို အရေးယူ၍ ဘုရားလောင်း၏ စည်းစိမ်ကို ပြန်လည်ရရှိစေသည်။","moral":"ကျေးဇူးမသိခြင်းသည် ယုတ်မာသောအကျင့် ဖြစ်၏။"},{"no":132,"pali":"Bhīrukajātaka","mm":"ဘီရုကဇာတ်","summary":"မင်းသားဖြစ်သော ဘုရားလောင်းသည် ဘီလူးမတို့၏ ဖြားယောင်းသွေးဆောင်မှုကို မျက်စိဖြင့်ပင် မကြည့်ဘဲ ဣန္ဒြေစောင့်စည်း ရှောင်ကြဉ်ခဲ့သဖြင့် ဘေးကင်းစွာ မင်းအဖြစ်သို့ ရောက်ရှိသည်။","moral":"ဣန္ဒြေစောင့်စည်းမှုသည် ဘေးရန်မှ ကာကွယ်၏။"},{"no":133,"pali":"Ghatāsanajātaka","mm":"ဃတာသနဇာတ်","summary":"ငှက်တို့ ခိုနားရာအိုင်၏ ရေပြင်မှ မီးလျှံထွက်လာသောအခါ ငှက်မင်းဖြစ်သော ဘုရားလောင်းသည် ခိုလှုံရာကိုယ်တိုင် ဘေးဖြစ်လာပြီဟု ဆင်ခြင်၍ ငှက်အပေါင်းကို အခြားအရပ်သို့ ဆောင်ယူပြောင်းရွှေ့သဖြင့် ဘေးမှလွတ်ကြသည်။","moral":"ခိုလှုံရာကိုယ်တိုင် ဘေးဖြစ်လာလျှင် စွန့်ခွာသင့်၏။"},{"no":134,"pali":"Jhānasodhanajātaka","mm":"ဈာနသောဓနဇာတ်","summary":"သေခါနီးအချိန်၌ ရသေ့ဆရာကြီးဖြစ်သော ဘုရားလောင်း မိန့်ကြားသော \"သညာရှိသည်လည်းမဟုတ် မရှိသည်လည်းမဟုတ်\" ဟူသော နက်နဲသောစကားကို ပညာရှိတပည့်ကြီးတစ်ပါးသာ မှန်ကန်စွာ နားလည်ဖွင့်ဆိုနိုင်သည်။","moral":"နက်နဲသောတရားကို ပညာရှိသာ သိနားလည်နိုင်၏။"},{"no":135,"pali":"Candābhajātaka","mm":"စန္ဒာဘဇာတ်","summary":"သေခါနီးအချိန်၌ ရသေ့ဆရာကြီးဖြစ်သော ဘုရားလောင်း မိန့်ကြားသော \"လရောင် နေရောင်\" ဟူသော နက်နဲသောစကားကို ပညာရှိတပည့်ကြီးကသာ အလင်းကသိုဏ်းစီးဖြန်း၍ အာဘဿရဗြဟ္မာ့ဘုံသို့ ရောက်ကြောင်း ဟူ၍ မှန်ကန်စွာ ဖွင့်ဆိုနိုင်သည်။","moral":"ဆရာ့ဩဝါဒ၏ အနက်ကို ပညာရှိသာ ထိုးထွင်းသိမြင်နိုင်၏။"},{"no":136,"pali":"Suvaṇṇahaṁsajātaka","mm":"သုဝဏ္ဏဟံသဇာတ်","summary":"ရွှေဟင်္သာအဖြစ် ဖြစ်လာသော ဘုရားလောင်းသည် အတိတ်ဘဝက ဇနီးသမီးတို့အား ရွှေအတောင် တစ်ချောင်းစီ ပေးလှူနေရာ လောဘကြီးသောဇနီးက အတောင်အားလုံးကို တစ်ကြိမ်တည်း နုတ်ယူသဖြင့် ရွှေအတောင်တို့သည် ရိုးရိုးအတောင်ဖြစ်သွား၍ စည်းစိမ်ဆုံးရှုံးသည်။","moral":"လောဘလွန်ကြူးလျှင် ရရှိပြီးသမျှပါ ဆုံးရှုံးရ၏။"},{"no":137,"pali":"Babbujātaka","mm":"ဗဗ္ဗုဇာတ်","summary":"ကြောင်တို့၏ ခြိမ်းခြောက်တောင်းယူမှုကို ခံနေရသော ကြွက်လေးအား ကျောက်ဆစ်ဆရာဖြစ်သော ဘုရားလောင်းက ဖန်သားကျောက်တုံးအတွင်း၌ ခိုအောင်းစေပြီး ခုန်အုပ်လာသော ကြောင်တို့သည် ကျောက်တုံးနှင့် ဆောင့်မိ၍ သေကြသည်။","moral":"လောဘဖြင့် ညှဉ်းပန်းသူသည် မိမိပြုသောကံကြောင့် ပျက်စီးရ၏။"},{"no":138,"pali":"Godhajātaka","mm":"ဂေါဓဇာတ်","summary":"ဖွတ်မင်းဖြစ်သော ဘုရားလောင်းကို စားရန် ကြံစည်နေသော ရသေ့အယောင်ဆောင်၏ မကောင်းသောအကြံကို ဖွတ်မင်းက ရိပ်မိသိရှိ၍ ဖော်ထုတ်ရှုတ်ချကာ လွတ်မြောက်သွားသည်။","moral":"ရသေ့ရဟန်းအဝတ်သည် ယုတ်မာသောစိတ်ထားကို မဖုံးကွယ်နိုင်။"},{"no":139,"pali":"Ubhatobhaṭṭhajātaka","mm":"ဥဘတောဘဋ္ဌဇာတ်","summary":"တံငါသည်သည် ရေအောက်၌ ငြိနေသောငါးမျှားချိတ်ကို ငါးကြီးဟု ထင်မှတ်ကာ ဆင်းယူရာ မျက်စိနှစ်ကွင်း ထိခိုက်ပျက်စီးပြီး အိမ်၌လည်း ဇနီးကြောင့် အမှုရင်ဆိုင်ရသဖြင့် နှစ်ဖက်စလုံး ဆုံးရှုံးသည်။ သစ်ပင်စောင့်နတ်ဖြစ်သော ဘုရားလောင်းက ထိုအဖြစ်ကို ထောက်၍ ဟောကြားသည်။","moral":"မကောင်းမှုပြုသူသည် ဤဘဝနောင်ဘဝ နှစ်ဖက်လုံး၌ ဆုံးရှုံးရ၏။"},{"no":140,"pali":"Kākajātaka","mm":"ကာကဇာတ်","summary":"ကျီးတို့အပေါ် ရန်ငြိုးဖွဲ့ထားသော ပုရောဟိတ်၏ တိုက်တွန်းချက်ကြောင့် ကျီးဆီရရှိရန် ကျီးတို့ကို သတ်ဖြတ်နေရာ ကျီးမင်းဖြစ်သော ဘုရားလောင်းသည် ရဲရင့်စွာ မင်းကြီးထံချဉ်းကပ်၍ အမြဲကြောက်ရွံ့စိုးရိမ်စွာ နေရသောကျီးတို့၌ အဆီမရှိကြောင်း အမှန်ကို လျှောက်တင်သဖြင့် ကျီးအပေါင်း ဘေးမဲ့ရရှိသည်။","moral":"သစ္စာနှင့် ရဲရင့်မှုသည် အများကို ကယ်တင်နိုင်၏။"},{"no":141,"pali":"Godhajātaka","mm":"ဂေါဓဇာတ်","summary":"ဖွတ်မင်း၏သားသည် ပုတ်သင်ညိုနှင့် မိတ်ဖွဲ့ရာ ပုတ်သင်ညိုက မုဆိုးအား ဖွတ်တို့၏နေရာကို ညွှန်ပြသဖြင့် ဖွတ်အမျိုး ပျက်စီးလုနီးပါး ဖြစ်ရသည်။ မသူတော်နှင့် ပေါင်းဖော်ခြင်း၏အပြစ်ကို ဖွတ်မင်းဖြစ်သော ဘုရားလောင်းက ဟောကြားသည်။","moral":"မသူတော်နှင့် ပေါင်းဖော်လျှင် ပျက်စီးရ၏။"},{"no":142,"pali":"Siṅgālajātaka","mm":"သိင်္ဂါလဇာတ်","summary":"လူတစ်ယောက်သည် မြေခွေးတို့ကို ဖမ်းရန် တုတ်ကိုင်လျက် သေဟန်ဆောင် လဲလျောင်းနေရာ မြေခွေးမင်းဖြစ်သော ဘုရားလောင်းသည် တုတ်ကို ဆွဲစမ်းကြည့်၍ လူက တင်းကြပ်စွာ ဆုပ်ကိုင်ထားသည်ကို တွေ့သဖြင့် သေသူမဟုတ်ကြောင်း သိကာ လွတ်မြောက်သွားသည်။","moral":"စေ့စပ်သော အကဲခတ်မှုသည် လှည့်စားမှုကို လွန်မြောက်စေ၏။"},{"no":143,"pali":"Virocanajātaka","mm":"ဝိရောစနဇာတ်","summary":"မြေခွေးသည် ခြင်္သေ့မင်းဖြစ်သော ဘုရားလောင်းကဲ့သို့ ဆင်ကို ခုန်အုပ်သတ်ဖြတ်လိုသဖြင့် မိမိစွမ်းရည် မမီပါလျက် အတုခိုးခုန်အုပ်ရာ ဆင်၏ခြေအောက်၌ ကြေမွသေဆုံးသည်။","moral":"မိမိစွမ်းရည်ကို မသိဘဲ ကြီးမြတ်သူကို အတုခိုးလျှင် ပျက်စီးရ၏။"},{"no":144,"pali":"Naṅguṭṭhajātaka","mm":"နင်္ဂုဋ္ဌဇာတ်","summary":"မီးပူဇော်နေသော ရသေ့ဘုရားလောင်းသည် ပူဇော်ရန်နွားကို သူခိုးတို့ သတ်စားပြီး အမြီးသာ ကျန်ရစ်သည်ကို မြင်သောအခါ မိမိအလှူခံပစ္စည်းကိုပင် မစောင့်ရှောက်နိုင်သောမီးသည် မိမိကို အဘယ်မှာ စောင့်ရှောက်နိုင်အံ့နည်းဟု ဆင်ခြင်ကာ မီးပူဇော်မှုကို စွန့်၍ တရားအားထုတ်သဖြင့် ဈာန်အဘိညာဉ် ရရှိသည်။","moral":"အပြင်အပ ပူဇော်ပသမှုထက် စိတ်၏စင်ကြယ်မှုက အရေးကြီး၏။"},{"no":145,"pali":"Rādhajātaka","mm":"ရာဓဇာတ်","summary":"ပုဏ္ဏားသည် ကြက်တူရွေး ညီအစ်ကိုနှစ်ကောင်အား ဇနီးကို စောင့်ကြည့်ရန် အပ်နှံခဲ့ရာ ဇနီး အကျင့်ဖောက်ပြားသော်လည်း ကြက်တူရွေးအစ်ကိုကြီးဖြစ်သော ဘုရားလောင်းက အနိုင်အထက် စောင့်ရှောက်၍မရသည်ကိုလည်းကောင်း၊ အချိန်မသင့်သော ဆုံးမစကား အကျိုးမရှိသည်ကိုလည်းကောင်း သိမြင်၍ မဆိုသင့်သောစကားကို ရှောင်ကြဉ်သည်။","moral":"အချိန်အခါမသင့်သော ဆုံးမစကားသည် အကျိုးမပေး။"},{"no":146,"pali":"Samuddakākajātaka","mm":"သမုဒ္ဒကာကဇာတ်","summary":"ပင်လယ်ရေတွင် နစ်မြုပ်သွားသော အဖော်ကျီးမအတွက် ကျီးအပေါင်းသည် နှုတ်သီးဖြင့် ပင်လယ်ရေကို ခပ်ထုတ်ခန်းခြောက်စေမည်ဟု အချည်းနှီး ကြိုးပမ်းဝါကြွားကြသည်။ မိမိတို့ မတတ်စွမ်းနိုင်သောအမှုကို ဝါကြွားလုပ်ဆောင်ခြင်း၏ အချည်းနှီးဖြစ်မှုကို ပြသောဇာတ်ဖြစ်သည်။","moral":"မတတ်စွမ်းနိုင်သောအမှု၌ အချည်းနှီး မပင်ပန်းရာ။"},{"no":147,"pali":"Puppharattajātaka","mm":"ပုပ္ဖရတ္တဇာတ်","summary":"ဆင်းရဲသားတစ်ဦးသည် ဇနီး၏အလိုကျ ပွဲတော်၌ ဝတ်ဆင်ရန် နီမောင်းသောပန်းဆိုးအထည်ကို ခိုးယူမိသဖြင့် တံကျင်စူးထိုးခံရလျက်ပင် သေခြင်းထက် ဇနီး ပွဲတော်မသွားနိုင်မှုကိုသာ စိုးရိမ်တသနေသည်။ ကာမတဏှာ၏ အားကြီးမှုကို ပြသောဇာတ်ဖြစ်သည်။","moral":"ကာမတဏှာသည် သေသည့်တိုင်အောင် စွဲမြဲ၍ ဆင်းရဲကို ဆောင်၏။"},{"no":148,"pali":"Siṅgālajātaka","mm":"သိင်္ဂါလဇာတ်","summary":"မြေခွေးဖြစ်သော ဘုရားလောင်းသည် ဆင်သေကောင်၏ ဝမ်းတွင်းသို့ဝင်၍ အသားစားနေစဉ် အရေခွံခြောက်ကပ်သဖြင့် အတွင်း၌ ပိတ်မိနေပြီး မိုးရွာ၍ အရေပျော့မှ ခဲယဉ်းစွာ လွတ်မြောက်ကာ နောက်နောင် လောဘမလွန်ကြူးတော့ရန် သံဝေဂရရှိသည်။","moral":"လောဘလွန်ကြူးမှုသည် မိမိကိုယ်ကို ထောင်ချောက်ဆင်ရာ ရောက်၏။"},{"no":149,"pali":"Ekapaṇṇajātaka","mm":"ဧကပဏ္ဏဇာတ်","summary":"စိတ်ထားကြမ်းတမ်းသော မင်းသားအား ရသေ့ပညာရှိဖြစ်သော ဘုရားလောင်းက အရွက်တစ်ရွက်တည်းရှိသေးသော ခါးသီးသည့်ပျိုးပင်ကို မြည်းစမ်းစေရာ မင်းသားက ပျိုးစဉ်ကပင် ဤမျှခါးလျှင် ကြီးသောအခါ အဘယ်မျှ ခါးလိမ့်မည်နည်းဟုဆို၍ ဆွဲနုတ်ပစ်ပြီး မိမိလည်း ကြမ်းကြုတ်နေလျှင် ပြည်သူတို့၏ ပယ်ရှားခြင်းကို ခံရမည်ကို ဆင်ခြင်ကာ စိတ်ထားပြောင်းလဲသည်။","moral":"ငယ်စဉ်ကပင် စိတ်ထားကြမ်းတမ်းမှုကို ပြုပြင်သင့်၏။"},{"no":150,"pali":"Sañjīvajātaka","mm":"သဉ္ဇီဝဇာတ်","summary":"လုလင်သဉ္ဇီဝသည် သေသူကို ရှင်ပြန်စေသော မန္တန်ကို သင်ယူပြီး သေနေသောကျားကို ရှင်ပြန်စေရာ ထိုကျားက သူ့ကိုပင် ကိုက်သတ်သဖြင့် နှစ်ဦးလုံး သေဆုံးကြသည်။ ဆရာဖြစ်သော ဒိသာပါမောက္ခဘုရားလောင်းက မသူတော်ကို ချီးမြှောက်လျှင် မိမိဒုက္ခရောက်ရကြောင်း ဟောကြားသည်။","moral":"မသူတော်ကို ချီးမြှောက်သူသည် ဘေးဒုက္ခ ခံရ၏။"},{"no":151,"pali":"Rājovādajātaka","mm":"ရာဇောဝါဒဇာတ်","summary":"ဗာရာဏသီမင်းအဖြစ် ဖွားမြင်သော ဘုရားလောင်းနှင့် ကောသလမင်းတို့သည် နှစ်ဦးစလုံး တရားစောင့်သော မင်းများဖြစ်ကြရာ လမ်းကျဉ်း၌ ရထားချင်းဆုံသောအခါ မည်သည့်မင်း၏ သီလဂုဏ်သာသနည်းဟု ရထားထိန်းတို့ ငြင်းခုံကြသည်။ အမျက်ထွက်သူကို အမျက်မထွက်ဘဲလည်းကောင်း၊ မကောင်းသူကိုပင် ကောင်းမှုဖြင့်လည်းကောင်း အနိုင်ယူသော ဘုရားလောင်းမင်း၏ ကျင့်စဉ်က သာလွန်ကြောင်း ဝန်ခံကြရလေသည်။","moral":"အမျက်ကို မေတ္တာဖြင့်လည်းကောင်း၊ မကောင်းမှုကို ကောင်းမှုဖြင့်လည်းကောင်း အနိုင်ယူအပ်၏။"},{"no":152,"pali":"Siṅgālajātaka","mm":"သိင်္ဂါလဇာတ်","summary":"ခြင်္သေ့မငယ်ကို တပ်မက်သော မြေခွေးတစ်ကောင်ကြောင့် ခြင်္သေ့ညီနောင်တို့သည် ဒေါသရှေ့ထား၍ အချင့်အချိန် မစဉ်းစားဘဲ ခုန်အုပ်ကြရာ ကျောက်သလင်းဂူနံရံနှင့် ဆောင့်မိကာ သေကြေကြရသည်။ အကြီးဆုံးဖြစ်သော ဘုရားလောင်းခြင်္သေ့မင်းက ဆင်ခြင်ဉာဏ်ဖြင့် ခြင်္သေ့ဟောက်သံ ဟောက်လိုက်သောအခါ မြေခွေးသည် ကြောက်လန့်လွန်း၍ သေဆုံးလေသည်။","moral":"မိမိအင်အားကို မချင့်ချိန်ဘဲ ဒေါသအလျောက် ရမ်းကားပြုမူခြင်းသည် ပျက်စီးခြင်းသို့ ရောက်စေ၏။"},{"no":153,"pali":"Sūkarajātaka","mm":"သူကရဇာတ်","summary":"ဝက်တစ်ကောင်သည် မိမိအင်အားကို မချင့်ချိန်ဘဲ ဘုရားလောင်းခြင်္သေ့မင်းအား စစ်ထိုးရန် စိန်ခေါ်ပြီးမှ ကြောက်လန့်သဖြင့် မစင်ပုပ်တွင် လူးလှိမ့်ကာ ကိုယ်ကို ညစ်ညမ်းစေသည်။ စက်ဆုပ်ဖွယ် ညစ်ညမ်းသောကိုယ်ကို မထိလိုသော ခြင်္သေ့မင်းက အရှုံးပေးဟန်ဖြင့် ရှောင်ကြဉ်သွားလေသည်။","moral":"ပညာရှိတို့သည် ယုတ်ညံ့ညစ်ညမ်းသူတို့နှင့် ထိတွေ့ဆက်ဆံရန် ရှောင်ကြဉ်ကြ၏။"},{"no":154,"pali":"Uragajātaka","mm":"ဥရဂဇာတ်","summary":"ဂဠုန်၏ လိုက်လံဖမ်းဆီးခြင်းကို ခံရသော နဂါးသည် ဘုရားလောင်းရသေ့၏ အဝတ်တော်၌ ခိုလှုံသဖြင့် ဂဠုန်သည် ရသေ့ကို ရိုသေထောက်ထားသောအားဖြင့် မဖမ်းဘဲ နေလေသည်။ ရသေ့၏ တရားဟောကြားမှုကြောင့် နဂါးနှင့် ဂဠုန်တို့ ရန်ငြိမ်း၍ မိတ်ဆွေဖြစ်သွားကြသည်။","moral":"သီလရှိသူကို ခိုလှုံခြင်းနှင့် သည်းခံခွင့်လွှတ်ခြင်းသည် ရန်ဘေးကို ငြိမ်းစေ၏။"},{"no":155,"pali":"Bhaggajātaka","mm":"ဘဂ္ဂဇာတ်","summary":"ဘုရားလောင်းနှင့် ဖခင်တို့သည် ဘီလူးစိုးမိုးရာ တဲကျောင်း၌ ညအိပ်ကြရာ နှာချေသောအခါ ကောင်းချီးမင်္ဂလာစကား မဆိုသူကို စားခွင့်ရထားသော ဘီလူးက ချောင်းမြောင်းနေသည်။ ဖခင် နှာချေသောအခါ ဘုရားလောင်းက အသက်ရှည်ကြောင်း ကောင်းချီးစကား ဆိုလိုက်သဖြင့် ဘီလူးသည် စားခွင့်မရဘဲ ဘုရားလောင်း၏ ဆုံးမခြင်းကိုပင် ခံယူရလေသည်။","moral":"မင်္ဂလာရှိသော စကားနှင့် သတိရှိသော အပြောအဆိုသည် ဘေးရန်မှ ကယ်တင်နိုင်၏။"},{"no":156,"pali":"Alīnacittajātaka","mm":"အလီနစိတ္တဇာတ်","summary":"ခြေ၌ ဆူးစူးဝင်၍ ဝေဒနာခံစားနေရသော ဆင်ကြီးကို လက်သမားတို့က ကုသပေးရာ ကျေးဇူးသိတတ်သော ဆင်ကြီးသည် သူတို့၏အမှုကို ကူညီဆောင်ရွက်ပေးပြီး မိမိ၏ ဆင်ဖြူသားငယ်ကိုလည်း အပ်နှံခဲ့သည်။ ထိုဆင်ငယ်သည် နောင်အခါ အလီနစိတ္တမင်းသားငယ်၏ နိုင်ငံတော်ကို ရန်သူ့လက်မှ ကာကွယ်ကယ်တင်ပေးလေသည်။","moral":"ကျေးဇူးသိတတ်၍ ကျေးဇူးဆပ်တတ်ခြင်းသည် မြင့်မြတ်သော အကျင့်ဖြစ်၏။"},{"no":157,"pali":"Guṇajātaka","mm":"ဂုဏဇာတ်","summary":"ညွန်တွင် ကျွံနစ်နေသော ဘုရားလောင်းခြင်္သေ့မင်းကို မြေခွေးက ကယ်တင်ခဲ့သဖြင့် ခြင်္သေ့မင်းသည် အစာအာဟာရ ခွဲဝေကျွေးမွေးကာ မိတ်ဆွေအဖြစ် ပြုစုသည်။ ခြင်္သေ့မက မနာလိုစိတ် ဖြစ်သောအခါ ခြင်္သေ့မင်းက ကျေးဇူးပြုဖူးသူ၏ ဂုဏ်ကို ဖော်ပြ၍ ဆုံးမလေသည်။","moral":"မိမိအား ပြုဖူးသော ကျေးဇူးကို မည်သည့်အခါမျှ မမေ့အပ်။"},{"no":158,"pali":"Suhanujātaka","mm":"သုဟနုဇာတ်","summary":"ကြမ်းကြုတ်ခက်ထန်သော မြင်းနှစ်ကောင်ဖြစ်သည့် သုဟနုနှင့် သောဏတို့သည် အချင်းချင်း တွေ့ဆုံသောအခါ ခက်ထန်မှုမပြဘဲ ချစ်ခင်ရင်းနှီးစွာ နေကြသည်။ ဘုရားလောင်းအမတ်က သဘောသဘာဝ တူညီသူချင်း ဆည်းကပ်ပေါင်းသင်းတတ်ကြောင်း မင်းကြီးအား ရှင်းပြလေသည်။","moral":"စိတ်နေသဘောထား တူညီသူချင်းသာ ပေါင်းဖော်မိတ်ဖွဲ့တတ်ကြ၏။"},{"no":159,"pali":"Morajātaka","mm":"မောရဇာတ်","summary":"ရွှေဥဒေါင်းမင်းဖြစ်သော ဘုရားလောင်းသည် နေ့စဉ် နံနက်နှင့် ညနေတို့၌ အစောင့်အရှောက် ပရိတ်မန္တန်ကို ရွတ်ဆိုလေ့ရှိသဖြင့် ကာလကြာရှည်စွာ မည်သူမျှ မဖမ်းနိုင်ခဲ့ချေ။ ဥဒေါင်းမ၏ အသံကြောင့် တပ်မက်စိတ်ဝင်ကာ မန္တန်ရွတ်ရန် မေ့လျော့သောနေ့၌ ထောင်ချောက်မိသွားပြီး မင်းကြီးထံ ရောက်သောအခါ တရားဟောကြား၍ လွတ်မြောက်ခဲ့လေသည်။","moral":"မမေ့မလျော့ သတိရှိခြင်း (အပ္ပမာဒတရား)သည် ဘေးရန်မှ စောင့်ရှောက်၏။"},{"no":160,"pali":"Vinīlajātaka","mm":"ဝိနီလဇာတ်","summary":"ဟင်္သာမင်းနှင့် ကျီးမတို့မှ ဖွားမြင်သော ဝိနီလကသည် မိမိကိုယ်ကို အထင်ကြီးလျက် သူ့ကို တံပိုးဖြင့် သယ်ဆောင်လာသော ဟင်္သာညီနောင်တို့ကို မြင်းကဲ့သို့ သဘောထားကာ မောက်မာစွာ ပြောဆိုသည်။ ဟင်္သာမင်းကြီးက ထိုမောက်မာမှုကို ဆုံးမ၍ မိခင်ရှိရာသို့ ပြန်ပို့စေလေသည်။","moral":"မိမိအခြေအနေကို မဆင်ခြင်ဘဲ မောက်မာထောင်လွှားခြင်းသည် အပြစ်တင်ခြင်းကို ခံရ၏။"},{"no":161,"pali":"Indasamānagottajātaka","mm":"ဣန္ဒသမာနဂေါတ္တဇာတ်","summary":"ဆရာဖြစ်သော ဘုရားလောင်းရသေ့ကြီး၏ တားမြစ်စကားကို နားမထောင်ဘဲ ဣန္ဒသမာနဂေါတ္တရသေ့သည် ဆင်ငယ်တစ်ကောင်ကို ချစ်ခင်စွာ မွေးမြူထားရာ ဆင်ကြီးပြင်းလာသောအခါ တစ်နေ့၌ မိမိကိုပင် သတ်ဖြတ်ခြင်း ခံရလေသည်။","moral":"ပညာရှိ၏ အဆုံးအမကို နာယူ၍ မသင့်လျော်သော ပေါင်းသင်းမှုကို ရှောင်အပ်၏။"},{"no":162,"pali":"Santhavajātaka","mm":"သန္ထဝဇာတ်","summary":"ဘုရားလောင်းပုဏ္ဏားသည် ယဇ်မီးကို ထောပတ်စသည်တို့ဖြင့် ပူဇော်မွေးမြူခဲ့ရာ တစ်နေ့တွင် ထိုမီးသည် ဟုန်းဟုန်းတောက်လောင်ကာ မိမိ၏ တဲကျောင်းကိုပင် လောင်ကျွမ်းစေသည်။ ထို့ကြောင့် မီးပူဇော်မှုကို စွန့်၍ တောထွက်ကာ ရသေ့ရဟန်းပြုလေသည်။","moral":"မသင့်လျော်သော ရင်းနှီးကျွမ်းဝင်မှုသည် ဘေးဥပဒ်ကို ဆောင်တတ်၏။"},{"no":163,"pali":"Susīmajātaka","mm":"သုသီမဇာတ်","summary":"ပုရောဟိတ်ဆရာကြီး ကွယ်လွန်သောအခါ သားဖြစ်သူ ဘုရားလောင်း သုသီမလုလင်သည် ဆင်မင်္ဂလာပွဲတော် မတိုင်မီ အချိန်တိုအတွင်း တက္ကသိုလ်ပြည်သို့ သွားရောက်၍ ဗေဒကျမ်းနှင့် ဆင်အတတ်ကျမ်းတို့ကို တတ်မြောက်အောင် သင်ယူပြီးလျှင် မိမိအမျိုး၏ ရာထူးဌာနန္တရကို ပြန်လည်ရရှိလေသည်။","moral":"လုံ့လဝီရိယဖြင့် ပညာသင်ယူခြင်းသည် မိမိ၏အကျိုးကို ပြီးစေ၏။"},{"no":164,"pali":"Gijjhajātaka","mm":"ဂိဇ္ဈဇာတ်","summary":"ဘုရားလောင်း လင်းတမင်းသည် အိုမင်း၍ မျက်စိအလင်း ကွယ်နေသော မိဘနှစ်ပါးကို အစာရှာ၍ ကျွေးမွေးပြုစုသည်။ မုဆိုး၏ ကျော့ကွင်းမိသောအခါ မိမိအတွက် မဟုတ်ဘဲ မိဘတို့အတွက်သာ စိုးရိမ်မြည်တမ်းသည်ကို ကြားရသော မုဆိုးက ကြည်ညိုသဖြင့် လွှတ်ပေးလေသည်။","moral":"မိဘကျေးဇူးကို သိ၍ ပြုစုလုပ်ကျွေးခြင်းသည် မြတ်သောအကျင့်ဖြစ်၏။"},{"no":165,"pali":"Nakulajātaka","mm":"နကုလဇာတ်","summary":"ရန်ငြိုးဖွဲ့လျက်နေကြသော မြွေနှင့် မြွေပါတို့သည် ဘုရားလောင်းရသေ့၏ ဆုံးမမှုဖြင့် ရန်ငြိမ်း၍ မိတ်ဆွေဖွဲ့ကြသော်လည်း မြွေပါသည် သတိမလျော့ဘဲ စောင့်ကြပ်လျက် နေသေးသည်။ ရသေ့က ထိုအခြင်းအရာကို ထောက်၍ ရန်သူဟောင်းအပေါ် ထားအပ်သော သတိတရားကို ဟောကြားလေသည်။","moral":"ရန်သူဟောင်းကို အကြွင်းမဲ့ အလွယ်တကူ မယုံကြည်အပ်။"},{"no":166,"pali":"Upasāḷakajātaka","mm":"ဥပသာဠကဇာတ်","summary":"ဥပသာဠကပုဏ္ဏားသည် မိမိအလောင်းကို စင်ကြယ်သော သင်္ချိုင်းမြေ၌သာ သင်္ဂြိုဟ်လိုသဖြင့် နေရာရွေးချယ်နေသည်။ ဘုရားလောင်းက ထိုမြေတစ်နေရာတည်း၌ပင် ဥပသာဠကအမည်ရှိ ပုဏ္ဏားပေါင်း တစ်သောင်းလေးထောင် မီးသင်္ဂြိုဟ်ခြင်း ခံခဲ့ရဖူးကြောင်း ဖော်ပြ၍ သေခြင်းတရားမှ ကင်းလွတ်ရာမြေဟူ၍ မရှိကြောင်း ဟောကြားလေသည်။","moral":"သေခြင်းတရားမှ လွတ်ရာအရပ်ဟူ၍ မရှိ၊ သီလဂုဏ်သာလျှင် အားထားရာဖြစ်၏။"},{"no":167,"pali":"Samiddhijātaka","mm":"သမိဒ္ဓိဇာတ်","summary":"ရဟန်းပျို သမိဒ္ဓိကို နတ်သမီးက ကာမဂုဏ်ဖြင့် သွေးဆောင်ဖြားယောင်းသကဲ့သို့ ရှေးအခါကလည်း ဘုရားလောင်းရသေ့ကို နတ်သမီးက သွေးဆောင်ခဲ့ဖူးသည်။ သေမည့်အချိန်ကို မသိနိုင်သဖြင့် ကာမဂုဏ်ခံစားရန် အချိန်မရှိ၊ တရားအားထုတ်ရန်သာ ရှိကြောင်း ပြန်လည်ဟောကြားခဲ့လေသည်။","moral":"သေချိန်ကို မသိနိုင်သောကြောင့် ကုသိုလ်တရားကို ဆောလျင်စွာ ပြီးစေအပ်၏။"},{"no":168,"pali":"Sakuṇagghijātaka","mm":"သကုဏဂ္ဃိဇာတ်","summary":"ဘုရားလောင်း ငုံးငယ်သည် မိမိကျက်စားရာ လယ်ထွန်ကြောင်းမှ လွန်၍ သွားမိစဉ် စွန်၏ ဖမ်းဆီးခြင်းကို ခံရသည်။ လွှတ်ပေးသောအခါ မိမိနယ်မြေဖြစ်သော မြေစိုင်ကြီးအနီး၌ ရပ်လျက် စိန်ခေါ်ရာ စွန်သည် အရှိန်ပြင်းစွာ ထိုးဆင်းသဖြင့် မြေစိုင်နှင့် ဆောင့်မိ၍ သေလေသည်။","moral":"မိမိကျက်စားရာ နယ်မြေကို မစွန့်အပ်၊ စွန့်လျှင် ဘေးရောက်တတ်၏။"},{"no":169,"pali":"Arakajātaka","mm":"အရကဇာတ်","summary":"ဘုရားလောင်း အရကဆရာကြီးသည် တပည့်ပရိသတ်တို့အား မေတ္တာဘာဝနာ ပွားများခြင်း၏ အကျိုးအာနိသင်ကို ဟောကြားညွှန်ပြ၍ မိမိကိုယ်တိုင်လည်း မေတ္တာတရားကို ပွားများခဲ့သဖြင့် ဗြဟ္မာ့ပြည်၌ ကာလကြာမြင့်စွာ ဖြစ်ရလေသည်။","moral":"မေတ္တာတရား ပွားများခြင်းသည် မြင့်မြတ်ကြီးမားသော အကျိုးကို ဆောင်၏။"},{"no":170,"pali":"Kakaṇṭakajātaka","mm":"ကကဏ္ဋကဇာတ်","summary":"မင်းကြီးအား နေ့စဉ် ရိုသေစွာ ဦးညွှတ်လေ့ရှိသော ပုတ်သင်ညိုသည် ဥစ္စာအနည်းငယ် ရရှိပြီးနောက် မာန်မာနတက်၍ မရိုသေတော့ချေ။ ပညာရှိသုခမိန်က ရုတ်တရက်ရသော စည်းစိမ်ကြောင့် မာန်တက်ခြင်းဖြစ်ကြောင်း မင်းကြီးအား ရှင်းလင်းဖော်ပြလေသည်။","moral":"ယုတ်ညံ့သူသည် စည်းစိမ်အနည်းငယ် ရရုံမျှဖြင့်ပင် မာန်မာနတက်တတ်၏။"},{"no":171,"pali":"Kalyāṇadhammajātaka","mm":"ကလျာဏဓမ္မဇာတ်","summary":"ဗာရာဏသီသူဌေးဖြစ်သော ဘုရားလောင်းသည် မင်းကြီးထံ ခစားပြီးနောက် အကြားအာရုံ ချို့တဲ့သော ယောက္ခမ၏ အမှားကြောင့် ရဟန်းပြုတော့မည်ဟူသော သတင်းထွက်သွားရာ ထွက်ပြီးသော ကောင်းသောစကားကို မဖျက်သင့်ဟု နှလုံးသွင်းကာ အမှန်ပင် တောထွက်၍ ရသေ့ပြုလေသည်။","moral":"သူတော်ကောင်းတို့သည် ဆိုပြီးသောစကားကို တည်စေကြ၏။"},{"no":172,"pali":"Daddarajātaka","mm":"ဒဒ္ဒရဇာတ်","summary":"ဒဒ္ဒရတောင်၌ ခြင်္သေ့တို့နှင့်အတူ နေသော မြေခွေးသည် ခြင်္သေ့ဟောက်သံကို အတုယူ၍ ဟောက်ရာ မိမိ၏ ယုတ်ညံ့သောအသံကြောင့် အမျိုးပေါ်လွင်ကာ အရှက်ရလေသည်။ ဘုရားလောင်းခြင်္သေ့မင်းက သားငယ်အား ထိုအကြောင်းကို ရှင်းပြလေသည်။","moral":"မိမိ၏ အသံအပြောအဆိုက မိမိ၏ အမျိုးဇာတိကို ဖော်ပြတတ်၏။"},{"no":173,"pali":"Makkaṭajātaka","mm":"မက္ကဋဇာတ်","summary":"မိုးရွာသောည၌ ရသေ့အသွင်ဆောင်၍ တဲကျောင်းသို့ မီးလှုံရန် ချဉ်းကပ်လာသော မျောက်ကို ဘုရားလောင်းရသေ့၏ သားက မြင်သိသဖြင့် ဟန်ဆောင်မျှသာဖြစ်သော ထိုမျောက်ကို နှင်ထုတ်လိုက်ကြလေသည်။","moral":"အဝတ်အသွင်မျှဖြင့် သူတော်ကောင်း မဖြစ်နိုင်၊ အကျင့်သီလသာ ပဓာနဖြစ်၏။"},{"no":174,"pali":"Dubbhiyamakkaṭajātaka","mm":"ဒုဗ္ဘိယမက္ကဋဇာတ်","summary":"ဘုရားလောင်းပုဏ္ဏားသည် ရေငတ်နေသော မျောက်အား ရေတွင်းမှ ရေခပ်၍ တိုက်ကျွေးကာ ကျေးဇူးပြုသော်လည်း မျောက်သည် ကျေးဇူးမသိဘဲ မဲ့ရွဲ့ပြက်ရယ်ပြုကာ မစင်စွန့်ချ၍ ထွက်ပြေးလေသည်။","moral":"ယုတ်မာသောသူအား ပြုသောကျေးဇူးသည် အချည်းနှီးသာ ဖြစ်တတ်၏။"},{"no":175,"pali":"Ādiccupaṭṭhānajātaka","mm":"အာဒိစ္စုပဋ္ဌာနဇာတ်","summary":"ရသေ့တို့၏ ကျောင်းသို့ ရောက်လာသော မျောက်တစ်ကောင်သည် နေမင်းကို ရှိခိုးကိုးကွယ်ဟန်ဆောင်၍ ရပ်နေသဖြင့် လူတို့က သူတော်ကောင်းအထင်ဖြင့် ကြည်ညိုကြသည်။ ဘုရားလောင်းရသေ့ကြီးက ထိုမျောက်၏ စဉ်းလဲကောက်ကျစ်သော အကျင့်ကို ဖော်ထုတ်ပြလေသည်။","moral":"ဟန်ဆောင်သော ကိုယ်ကျင့်တရားကို အထင်မကြီးအပ်၊ အမူအကျင့်ကို စူးစမ်း၍သာ ယုံကြည်အပ်၏။"},{"no":176,"pali":"Kaḷāyamuṭṭhijātaka","mm":"ကဠာယမုဋ္ဌိဇာတ်","summary":"မျောက်တစ်ကောင်သည် လက်တစ်ဆုပ်စာ ပဲများကို ကိုင်ဆောင်ထားရင်း ပဲတစ်စေ့ ကျသွားသောအခါ လက်ထဲရှိ ပဲအားလုံးကို စွန့်ပစ်၍ ထိုတစ်စေ့ကို လိုက်ရှာသည်။ ဘုရားလောင်းအမတ်က ထိုဥပမာဖြင့် အနည်းငယ်အတွက် အများကို မဆုံးရှုံးစေရန် မင်းကြီးအား သတိပေးလျှောက်ထားလေသည်။","moral":"အနည်းငယ်သော အကျိုးအတွက် ကြီးမားသောအကျိုးကို မဆုံးရှုံးစေအပ်။"},{"no":177,"pali":"Tindukajātaka","mm":"တိန္ဒုကဇာတ်","summary":"ဘုရားလောင်း မျောက်မင်းသည် နောက်ပါ မျောက်အပေါင်းနှင့်အတူ ရွာအနီးရှိ တိန္ဒုကသီးများကို စားရန် သွားရောက်ရာ ရွာသားတို့က ဝိုင်းရံဖမ်းဆီးမည် ပြုကြသည်။ မျောက်မင်းသည် ဉာဏ်ပညာဖြင့် ထွက်ပေါက်လမ်းကို ရှာဖွေ၍ အပေါင်းအဖော်တို့ကို ဘေးမဲ့ရာသို့ ကယ်ထုတ်လေသည်။","moral":"ပညာရှိသော အကြီးအကဲသည် နောက်လိုက်တို့ကို ဘေးအန္တရာယ်မှ ကယ်တင်နိုင်၏။"},{"no":178,"pali":"Kacchapajātaka","mm":"ကစ္ဆပဇာတ်","summary":"ရေကန် ခန်းခြောက်မည့်အခါ အခြားသတ္တဝါတို့သည် ရေရှိရာသို့ ပြောင်းရွှေ့ကြသော်လည်း လိပ်တစ်ကောင်သည် မွေးရပ်ဌာနေကို မစွန့်နိုင်ဘဲ ညွန်တွင်း၌ မြှုပ်၍ နေခဲ့သည်။ မြေတူးသူ၏ ပေါက်တူးဒဏ်သင့်၍ သေရလေသည်။ ဘုရားလောင်းအမတ်က ထိုဖြစ်ရပ်ဖြင့် မင်းကြီးအား တရားပြလေသည်။","moral":"အလွန်အကျွံ တွယ်တာစွဲလမ်းမှုသည် ပျက်စီးခြင်း၏ အကြောင်းရင်းဖြစ်၏။"},{"no":179,"pali":"Satadhammajātaka","mm":"သတဓမ္မဇာတ်","summary":"မာနကြီးသော သတဓမ္မလုလင်သည် ခရီးလမ်း၌ ဆာလောင်မွတ်သိပ်လွန်းသဖြင့် ဘုရားလောင်း စဏ္ဍာလအမျိုးသား၏ စားကြွင်းစားကျန်ကို စားမိပြီးနောက် ကြီးစွာသော နောင်တရလျက် အော့အန်ရလေသည်။ မထိုက်မတန်သောနည်းဖြင့် ရသောအရာသည် ချမ်းသာကို မပေးနိုင်ကြောင်း ဤဇာတ်က ပြဆို၏။","moral":"မသင့်မလျော်သောနည်းဖြင့် ရရှိသောလာဘ်သည် စင်ကြယ်သောချမ်းသာကို မပေးနိုင်။"},{"no":180,"pali":"Duddadajātaka","mm":"ဒုဒ္ဒဒဇာတ်","summary":"ပေးလှူရန် ခဲယဉ်းသောအရာကို စွန့်လှူတတ်သော သူတော်ကောင်းတို့၏ အလှူအကြောင်းကို ဟောကြားသောဇာတ်ဖြစ်၍ ဘုရားလောင်းရသေ့က ဆင်းရဲသည်ဖြစ်စေ ချမ်းသာသည်ဖြစ်စေ စေတနာသဒ္ဓါဖြင့် ပေးလှူသော အလှူ၏ အကျိုးကြီးမားပုံကို ညွှန်ပြသည်။","moral":"ပေးလှူရန် ခက်ခဲသောအရာကို စွန့်လှူနိုင်ခြင်းသည် အကျိုးကြီးမား၏။"},{"no":181,"pali":"Asadisajātaka","mm":"အသဒိသဇာတ်","summary":"လေးအတတ်၌ နှိုင်းယှဉ်ဖွယ်မရှိသော ဘုရားလောင်း အသဒိသမင်းသားသည် ထီးနန်းကို ညီတော်အား စွန့်၍ တိုင်းတစ်ပါး၌ နေထိုင်စဉ် ညီတော်၏ ဗာရာဏသီပြည်ကို မင်းခုနစ်ပါးတို့ ဝိုင်းရံကြသောအခါ မြားတစ်စင်းတည်း၏ အစွမ်းဖြင့် စစ်မတိုက်ဘဲ ရန်သူတို့ကို ဆုတ်ခွာစေသည်။ ထို့နောက် တောထွက်၍ ရသေ့ပြုလေသည်။","moral":"အတတ်ပညာကို လောဘဒေါသ မပါဘဲ သုံးစွဲ၍ စွန့်လွှတ်နိုင်သူသည် မြင့်မြတ်၏။"},{"no":182,"pali":"Saṅgāmāvacarajātaka","mm":"သင်္ဂါမာဝစရဇာတ်","summary":"စစ်မြေပြင်ဝင် ဆင်ပြောင်ကြီးသည် ကျွမ်းကျင်သော ဆင်ထိန်းဖြစ်သူ ဘုရားလောင်း၏ တိုက်တွန်းအားပေး လမ်းညွှန်မှုကြောင့် ကြောက်ရွံ့ခြင်းကင်းစွာ တိုက်ခိုက်ကာ မြို့တံခါးကို ဖြိုဖျက်၍ အောင်မြင်မှုကို ဆောင်ကြဉ်းပေးလေသည်။","moral":"ကောင်းသော လမ်းညွှန်ဆရာ၏ အားပေးမှုသည် အောင်မြင်မှုကို ဖြစ်စေ၏။"},{"no":183,"pali":"Vālodakajātaka","mm":"ဝါလောဒကဇာတ်","summary":"မြင်းအာဇာနည်တို့သည် စပျစ်ရည်စစ်ကို သောက်ရသော်လည်း ငြိမ်သက်တည်ကြည်စွာ နေကြပြီး မြည်းတို့မူကား ထိုအဖတ်ကို ရေစိမ်ထားသော အရည်ကြမ်းမျှ သောက်ရရုံဖြင့် မာန်တက်ကာ ဆူညံစွာ အော်မြည်ကြသည်။ ဘုရားလောင်းအမတ်က ထိုအကြောင်းကို မင်းကြီးအား ရှင်းလင်းလျှောက်ထားလေသည်။","moral":"ယုတ်ညံ့သူသည် အနည်းငယ်သော အရသာမျှဖြင့်ပင် ယစ်မူးမာန်တက်တတ်၏။"},{"no":184,"pali":"Giridattajātaka","mm":"ဂိရိဒတ္တဇာတ်","summary":"မင်းကြီး၏ မင်္ဂလာမြင်းသည် ခြေဆွံ့သော မြင်းထိန်း ဂိရိဒတ္တကို အတုမြင်၍ ခြေဆွံ့ဟန် လျှောက်လာသည်။ ဘုရားလောင်းအမတ်က အကြောင်းရင်းကို စူးစမ်းသိရှိ၍ ကောင်းသော မြင်းထိန်းနှင့် လဲလှယ်စေရာ မြင်းသည် ပကတိအတိုင်း ပြန်လည်ကောင်းမွန်လာလေသည်။","moral":"ပေါင်းသင်းဆက်ဆံသူ၏ အကျင့်သည် မိမိအပေါ် ကူးစက်သက်ရောက်တတ်၏။"},{"no":185,"pali":"Anabhiratijātaka","mm":"အနဘိရတိဇာတ်","summary":"ရေကြည်သည် နောက်ကျိသွားလျှင် အရိပ်မထင်သကဲ့သို့ စိတ်နောက်ကျိလျှင် သင်ယူထားသော အတတ်ပညာ မထင်ရှားကြောင်း၊ လောကီအမှုကိစ္စတို့ဖြင့် စိတ်ပူပန်နောက်ကျိနေသော ပုဏ္ဏားလုလင်အား ဘုရားလောင်းဆရာကြီးက ဥပမာဆောင်၍ ဟောကြားလေသည်။","moral":"ငြိမ်းချမ်းတည်ကြည်သော စိတ်သာလျှင် အမှန်တရားကို ရှင်းလင်းစွာ မြင်နိုင်၏။"},{"no":186,"pali":"Dadhivāhanajātaka","mm":"ဒဓိဝါဟနဇာတ်","summary":"ဒဓိဝါဟနမင်း၏ ဥယျာဉ်ရှိ ချိုမြိန်သော သရက်ပင်သည် အနီး၌ ခါးသောအပင်တို့ ပေါက်ရောက်နေသောကြောင့် အသီးအရသာ ခါးသွားလေသည်။ ဘုရားလောင်းအမတ်က မကောင်းသော အနီးအပါးကြောင့် ဖြစ်ကြောင်း ထောက်ပြ၍ ထိုအပင်တို့ကို ဖယ်ရှားစေရာ သရက်သီးတို့ ပြန်၍ ချိုမြိန်လာလေသည်။","moral":"မကောင်းသော အပေါင်းအသင်းသည် ကောင်းမြတ်သူကိုပင် ဖောက်ပြန်စေတတ်၏။"},{"no":187,"pali":"Catumaṭṭhajātaka","mm":"စတုမဋ္ဌဇာတ်","summary":"မြင့်မြတ်သော ဟင်္သာညီနောင်တို့ တရားစကား ပြောဆိုနေရာသို့ မြေခွေးတစ်ကောင် ဝင်ရောက်၍ မိမိကိုယ်ကို ဂုဏ်လေးပါးနှင့် ပြည့်စုံသူဟု ကြွားဝါသောကြောင့် ဟင်္သာတို့သည် ယုတ်ညံ့သူနှင့် မရောနှောလို၍ ထိုနေရာမှ ထွက်ခွာသွားကြလေသည်။","moral":"ယုတ်ညံ့သူသည် မိမိကိုယ်ကို အထင်ကြီးကာ မြင့်မြတ်သူတို့နှင့် ရောနှောလိုတတ်၏။"},{"no":188,"pali":"Sīhakotthujātaka","mm":"သီဟကောတ္ထုဇာတ်","summary":"ခြင်္သေ့ဖနှင့် မြေခွေးမတို့မှ ဖွားသောသားသည် ကိုယ်ခန္ဓာအားဖြင့် ခြင်္သေ့နှင့် တူသော်လည်း အသံမှာ မြေခွေးသံသာ ဖြစ်နေသည်။ ဖခင်ခြင်္သေ့မင်းက အသံမမြည်ဘဲ ငြိမ်သက်စွာနေလျှင် အမျိုးဇာတိ မပေါ်နိုင်ကြောင်း ထိုသားအား ဆုံးမလေသည်။","moral":"မိမိအားနည်းချက် ပေါ်လွင်စေမည့်စကားကို မပြောဘဲ ငြိမ်သက်ခြင်းသည် ကောင်း၏။"},{"no":189,"pali":"Sīhacammajātaka","mm":"သီဟစမ္မဇာတ်","summary":"ကုန်သည်တစ်ဦးသည် မိမိ၏မြည်းကို ခြင်္သေ့ရေခြုံပေးကာ လယ်ကောက်ခင်းများ၌ အခမဲ့ ကျက်စားစေသည်။ တစ်နေ့တွင် မြည်း၏ အော်မြည်သံ ပေါ်ထွက်သွားသဖြင့် လူတို့ သိရှိကြကာ ရိုက်နှက်ကြရာ မြည်းသည် ပျက်စီးခြင်းသို့ ရောက်ရလေသည်။","moral":"အယောင်ဆောင်ခြင်းသည် ပင်ကိုအသံ ပေါ်သည်နှင့် တစ်ပြိုင်နက် ပျက်စီးတတ်၏။"},{"no":190,"pali":"Sīlānisaṁsajātaka","mm":"သီလာနိသံသဇာတ်","summary":"သီလရှိသော ဥပါသကာနှင့် အဆွေခင်ပွန်းတို့ စီးနင်းလိုက်ပါသော သင်္ဘောသည် ပင်လယ်၌ ပျက်လေသည်။ သီလရှိသူသည် မိမိ၏ သီလစောင့်ထိန်းမှု အစွမ်းကြောင့် နတ်၏ စောင်မကူညီခြင်းကို ရရှိပြီး အတူပါလာသော အဆွေခင်ပွန်းကိုပါ ကယ်တင်နိုင်ခဲ့လေသည်။","moral":"သီလ၏ အကျိုးအာနိသင်သည် ကြီးမားသောဘေးမှပင် ကယ်တင်နိုင်၏။"},{"no":191,"pali":"Ruhakajātaka","mm":"ရုဟကဇာတ်","summary":"ရုဟကပုရောဟိတ်သည် ဇနီးဖြစ်သူကြောင့် လူအများရှေ့ အရှက်ရသဖြင့် သူမကို စွန့်ပစ်ရန် ကြံစည်သောအခါ ဘုရားလောင်း ဗာရာဏသီမင်းက ပြတ်သွားသော လေးကြိုးကိုပင် ပြန်ဆက်၍ သုံးနိုင်သေးသည်ဟူသော ဥပမာဖြင့် ခွင့်လွှတ်ကျေအေးရန် ဆုံးမလေသည်။","moral":"ပျက်ပြားသွားသော ဆက်ဆံရေးကို စွန့်ပစ်မည့်အစား ပြန်လည်ပြုပြင် ခွင့်လွှတ်သင့်၏။"},{"no":192,"pali":"Sirikāḷakaṇṇijātaka","mm":"သိရိကာဠကဏ္ဏိဇာတ်","summary":"ကံကောင်းခြင်း သိရီမင်္ဂလာနှင့် ကံဆိုးခြင်း ကာဠကဏ္ဏီတို့၏ ခြားနားပုံကို ပြဆိုသောဇာတ်ဖြစ်၍ အကျယ်ကို မဟောသဓပညာရှိ ပါဝင်သော ဇာတ်ကြီးနှင့် ဆက်စပ်ထားသည်။ သီလသမာဓိဂုဏ်ရှိသူထံသို့သာ သိရီမင်္ဂလာ ကပ်ရောက်ကြောင်း ပြဆို၏။","moral":"ကောင်းသောအကျင့်ရှိသူထံသို့သာ ကံကောင်းခြင်းမင်္ဂလာ ရောက်တတ်၏။"},{"no":193,"pali":"Cūḷapadumajātaka","mm":"စူဠပဒုမဇာ
