မြဲမြံစွာ စောင့်ထိန်းသဖြင့် နောင်အခါ ရသေ့ပြုကာ ပစ္စေကဗုဒ္ဓါ ဖြစ်လာ၍ မင်းကြီးအား တရားဟောလေသည်။ မင်းကြီးသည် ဇာတ်နိမ့်သူဟူ၍ မထီမဲ့မြင် မပြုဘဲ ရိုသေစွာ ပူဇော်လေသည်။","moral":"လူ၏ တန်ဖိုးသည် အမျိုးဇာတ်၌ မတည်၊ ကိုယ်ကျင့်သီလ၌သာ တည်၏။"},{"no":422,"pali":"Cetiyajātaka","mm":"စေတိယဇာတ်","summary":"တန်ခိုးပြည့်စုံသော စေတိယမင်းသည် ချစ်စုံမက်သူကို မျက်နှာသာပေးလိုသဖြင့် ပုရောဟိတ် ကပိလပုဏ္ဏား (ဘုရားလောင်း) ၏ တားမြစ်ချက်ကို မနာခံဘဲ မုသားစကားကို ဆိုလေသည်။ မုသားဆိုတိုင်း တန်ခိုးဂုဏ်သတ္တိတို့ တစ်ဆင့်ပြီးတစ်ဆင့် ဆုတ်ယုတ်ကာ နောက်ဆုံး၌ မြေမျိုခြင်းကို ခံရလေသည်။","moral":"မုသားစကားသည် ဆိုသူ၏ ဂုဏ်သတ္တိကို ဖျက်ဆီး၍ ပျက်စီးခြင်းသို့ ရောက်စေ၏။"},{"no":423,"pali":"Indriyajātaka","mm":"ဣန္ဒြိယဇာတ်","summary":"နာရဒရသေ့သည် ကာမရာဂ၏ နှိပ်စက်ခြင်းကို ခံရ၍ အကျင့်ပျက်လုနီး ဖြစ်နေသောအခါ ဆရာဖြစ်သော ရသေ့ကြီး (ဘုရားလောင်း) က ဣန္ဒြေတို့၏ အလိုသို့ လိုက်သူသည် ဆင်းရဲခြင်းသို့ ရောက်ရကြောင်း ဆုံးမ၍ ကယ်တင်လေသည်။","moral":"ဣန္ဒြေအလိုသို့ လိုက်ခြင်းသည် ဆင်းရဲအပေါင်း၏ အကြောင်းရင်း ဖြစ်၏။"},{"no":424,"pali":"Ādittajātaka","mm":"အာဒိတ္တဇာတ်","summary":"ဘုရားလောင်း မင်းကြီးနှင့် မိဖုရားတို့သည် ပစ္စေကဗုဒ္ဓါတို့အား ကြည်ညိုစွာ လှူဒါန်းကြပြီး \"မီးလောင်နေသော အိမ်မှ ထုတ်ဆောင်နိုင်သမျှ ပစ္စည်းသာ အသုံးဝင်သကဲ့သို့ လှူပြီးသော ဒါနသာလျှင် မိမိပိုင် စစ်စစ်ဖြစ်သည်\" ဟု ဟောကြားလေသည်။","moral":"မမြဲသောလောက၌ ပေးလှူခြင်းဖြင့်သာ ဥစ္စာ၏ အနှစ်သာရကို ရယူနိုင်၏။"},{"no":425,"pali":"Aṭṭhānajātaka","mm":"အဋ္ဌာနဇာတ်","summary":"သူဌေးသားတစ်ဦးသည် ပြည့်တန်ဆာမတစ်ဦးအား ဥစ္စာကုန်ခန်းသည်အထိ မြှုပ်နှံခဲ့သော်လည်း ဆင်းရဲသွားသောအခါ နှင်ထုတ်ခြင်းကို ခံရလေသည်။ သံဝေဂရ၍ ရသေ့ပြုပြီးနောက် \"မဖြစ်နိုင်သော အရာများ\" ကို ဥပမာဆောင်လျက် ကျေးဇူးမသိသူကို နောက်တစ်ဖန် အားမကိုးတော့ကြောင်း ဟောလေသည်။","moral":"ကျေးဇူးမသိသူကို အားကိုးမြှုပ်နှံခြင်းသည် ဆင်းရဲခြင်း၏ အကြောင်းဖြစ်၏။"},{"no":426,"pali":"Dīpijātaka","mm":"ဒီပိဇာတ်","summary":"ဆိတ်မတစ်ကောင်သည် ကျားသစ်အား ယဉ်ကျေးစွာ နှုတ်ဆက်ရှိခိုးသော်လည်း ကျားသစ်သည် မဟုတ်မမှန် အပြစ်ရှာဖွေကာ ဆိတ်မကို ကိုက်သတ်စားလေသည်။","moral":"စိတ်ယုတ်မာသူကို ယဉ်ကျေးသိမ်မွေ့မှုဖြင့် မချော့မော့နိုင်။"},{"no":427,"pali":"Gijjhajātaka","mm":"ဂိဇ္ဈဇာတ်","summary":"အားကောင်းသော လင်းတပျိုသည် လူကြီးသူမတို့၏ တားမြစ်စကားကို နားမထောင်ဘဲ ပျံနိုင်သည့် အတိုင်းအတာကို ကျော်လွန်၍ အလွန်မြင့်စွာ ပျံတက်သဖြင့် ဝေရမ္ဘလေပြင်း တိုက်ခတ်ခြင်းကြောင့် ကျေမွပျက်စီးရလေသည်။","moral":"ပညာရှိ လူကြီးသူမတို့၏ အဆုံးအမကို လွန်ဆန်သူသည် ပျက်စီးခြင်းသို့ ရောက်၏။"},{"no":428,"pali":"Kosambiyajātaka","mm":"ကောသမ္ဗိယဇာတ်","summary":"ကောသမ္ဗီပြည်၌ ရဟန်းတို့ ခိုက်ရန်ဖြစ်ကြသောအခါ မြတ်စွာဘုရားသည် ခမည်းတော် ဒီဃီတိမင်းကို သတ်ခဲ့သော ရန်သူ ဗြဟ္မဒတ်မင်းအား ဒီဃာဝုမင်းသား (ဘုရားလောင်း) က လက်စားမချေဘဲ ခွင့်လွှတ်ခဲ့သဖြင့် ရန်ငြိမ်းခဲ့ပုံကို ဟောကြားလေသည်။","moral":"ရန်ကို ရန်ချင်း မတုံ့ပြန်ဘဲ ခန္တီမေတ္တာဖြင့်သာ ငြိမ်းစေနိုင်၏။"},{"no":429,"pali":"Mahāsuvajātaka","mm":"မဟာသုဝဇာတ်","summary":"ကျေးငှက်မင်း (ဘုရားလောင်း) သည် အသီးကုန်ခန်း ခြောက်သွေ့သွားသော သဖန်းပင်ကို ကျေးဇူးတင်သောစိတ်ဖြင့် မစွန့်ခွာဘဲ မှီခိုနေမြဲ နေလေသည်။ သိကြားမင်းသည် စမ်းသပ်ပြီးနောက် ကြည်ညို၍ သစ်ပင်ကို ပြန်လည် စိမ်းလန်းစေလေသည်။","moral":"ကျေးဇူးရှင်ကို ဆင်းရဲသောအခါ၌ မစွန့်ပစ်အပ်။"},{"no":430,"pali":"Cūḷasuvajātaka","mm":"စူဠသုဝဇာတ်","summary":"ကျေးငှက် (ဘုရားလောင်း) သည် မိမိမှီခိုခဲ့သော သစ်ပင်ကြီး ခြောက်သွေ့ဆွေးမြေ့သွားသော်လည်း ကျေးဇူးကို အောက်မေ့လျက် မစွန့်ခွာဘဲ နေသဖြင့် သိကြားမင်း၏ စမ်းသပ်ချီးမွမ်းခြင်းကို ခံရလေသည်။","moral":"သစ္စာရှိခြင်းနှင့် ကျေးဇူးသိတတ်ခြင်းသည် သူတော်ကောင်းတို့၏ အလေ့ဖြစ်၏။"},{"no":431,"pali":"Haritacajātaka","mm":"ဟရိတစဇာတ်","summary":"တန်ခိုးကြီးသော ဟရိတရသေ့ (ဘုရားလောင်း) သည် မင်းကြီး စစ်ချီသွားစဉ် မိဖုရားနှင့် မှားယွင်းမိလေသည်။ မင်းကြီး ပြန်လည် မေးမြန်းသောအခါ မှန်ကန်စွာ ဝန်ခံပြီး ကာမကို စွန့်လွှတ်ကာ ဈာန်တန်ခိုးကို ပြန်လည် ရရှိလေသည်။","moral":"ကာမရာဂသည် တန်ခိုးကြီးသူကိုပင် လှဲနိုင်၏၊ သစ္စာဝန်ခံခြင်းဖြင့် ပြန်လည် ထူထောင်နိုင်၏။"},{"no":432,"pali":"Padakusalamāṇavajātaka","mm":"ပဒကုသလမာဏဝဇာတ်","summary":"ခြေရာကောက်ခြင်းအတတ်၌ ကျွမ်းကျင်သော လုလင် (ဘုရားလောင်း) ၏ အတတ်ကို စမ်းသပ်လိုသဖြင့် မင်းကြီးနှင့် ပုရောဟိတ်တို့သည် ဘဏ္ဍာတော်ကို ကိုယ်တိုင် ခိုးယူဝှက်ထားကြရာ လုလင်သည် ခြေရာအတိုင်း လိုက်၍ ခိုးသူမှာ မင်းကြီးကိုယ်တိုင် ဖြစ်ကြောင်း ဖော်ထုတ်လေသည်။ ပြည်သူတို့သည် မတရားသော မင်းကို ပယ်ရှား၍ လုလင်ကို မင်းမြှောက်ကြလေသည်။","moral":"အုပ်ချုပ်သူသည် တရားကို စောင့်ရမည်၊ မတရားပြုလျှင် ကျဆုံးရ၏။"},{"no":433,"pali":"Lomasakassapajātaka","mm":"လောမသကဿပဇာတ်","summary":"အလွန်ခြိုးခြံစွာ ကျင့်သော လောမသကဿပရသေ့ (ဘုရားလောင်း) သည် မင်းသမီးကို ရလိုသောစိတ်ဖြင့် သတ္တဝါတို့ကို ယဇ်ပူဇော်ရန် ဓားမြှောက်မိသည်အထိ ရောက်ခဲ့သော်လည်း နောက်ဆုံးအခိုက်၌ သတိသံဝေဂရ၍ ယဇ်ပွဲကို စွန့်ကာ ရသေ့အကျင့်သို့ ပြန်လည် ဝင်ရောက်လေသည်။","moral":"ကာမဂုဏ်သည် ကြီးမြတ်သူကိုပင် ဖျက်ဆီးနိုင်သဖြင့် သတိဖြင့် စောင့်စည်းအပ်၏။"},{"no":434,"pali":"Cakkavākajātaka","mm":"စက္ကဝါကဇာတ်","summary":"ကျီးကန်းသည် စက္ကဝါကငှက် (ဘုရားလောင်း) ၏ အဆင်းလှပခြင်းကို အားကျ၍ အစားအစာကြောင့်လောဟု မေးရာ စက္ကဝါကက ကိုယ်ကျင့်သန့်ရှင်း ရောင့်ရဲစွာ နေခြင်းကြောင့်သာ ဖြစ်ကြောင်း၊ ကျီးကန်းမှာ လောဘစိတ်နှင့် ညစ်ညမ်းသောအစာ လိုက်စားခြင်းကြောင့် အဆင်းမလှကြောင်း ဖြေကြားလေသည်။","moral":"ဖြူစင်ရောင့်ရဲသော စိတ်ထားသည် တင့်တယ်ခြင်း၏ အကြောင်းဖြစ်၏။"},{"no":435,"pali":"Haliddirāgajātaka","mm":"ဟလိဒ္ဒိရာဂဇာတ်","summary":"တော၌ ကြီးပြင်းသော ရသေ့ပျိုသည် မိန်းမတစ်ဦး၏ ဖြားယောင်းခြင်းကို ခံရသောအခါ ဖခင်ရသေ့ (ဘုရားလောင်း) က \"နနွင်းဆိုးထားသော အရောင်သည် လျင်မြန်စွာ မှေးမှိန်သကဲ့သို့ မတည်ကြည်သူတို့၏ စိတ်သည် လွယ်ကူစွာ ပြောင်းလဲတတ်သည်\" ဟု ဆုံးမ၍ သားကို ကာမအန္တရာယ်မှ ကယ်တင်လေသည်။","moral":"တည်ကြည်ခိုင်မြဲသော သူတော်ကောင်းကိုသာ မှီဝဲဆည်းကပ်အပ်၏။"},{"no":436,"pali":"Samuggajātaka","mm":"သမုဂ္ဂဇာတ်","summary":"ဘီလူးကြီးတစ်ဦးသည် မိမိ၏ မယားကို သေတ္တာတွင်း ထည့်၍ ဝမ်းဗိုက်၌ မျိုထားလျက် စောင့်ရှောက်သော်လည်း ထိုမိန်းမသည် ဝိဇ္ဇာဓိုရ်တစ်ဦးနှင့် ပြစ်မှားလေသည်။ ရသေ့ (ဘုရားလောင်း) ၏ ဖော်ထုတ်ပြောကြားချက်ကြောင့် ဘီလူးသည် စောင့်၍မရနိုင်မှန်း သိကာ မိန်းမကို လွှတ်လိုက်လေသည်။","moral":"သူတစ်ပါးကို ချုပ်ချယ်ရုံဖြင့် မစောင့်ထိန်းနိုင်၊ မိမိစိတ်ကိုသာ စောင့်ထိန်းအပ်၏။"},{"no":437,"pali":"Pūtimaṁsajātaka","mm":"ပူတိမံသဇာတ်","summary":"ပူတိမံသအမည်ရှိ မြေခွေးလင်မယားသည် ဆိတ်အုပ်ကို စားလို၍ မိတ်ဆွေယောင်ဆောင်ကာ ချဉ်းကပ်ကြသော်လည်း ပညာရှိ ဆိတ်မသည် သူတို့၏ ပရိယာယ်ကို ရိပ်မိသိမြင်၍ လိမ္မာစွာ ရှောင်လွှဲကာ အသက်ချမ်းသာရလေသည်။","moral":"မိတ်ဆွေယောင်ဆောင်သော ရန်သူကို သတိမပြတ် ကြည့်ရှုအပ်၏။"},{"no":438,"pali":"Daddarajātaka","mm":"ဒဒ္ဒရဇာတ်","summary":"ကျမ်းဂန်တတ်မြောက်၍ ပညာသင်ပေးလေ့ရှိသော ငှက်ပညာရှိ (ဘုရားလောင်း) သည် ရသေ့အယောင်ဆောင် သူယုတ်တစ်ဦး၏ သတ်ဖြတ်ခြင်းကို ခံရလေသည်။ ငှက်၏ မိတ်ဆွေဖြစ်သော ခြင်္သေ့နှင့် ကျားတို့သည် ထိုမကောင်းမှုကို ဖော်ထုတ်၍ သူယုတ်အား အပြစ်ပေးကြလေသည်။","moral":"ဆိတ်ကွယ်၌ ပြုသော မကောင်းမှုသည်လည်း ပေါ်လွင်၍ အကျိုးဆက်ကို ခံရ၏။"},{"no":439,"pali":"Catudvārajātaka","mm":"စတုဒွါရဇာတ်","summary":"မိတ္တဝိန္ဒကသည် မိခင်၏ စကားကို နားမထောင်၊ မိခင်ကို ပြစ်မှား၍ ပင်လယ်ကူး ထွက်ခွာသွားရာ ကံဆိုးမှု အဆင့်ဆင့်နောက် တံခါးလေးပေါက်ရှိသော ဥဿဒငရဲမြို့သို့ ရောက်ကာ ဦးခေါင်းပေါ်၌ လည်ပတ်နေသော သံစက်ဝန်းဒဏ်ကို ခံရလေသည်။ ဘုရားလောင်း နတ်သားက ထိုဒဏ်၏ အကြောင်းရင်းကို ဟောပြလေသည်။","moral":"မိခင်ကို ပြစ်မှားခြင်းနှင့် အလိုမပြည့်နိုင်သော လောဘသည် ကြီးလေးသော ဆင်းရဲကို ဖြစ်စေ၏။"},{"no":440,"pali":"Kaṇhajātaka","mm":"ကဏှဇာတ်","summary":"ကဏှရသေ့ (ဘုရားလောင်း) ၏ သီလဂုဏ်ကြောင့် သိကြားမင်းသည် ဆင်းသက်၍ ဆုပေးရာ ရသေ့သည် လောကီစည်းစိမ်ကို မတောင်းဘဲ ဒေါသကင်းခြင်း၊ လောဘကင်းခြင်း၊ တဏှာကင်းခြင်းနှင့် မိမိကြောင့် မည်သည့်သတ္တဝါမျှ မဆင်းရဲစေရခြင်းတို့ကိုသာ တောင်းလေသည်။","moral":"ပညာရှိတို့သည် လောကီစည်းစိမ်ထက် ကိလေသာကင်းခြင်းကိုသာ တောင့်တကြ၏။"},{"no":441,"pali":"Catuposathiyajātaka","mm":"စတုပေါသထိယဇာတ်","summary":"မင်းကြီး၊ နဂါးမင်း၊ ဂဠုန်မင်းနှင့် သိကြားမင်းတို့ လေးဦးသည် ဥပုသ်သီလ ဆောက်တည်ကြပြီး မိမိတို့အနက် မည်သူ၏ အကျင့်က သာလွန်မြတ်သနည်းဟု ငြင်းခုံကြရာ ပညာရှိ ဝိဓုရအမတ် (ဘုရားလောင်း) က လေးဦးလုံး၏ ဂုဏ်ကျေးဇူးတို့သည် အညီအမျှ မြတ်ကြောင်း ဆုံးဖြတ်ဖြေကြားလေသည်။","moral":"သူတော်ကောင်းတရားတို့သည် အသီးသီး မြတ်သည်ချည်းသာ ဖြစ်၏။"},{"no":442,"pali":"Saṅkhajātaka","mm":"သင်္ခဇာတ်","summary":"သင်္ခပုဏ္ဏား (ဘုရားလောင်း) သည် ပစ္စေကဗုဒ္ဓါအား ဖိနပ်နှင့် ထီးကို ကြည်ညိုစွာ လှူပြီးနောက် ပင်လယ်ခရီး၌ သင်္ဘောပျက်ရာ ထိုအလှူ၏ အကျိုးကြောင့် မဏိမေခလာနတ်သမီးက ကယ်တင်၍ ရတနာပြည့်သော သင်္ဘောဖြင့် နေရပ်သို့ ပြန်ပို့လေသည်။","moral":"စေတနာထက်သန်စွာ ပြုသော ဒါနသည် ဘေးအန္တရာယ်၌ ကိုးကွယ်ရာ ဖြစ်၏။"},{"no":443,"pali":"Cūḷabodhijātaka","mm":"စူဠဗောဓိဇာတ်","summary":"ဗောဓိရသေ့ (ဘုရားလောင်း) နှင့်အတူ ကျင့်နေသော ရသေ့မကို မင်းကြီးက အနိုင်အထက် သိမ်းယူသွားသော်လည်း ရသေ့သည် အမျက်မထွက်ဘဲ \"ဒေါသကို ဖြစ်ပေါ်သည်နှင့် တစ်ပြိုင်နက် နှိမ်နင်းထား၏\" ဟု ဖြေကြားရာ မင်းကြီးသည် အံ့ဩကြည်ညို၍ ရသေ့မကို ပြန်လည် အပ်နှံလေသည်။","moral":"ဒေါသကို နှိမ်နင်းနိုင်ခြင်းသည် စစ်မှန်သော ခွန်အားဖြစ်၏။"},{"no":444,"pali":"Kaṇhadīpāyanajātaka","mm":"ကဏှဒီပါယနဇာတ်","summary":"ဒီပါယနရသေ့ (ဘုရားလောင်း) သည် နှစ်ပေါင်းများစွာ မိမိအကျင့်၌ မမွေ့လျော်ဘဲ ကျင့်နေခဲ့ရကြောင်း မှန်ကန်စွာ ထုတ်ဖော်၍ သစ္စာဆိုကာ မြွေကိုက်ခံရသော သူငယ်၏ အဆိပ်ကို ပြေပျောက်စေလေသည်။ သူငယ်၏ မိဘနှစ်ပါးလည်း မိမိတို့ စိတ်အမှန်ကို ဝန်ခံလျက် သစ္စာဆိုကြလေသည်။","moral":"မှန်သောစကားကို ထုတ်ဖော်ဆိုသော သစ္စာ၌ ကြီးမားသော တန်ခိုးရှိ၏။"},{"no":445,"pali":"Nigrodhajātaka","mm":"နိဂြောဓဇာတ်","summary":"နိဂြောဓ (ဘုရားလောင်း) သည် မင်းဖြစ်လာသောအခါ မိမိတို့ကို ကျေးဇူးပြုခဲ့သော ဆင်းရဲသား မိတ်ဆွေ ပေါတ္တိကကို မြတ်နိုးစွာ ချီးမြှင့်၍ ကျေးဇူးကို မေ့လျော့သော မိတ်ဆွေ သာခကို ပြင်းထန်စွာ ဆုံးမလေသည်။","moral":"ကျေးဇူးသိတတ်သူကိုသာ မှီဝဲဆည်းကပ်အပ်၏။"},{"no":446,"pali":"Takkalajātaka","mm":"တက္ကလဇာတ်","summary":"ဖခင်သည် အိုမင်းသော အဖိုးအိုကို သင်္ချိုင်း၌ မြှုပ်နှံပစ်ရန် တွင်းတူးနေစဉ် သားငယ် (ဘုရားလောင်း) က \"ဖခင် အိုမင်းသောအခါ မြှုပ်နှံရန် ကျွန်ုပ်လည်း တွင်းတူးထားပါမည်\" ဟု ဆိုကာ ဖခင်ကို သံဝေဂရစေ၍ အဖိုးအိုကို ကယ်တင်လေသည်။","moral":"မိဘဘိုးဘွားကို ပြုသမျှသည် မိမိထံသို့ တစ်ဖန် ပြန်ရောက်၏။"},{"no":447,"pali":"Mahādhammapālajātaka","mm":"မဟာဓမ္မပါလဇာတ်","summary":"ဓမ္မပါလအမျိုးသည် ကောင်းမှုကုသိုလ်ကို မပြတ်ကျင့်သုံးသဖြင့် ငယ်ရွယ်စဉ်အခါ၌ မည်သူမျှ မသေဆုံးကြချေ။ ဆရာဖြစ်သူက သားငယ် ဓမ္မပါလ (ဘုရားလောင်း) သေဆုံးပြီဟု အရိုးအတုပြ၍ စမ်းသပ်သော်လည်း ဖခင်သည် \"ငါတို့အမျိုး၌ အငယ်သေခြင်း မရှိ\" ဟု ယုံကြည်တည်ကြည်စွာ ဖြေကြားလေသည်။","moral":"ကောင်းသော အကျင့်တရားသည် အသက်ကိုပင် စောင့်ရှောက်၏။"},{"no":448,"pali":"Kukkuṭajātaka","mm":"ကုက္ကုဋဇာတ်","summary":"ကြက်တို့ကို ဖမ်းစားလေ့ရှိသော စွန်ရဲသည် ကြက်ဖပညာရှိ (ဘုရားလောင်း) အား မိတ်ဆွေဖွဲ့ဟန်ဆောင်၍ ချဉ်းကပ်သော်လည်း ကြက်ဖသည် ရန်သူ၏ ချိုသာသောစကားကို မယုံကြည်ဘဲ ငြင်းပယ်သဖြင့် ဘေးမှ လွတ်မြောက်လေသည်။","moral":"ရန်သူ၏ ချိုသာသော ဖြားယောင်းစကားကို မယုံအပ်။"},{"no":449,"pali":"Maṭṭhakuṇḍalījātaka","mm":"မဋ္ဌကုဏ္ဍလီဇာတ်","summary":"သားသေဆုံး၍ ပူဆွေးငိုကြွေးနေသော ပုဏ္ဏားထံ နတ်ဘဝသို့ ရောက်နေသော သားသည် လုလင်အသွင်ဖြင့် လာရောက်ကာ လမင်းကို ရထားဘီးအဖြစ် ရလိုသည်ဟု ငိုကြွေးပြလေသည်။ \"မရနိုင်သောအရာကို တောင်းသူသည် မိုက်၏\" ဟု ပုဏ္ဏားဆိုသောအခါ \"သေဆုံးပြီးသူကို ငိုကြွေးခြင်းသည် ထို့ထက် အချည်းနှီး\" ဟု ဆုံးမ၍ ပူဆွေးမှုကို ငြိမ်းစေလေသည်။","moral":"သေဆုံးပြီးသူအတွက် ပူဆွေးငိုကြွေးခြင်းသည် အကျိုးမရှိ။"},{"no":450,"pali":"Bilārakosiyajātaka","mm":"ဗိဠာရကောသိယဇာတ်","summary":"ရှေးကုသိုလ်ကြောင့် ချမ်းသာသော်လည်း အလှူဒါနကို လုံးဝ မပြုသော ကောသိယသူဌေးထံ သိကြားမင်း (ဘုရားလောင်း) နှင့် နတ်တို့သည် ပုဏ္ဏားအသွင်ဖြင့် ဆင်းသက်၍ အလှူခံပြီး ပေးလှူခြင်း၏ အကျိုးကို ဟောပြသဖြင့် သူဌေးသည် လှူဒါန်းခြင်း၌ မွေ့လျော်သူ ဖြစ်လာလေသည်။","moral":"ဝန်တိုနှမြောခြင်းသည် ဆုတ်ယုတ်စေ၍ ပေးလှူခြင်းသည် ချမ်းသာစေ၏။"},{"no":451,"pali":"Cakkavākajātaka","mm":"စက္ကဝါကဇာတ်","summary":"လောဘကြီးသော ကျီးကန်းသည် ရွှေရောင်လှပသော စက္ကဝါကငှက် (ဘုရားလောင်း) အား အဆင်းလှရခြင်း အကြောင်းကို မေးရာ စက္ကဝါကက သတ္တဝါတို့ကို မညှဉ်းဆဲဘဲ ရောင့်ရဲစွာ နေခြင်းကြောင့်ဖြစ်၍ ကျီးကန်းမှာ လောဘနှင့် ယုတ်မာသော အကျင့်ကြောင့် အဆင်းမလှကြောင်း ဟောကြားလေသည်။","moral":"လောဘသည် ရုပ်အဆင်းကိုပင် ညစ်နွမ်းစေ၏။"},{"no":452,"pali":"Bhūripaññajātaka","mm":"ဘူရိပညဇာတ်","summary":"မဟောသဓပညာရှိ (ဘုရားလောင်း) ၏ မြေကဲ့သို့ ကျယ်ဝန်းနက်နဲသော ပညာစွမ်းကို ပြဆိုသော ဇာတ်ဖြစ်၍ အကျယ်ကို မဟောသဓ (ဥမ္မဂ္ဂ) ဇာတ်တော်ကြီး၌ လာသည်။","moral":"ပညာသည် ဥစ္စာရတနာအပေါင်းထက် မြတ်၏။"},{"no":453,"pali":"Mahāmaṅgalajātaka","mm":"မဟာမင်္ဂလဇာတ်","summary":"မင်္ဂလာဟူသည် အဘယ်နည်းဟု လူအပေါင်း ငြင်းခုံကြသောအခါ ရသေ့ဆရာကြီး (ဘုရားလောင်း) က မြင်ရ ကြားရသော နိမိတ်တို့၌ မင်္ဂလာ မတည်၊ ကောင်းမြတ်သော အကျင့်ကို ကျင့်သုံးခြင်း၌သာ စစ်မှန်သော မင်္ဂလာတည်ကြောင်း ဟောကြားလေသည်။","moral":"မင်္ဂလာသည် အပြင်နိမိတ်၌ မတည်၊ ကိုယ်ကျင့်တရား၌သာ တည်၏။"},{"no":454,"pali":"Ghaṭapaṇḍitajātaka","mm":"ဃဋပဏ္ဍိတဇာတ်","summary":"ဝါသုဒေဝမင်းကြီးသည် သားတော် သေဆုံးသဖြင့် အလွန် ပူဆွေးနေရာ ညီတော် ဃဋပဏ္ဍိတ (ဘုရားလောင်း) သည် ရူးသွပ်ဟန်ဆောင်ကာ \"လပေါ်ရှိ ယုန်ကို ပေးပါ\" ဟု တောင်း၍ လှည့်လည်လေသည်။ မရနိုင်သောအရာကို တောင်းသည်ဟု မင်းကြီး ဆုံးမသောအခါ \"သေဆုံးပြီးသူကို ပြန်တောင့်တခြင်းသည် ထို့ထက် အချည်းနှီး\" ဟု ဖော်ပြ၍ ပူဆွေးမှုကို ငြိမ်းစေလေသည်။","moral":"ပြန်၍ မရနိုင်သောအရာအတွက် ပူဆွေးခြင်းသည် အမိုက်တရားသာ ဖြစ်၏။"},{"no":455,"pali":"Mātuposakajātaka","mm":"မာတုပေါသကဇာတ်","summary":"မျက်မမြင် မိခင်ဆင်မကြီးကို လုပ်ကျွေးနေသော ဆင်မင်း (ဘုရားလောင်း) သည် မင်းကြီး၏ ဖမ်းဆီးခြင်းကို ခံရသော်လည်း မိခင်ကို အောက်မေ့သဖြင့် အစာမစားဘဲ နေလေသည်။ အကြောင်းစုံကို သိသော မင်းကြီးက လွှတ်ပေးသဖြင့် မိခင်ထံ ပြန်၍ လုပ်ကျွေးမြဲ လုပ်ကျွေးလေသည်။","moral":"မိဘကို လုပ်ကျွေးပြုစုခြင်းသည် မြင့်မြတ်သော ကျင့်ဝတ်ဖြစ်၏။"},{"no":456,"pali":"Juṇhajātaka","mm":"ဇုဏှဇာတ်","summary":"ဇုဏှမင်းသား (ဘုရားလောင်း) သည် ညအမှောင်၌ ပုဏ္ဏားတစ်ဦးနှင့် မတော်တဆ တိုက်မိခဲ့ရာ မင်းဖြစ်သောအခါ ကျေးဇူးဆပ်ပါမည်ဟု ကတိပေးခဲ့လေသည်။ နှစ်များစွာ ကြာသောအခါ ပုဏ္ဏား လာရောက် သတိပေးရာ ကတိအတိုင်း များစွာ ချီးမြှင့်လေသည်။","moral":"ပေးထားပြီးသော ကတိသစ္စာကို တည်စေအပ်၏။"},{"no":457,"pali":"Dhammadevaputtajātaka","mm":"ဓမ္မဒေဝပုတ္တဇာတ်","summary":"ဓမ္မနတ်သား (ဘုရားလောင်း) နှင့် အဓမ္မနတ်သားတို့ ရထားချင်း ဆိုင်မိကြရာ လမ်းဖယ်ပေးရေးကို ငြင်းခုံကြလေသည်။ အဓမ္မသည် တရားကို မလေးစားဘဲ မဖယ်ဘဲနေသဖြင့် မြေမျိုခြင်းခံရ၍ ဓမ္မသာလျှင် အောင်မြင်လေသည်။","moral":"တရားသည် မတရားကို အခါခပ်သိမ်း အောင်နိုင်၏။"},{"no":458,"pali":"Udayajātaka","mm":"ဥဒယဇာတ်","summary":"ဥဒယမင်းသား (ဘုရားလောင်း) နှင့် မိဖုရားတို့သည် သီလစောင့်လျက် သန့်ရှင်းစွာ ပေါင်းသင်းခဲ့ကြသည်။ မင်းသားသည် နတ်ဘဝသို့ ရောက်ပြီးနောက် မိဖုရား၏ သီလကို ရွှေငွေဖြင့် သွေးဆောင် စမ်းသပ်သော်လည်း မိဖုရား မယိမ်းယိုင်သဖြင့် ချီးမွမ်း၍ တရားသံဝေဂ ရစေလေသည်။","moral":"ကာမဂုဏ်ကို စွန့်၍ သီလကို မြဲမြံစွာ စောင့်ထိန်းခြင်းသည် မြတ်၏။"},{"no":459,"pali":"Pānīyajātaka","mm":"ပါနီယဇာတ်","summary":"သူတစ်ပါး၏ ရေကို ခိုး၍ သောက်မိခြင်း စသော အပြစ်ငယ်လေးများကြောင့်ပင် ထိတ်လန့် သံဝေဂရကာ တောထွက်ကျင့်ကြံ၍ ပစ္စေကဗုဒ္ဓါ ဖြစ်ကြသူတို့၏ အကြောင်းကို ဟောသော ဇာတ်ဖြစ်သည်။ ထိုတရားကြောင့် မင်းကြီး (ဘုရားလောင်း) သည်လည်း စည်းစိမ်ကို စွန့်၍ တောထွက်လေသည်။","moral":"အပြစ်ငယ်ကိုပင် ကြောက်ရွံ့၍ ရှောင်ကြဉ်အပ်၏။"},{"no":460,"pali":"Yudhañcayajātaka","mm":"ယုဓဉ္စယဇာတ်","summary":"ယုဓဉ္စယမင်းသား (ဘုရားလောင်း) သည် နံနက်ခင်း၌ နှင်းစက်တို့ နေရောင်ကြောင့် ခဏချင်း ပျောက်ကွယ်သွားသည်ကို မြင်၍ ဘဝ၏ မမြဲခြင်းကို ဆင်ခြင်မိကာ မိဘတို့ မည်မျှ တားမြစ် တောင်းပန်စေကာမူ စည်းစိမ်ကို စွန့်၍ တောထွက်လေသည်။","moral":"သင်္ခါရတရားတို့၏ မမြဲခြင်းကို ဆင်ခြင်၍ မမေ့မလျော့ ကျင့်အပ်၏။"},{"no":461,"pali":"Dasarathajātaka","mm":"ဒသရထဇာတ်","summary":"ရာမပဏ္ဍိတ (ဘုရားလောင်း) သည် တော၌ နေထိုင်စဉ် ခမည်းတော် ဒသရထမင်း နတ်ရွာစံကြောင်း ကြားရသော်လည်း မငိုကြွေး မပူဆွေးဘဲ \"မမြဲသောတရားကို ပညာရှိတို့ မငိုကြွေးကြ\" ဟု ညီတော် မောင်နှမတို့အား ဆုံးမလေသည်။ ညီတော် ဘရတအား ဖိနပ်တော်ကို အပ်နှံ၍ မိမိကိုယ်စား နန်းစိုးစေလေသည်။","moral":"မလွဲမသွေ ဖြစ်ရမည့် သေခြင်းတရားကြောင့် ပညာရှိတို့ မပူဆွေးကြ။"},{"no":462,"pali":"Saṁvarajātaka","mm":"သံဝရဇာတ်","summary":"မင်းသားများစွာတို့တွင် အငယ်ဆုံးဖြစ်သော သံဝရမင်းသားသည် ပညာရှိအမတ်ကြီး (ဘုရားလောင်း) ၏ အဆုံးအမကို ခံယူ၍ လူအပေါင်းကို ရက်ရောစွာ ချစ်ခင် ပြုစုသဖြင့် ထီးနန်းကို ရရှိလေသည်။ နောင်တော်တို့ စစ်ချီလာသော်လည်း သူ၏ မေတ္တာနှင့် နှိမ့်ချမှုကို မြင်ကြ၍ လက်နက်ချကာ ကြည်ညိုကြလေသည်။","moral":"နှိမ့်ချခြင်းနှင့် စွန့်ကြဲပေးကမ်းခြင်းသည် အာဏာလက်နက်ထက် အောင်နိုင်၏။"},{"no":463,"pali":"Suppārakajātaka","mm":"သုပ္ပါရကဇာတ်","summary":"မျက်စိအလင်း ဆုံးရှုံးသွားသော်လည်း အမြော်အမြင် ကြီးမားသော သင်္ဘောဆရာကြီး သုပ္ပါရက (ဘုရားလောင်း) သည် ဘေးအန္တရာယ် ထူပြောသော သမုဒ္ဒရာများကို ဖြတ်သန်းပြီး သစ္စာဆိုခြင်းဖြင့် ကုန်သည်တို့၏ သင်္ဘောကို ရတနာများနှင့်တကွ ဘေးမဲ့ရာသို့ ပြန်လည် ပို့ဆောင်နိုင်ခဲ့သည်။","moral":"သီလနှင့် သစ္စာသည် ဘေးအန္တရာယ် အပေါင်းမှ ကယ်တင်နိုင်၏။"},{"no":464,"pali":"Cūḷakuṇālajātaka","mm":"စူဠကုဏာလဇာတ်","summary":"ကုဏာလငှက်မင်း (ဘုရားလောင်း) က ကာမဂုဏ်၌ တွယ်တာသူတို့ ကြုံရတတ်သော ဆင်းရဲဘေးနှင့် စိတ်မတည်ကြည် ဖောက်ပြားတတ်ခြင်း၏ အပြစ်ကို ဥပမာများဖြင့် ဟောပြသော ဇာတ်ဖြစ်၍ အကျယ်ကို ကုဏာလဇာတ်တော်ကြီး၌ လာသည်။","moral":"ကာမရာဂ၌ ယစ်မူး မမေ့လျော့ဘဲ သတိဖြင့် စောင့်စည်းအပ်၏။"},{"no":465,"pali":"Bhaddasālajātaka","mm":"ဘဒ္ဒသာလဇာတ်","summary":"မင်းကြီးသည် နန်းတော်တိုင်ပြုရန် သာလပင်ကြီးကို ခုတ်လှဲစေမည် ပြုသောအခါ သစ်ပင်စောင့် နတ်မင်း (ဘုရားလောင်း) သည် ပတ်ဝန်းကျင်ရှိ ဆွေမျိုးသစ်ပင်ငယ်တို့ မပြိုပျက်စေရန် မိမိပင်ကိုသာ အပိုင်းပိုင်း ဖြတ်တောက်ပါဟု တောင်းပန်လေသည်။ ထိုစွန့်လွှတ်စိတ်ကို ကြည်ညိုသော မင်းကြီးသည် သစ်ပင်ကို မခုတ်တော့ဘဲ ဘေးမဲ့ပေးလေသည်။","moral":"ဆွေမျိုးအပေါင်းအတွက် မိမိကိုယ်ကို စွန့်နိုင်သူသည် မြတ်၏။"},{"no":466,"pali":"Samuddavāṇijajātaka","mm":"သမုဒ္ဒဝါဏိဇဇာတ်","summary":"ကျွန်းတစ်ကျွန်း၌ အခြေချနေထိုင်ကြသော လက်သမားအပေါင်းအား ရေလွှမ်းမိုးမည့်ဘေးကို နတ်ကောင်းက ကြိုတင် သတိပေးရာ ပညာရှိ အကြီးအကဲ (ဘုရားလောင်း) သည် သင်္ဘောတည်ဆောက်၍ မိမိအသင်းသားတို့နှင့် လွတ်မြောက်လေသည်။ သတိပေးချက်ကို မထီမဲ့မြင်ပြုသော အုပ်စုမှာမူ ရေဘေး၌ သေကြေပျက်စီးကြရလေသည်။","moral":"ပညာရှိ၏ သတိပေးစကားကို မမေ့မလျော့ လိုက်နာအပ်၏။"},{"no":467,"pali":"Kāmajātaka","mm":"ကာမဇာတ်","summary":"မင်းတစ်ပါးသည် ရသမျှနှင့် မရောင့်ရဲဘဲ တစ်ဆင့်ထက်တစ်ဆင့် တောင့်တလိုချင်နေရာ သိကြားမင်း (ဘုရားလောင်း) သည် လုလင်ပုဏ္ဏားအသွင်ဖြင့် ချဉ်းကပ်၍ ကာမတဏှာသည် ရလေ တိုးလေဖြစ်၍ အဆုံးမရှိကြောင်း ဟောပြသဖြင့် မင်းကြီးသည် သံဝေဂရကာ ရောင့်ရဲခြင်းသို့ ရောက်လေသည်။","moral":"တဏှာသည် အဘယ်အခါမျှ မပြည့်နိုင်၊ ရောင့်ရဲခြင်းသည်သာ အမြတ်ဆုံး ဥစ္စာဖြစ်၏။"},{"no":468,"pali":"Janasandhajātaka","mm":"ဇနသန္ဓဇာတ်","summary":"ဇနသန္ဓမင်း (ဘုရားလောင်း) သည် ပြည်သူတို့အား မပြုလုပ်မိလျှင် နောင်အခါ နောင်တရစေတတ်သော အကြောင်းဆယ်ပါးကို ဟောကြားလျက် တရားသဖြင့် အုပ်ချုပ်လေသည်။","moral":"အခွင့်သာစဉ်၌ ကောင်းမှုကို ဆောလျင်စွာ ပြုအပ်၏၊ နောင်တနှင့် မတွေ့စေရ။"},{"no":469,"pali":"Mahākaṇhajātaka","mm":"မဟာကဏှဇာတ်","summary":"လောက၌ တရားယိုယွင်း၍ မကောင်းမှု ထွန်းကားလာသောအခါ သိကြားမင်း (ဘုရားလောင်း) သည် မာတလိနတ်သားကို ကြောက်မက်ဖွယ် ခွေးနက်ကြီးအသွင် ဆောင်စေပြီး မကောင်းမှုပြုသူတို့ကို ကိုက်စားမည်ဟု ဟိန်းဟောက်စေသဖြင့် လူအပေါင်းသည် ထိတ်လန့်ကြကာ ကောင်းမှု၌ ပြန်လည် တည်ကြလေသည်။","moral":"မကောင်းမှု၏ အကျိုးဆက်ကို ကြောက်ရွံ့၍ ကောင်းမှု၌ တည်အပ်၏။"},{"no":470,"pali":"Kosiyajātaka","mm":"ကောသိယဇာတ်","summary":"ဝန်တိုနှမြောခြင်း၌ အလွန်ကဲသော ကောသိယသူဌေးသည် နတ်တို့၏ ဆုံးမသွန်သင်ခြင်းကြောင့် စွန့်ကြဲပေးလှူခြင်း၌ မွေ့လျော်လာသည့် အကြောင်းကို ဟောသောဇာတ်ဖြစ်၍ အကျယ်ကို သုဓာဘောဇနဇာတ်၌ လာသည်။","moral":"ဝန်တိုခြင်းကို ပယ်၍ ပေးလှူခြင်း၌ မွေ့လျော်အပ်၏။"},{"no":471,"pali":"Meṇḍakapañhajātaka","mm":"မေဏ္ဍကပဉှဇာတ်","summary":"သဘာဝအားဖြင့် မခင်မင်တတ်ကြသော သိုးနှင့် ခွေးတို့ အချင်းချင်း ကျေးဇူးပြုနေကြသည်ကို မင်းကြီး မြင်၍ မေးသော ပဟေဠိကို ပညာရှိအပေါင်း မဖြေနိုင်ကြဘဲ မဟောသဓပညာရှိ (ဘုရားလောင်း) ကသာ ထိုးထွင်း၍ ဖြေဆိုနိုင်ခဲ့သည်။ အကျယ်ကို မဟောသဓ (ဥမ္မဂ္ဂ) ဇာတ်၌ လာသည်။","moral":"ပညာရှိသည် နက်နဲသောအရာကို ထိုးထွင်း၍ မြင်နိုင်၏။"},{"no":472,"pali":"Mahāpadumajātaka","mm":"မဟာပဒုမဇာတ်","summary":"ပဒုမမင်းသား (ဘုရားလောင်း) သည် မိထွေးမိဖုရား၏ ဖြားယောင်းမှုကို ငြင်းပယ်သဖြင့် မဟုတ်မမှန် စွပ်စွဲခြင်းခံရကာ ချောက်ကမ်းပါးမှ ပစ်ချခြင်း ခံရလေသည်။ နဂါးမင်း၏ ကယ်ဆယ်ခြင်းကြောင့် အသက်ချမ်းသာရ၍ ရသေ့ပြုနေစဉ် အမှန်တရား ပေါ်လွင်လာသောအခါ မင်းကြီးသည် နောင်တရ၍ မိဖုရားကို အပြစ်ပေးလေသည်။","moral":"စုံစမ်းစစ်ဆေးခြင်း မပြုဘဲ တစ်ဖက်စကားဖြင့် အပြစ်မစီရင်အပ်၊ သစ္စာသည် နောက်ဆုံး၌ ပေါ်လွင်၏။"},{"no":473,"pali":"Mittāmittajātaka","mm":"မိတ္တာမိတ္တဇာတ်","summary":"မိတ်ဆွေနှင့် ရန်သူကို အဘယ်သို့ ခွဲခြား သိနိုင်သနည်းဟု မင်းကြီး မေးမြန်းရာ ပညာရှိအမတ် (ဘုရားလောင်း) သည် မိတ်ဆွေစစ်နှင့် မိတ်ဆွေယောင်တို့၏ အမူအကျင့် လက္ခဏာတို့ကို အသေးစိတ် ဟောကြားလေသည်။","moral":"အမူအကျင့်ကို ထောက်ရှု၍ မိတ်ဆွေစစ်ကို ရွေးချယ်အပ်၏။"},{"no":474,"pali":"Ambajātaka","mm":"အမ္ဗဇာတ်","summary":"လုလင်တစ်ယောက်သည် ဒွန်းစဏ္ဍားဆရာထံမှ ရာသီမဟုတ်ဘဲ သရက်သီးသီးစေနိုင်သော မန္တန်ကို သင်ယူရရှိ၏။ မင်းကြီးက ဆရာမည်သူနည်းဟု မေးသောအခါ ဆရာ၏ဇာတ်နိမ့်မှုကို ရှက်၍ ကျော်ကြားသောဆရာထံမှ သင်ယူခဲ့သည်ဟု လိမ်လည်ပြောဆိုသဖြင့် မန္တန်တန်ခိုး ချက်ချင်းပျောက်ကွယ်သွားလေသည်။","moral":"ကျေးဇူးရှင်ဆရာကို ငြင်းပယ်သူသည် မိမိရရှိထားသော အတတ်ပညာပါ ဆုံးရှုံးရ၏။"},{"no":475,"pali":"Phandanajātaka","mm":"ဖန္ဒနဇာတ်","summary":"ရထားလုပ်သော လက်သမားတစ်ယောက်ကို အကြောင်းပြု၍ ခြင်္သေ့နှင့် ဖန္ဒနသစ်ပင်စောင့်နတ်တို့သည် တစ်ဦးကိုတစ်ဦး ကုန်းချောတိုက်တွန်းကြရာ သစ်ပင်လည်း ခုတ်လှဲခြင်းခံရ၍ ခြင်္သေ့လည်း အသက်ဆုံးရှုံးရလေသည်။ အချင်းချင်း ရန်တိုက်ခြင်း၏ အပြစ်ကို ပြသော ဇာတ်တော်ဖြစ်သည်။","moral":"အချင်းချင်း ကုန်းချောရန်တိုက်ခြင်းသည် နှစ်ဦးစလုံးကို ပျက်စီးစေ၏။"},{"no":476,"pali":"Javanahaṁsajātaka","mm":"ဇဝနဟံသဇာတ်","summary":"ဗောဓိသတ်သည် အလွန်လျင်မြန်သော ဇဝနဟံသငှက်မင်းဖြစ်၍ ဗာရာဏသီမင်းနှင့် မိတ်ဆွေဖွဲ့ကာ မြားထက်ပင် လျင်မြန်သော အဟုန်စွမ်းရည်ကို ပြသလေသည်။ ထို့နောက် သတ္တဝါတို့၏ အသက်သင်္ခါရသည် ထို့ထက်ပင် လျင်မြန်စွာ ကုန်ဆုံးပျက်စီးနေကြောင်း မင်းကြီးအား တရားဟောလေသည်။","moral":"သင်္ခါရတရားတို့၏ လျင်မြန်သောပျက်စီးမှုကို သတိမူ၍ မမေ့မလျော့ ကုသိုလ်ပြုအပ်၏။"},{"no":477,"pali":"Cūḷanāradajātaka","mm":"စူဠနာရဒဇာတ်","summary":"တောရ၌ ကြီးပြင်းခဲ့သော ရသေ့ငယ်သည် တောသို့ရောက်လာသော မိန်းမပျို၏ ဖြားယောင်းမှုကြောင့် ဈာန်ပျက်၍ စိတ်ပူပန်နေရာ ဖခင်ရသေ့ကြီး (ဗောဓိသတ်) က ကာမဂုဏ်၏ အပြစ်ဘေးကို ဟောပြောဆုံးမလေသည်။ သားရသေ့သည် အဆုံးအမကို ခံယူ၍ ဈာန်ကို ပြန်လည်ရရှိလေသည်။","moral":"ကာမဂုဏ်၏ ဖြားယောင်းမှုကို ပညာဖြင့် ဆင်ခြင်၍ ရှောင်ကြဉ်အပ်၏။"},{"no":478,"pali":"Dūtajātaka","mm":"ဒူတဇာတ်","summary":"ဆရာ့အား ဆပ်ရန်ရှိသော ပညာသင်ကြားခကို ရှာဖွေနေသည့် လုလင်သည် မိမိ၏လိုအပ်ချက်ကို ဖြည့်ဆည်းပေးနိုင်သော မင်းကြီးထံသာ ချဉ်းကပ်လျှောက်ထားသဖြင့် အလိုပြည့်လေသည်။ မိမိအကျိုးကို ဆောင်ရွက်ပေးနိုင်သူထံသာ ဖွင့်ဟပြောဆိုသင့်ကြောင်း ပြဆိုသော ဇာတ်တော်ဖြစ်သည်။","moral":"မိမိလိုအပ်ချက်ကို ဖြည့်ဆည်းပေးနိုင်သူထံသာ ဖွင့်ဟလျှောက်ထားအပ်၏။"},{"no":479,"pali":"Kāliṅgabodhijātaka","mm":"ကာလိင်္ဂဗောဓိဇာတ်","summary":"ကာလိင်္ဂမင်းမျိုးမှ ဆင်းသက်သော စကြဝတေးမင်းသည် ကောင်းကင်ခရီးဖြင့် သွားစဉ် ဗောဓိမဏ္ဍိုင်အရပ်၏အထက်၌ ရထားရပ်တန့်၍ မကျော်ဖြတ်နိုင်ဘဲ ဖြစ်နေရာ ထိုအရပ်၏ အလွန်မြတ်သောဂုဏ်ကို သိရှိ၍ ကြီးစွာသော ပူဇော်သက္ကာရကို ပြုလေသည်။ အာနန္ဒာမထေရ် ဇေတဝန်ကျောင်းတော်၌ ဗောဓိပင် စိုက်ပျိုးခြင်းနှင့် စပ်၍ ဟောကြားတော်မူသော ဇာတ်တော်ဖြစ်သည်။","moral":"ဗောဓိမဏ္ဍိုင်စသော အမြတ်တကာတို့ကို ရိုသေပူဇော်ခြင်းသည် ကြီးမားသောအကျိုးရှိ၏။"},{"no":480,"pali":"Akittijātaka","mm":"အကိတ္တိဇာတ်","summary":"ဗောဓိသတ် အကိတ္တိရသေ့သည် များပြားသောစည်းစိမ်ကို လှူဒါန်းစွန့်လွှတ်၍ တောထွက်ကာ သစ်ရွက်ပြုတ်ဖြင့်သာ အသက်မွေးလေသည်။ သိကြားမင်းသည် ပုဏ္ဏားယောင်ဆောင်၍ သုံးရက်ဆက် အလှူခံရာ မိမိစားရန် သစ်ရွက်ရှိသမျှကို ဝမ်းမြောက်စွာ လှူပြီး အစာရှောင်နေသဖြင့် သိကြားမင်းက ဆုပေးလေသည်။","moral":"စွန့်လွှတ်လှူဒါန်းခြင်း၌ မွေ့လျော်သောစိတ်သည် အမြတ်ဆုံးဥစ္စာဖြစ်၏။"},{"no":481,"pali":"Takkāriyajātaka","mm":"တက္ကာရိယဇာတ်","summary":"စကားကို အချိန်အခါမဲ့ ပြောဆိုမိသောကြောင့် ဘေးဒုက္ခရောက်ခဲ့ရသူတို့၏ ပုံဝတ္ထုများကို တပည့်ပညာရှိ (ဗောဓိသတ်) က ဆရာဖြစ်သူအား ဟောပြောဆုံးမသော ဇာတ်တော်ဖြစ်သည်။ နှုတ်ကို မစောင့်စည်းခြင်း၏ အပြစ်ကို ထင်ရှားပြသည်။","moral":"စကားကို အချိန်အခါဒေသနှင့် လျော်ညီစွာသာ ပြောဆိုအပ်၏။"},{"no":482,"pali":"Rurumigarājajātaka","mm":"ရုရုမိဂရာဇဇာတ်","summary":"ဗောဓိသတ်သည် ရွှေရောင်ကိုယ်ရှိသော ရုရုသမင်မင်းဖြစ်၍ မြစ်၌မျောပါလာသော သူဌေးသားကို ကယ်တင်ခဲ့၏။ ထိုသူသည် ကျေးဇူးကိုမထောက်ဘဲ ဆုငွေအတွက် သမင်မင်းတည်ရာကို မင်းကြီးအား ညွှန်ပြလေသည်။ သမင်မင်းက ဖြစ်ကြောင်းကုန်စင်ကို လျှောက်တင်သောအခါ မင်းကြီးသည် ကျေးဇူးကန်းသူကို ရှုတ်ချ၍ သမင်အပေါင်းအား ဘေးမဲ့ပေးလေသည်။","moral":"ကျေးဇူးသိတတ်ခြင်းသည် သူတော်ကောင်းတရားဖြစ်၍ ကျေးဇူးကန်းခြင်းသည် ယုတ်မာ၏။"},{"no":483,"pali":"Sarabhamigajātaka","mm":"သရဘမိဂဇာတ်","summary":"မင်းကြီးသည် သရဘသမင် (ဗောဓိသတ်) ကို လိုက်လံပစ်ခတ်ရင်း တွင်းနက်ထဲသို့ ကျသွားရာ မိမိကို သတ်ရန်လိုက်သူဖြစ်သော်လည်း သမင်က သနားသဖြင့် ဆွဲတင်ကယ်တင်လေသည်။ မင်းကြီးသည် ကျေးဇူးတရားကို အလေးထား၍ သမင်မင်းအား ပူဇော်ကာ တရားသဖြင့် မင်းပြုလေသည်။","moral":"ရန်သူ့အပေါ်၌ပင် မေတ္တာကရုဏာထားရှိခြင်းသည် သူတော်ကောင်းတရားဖြစ်၏။"},{"no":484,"pali":"Sālikedārajātaka","mm":"သာလိကေဒါရဇာတ်","summary":"ဗောဓိသတ် ကျေးငှက်မင်းသည် စပါးခင်းမှ စပါးနှံများကို ချီဆောင်၍ အိုမင်းသော မိဘနှစ်ပါးကို လုပ်ကျွေး၏။ လယ်စောင့်ထောင်သော ကျော့ကွင်း၌ မိသောအခါ အကြွေးဆပ်ခြင်း၊ အကြွေးချေးခြင်း၊ ရွှေအိုးမြှုပ်ခြင်းဟူသော ဆိုရိုးစကားဖြင့် မိဘကျေးဇူးဆပ်ခြင်းစသည်ကို ဖွင့်ပြရာ ပုဏ္ဏားလယ်ရှင်သည် ကြည်ညို၍ လွှတ်ပေးလေသည်။","moral":"မိဘကို လုပ်ကျွေးထောက်ပံ့ခြင်းသည် မြတ်သောကျေးဇူးဆပ်ခြင်းဖြစ်၏။"},{"no":485,"pali":"Candakinnarījātaka","mm":"စန္ဒကိန္နရီဇာတ်","summary":"ဗောဓိသတ်သည် စန္ဒကိန္နရာဖြစ်၍ ဇနီးကိန္နရီနှင့် တောင်တော၌ ပျော်မွေ့စွာနေစဉ် ဗာရာဏသီမင်းသည် ကိန္နရီကို တပ်မက်၍ စန္ဒကိန္နရာကို မြားဖြင့် ပစ်ခတ်လေသည်။ ဇနီးဖြစ်သူ သစ္စာဆို၍ ငိုကြွေးတောင်းပန်ရာ သိကြားမင်း ဆင်းသက်လာ၍ အသက်ပြန်လည်ရှင်စေလေသည်။","moral":"သစ္စာရှိသော ချစ်ခြင်းမေတ္တာသည် သေဘေးကိုပင် လွန်မြောက်စေနိုင်၏။"},{"no":486,"pali":"Mahāukkusajātaka","mm":"မဟာဥက္ကုသဇာတ်","summary":"သားငယ်ပေါက်ဖွားထားသော စွန်လင်မယားသည် ဥက္ကုသ်ငှက်မင်း၊ လိပ်နှင့် ခြင်္သေ့တို့နှင့် မိတ်ဆွေဖွဲ့ထား၏။ မုဆိုးတို့သည် မီးရှို ်း ခံရလေသည်။","moral":"တဏှာရာဂကြောင့် သတိလွတ်လျှင် ဘေးရန်နှင့် တွေ့ကြုံရတတ်၏။"},{"no":492,"pali":"Tacchasūkarajātaka","mm":"တစ္ဆသူကရဇာတ်","summary":"လက်သမားတို့ မွေးမြူခဲ့သော တစ္ဆသူကရဝက်သည် တောဝက်အပေါင်းကို စည်းရုံး၍ နည်းပရိယာယ်ဖြင့် ကျားကြီးကို အတူတကွ တိုက်ခိုက်အနိုင်ယူကြလေသည်။ ကျားကို အားကိုးနေသော စဉ်းလဲသည့် ရသေ့အယောင်ဆောင်လည်း ပျက်စီးခြင်းသို့ ရောက်လေသည်။","moral":"စည်းလုံးညီညွတ်မှုသည် အင်အားကြီးသောရန်သူကိုပင် အနိုင်ယူနိုင်၏။"},{"no":493,"pali":"Mahāvāṇijajātaka","mm":"မဟာဝါဏိဇဇာတ်","summary":"ကုန်သည်တို့သည် အလိုရှိရာကို ထွက်ပေါ်စေသော အံ့ဖွယ်ညောင်ပင်ကြီးကို တွေ့ရှိကြ၍ အကိုင်းတို့မှ ရေ၊ အစားအစာနှင့် ရတနာတို့ကို ရရှိကြ၏။ လောဘကြီးသောသူတို့က အမြစ်ပါ ခုတ်ယူလိုကြရာ ထိုအပင်ကိုစောင့်သော နဂါးတို့၏ ဒဏ်ကိုခံရ၍ လောဘသမားတို့ ပျက်စီးကြလေသည်။","moral":"လောဘလွန်ကဲလျှင် ရရှိပြီးသောအကျိုးပါ ဆုံးရှုံးရ၏။"},{"no":494,"pali":"Sādhinajātaka","mm":"သာဓိနဇာတ်","summary":"သာဓိနမင်းကြီးသည် ဒါနသီလတို့၌ မွေ့လျော်သဖြင့် သိကြားမင်း ဖိတ်ခေါ်ရာ တာဝတိံသာနတ်ပြည်၌ ကြာမြင့်စွာ စံမြန်းရလေသည်။ လူ့ပြည်သို့ ပြန်ရောက်သောအခါ လူမျိုးဆက်များစွာ လွန်ခဲ့ပြီဖြစ်သော်လည်း တစ်ဖန် ကောင်းမှုပြု၍ နတ်ပြည်သို့ပင် ပြန်လည်ရောက်ရှိလေသည်။","moral":"ဒါနသီလကောင်းမှုသည် နတ်စည်းစိမ်ကိုပင် ဆောင်ကြဉ်းပေးနိုင်၏။"},{"no":495,"pali":"Dasabrāhmaṇajātaka","mm":"ဒသဗြာဟ္မဏဇာတ်","summary":"ဗောဓိသတ် ဝိဓုရပညာရှိသည် ကောရဗျမင်းအား ပုဏ္ဏားဟူ၍ အမည်ခံသော်လည်း အကျင့်ယုတ်သော ပုဂ္ဂိုလ်ဆယ်မျိုးနှင့် စစ်မှန်သော သီလဂုဏ်ရှိ အလှူခံထိုက်သူတို့ကို ခွဲခြားပြသလေသည်။ မင်းကြီးသည် သီလရှိသူတို့အားသာ ရွေးချယ်လှူဒါန်းလေသည်။","moral":"အလှူကို သီလဂုဏ်နှင့် ပြည့်စုံသူ၌သာ ပြုအပ်၏။"},{"no":496,"pali":"Bhikkhāparamparajātaka","mm":"ဘိက္ခာပရမ္ပရဇာတ်","summary":"ရရှိသော အစားအစာကို မင်းကြီးက ပုရောဟိတ်အား၊ ပုရောဟိတ်က ရသေ့အား၊ ရသေ့က ပစ္စေကဗုဒ္ဓါအား ဆင့်ကာဆင့်ကာ လှူဒါန်းကြသဖြင့် အလှူခံပုဂ္ဂိုလ်၏ ဂုဏ်အလိုက် အလှူ၏အကျိုး ကြီးမားပုံကို ပြဆိုသော ဇာတ်တော်ဖြစ်သည်။","moral":"အလှူခံပုဂ္ဂိုလ်၏ ဂုဏ်မြင့်လေ အလှူ၏အကျိုး ကြီးလေဖြစ်၏။"},{"no":497,"pali":"Mātaṅgajātaka","mm":"မာတင်္ဂဇာတ်","summary":"ဗောဓိသတ်သည် မာတင်္ဂအမည်ရှိ ဒွန်းစဏ္ဍားသားဖြစ်၍ မာနကြီးသော သူဌေးသမီး ဒိဋ္ဌမင်္ဂလိကာ၏ ခင်ပွန်းဖြစ်လာပြီးနောက် ရသေ့ပြု၍ တန်ခိုးဉာဏ်စွမ်းနှင့် ပြည့်စုံလေသည်။ ဇာတ်မာနကြီးသော ပုဏ္ဏားတို့၏ အထင်သေးမှုကို နှိမ့်ချ၍ ဇာတ်ဇာတိထက် အကျင့်သီလသာ မြတ်ကြောင်း ပြသလေသည်။","moral":"လူ၏တန်ဖိုးသည် ဇာတ်ဇာတိ၌ မတည်၊ အကျင့်သီလ၌သာ တည်၏။"},{"no":498,"pali":"Cittasambhūtajātaka","mm":"စိတ္တသမ္ဘူတဇာတ်","summary":"စိတ္တနှင့် သမ္ဘူတတို့သည် ဘဝများစွာ အတူဖြစ်ခဲ့ကြပြီးနောက် တစ်ဦးက မင်းဖြစ်၍ တစ်ဦးက ရသေ့ဖြစ်လေသည်။ ရသေ့စိတ္တ (ဗောဓိသတ်) သည် အတိတ်ဘဝများကို ပြန်ပြောင်းပြောပြ၍ ဘဝစည်းစိမ်တို့၏ မမြဲမှုကို ဟောကြားရာ သမ္ဘူတမင်းလည်း တရားသံဝေဂ ရရှိလေသည်။","moral":"ဘဝစည်းစိမ်တို့သည် မမြဲသဖြင့် တရားကို ဆောလျင်စွာ ကျင့်အပ်၏။"},{"no":499,"pali":"Sivijātaka","mm":"သိဝိဇာတ်","summary":"သိဝိမင်းကြီး (ဗောဓိသတ်) သည် အလှူ၌ အလွန်မွေ့လျော်၍ ကိုယ်တွင်းအင်္ဂါကိုပင် လှူလိုသောဆန္ဒရှိရာ သိကြားမင်းသည် မျက်စိကန်းသော ပုဏ္ဏားအသွင်ဖြင့် လာရောက်၍ မျက်စိကို တောင်းလေသည်။ မင်းကြီးသည် မျက်စိနှစ်ကွင်းလုံးကို ဝမ်းမြောက်စွာ လှူပြီးနောက် သစ္စာတန်ခိုးကြောင့် အံ့ဖွယ်မျက်စိအသစ်ကို ပြန်လည်ရရှိလေသည်။","moral":"စေတနာပြည့်ဝသော အလှူသည် အတိုင်းမသိ ကြီးမားသောအကျိုးကို ပေး၏။"},{"no":500,"pali":"Sirīmantajātaka","mm":"သိရီမန္တဇာတ်","summary":"စည်းစိမ်ဥစ္စာနှင့် ပညာတို့တွင် မည်သည်က မြတ်သနည်းဟူသော ပြဿနာကို ဝိဒေဟမင်း မေးရာ သေနကဆရာက ဥစ္စာမြတ်သည်ဟု ဖြေဆို၍ မဟောသဓပညာရှိ (ဗောဓိသတ်) က ပညာသာလျှင် အမြတ်ဆုံးဖြစ်ကြောင်း အကြောင်းပြချက်နှင့်တကွ ဖြေကြားလေသည်။","moral":"ပညာသည် ဥစ္စာစည်းစိမ်ထက် မြတ်၏။"},{"no":501,"pali":"Rohaṇamigajātaka","mm":"ရောဟဏမိဂဇာတ်","summary":"ရောဟဏသမင်မင်း (ဗောဓိသတ်) သည် ကျော့ကွင်း၌ မိသောအခါ သမင်အပေါင်း ထွက်ပြေးကြသော်လည်း ညီဖြစ်သူနှင့် နှမတို့သည် အသက်စွန့်၍ အနီး၌ စောင့်နေကြလေသည်။ ထိုမေတ္တာသစ္စာကို မြင်သော မုဆိုးသည် ကြည်ညိုသဖြင့် လွှတ်ပေး၍ တရားစကားကို နာယူလေသည်။","moral":"ဆွေမျိုးသားချင်းအပေါ် ထားရှိသော မေတ္တာသစ္စာသည် ရက်စက်သူကိုပင် နူးညံ့စေ၏။"},{"no":502,"pali":"Cūḷahaṁsajātaka","mm":"ဟံသဇာတ်","summary":"ရွှေဟင်္သာမင်း ဓတရဋ္ဌ (ဗောဓိသတ်) သည် မုဆိုးထောင်ထားသော ကျော့ကွင်း၌ မိရာ ဟင်္သာအပေါင်း ထွက်ပြေးကြသော်လည်း စစ်သူကြီး သုမုခဟင်္သာသည် အသက်ကိုစွန့်၍ အနီးမှ မခွာဘဲ စောင့်နေလေသည်။ မုဆိုးသည် ထိုသစ္စာစောင့်သိမှုကို အံ့ဩကြည်ညို၍ လွှတ်ပေးရာ ဟင်္သာမင်းတို့သည် မင်းကြီးအား တရားဟောကြားပြီးမှ ပြန်ကြလေသည်။","moral":"မိတ်ဆွေစစ်သည် ဘေးဒုက္ခရောက်သောအခါ စွန့်ပစ်၍ မထွက်ခွာ။"},{"no":503,"pali":"Sattigumbajātaka","mm":"သတ္တိဂုမ္ဗဇာတ်","summary":"ကျေးညီအစ်ကိုနှစ်ကောင်တွင် သတ္တိဂုမ္ဗသည် ခိုးသားတို့အရပ်၌ ကြီးပြင်း၍ ကြမ်းတမ်းယုတ်မာသောစကားကို ပြောဆိုတတ်ပြီး ညီဖြစ်သူသည် ရသေ့တို့ထံ၌ ကြီးပြင်း၍ ယဉ်ကျေးဖြူစင်လေသည်။ မင်းကြီးသည် ထိုနှစ်ကောင်၏ ခြားနားချက်ကို တွေ့မြင်၍ ပေါင်းသင်းမှီဝဲရာ၏ အရေးကြီးပုံကို သဘောပေါက်လေသည်။","moral":"မှီဝဲပေါင်းသင်းရာ အပေါင်းအသင်းအလိုက် စိတ်နေသဘောထား ပြောင်းလဲတတ်၏။"},{"no":504,"pali":"Bhallātiyajātaka","mm":"ဘလ္လာတိယဇာတ်","summary":"ဘလ္လာတိယမင်းကြီးသည် တောင်ပေါ်၌ ငိုကြွေးနေကြသော ကိန္နရာလင်မယားကို တွေ့၍ အကြောင်းမေးရာ ရှေးနှစ်ပေါင်း ခုနစ်ရာကျော်က တစ်ညတာမျှ ခွဲခွာနေခဲ့ရသည်ကို ယနေ့တိုင် အောက်မေ့၍ ငိုကြွေးနေကြကြောင်း ဖြေကြားကြလေသည်။ ချစ်ခင်သူချင်း ခွဲခွာရခြင်း၏ ဆင်းရဲကို ပြသော ဇာတ်တော်ဖြစ်သည်။","moral":"ချစ်ခင်သူတို့နှင့် ခွဲခွာရခြင်းသည် ဆင်းရဲသဖြင့် သင့်မြတ်စွာ ပေါင်းသင်းနေထိုင်အပ်၏။"},{"no":505,"pali":"Somanassajātaka","mm":"သောမနဿဇာတ်","summary":"သောမနဿမင်းသား (ဗောဓိသတ်) သည် အယောင်ဆောင်ရသေ့၏ မမှန်သောစွပ်စွဲချက်ကြောင့် ခမည်းတော်၏ အမျက်သင့်၍ အသတ်ခံရလုနီး ဖြစ်ခဲ့ရာ အကြောင်းစုံကို ရဲရင့်စွာ ထုချေဖော်ထုတ်နိုင်ခဲ့လေသည်။ လောကဓံကို ငြီးငွေ့သဖြင့် မင်းစည်းစိမ်ကို စွန့်၍ တောထွက်လေသည်။","moral":"မစုံစမ်းမဆင်ခြင်ဘဲ အရေးယူခြင်းသည် ကြီးမားသောအမှားကို ဖြစ်စေတတ်၏။"},{"no":506,"pali":"Campeyyajātaka","mm":"စမ္ပေယျဇာတ်","summary":"နဂါးမင်း စမ္ပေယျ (ဗောဓိသတ်) သည် ဥပုသ်သီလ ဆောက်တည်နေစဉ် အလမ္ပာယ်ဆရာ၏ ဖမ်းဆီးခြင်းကို ခံရ၍ မြို့ရွာတို့၌ ကပြခိုင်းစေခြင်း ခံရလေသည်။ သီလမပျက်စေရန် အမျက်မထွက်ဘဲ သည်းခံနေရာ မိဖုရား သုမနာ၏ ရှာဖွေမှုနှင့် ဗာရာဏသီမင်း၏ ကူညီမှုတို့ကြောင့် လွတ်မြောက်လေသည်။","moral":"သီလကို အသက်ထက် မြတ်နိုး၍ စောင့်ထိန်းအပ်၏။"},{"no":507,"pali":"Mahāpalobhanajātaka","mm":"မဟာပလောဘနဇာတ်","summary":"မိန်းမတို့ကို ရှောင်ကြဉ်စက်ဆုပ်သော မင်းသားသည် ကျွမ်းကျင်လိမ္မာသော မိန်းမပျို၏ ဖြားယောင်းမှုကြောင့် ကာမဂုဏ်၌ တွယ်တာမက်မောလာ၍ ဘေးအန္တရာယ်နှင့်ပင် ကြုံတွေ့ရလေသည်။ နောက်ဆုံး၌ ကာမဂုဏ်၏ အပြစ်ကို မြင်၍ တောထွက် တရားကျင့်လေသည်။","moral":"ကာမဂုဏ်၏ ဖြားယောင်းမှုသည် ခိုင်မြဲသောစိတ်ကိုပင် မွှေနှောက်နိုင်၏။"},{"no":508,"pali":"Pañcapaṇḍitajātaka","mm":"ပဉ္စပဏ္ဍိတဇာတ်","summary":"ဝိဒေဟမင်းသည် ပညာရှိငါးဦးတို့အား လျှို့ဝှက်ချက်ကို မည်သူ့အား ဖွင့်ပြောသင့်သနည်းဟု မေးရာ အခြားပညာရှိလေးဦးက မိတ်ဆွေ၊ ဆွေမျိုးစသည်တို့အား ပြောသင့်သည်ဟု ဖြေကြသော်လည်း မဟောသဓပညာရှိ (ဗောဓိသတ်) က လျှို့ဝှက်ချက်ကို မည်သူ့အားမျှ မဖွင့်ပြောသင့်ကြောင်း ဖြေဆိုလေသည်။","moral":"လျှို့ဝှက်အပ်သောအရာကို လုံခြုံစွာ စောင့်ထိန်းအပ်၏။"},{"no":509,"pali":"Hatthipālajātaka","mm":"ဟတ္ထိပါလဇာတ်","summary":"ပုရောဟိတ်၏သားကြီး ဟတ္ထိပါလ (ဗောဓိသတ်) သည် မင်းအရိုက်အရာကို စွန့်၍ တောထွက်ရာ ညီသုံးဦး၊ မိဘနှစ်ပါး၊ မင်းကြီးနှင့် မိဖုရားမှစ၍ တစ်ပြည်လုံးပါ တစ်ဆင့်ပြီးတစ်ဆင့် လိုက်ပါတောထွက်ကြလေသည်။ ကြီးမားသော စွန့်လွှတ်မှုကို ပြသော ဇာတ်တော်ဖြစ်သည်။","moral":"ကုသိုလ်တရားကျင့်ရန် အခါကောင်းကို မဆိုင်းမတွ ဆောလျင်စွာ ပြုအပ်၏။"},{"no":510,"pali":"Ayogharajātaka","mm":"အယောဃရဇာတ်","summary":"ယခင်သားတော်များကို ဘီလူးမ ဖမ်းစားသဖြင့် မင်းကြီးသည် သားတော်ငယ်ကို သံအိမ်၌ ထိန်းသိမ်းကြီးပြင်းစေလေသည်။ အရွယ်ရောက်သော အယောဃရမင်းသား (ဗောဓိသတ်) သည် သံအိမ်သည် ဘီလူးဘေးကို ကာကွယ်နိုင်သော်လည်း အိုခြင်းသေခြင်းဘေးကို မကာကွယ်နိုင်ကြောင်း ဆင်ခြင်၍ တောထွက်လေသည်။","moral":"သေမင်း၏ဘေးကို မည်သည့်ခိုလှုံရာကမျှ မကာကွယ်နိုင်။"},{"no":511,"pali":"Kiṁchandajātaka","mm":"ကိံဆန္ဒဇာတ်","summary":"ရသေ့တစ်ပါးသည် မြစ်ရေစီး၌ မျောပါလာသော အလွန်ချိုမြိန်သည့် သရက်သီးကို စားရ၍ တပ်မက်စွဲလမ်းနေလေသည်။ ထိုသရက်ဥယျာဉ်ကို ပိုင်ဆိုင်သူမှာ အသက်ရှင်စဉ်က ကောင်းမှုမကောင်းမှု ရောနှောပြုခဲ့သဖြင့် တစ်ချိန်၌ စည်းစိမ်ခံစားရ၍ တစ်ချိန်၌ ဆင်းရဲခံရသော ဘဝမျိုးကို ရရှိနေကြောင်း သိရလေသည်။","moral":"ကောင်းမှုမကောင်းမှု ရောနှောပြုလျှင် အကျိုးပေးလည်း ရောနှော၍ ခံစားရ၏။"},{"no":512,"pali":"Kumbhajātaka","mm":"ကုမ္ဘဇာတ်","summary":"မုဆိုးသုရသည် သစ်ခေါင်း၌ အလိုအလျောက် ဖြစ်ပေါ်နေသော သေရည်ကို စတင်တွေ့ရှိရာ ထိုသေရည်သည် တိုင်းပြည်အနှံ့ ပျံ့နှံ့၍ လူတို့ကို ပျက်စီးရာပျက်စီးကြောင်း ဖြစ်စေလေသည်။ သိကြားမင်း (ဗောဓိသတ်) သည် မင်းကြီးအား သေရည်၏ အပြစ်များကို အကျယ်ဟောကြားသဖြင့် မင်းကြီးသည် သေရည်ကို စွန့်လွှတ်လေသည်။","moral":"သေရည်သေရက်သည် ပျက်စီးခြင်းအပေါင်း၏ အကြောင်းရင်းဖြစ်၍ ရှောင်ကြဉ်အပ်၏။"},{"no":513,"pali":"Jayaddisajātaka","mm":"ဇယဒ္ဒိသဇာတ်","summary":"ဇယဒ္ဒိသမင်း၏ နောင်တော်သည် ငယ်စဉ်က ဘီလူးမခိုးယူသွား၍ လူသားစားသူအဖြစ် ကြီးပြင်းခဲ့လေသည်။ မင်းကြီး ဖမ်းမိခံရသောအခါ သားတော် (ဗောဓိသတ်) သည် ခမည်းတော့်ကိုယ်စား မိမိကိုယ်ကို အစားထိုးပေးအပ်ကာ ကြောက်ရွံ့ခြင်းမရှိဘဲ တရားစကား ဟောကြားရာ လူသားစားသူသည် ယဉ်ကျေးသိမ်မွေ့သွား၍ မကောင်းမှုကို စွန့်လွှတ်လေသည်။","moral":"ရဲရင့်ခြင်းနှင့် မေတ္တာတရားသည် ရက်စက်ကြမ်းကြုတ်သူကိုပင် ယဉ်ကျေးစေနိုင်၏။"},{"no":514,"pali":"Chaddantajātaka","mm":"ဆဒ္ဒန္တဇာတ်","summary":"ဆဒ္ဒန်ဆင်မင်း (ဗောဓိသတ်) အပေါ် အငြိုးထားခဲ့သော ငယ်မယားဟောင်းသည် သေဆုံးပြီးနောက် ဗာရာဏသီမိဖုရား ဖြစ်လာ၍ ဆင်မင်း၏အစွယ်ကို လိုချင်သည်ဟုဆိုကာ မုဆိုးသောနုတ္တရကို စေလွှတ်လေသည်။ မြားဒဏ်ရာရသော်လည်း ဆင်မင်းသည် အမျက်မထွက်ဘဲ မိမိအစွယ်ကို ကိုယ်တိုင်ဖြတ်၍ ပေးလှူလိုက်ရာ မိဖုရားသည် ကြားသိရသောအခါ နောင်တပူပန်ခြင်းကြီးစွာဖြင့် သေဆုံးလေသည်။","moral":"အငြိုးအာဃာတသည် သူတစ်ပါးကိုသာမက မိမိကိုယ်ကိုပါ ပျက်စီးစေ၏။"},{"no":515,"pali":"Sambhavajātaka","mm":"သမ္ဘဝဇာတ်","summary":"မင်းကြီးသည် တရားနက်နဲသော ပြဿနာကို ဖြေဆိုနိုင်သူ ရှာဖွေစေရာ ကျော်ကြားသော ပညာရှိကြီးများပင် မဖြေဆိုနိုင်ကြဘဲ အသက်ခုနစ်နှစ်အရွယ် သမ္ဘဝသူငယ် (ဗောဓိသတ်) က ထိုပြဿနာကို ပြည့်စုံကျနစွာ ဖြေဆိုနိုင်လေသည်။","moral":"ပညာဉာဏ်သည် အသက်အရွယ်၌ မတည်။"},{"no":516,"pali":"Mahākapijātaka","mm":"မဟာကပိဇာတ်","summary":"မျောက်မင်း (ဗောဓိသတ်) သည် ချောက်ထဲကျနေသော ပုဏ္ဏားကို ပင်ပန်းကြီးစွာ သယ်ဆောင်ကယ်တင်ခဲ့၏။ ကျေးဇူးကန်းသော ထိုသူသည် အိပ်ပျော်နေသော မျောက်မင်း၏ဦးခေါင်းကို ကျောက်ခဲဖြင့် ထုနှက်သော်လည်း မျောက်မင်းက အာဃာတမထားဘဲ တောထွက်ရာလမ်းကို ညွှန်ပြပေးလေသည်။ ကျေးဇူးကန်းသူသည် ကြီးလေးသော အပြစ်ဒဏ်ကို ခံရလေသည်။","moral":"ကျေးဇူးကန်းခြင်းသည် ကြီးလေးသော ဆိုးကျိုးကို ဖြစ်စေ၏။"},{"no":517,"pali":"Dakarakkhasajātaka","mm":"ဒကရက္ခသဇာတ်","summary":"ရေဘီလူးသည် သင်္ဘောကို ဖမ်းယူ၍ လူတစ်ဦးစီကို စွန့်ရမည်ဆိုလျှင် မည်သူ့ကို အစဉ်အတိုင်း စွန့်မည်နည်းဟူသော ပြဿနာကို မင်းကြီးအား မေးလေသည်။ မင်းကြီးက မိမိကိုယ်ကိုစွန့်၍ပင် မဟောသဓပညာရှိကို နောက်ဆုံးမှ စွန့်မည်ဟု ဖြေဆိုသဖြင့် သီလပညာရှိသူ၏ တန်ဖိုးကြီးမားပုံ ပေါ်လွင်လေသည်။","moral":"သီလပညာနှင့် ပြည့်စုံသော သူတော်ကောင်းကို အမြတ်ဆုံး တန်ဖိုးထားအပ်၏။"},{"no":518,"pali":"Paṇḍaranāgarājajātaka","mm":"ပဏ္ဍရနာဂရာဇဇာတ်","summary":"ပဏ္ဍရနဂါးမင်းသည် မိမိတို့နဂါးမျိုး၏ လျှို့ဝှက်ချက်ကို ယုံကြည်စွာ ဖွင့်ပြောမိရာ ထိုအယောင်ဆောင်ရသေ့က ဂဠုန်မင်းအား ဖောက်ပြန်ပြောကြားသဖြင့် နဂါးမင်း ဖမ်းဆီးခံရလေသည်။ နဂါးမင်း၏ လျှောက်ထားချက်ကြောင့် ဂဠုန်မင်း လွှတ်ပေး၍ သစ္စာဖောက်သော ရသေ့မှာ ကြီးစွာသော အပြစ်ဒဏ်သင့်လေသည်။","moral":"လျှို့ဝှက်ချက်ကို မစိစစ်ဘဲ ဖွင့်ဟခြင်းသည် အသက်ဘေးကိုပင် ရောက်စေတတ်၏။"},{"no":519,"pali":"Sambulājātaka","mm":"သမ္ဗုလာဇာတ်","summary":"သမ္ဗုလာမင်းသမီးသည် နူနာစွဲ၍ တောသို့ထွက်သော ခင်ပွန်း သောတ္ထိသေနမင်းသားကို သစ္စာရှိစွာ လိုက်ပါပြုစုလေသည်။ ဘီလူး၏ဘေးမှ သိကြားမင်း ကယ်တင်၍ သူမ၏သစ္စာဆိုမှုကြောင့် ခင်ပွန်း၏ရောဂါလည်း ပျောက်ကင်းလေသည်။ နန်းပြန်တက်သောအခါ မေ့လျော့ခြင်းခံရသော်လည်း နောက်ဆုံး၌ ဂုဏ်ပြုချီးမြှောက်ခြင်း ခံရလေသည်။","moral":"သစ္စာရှိသော ဇနီးမယား၏ ကျေးဇူးဂုဏ်ကို အသိအမှတ်ပြု မြတ်နိုးအပ်၏။"},{"no":520,"pali":"Gandhatindukajātaka","mm":"ဂန္ဓတိန္ဒုကဇာတ်","summary":"ပဉ္စာလမင်းသည် မေ့လျော့စွာ မင်းပြုနေသဖြင့် တိုင်းသူပြည်သားတို့ ဆင်းရဲကြရာ သစ်ပင်စောင့်နတ် (ဗောဓိသတ်) သည် မင်းကျင့်တရားကို ဟောကြားဆုံးမလေသည်။ မင်းကြီးသည် ရုပ်ဖျက်၍ တိုင်းခန်းလှည့်လည်ရာ မိမိအုပ်ချုပ်မှု ညံ့ဖျင်းခြင်း၏ အပြစ်များကို ကိုယ်တိုင်တွေ့မြင်ပြီး တရားသဖြင့် ပြုပြင်အုပ်စိုးလေသည်။","moral":"မင်းပြုသူသည် မမေ့မလျော့ တရားသဖြင့် အုပ်ချုပ်အပ်၏။"},{"no":521,"pali":"Tesakuṇajātaka","mm":"တေသကုဏဇာတ်","summary":"သားသမီးမရှိသော မင်းကြီးသည် ငှက်သုံးကောင်ကို သားသမီးအရာထား၍ မွေးမြူရာ အရွယ်ရောက်သောအခါ တစ်ကောင်စီအား မင်းကျင့်တရားကို မေးလေသည်။ ဝေဿန္တရ၊ ကုဏ္ဍလိနီနှင့် ဇမ္ဗုက (ဗောဓိသတ်) ငှက်တို့သည် တရားသဖြင့် အုပ်ချုပ်ရေးဆိုင်ရာ အဆုံးအမတို့ကို အသီးသီး ဟောကြားကြသဖြင့် မင်းကြီးသည် ထိုအတိုင်း တရားသဖြင့် မင်းပြုလေသည်။","moral":"ပညာရှိတို့၏ အဆုံးအမကို နာယူ၍ တရားသဖြင့် အုပ်စိုးအပ်၏။"},{"no":522,"pali":"Sarabhaṅgajātaka","mm":"သရဘင်္ဂဇာတ်","summary":"လေးအတတ်၌ အတုမရှိသော ဇောတိပါလလုလင် (ဗောဓိသတ်) သည် စည်းစိမ်ကိုစွန့်၍ သရဘင်္ဂရသေ့ကြီးအဖြစ် တပည့်များစွာနှင့် တော၌ နေထိုင်လေသည်။ မင်းသုံးပါးနှင့် သိကြားမင်းတို့ လာရောက်မေးမြန်းသော ပြဿနာတို့ကို ဖြေကြားရာ ဒေါသကို ပယ်သတ်ခြင်းနှင့် ကာမကို စွန့်ခြင်းတို့၏ ချမ်းသာကို ဟောကြားလေသည်။","moral":"ဒေါသကို ပယ်သတ်နိုင်သူသည် စိုးရိမ်ပူဆွေးခြင်းမှ ကင်းဝေး၏။"},{"no":523,"pali":"Alambusājātaka","mm":"အလမ္ဗုသာဇာတ်","summary":"ဣသိသိင်္ဂရသေ့၏ တန်ခိုးအကျင့်ကို စိုးရိမ်သော သိကြားမင်းသည် နတ်သမီး အလမ္ဗုသာကို စေလွှတ်၍ ဖြားယောင်းစေရာ ရသေ့သည် ဈာန်ပျက်၍ သုံးနှစ်ပတ်လုံး သတိမေ့လျော့နေလေသည်။ သတိပြန်ရသောအခါ ကြီးစွာသော သံဝေဂဖြင့် အားထုတ်၍ ဈာန်ကို ပြန်လည်ရရှိပြီး အလမ္ဗုသာကိုလည်း အပြစ်မှ လွှတ်လေသည်။","moral":"မေ့လျော့မှုကြောင့် ပျက်စီးသော်လည်း လုံ့လဖြင့် ပြန်လည်ထူထောင်နိုင်၏။"},{"no":524,"pali":"Saṅkhapālajātaka","mm":"သင်္ခပါလဇာတ်","summary":"နဂါးမင်း သင်္ခပါလ (ဗောဓိသတ်) သည် နဂါးစည်းစိမ်ကို ငြီးငွေ့၍ လူ့ပြည်၌ ဥပုသ်သီလ ဆောက်တည်နေစဉ် လူဆိုးတို့၏ ထိုးဆွဖမ်းဆီး သယ်ဆောင်နှိပ်စက်ခြင်းကို အမျက်မထွက်ဘဲ သည်းခံလေသည်။ အဠာရသူကြွယ်က ကယ်တင်ရာ နဂါးပြည်သို့ ပင့်ဆောင်၍ သီလ၏အကျိုးကို ဟောကြားလေသည်။","moral":"သီလကို စောင့်ထိန်းရာ၌ အသက်ကိုပင် ပဓာနမထားဘဲ သည်းခံအပ်၏။"},{"no":525,"pali":"Cūḷasutasomajātaka","mm":"စူဠသုတသောမဇာတ်","summary":"သုတသောမမင်းကြီး (ဗောဓိသတ်) သည် သံသရာဘေးကို ဆင်ခြင်၍ သံဝေဂရသဖြင့် စည်းစိမ်ချမ်းသာနှင့် ဆွေတော်မျိုးတော်တို့၏ တောင်းပန်တားမြစ်မှုကို ပယ်ကာ တောထွက်လေသည်။ မိဖုရား၊ သားတော်သမီးတော်နှင့် တိုင်းသူပြည်သားအများပါ နောက်လိုက်၍ တရားကျင့်ကြလေသည်။","moral":"သံသရာဘေးကို ဆင်ခြင်မိလျှင် မဆိုင်းမတွ တရားကျင့်အပ်၏။"},{"no":526,"pali":"Niḷinikājātaka","mm":"နိဠိနိကာဇာတ်","summary":"မိုးခေါင်ခြင်းဘေးကို ငြိမ်းစေရန်ဟူသော အကြောင်းကြောင့် မင်းကြီးသည် သမီးတော် နိဠိနိကာကို စေလွှတ်၍ တော၌တရားကျင့်နေသော ဣသိသိင်္ဂရသေ့ငယ်၏ အကျင့်ကို ဖျက်ဆီးစေလေသည်။ မိန်းမကို တစ်ခါမျှ မမြင်ဖူးသော ရသေ့ငယ်သည် ဖြားယောင်းခြင်းခံရ၍ ဈာန်ပျက်ရာ ဖခင်ရသေ့ကြီး (ဗောဓိသတ်) က ဖြားယောင်းတတ်သောသဘောကို ဟောကြားဆုံးမသဖြင့် သားရသေ့သည် ဈာန်ကို ပြန်လည်ရရှိလေသည်။","moral":"ဖြားယောင်းသွေးဆောင်မှု၌ သတိပညာဖြင့် စောင့်စည်းအပ်၏။"},{"no":527,"pali":"Ummādantījātaka","mm":"ဥမ္မာဒန္တီဇာတ်","summary":"သိဝိမင်းကြီး (ဗောဓိသတ်) သည် စစ်သူကြီး အဘိပါရက၏ဇနီး ဥမ္မာဒန္တီကို မြင်၍ စိတ်နှလုံးရူးသွပ်မတတ် တပ်မက်လေသည်။ စစ်သူကြီးက မိမိဇနီးကို ဆက်သပါမည်ဟု လျှောက်ထားသော်လည်း မင်းကြီးသည် တရားစောင့်သောစိတ်ဖြင့် ထိုတပ်မက်မှုကို နှိမ်နင်းအောင်မြင်လေသည်။","moral":"တဏှာရာဂကို တရားအကျင့်ဖြင့် နှိမ်နင်းခြင်းသည် မင်းမြတ်တို့၏ ဂုဏ်ဖြစ်၏။"},{"no":528,"pali":"Mahābodhijātaka","mm":"မဟာဗောဓိဇာတ်","summary":"မဟာဗောဓိပရိဗိုဇ် (ဗောဓိသတ်) သည် မင်းကြီး၏ ချီးမြှောက်မှုကို ခံရသဖြင့် မနာလိုသော အမတ်ငါးဦးတို့၏ ကုန်းချောခြင်းကြောင့် တောသို့ ဖဲကြဉ်သွားလေသည်။ ထို့နောက် ပြန်လာ၍ ကံကမ္မကို ငြင်းပယ်သောအယူ စသည့် အမတ်ငါးဦး၏ မိစ္ဆာအယူငါးမျိုးကို ပညာဖြင့် တစ်ခုချင်း ချေဖျက်ကာ မင်းကြီးကို တရားလမ်းမှန်သို့ ပြန်လည်တင်ပေးလေသည်။","moral":"မှားယွင်းသောအယူကို ပညာဖြင့် ဆင်ခြင်ပယ်ဖျက်အပ်၏။"},{"no":529,"pali":"Soṇakajātaka","mm":"သောဏကဇာတ်","summary":"အရိန္ဒမမင်းကြီးသည် ငယ်သူငယ်ချင်း သောဏကကို တွေ့လိုသဖြင့် နှစ်ပေါင်းများစွာ ရှာဖွေလေသည်။ ပစ္စေကဗုဒ္ဓါဖြစ်နေပြီဖြစ်သော သောဏကက ကာမစည်းစိမ်၏ အပြစ်နှင့် ငြိမ်းချမ်းမှု၏ဂုဏ်ကို ဟောကြားရာ မင်းကြီးသည် သားတော်အား နန်းအပ်၍ တောထွက်ကာ ဈာန်ကို ရရှိလေသည်။","moral":"ကာမစည်းစိမ်ထက် စွန့်လွှတ်ငြိမ်းချမ်းမှုသည် သာ၍မြတ်၏။"},{"no":530,"pali":"Saṅkiccajātaka","mm":"သင်္ကိစ္စဇာတ်","summary":"ခမည်းတော်ကို လုပ်ကြံ၍ နန်းတက်ခဲ့သော မင်းကြီးသည် စိတ်မငြိမ်မသက် ပူပန်နေရာ သင်္ကိစ္စရသေ့ကြီး (ဗောဓိသတ်) သည် မကောင်းမှုကံတို့၏ အကျိုးပေးဖြစ်သော ငရဲဘုံများ၏ အဖြစ်ကို အကျယ်ဟောကြားလေသည်။ မင်းကြီးသည် ကြောက်လန့်သံဝေဂရ၍ မကောင်းမှုမှ ရှောင်ကြဉ်ကာ ကုသိုလ်တရား ပွားများလေသည်။","moral":"မကောင်းမှုကံသည် အပါယ်ငရဲအကျိုးကို ပေးတတ်သဖြင့် ရှောင်ကြဉ်အပ်၏။"},{"no":531,"pali":"Kusajātaka","mm":"ကုသဇာတ်","summary":"ကုသမင်းကြီး (ဗောဓိသတ်) သည် ရုပ်အဆင်းမလှသော်လည်း ဉာဏ်ပညာနှင့် အတတ်အစွမ်း ထူးချွန်လေသည်။ မျက်နှာချင်းမဆိုင်စေဘဲ ပရိယာယ်ဖြင့် ထိမ်းမြားခဲ့သော ပဘာဝတီမိဖုရားသည် မင်းကြီး၏ရုပ်ကို မြင်သောအခါ စက်ဆုပ်၍ မိမိတိုင်းပြည်သို့ ပြန်ထွက်သွားလေသည်။ ကုသမင်းသည် နောက်သို့လိုက်၍ စားတော်ကဲအဖြစ် အမှုထမ်းကာ သည်းခံစောင့်ဆိုင်းနေရာ မင်းခုနစ်ပါးတို့ ဝိုင်းရံတိုက်ခိုက်သောအခါ ရဲရင့်စွာ ကယ်တင်နိုင်ခဲ့သဖြင့် ပဘာဝတီနှင့် ပြန်လည်ပေါင်းဖက်၍ စည်းစိမ်ချမ်းသာနှင့် ပြည့်စုံလေသည်။","moral":"ဇွဲလုံ့လနှင့် သည်းခံမှုသည် အလိုဆန္ဒကို ပြည့်စုံစေ၏။"},{"no":532,"pali":"Soṇanandajātaka","mm":"သောဏနန္ဒဇာတ်","summary":"သောဏနှင့် နန္ဒ ညီအစ်ကိုနှစ်ပါး (အစ်ကိုသောဏမှာ ဗောဓိသတ်) သည် ရသေ့ပြု၍ အိုမင်းသော မိဘနှစ်ပါးကို လုပ်ကျွေးပြုစုကြလေသည်။ လုပ်ကျွေးပုံနည်းလမ်း ကွဲလွဲမှုကြောင့် အစ်ကိုက ညီကို ပယ်ရှားရာ နန္ဒသည် မင်းတို့၏အကူအညီဖြင့် တောင်းပန်၍ ပြန်လည်သင့်မြတ်ကြပြီး မိဘဝတ်ကျေပွန်ခြင်း၏ ဂုဏ်ကျေးဇူးကို မင်းအပေါင်းရှေ့၌ ဟောကြားလေသည်။","moral":"မိဘကို လုပ်ကျွေးပြုစုခြင်းသည် မြတ်သောမင်္ဂလာတရားဖြစ်၏။"},{"no":533,"pali":"Cūḷahaṁsajātaka","mm":"စူဠဟံသဇာတ်","summary":"ရွှေဟင်္သာမင်း ဓတရဋ္ဌ (ဗောဓိသတ်) သည် မုဆိုးထောင်ထားသော ကျော့ကွင်း၌ မိသောအခါ ဟင်္သာအပေါင်း ထွက်ပြေးကြသော်လည်း စစ်သူကြီး သုမုခဟင်္သာသည် အရှင်ကိုစွန့်၍ မသွားနိုင်ဟုဆိုကာ အသက်ကိုစွန့်လျက် အနီး၌ စောင့်နေလေသည်။ ထိုကြီးမြတ်သော သစ္စာစောင့်သိမှုကို မြင်သော မုဆိုးသည် ကြည်ညိုသဖြင့် လွှတ်ပေးရာ ဟင်္သာမင်းတို့သည် မင်းကြီးထံ ကိုယ်တိုင်သွားရောက်၍ တရားဟောကြားပြီး ဂုဏ်ပြုပူဇော်ခြင်းကို ခံရလေသည်။ ဗုဒ္ဓအတွက် အသက်စွန့်ဝံ့သော အာနန္ဒာမထေရ်၏ဂုဏ်နှင့် စပ်၍ ဟောကြားတော်မူသော ဇာတ်တော်ဖြစ်သည်။","moral":"မိတ်ဆွေစစ်သည် အသက်ဘေးရောက်သော်လည်း မိတ်ဆွေကို စွန့်ပစ်၍ မသွား။"},{"no":534,"pali":"Mahāhaṁsajātaka","mm":"မဟာဟံသဇာတ်","summary":"ခေမာမိဖုရားသည် ရွှေဟင်္သာမင်း တရားဟောသည်ကို အိပ်မက်မြင်၍ နာယူလိုသဖြင့် မင်းကြီးသည် မုဆိုးကို စေလွှတ်ကာ ကျော့ကွင်းထောင်စေလေသည်။ ဟင်္သာမင်း ဓတရဋ္ဌ (ဗောဓိသတ်) ကျော့မိသောအခါ စစ်သူကြီး သုမုခသည် အသက်စွန့်၍ စောင့်ရှောက်နေသဖြင့် မုဆိုးသည် ကြည်ညို၍ လွှတ်မည်ပြုရာ ဟင်္သာမင်းတို့က မင်းကြီးထံသို့ပင် လိုက်ပါကြလေသည်။ ဟင်္သာမင်းသည် မင်းကြီးနှင့် မိဖုရားအား မင်းကျင့်တရားနှင့် သုစရိုက်တရားတို့ကို ဟောကြားပြီး ဂုဏ်ပြုပူဇော်ခြင်းကို ခံလျက် ပြန်လည်ထွက်ခွာလေသည်။","moral":"သစ္စာရှိသော အပေါင်းအဖော်နှင့် တရားဓမ္မသည် ဘေးရန်ကို အောင်နိုင်စေ၏။"},{"no":535,"pali":"Sudhābhojanajātaka","mm":"သုဓာဘောဇနဇာတ်","summary":"အလွန်ဝန်တိုသော ကောသိယသူဌေးသည် ယာဂုကို လူမသိအောင် တစ်ယောက်တည်း ချက်ပြုတ်စားမည်ပြုရာ သိကြားမင်းအမှူးရှိသော နတ်တို့သည် ပုဏ္ဏားအသွင်ဖြင့် လာရောက်အလှူခံ၍ ဝန်တိုခြင်း၏အပြစ်နှင့် ပေးလှူခြင်း၏အကျိုးကို ဟောကြားကြလေသည်။ သူဌေးသည် သံဝေဂရ၍ ဥစ္စာအားလုံးကို လှူဒါန်းကာ ရသေ့ရဟန်းပြုလေသည်။ နောက်ပိုင်း၌ သိကြားမင်း၏ သမီးတော်လေးပါးတို့ သုဓာဘောဇဉ်အတွက် ငြင်းခုံကြရာ အရှက်တရားကို ဆောင်သော ဟိရီနတ်သမီးသာ ထိုက်တန်ကြောင်း ဆုံးဖြတ်ခြင်းခံရလေသည်။","moral":"ဝန်တိုခြင်းကို ပယ်၍ အရှက်တရားနှင့် ပေးလှူခြင်း၌ မွေ့လျော်အပ်၏။"},{"no":536,"pali":"Kuṇālajātaka","mm":"ကုဏာလဇာတ်","summary":"ကုဏာလငှက်မင်း (ဗောဓိသတ်) သည် မိတ်ဆွေ ပုဏ္ဏမုခငှက်မင်းနှင့် ရသေ့ပရိသတ်တို့အား မိန်းမတို့၏ ဖောက်ပြန်တတ်သောသဘောကို ရှေးဖြစ်ဟောင်း သာဓကများစွာဖြင့် အကျယ်ဟောကြားလေသည်။ ရေအတွက် ခိုက်ရန်ဖြစ်ကြသော သာကီဝင်နှင့် ကောလိယဆွေတော်မျိုးတော်တို့မှ ရဟန်းပြုလာသူတို့၏ မပျော်ပိုက်သောစိတ်ကို ပယ်ဖျောက်ရန် ဟောကြားတော်မူသော ဇာတ်တော်ကြီးဖြစ်သည်။","moral":"ကာမရာဂ၌ စွဲမက်တွယ်တာမှုကို သတိပညာဖြင့် ပယ်ဖျောက်အပ်၏။"},{"no":537,"pali":"Mahāsutasomajātaka","mm":"မဟာသုတသောမဇာတ်","summary":"မဟာသုတသောမမင်း (ဗောဓိသတ်) သည် လူသားစားသော ပေါရိသာဒမင်းဟောင်း၏ ဖမ်းဆီးခြင်းကို ခံရသော်လည်း ပုဏ္ဏားတစ်ဦးအား ပေးထားသောကတိအတိုင်း တရားလေးပုဒ်ကို နာယူရန် ပြန်သွားပြီးမှ ကတိတည်စွာ ပေါရိသာဒထံ မိမိအလိုအလျောက် ပြန်လာလေသည်။ ထိုသစ္စာတည်ကြည်မှုကို အံ့ဩကြည်ညိုသော ပေါရိသာဒသည် လူသားစားခြင်းကို စွန့်လွှတ်၍ တရားကိုခံယူကာ မိမိနိုင်ငံသို့ ပြန်လည်နန်းတင်ခြင်းကို ခံရလေသည်။ သစ္စာတရား၏ တန်ခိုးအာနုဘော်ကို အထူးထင်ရှားပြသော ဇာတ်တော်ကြီးဖြစ်သည်။","moral":"သစ္စာတရားသည် ရက်စက်ကြမ်းကြုတ်သူကိုပင် သူတော်ကောင်း ဖြစ်စေနိုင်၏။"},{"no":538,"pali":"Mūgapakkhajātaka","mm":"မူဂပက္ခဇာတ် (တေမိယဇာတ်)","summary":"ဘုရားအလောင်း တေမိယမင်းသားသည် ဗာရာဏသီပြည့်ရှင် ကာသိကရာဇ်မင်းကြီး၏ သားတော်အဖြစ် ဖွားမြင်တော်မူ၏။ ရှေးဘဝက မင်းအဖြစ်ဖြင့် အမှုစီရင်ခဲ့ရသည့်ကြောင့် ငရဲသို့ကျရောက်ခဲ့ရသည်ကို အောက်မေ့မိသဖြင့် ထီးနန်းကို ကြောက်ရွံ့တော်မူကာ ဆွံ့အသူ၊ နားမကြားသူ၊ ခြေလက်မစွမ်းသူအယောင်ဆောင်၍ တစ်ဆယ့်ခြောက်နှစ်တိုင်တိုင် နေတော်မူ၏။ မင်းကြီးက အမင်္ဂလာဟုယူဆကာ ရထားထိန်း သုနန္ဒအား တောသို့ဆောင်၍ မြှုပ်နှံစေရာ၊ တွင်းတူးနေစဉ် မင်းသားသည် ခွန်အားဗလကို ပြတော်မူ၍ တရားဟောကြားတော်မူ၏။ ထို့နောက် တောထွက်၍ ရသေ့ရဟန်းပြုတော်မူရာ မိဘနှစ်ပါးနှင့် ပြည်သူအပေါင်းတို့လည်း နောက်တော်သို့လိုက်၍ တောထွက်ကြကုန်၏။","moral":"စည်းစိမ်ချမ်းသာနှင့် အာဏာတည်းဟူသော ကာမဂုဏ်တို့ကို စွန့်လွှတ်နိုင်မှသာ စစ်မှန်သော ငြိမ်းချမ်းမှုကို ရနိုင်၏။","parami":"နေက္ခမ္မပါရမီ"},{"no":539,"pali":"Mahājanakajātaka","mm":"မဟာဇနကဇာတ် (ဇနကဇာတ်)","summary":"ဘုရားအလောင်း မဟာဇနကမင်းသားသည် မိထိလာပြည့်ရှင် အရိဋ္ဌဇနကမင်း၏ သားတော်ဖြစ်၍ ခမည်းတော်သည် ညီတော်နှင့် စစ်ခင်းရာ၌ ကျဆုံးသဖြင့် မယ်တော်နှင့်အတူ တိုင်းတစ်ပါး၌ ကြီးပြင်းရ၏။ နန်းလုပြန်ရန် ကုန်သွယ်ဖို့ သုဝဏ္ဏဘူမိသို့ သင်္ဘောဖြင့် ထွက်ခွာရာ သင်္ဘောပျက်၍ သမုဒ္ဒရာအတွင်း ခုနစ်ရက်တိုင်တိုင် စိတ်မလျှော့ဘဲ ကူးခတ်တော်မူ၏။ ထိုလုံ့လဝီရိယကို မြင်သော မဏိမေခလာနတ်သမီးက ကယ်တင်၍ မိထိလာပြည်သို့ ပို့ဆောင်ရာ သီဝလိဒေဝီနှင့် ထိမ်းမြားကာ ထီးနန်းကို ဆက်ခံရရှိတော်မူ၏။ နောက်ဆုံး၌ လောကီစည်းစိမ်တို့၏ အနိစ္စသဘောကို ဆင်ခြင်၍ တောထွက်တော်မူ၏။","moral":"ကမ်းမမြင်သော သမုဒ္ဒရာအလယ်၌ပင် မလျှော့သော လုံ့လဝီရိယသည် အောင်မြင်မှုကို ရစေတတ်၏။","parami":"ဝီရိယပါရမီ"},{"no":540,"pali":"Suvaṇṇasāmajātaka","mm":"သုဝဏ္ဏသာမဇာတ် (သာမဇာတ်)","summary":"ဘုရားအလောင်း သုဝဏ္ဏသာမသည် တော၌ ရသေ့အသွင်ဆောက်တည်ကြသော ဒုကူလနှင့် ပါရိကာ မိဘနှစ်ပါး၏ သားအဖြစ် ဖွားမြင်၏။ မိဘနှစ်ပါး မြွေဆိုးအငွေ့ကြောင့် မျက်စိကွယ်ကြသောအခါ သားတော်သည် သစ်သီးရှာ ရေခပ်ပေးလျက် ကတည်းကျွမ်း ပြုစုလုပ်ကျွေး၏။ တစ်နေ့သ၌ ရေခပ်ဆင်းစဉ် ဗာရာဏသီပြည့်ရှင် ပီဠိယက္ခမင်းသည် အဆိပ်လူးမြားဖြင့် ပစ်ခွင်းမိသဖြင့် သာမသည် လဲကျသော်လည်း မင်းကြီးအပေါ် အမျက်ဒေါသ မထားဘဲ မေတ္တာဖြင့်သာ ဆက်ဆံ၏။ မိဘနှစ်ပါးနှင့် ဗဟုသုန္ဒရီနတ်သမီးတို့၏ သစ္စာဆိုမှုကြောင့် အဆိပ်ပြေ၍ အသက်ရှင်ပြန်ကာ မိဘနှစ်ပါး၏ မျက်စိလည်း ပြန်လည်မြင်လာကြ၏။","moral":"မိဘကို လုပ်ကျွေးခြင်းနှင့် သတ္တဝါအားလုံးအပေါ် ပြန့်နှံ့သော မေတ္တာသည် ဘေးရန်အပေါင်းကို ငြိမ်းစေတတ်၏။","parami":"မေတ္တာပါရမီ"},{"no":541,"pali":"Nimijātaka","mm":"နိမိဇာတ် (နေမိဇာတ်)","summary":"ဘုရားအလောင်း နေမိမင်းကြီးသည် မိထိလာပြည်၌ မင်းအဆက်ဆက် တောထွက်ကြသော မခဂဒေဝမင်းမျိုး၌ ဖွားမြင်၍ ဒါနပြုခြင်း၊ ဥပုသ်သီလဆောက်တည်ခြင်းတို့၌ မြဲမြံစွာ အဓိဋ္ဌာန်ပြုကာ ပြည်သူတို့ကိုလည်း ကုသိုလ်ကောင်းမှု၌ ညွှန်ကြားတော်မူ၏။ ထိုဂုဏ်သတင်းကြောင့် သိကြားမင်းသည် မာတလိနတ်သားအား ဗေဒဝန်ရထားဖြင့် ပင့်ဆောင်စေရာ လမ်းခရီး၌ ငရဲဘုံများနှင့် နတ်ပြည်တို့ကို အစဉ်အတိုင်း ရှုစားခွင့်ရတော်မူ၏။ တာဝတိံသာနတ်ပြည်၌ စံမြန်းရန် နတ်တို့တောင်းပန်သော်လည်း မိမိကိုယ်တိုင်ပြုသော ကောင်းမှု၏အကျိုးကိုသာ လိုလားသည်ဟု ငြင်းပယ်ကာ လူ့ပြည်သို့ ပြန်ကြွ၍ ပြည်သူတို့အား တရားဟောတော်မူ၏။ နောက်ဆုံး၌ မင်းအဆက်ဆက် ထုံးစံအတိုင်း တောထွက်၍ ရသေ့ရဟန်းပြုတော်မူ၏။","moral":"ဒါနသီလ ကောင်းမှု၌ မြဲမြံခိုင်ခံ့သော အဓိဋ္ဌာန်သည် လူနတ်နှစ်ဌာန၏ ချီးမွမ်းခြင်းကို ခံရ၏။","parami":"အဓိဋ္ဌာနပါရမီ"},{"no":542,"pali":"Umaṅgajātaka (Mahosadhajātaka)","mm":"ဥမင်္ဂဇာတ် (မဟောသဓဇာတ်)","summary":"ဘုရားအလောင်း မဟောသဓပညာရှိသည် မိထိလာပြည့်ရှင် ဝေဒေဟမင်း၏ အမတ်ကြီးဖြစ်၍ ခုနစ်နှစ်သားအရွယ်ကပင် အမှုအခင်းတို့ကို ဉာဏ်ပညာဖြင့် စီရင်ဆုံးဖြတ်နိုင်ခဲ့၏။ မနာလိုသော အမတ်ကြီးလေးဦးတို့၏ စွပ်စွဲသောင်းကျန်းမှုတို့ကိုလည်း ပညာဉာဏ်ဖြင့်ပင် အောင်မြင်ကျော်လွှား၏။ စူဠနီဗြဟ္မဒတ်မင်းသည် ပုဏ္ဏားကေဝဋ်၏ အကြံပေးချက်ဖြင့် မင်းတစ်ရာ့တစ်ပါးတို့၏ စစ်သည်ဗိုလ်ခြေဖြင့် မိထိလာပြည်ကို ဝိုင်းရံတိုက်ခိုက်သော်လည်း မဟောသဓသည် လက်နက်မသုံးဘဲ ဉာဏ်ပညာသက်သက်ဖြင့် ချေမှုန်းနိုင်ခဲ့၏။ နောက်ဆုံး၌ ဥမင်လိုဏ်ခေါင်းကြီးကို တူးဖော်ခြင်းအားဖြင့် မိမိအရှင် ဝေဒေဟမင်းကို ဘေးမှကယ်ဆယ်ကာ စူဠနီမင်းနှင့်ပင် မိတ်ဆွေဖြစ်အောင် ပြုစွမ်းနိုင်ခဲ့၏။","moral":"ဉာဏ်ပညာသည် လက်နက်ဗိုလ်ခြေထက် တန်ခိုးကြီး၍ ရန်သူကိုပင် မိတ်ဆွေဖြစ်စေနိုင်၏။","parami":"ပညာပါရမီ"},{"no":543,"pali":"Bhūridattajātaka","mm":"ဘူရိဒတ္တဇာတ် (ဘူရိဒတ်ဇာတ်)","summary":"ဘုရားအလောင်း ဘူရိဒတ်သည် နဂါးမင်းသားအဖြစ် ဖွားမြင်၍ နဂါးပြည်၏ စည်းစိမ်ကို ငြီးငွေ့သဖြင့် လူ့ပြည်တောင်ပို့ထက်၌ ဥပုသ်သီလဆောက်တည်ကာ မိမိကိုယ်ကို အလိုရှိသူတို့အား စွန့်လှူထားတော်မူ၏။ အလမ္ဗာယနအမည်ရှိသော မြွေဆရာသည် နဂါးဖမ်းမန္တန်ဖြင့် ဖမ်းဆီး၍ နှိပ်စက်ကာ မြို့ရွာတို့၌ ကပြစေ၏။ ဘူရိဒတ်သည် တန်ခိုးအာနုဘော်ဖြင့် ဖျက်ဆီးနိုင်ပါလျက် ဆောက်တည်ထားသော သီလပျက်စီးမည်စိုး၍ အမျက်မထွက်ဘဲ သည်းခံတော်မူ၏။ နောက်ဆုံး၌ နောင်တော် သုဒဿနတို့ လိုက်လံရှာဖွေ ကယ်ဆယ်သဖြင့် နဂါးပြည်သို့ ပြန်ရောက်ကာ သီလကို ဆက်လက်စောင့်ထိန်းတော်မူ၏။","moral":"အသက်ဘေးနှင့် ရင်ဆိုင်ရသော်လည်း ဆောက်တည်ထားသော သီလကို မဖျက်ဆီးခြင်းသည် မြတ်သောကျင့်ဝတ်ဖြစ်၏။","parami":"သီလပါရမီ"},{"no":544,"pali":"Candakumārajātaka (Khaṇḍahālajātaka)","mm":"စန္ဒကုမာရဇာတ် (ခဏ္ဍဟာလဇာတ်)","summary":"ဘုရားအလောင်း စန္ဒကုမာရမင်းသားသည် ပုပ္ဖဝတီပြည့်ရှင် ဧကရာဇ်မင်း၏ သားတော်ဖြစ်၍ တရားမျှတစွာ အမှုစီရင်သဖြင့် ပြည်သူတို့၏ ချစ်ခင်ခြင်းကို ခံရ၏။ ထိုကြောင့် မနာလိုဖြစ်သော ပုဏ္ဏားပုရောဟိတ် ခဏ္ဍဟာလသည် နတ်ပြည်ရောက်လိုလျှင် သားတော် သမီးတော် မိဖုရားစသည်တို့ကို ယဇ်ပူဇော်ရမည်ဟု မင်းကြီးအား လိမ်လည်အကြံပေး၏။ စန္ဒကုမာရသည် ယဇ်ပလ္လင်၌ သတ်ဖြတ်ခြင်းခံရအံ့ဆဲဆဲ ဖြစ်နေသော်လည်း ခမည်းတော်နှင့် ရန်သူတို့အပေါ် အမျက်မထွက်ဘဲ သည်းခံတော်မူ၏။ မိဖုရား စန္ဒာဒေဝီ၏ သစ္စာဆိုမှုကြောင့် သိကြားမင်း ဆင်းသက်၍ ယဇ်ပွဲကို ဖျက်ဆီးရာ ပြည်သူတို့သည် ခဏ္ဍဟာလကို သတ်၍ မင်းကြီးကို နန်းချကာ စန္ဒကုမာရအား မင်းမြှောက်ကြ၏။","moral":"မတရားနှိပ်စက်ခြင်းကို အမျက်ဒေါသမထွက်ဘဲ သည်းခံနိုင်ခြင်းသည် နောက်ဆုံး၌ တရားကို အနိုင်ရစေ၏။","parami":"ခန္တီပါရမီ"},{"no":545,"pali":"Mahānāradakassapajātaka","mm":"မဟာနာရဒကဿပဇာတ် (နာရဒဇာတ်)","summary":"မိထိလာပြည့်ရှင် အင်္ဂတိမင်းကြီးသည် ကံကံ၏အကျိုးကို ပယ်သော ဂုဏအယူမှားတက္ကတွန်း၏ စကားကို ယုံကြည်မိသဖြင့် ဒါနသီလတို့ကို စွန့်ပစ်ကာ ကာမဂုဏ်၌သာ မွေ့လျော်နေတော့၏။ သမီးတော် ရုဇာမင်းသမီးသည် မိမိကိုယ်တွေ့ ဘဝဆက်များကို ထုတ်ဖော်ပြောကြား၍ တောင်းပန်သော်လည်း ခမည်းတော်၏ မိစ္ဆာအယူ မပြေပျောက်ချေ။ ထိုအခါ ဗြဟ္မာဘုံ၌ တည်နေတော်မူသော ဘုရားအလောင်း နာရဒဗြဟ္မာသည် ရသေ့အသွင်ဖြင့် ဆင်းသက်တော်မူ၍ ငရဲဘုံတို့၏ ကြောက်မက်ဖွယ်ဒုက္ခတို့ကို ဟောကြားပြသတော်မူ၏။ မင်းကြီးသည် ထိတ်လန့်၍ မိစ္ဆာအယူကို စွန့်ကာ သမ္မာဒိဋ္ဌိ၌ တည်ပြီးလျှင် ဒါနသီလကောင်းမှုတို့ကို ပြန်လည်ပြုကျင့်တော်မူ၏။","moral":"အယူမှားသည် ပျက်စီးခြင်း၏အကြောင်းဖြစ်၍ ကံကံ၏အကျိုးကို ယုံကြည်သော အယူမှန်၌သာ တည်သင့်၏။","parami":"ဥပေက္ခာပါရမီ"},{"no":546,"pali":"Vidhurajātaka","mm":"ဝိဓုရဇာတ် (ဝိဓူရဇာတ်)","summary":"ဘုရားအလောင်း ဝိဓူရပညာရှိသည် ဣန္ဒပတ်ပြည့်ရှင် ကောရဗျမင်းဓနဉ္စည်၏ အမတ်ကြီးဖြစ်၍ တရားဟောကောင်းသဖြင့် ကျော်စောသတင်း လူနတ်နဂါးဂဠုန်ဘုံတိုင် ပျံ့နှံ့၏။ နဂါးမိဖုရား ဝိမလာသည် ဝိဓူရ၏ နှလုံးသားကို လိုချင်သည်ဟုဆိုသဖြင့် သမီးတော် ဣရန္ဒတီကို ဆုထား၍ ပုဏ္ဏကဘီလူးစစ်သည် ကောရဗျမင်းနှင့် အန်စာတုံးကစားကာ ဝိဓူရကို အနိုင်ရယူသွား၏။ ပုဏ္ဏကသည် ကာဠာဂီရိတောင်ထိပ်၌ နည်းမျိုးစုံဖြင့် သတ်ရန်ကြိုးစားသော်လည်း ဝိဓူရသည် မကြောက်မရွံ့ သူတော်ကောင်းတရားကို ဟောကြားသဖြင့် ပုဏ္ဏက ကြည်ညိုလွှတ်ပေး၏။ နဂါးပြည်သို့ ကြွ၍ တရားဟောရာ နှလုံးသားဟူသည် ပညာရှိ၏ တရားစကားပင်ဖြစ်ကြောင်း ထင်ရှားစေပြီးလျှင် ဣန္ဒပတ်ပြည်သို့ ဂုဏ်ပြုပို့ဆောင်ခြင်းကို ခံရ၏။","moral":"သစ္စာတရား၌ မြဲမြံ၍ မှန်သောစကားကိုသာ ဆိုခြင်းသည် သေဘေးမှပင် လွတ်မြောက်စေတတ်၏။","parami":"သစ္စာပါရမီ"},{"no":547,"pali":"Vessantarajātaka","mm":"ဝေဿန္တရာဇာတ် (ဝေဿန္တရာမင်းဇာတ်)","summary":"ဘုရားအလောင်း ဝေဿန္တရာမင်းသားသည် သိဝိတိုင်း ဇေတုတ္တရပြည့်ရှင် သဉ္စည်မင်း၏ သားတော်ဖြစ်၍ ငယ်စဉ်ကပင် ပေးလှူခြင်း၌ အလွန်မွေ့လျော်တော်မူ၏။ မိုးခေါင်သော ကာလိင်္ဂတိုင်းသားတို့ တောင်းသဖြင့် မင်္ဂလာပစ္စယနာဂဆင်ဖြူတော်ကို ပေးလှူလိုက်ရာ ပြည်သူတို့ အမျက်ထွက်ကြ၍ ဝင်္ကပါတောင်သို့ နှင်ထုတ်ခြင်းခံရ၏။ တော၌ နေထိုင်စဉ် ပုဏ္ဏားဇူဇကာ လာရောက်တောင်းသဖြင့် သားတော် ဇာလီနှင့် သမီးတော် ကဏှာဇိန်တို့ကို လှူ၍ သိကြားမင်း ပုဏ္ဏားယောင်ဆောင် တောင်းသောအခါ မိဖုရား မဒ္ဒီဒေဝီကိုပင် လှူတော်မူ၏။ နောက်ဆုံး၌ ဆွေတော်မျိုးတော်တို့ လာရောက်ပင့်ဆောင်ကြသဖြင့် သားတော်သမီးတော် မိဖုရားနှင့် ပြန်လည်ဆုံစည်းကာ ပြည်တော်သို့ ပြန်ကြွ၍ မင်းပြုတော်မူ၏။ ဤဇာတ်တော်သည် ဘုရားအလောင်း၏ နောက်ဆုံးလူ့ဘဝဖြစ်၍ ဒါနပါရမီ၏ အထွတ်အထိပ်ဟု ကျော်စော၏။","moral":"မိမိချစ်မြတ်နိုးရာ မှန်သမျှကို မတွန့်တိုဘဲ စွန့်လှူနိုင်သော ဒါနသည် ပါရမီတို့၏ အထွတ်အထိပ်ဖြစ်၏။","parami":"ဒါနပါရမီ"}];
const state = {
  stories: [],
  byNo: {},
  currentNipata: 1,
  page: 0,
  view: 'nipata',
  query: '',
  bookmarks: new Set(JSON.parse(localStorage.getItem('jt_bookmarks') || '[]')),
  read: new Set(JSON.parse(localStorage.getItem('jt_read') || '[]')),
  theme: localStorage.getItem('jt_theme') || 'light',
  randomNo: null
};

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function nipataOf(no) { return NIPATAS.find(n => no >= n.range[0] && no <= n.range[1]); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(() => t.classList.remove('show'), 2600);
}
function saveBookmarks() { localStorage.setItem('jt_bookmarks', JSON.stringify([...state.bookmarks])); }
function saveRead() { localStorage.setItem('jt_read', JSON.stringify([...state.read])); }

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  localStorage.setItem('jt_theme', state.theme);
}
function cycleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : state.theme === 'dark' ? 'royal' : 'light';
  applyTheme();
  showToast(state.theme === 'light' ? '☀️ Light' : state.theme === 'dark' ? '🌙 Dark' : '👑 Royal');
}

function updateTotalProg() {
  const pct = Math.round(state.read.size / TOTAL * 100);
  document.getElementById('total-prog').style.width = pct + '%';
}

async function load() {
  
  state.stories = EMBEDDED_JATAKA;
  state.stories.forEach(s => state.byNo[s.no] = s);
  applyTheme();
  const last = parseInt(localStorage.getItem('jt_last') || '0');
  if (last >= 1 && last <= 22) state.currentNipata = last;
  renderNipatas();
  render();
  updateTotalProg();
}

function renderNipatas() {
  const ul = document.getElementById('nipatas');
  ul.innerHTML = NIPATAS.map(n => {
    const total = n.range[1] - n.range[0] + 1;
    let readN = 0;
    for (let i = n.range[0]; i <= n.range[1]; i++) if (state.read.has(i)) readN++;
    const pct = Math.round(readN / total * 100);
    return `
    <li data-id="${n.id}" class="${n.id === state.currentNipata && state.view === 'nipata' ? 'active' : ''}">
      <span class="np-badge">${NP_ICONS[n.id - 1]}</span>
      <span class="np-info">${n.mm}<br><span class="np-en">${n.en}</span></span>
      <span class="range">${n.range[0]}–${n.range[1]}${pct > 0 ? `<span class="prog-pct">${pct}%</span>` : ''}</span>
      ${pct > 0 ? `<div class="prog"><div class="prog-fill" style="width:${pct}%"></div></div>` : ''}
    </li>`;
  }).join('');
  ul.querySelectorAll('li').forEach(li => {
    li.onclick = () => {
      state.currentNipata = parseInt(li.dataset.id);
      localStorage.setItem('jt_last', state.currentNipata);
      state.view = 'nipata';
      state.page = 0;
      state.query = '';
      document.getElementById('search').value = '';
      renderNipatas();
      render();
      closeDrawer();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  });
}

function storyCard(s, opts = {}) {
  const n = nipataOf(s.no);
  const bookmarked = state.bookmarks.has(s.no);
  const isRead = state.read.has(s.no);
  const isMaha = s.no >= 538;
  return `
  <div class="story-card ${bookmarked ? 'bookmarked' : ''} ${isRead ? 'read-done' : ''}" data-no="${s.no}">
    <div class="watermark">${isMaha ? ART.crown : ART.lotus}</div>
    <div class="card-head">
      <span class="no-chip">${s.no}</span>
      <div class="titles">
        <div class="t-mm">${escapeHtml(s.mm)}${isMaha ? '<span class="maha-chip">ဇာတ်ကြီး</span>' : ''}${opts.daily ? '<span class="daily-badge">ယနေ့</span>' : ''}</div>
        <div class="t-pali">${escapeHtml(s.pali)}</div>
        <div class="np-chip">${n ? n.mm : ''}</div>
      </div>
      <button class="bookmark-btn ${bookmarked ? 'on' : ''}" data-no="${s.no}" title="Bookmark">${bookmarked ? '★' : '☆'}</button>
    </div>
    <p class="summary">${escapeHtml(s.summary)}</p>
    ${s.moral ? `<div class="moral">💡 ${escapeHtml(s.moral)}</div>` : ''}
    ${s.parami ? `<span class="parami">☸️ ${escapeHtml(s.parami)}</span>` : ''}
    <div class="card-actions">
      <button class="action-btn read-btn ${isRead ? 'done' : ''}" data-no="${s.no}">${isRead ? '✓ ဖတ်ပြီးပြီ' : '⭕ ဖတ်ပြီးကြောင်း မှတ်ရန်'}</button>
      <button class="action-btn share-btn" data-no="${s.no}">📤 မျှဝေရန်</button>
    </div>
  </div>`;
}

function bindCards(container) {
  container.querySelectorAll('.bookmark-btn').forEach(b => {
    b.onclick = () => {
      const no = parseInt(b.dataset.no);
      if (state.bookmarks.has(no)) { state.bookmarks.delete(no); showToast('☆ Bookmark ဖြုတ်လိုက်ပါပြီ'); }
      else { state.bookmarks.add(no); showToast('★ Bookmark သိမ်းလိုက်ပါပြီ'); }
      saveBookmarks();
      render();
    };
  });
  container.querySelectorAll('.read-btn').forEach(b => {
    b.onclick = () => {
      const no = parseInt(b.dataset.no);
      if (state.read.has(no)) state.read.delete(no);
      else {
        state.read.add(no);
        if (state.read.size === TOTAL) showToast('🎉 ၅၄၇ ပုဒ်လုံး ဖတ်ပြီးပါပြီ — သာဓု သာဓု သာဓု!');
      }
      saveRead();
      renderNipatas();
      updateTotalProg();
      render();
    };
  });
  container.querySelectorAll('.share-btn').forEach(b => {
    b.onclick = async () => {
      const s = state.byNo[parseInt(b.dataset.no)];
      const text = `${s.no}. ${s.mm} (${s.pali})\n\n${s.summary}${s.moral ? '\n\n💡 ' + s.moral : ''}\n\n— ၅၅၀ ဇာတ်တော်`;
      if (navigator.share) {
        try { await navigator.share({ text }); } catch (e) {}
      } else {
        await navigator.clipboard.writeText(text);
        showToast('📋 Clipboard သို့ ကူးယူပြီးပါပြီ');
      }
    };
  });
}

function render() {
  const banner = document.getElementById('banner');
  const cards = document.getElementById('cards');
  const pager = document.getElementById('pager');
  pager.innerHTML = '';

  if (state.view === 'daily') {
    const seed = parseInt(new Date().toISOString().slice(0, 10).replace(/-/g, ''));
    const s = state.stories[seed % state.stories.length];
    const n = nipataOf(s.no);
    banner.innerHTML = `
      <div class="nipata-banner">${ART.wheel}
        <div><h2 class="nipata-title">📖 ယနေ့ ဇာတ်တော်</h2>
        <p class="nipata-sub">${new Date().toLocaleDateString('my-MM', { year: 'numeric', month: 'long', day: 'numeric' })} · ${n ? n.mm : ''}</p></div>
      </div>`;
    cards.innerHTML = `<div class="daily-stage"><div class="daily-buddha">${ART.lotus}</div>${storyCard(s, { daily: true })}</div>`;
  } else if (state.view === 'random') {
    const s = state.byNo[state.randomNo] || state.stories[0];
    banner.innerHTML = `
      <div class="nipata-banner">${ART.elephant}
        <div><h2 class="nipata-title">🎲 ကျပန်း ဇာတ်တော်</h2>
        <p class="nipata-sub">🎲 ထပ်နှိပ်၍ နောက်တစ်ပုဒ် ကြည့်နိုင်ပါသည်</p></div>
      </div>`;
    cards.innerHTML = storyCard(s);
  } else if (state.view === 'bookmarks') {
    const bm = state.stories.filter(s => state.bookmarks.has(s.no));
    banner.innerHTML = `
      <div class="nipata-banner">${ART.bodhi}
        <div><h2 class="nipata-title">⭐ Bookmarks</h2>
        <p class="nipata-sub">သိမ်းထားသော ဇာတ်တော် ${bm.length} ပုဒ်</p></div>
      </div>`;
    cards.innerHTML = bm.length ? bm.map(s => storyCard(s)).join('')
      : `<div class="empty">Bookmark သိမ်းထားသော ဇာတ်တော် မရှိသေးပါ။<br><small>ဇာတ်တော်တိုင်းရှိ ☆ ကို နှိပ်၍ သိမ်းနိုင်ပါသည်။</small></div>`;
  } else if (state.query) {
    const q = state.query.toLowerCase();
    const hits = state.stories.filter(s =>
      String(s.no) === state.query.trim() ||
      s.pali.toLowerCase().includes(q) ||
      s.mm.includes(state.query) ||
      (s.summary || '').includes(state.query) ||
      (s.moral || '').includes(state.query)
    );
    banner.innerHTML = `
      <div class="nipata-banner">${ART.wheel}
        <div><h2 class="nipata-title">🔍 ရှာဖွေမှုရလဒ်</h2>
        <p class="nipata-sub">"${escapeHtml(state.query)}" — ${hits.length} ပုဒ် တွေ့ရှိသည်</p></div>
      </div>`;
    cards.innerHTML = hits.length ? hits.slice(0, 100).map(s => storyCard(s)).join('')
      : `<div class="empty">ရှာဖွေမှုနှင့် ကိုက်ညီသော ဇာတ်တော် မတွေ့ပါ။</div>`;
  } else {
    const n = NIPATAS.find(x => x.id === state.currentNipata);
    const list = state.stories.filter(s => s.no >= n.range[0] && s.no <= n.range[1]);
    const pages = Math.ceil(list.length / PAGE_SIZE);
    if (state.page >= pages) state.page = 0;
    const slice = list.slice(state.page * PAGE_SIZE, (state.page + 1) * PAGE_SIZE);
    banner.innerHTML = `
      <div class="nipata-banner">${state.currentNipata === 22 ? ART.crown : ART.wheel}
        <div><h2 class="nipata-title">${n.mm}</h2>
        <p class="nipata-sub">${n.pali} · ${n.en} · ဇာတ်တော် ${n.range[0]}–${n.range[1]} (${list.length} ပုဒ်)</p></div>
      </div>`;
    cards.innerHTML = list.length ? slice.map(s => storyCard(s)).join('')
      : `<div class="empty">ဤနိပါတ်၏ အချက်အလက်များ မတွေ့ပါ — jataka.json ကို စစ်ဆေးပါ။</div>`;
    if (pages > 1) {
      pager.innerHTML = Array.from({ length: pages }, (_, i) =>
        `<button class="btn ${i === state.page ? 'active' : ''}" data-page="${i}">${n.range[0] + i * PAGE_SIZE}–${Math.min(n.range[0] + (i + 1) * PAGE_SIZE - 1, n.range[1])}</button>`
      ).join('');
      pager.querySelectorAll('[data-page]').forEach(b => {
        b.onclick = () => { state.page = parseInt(b.dataset.page); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      });
    }
  }
  bindCards(cards);
}

function openDrawer() {
  document.querySelector('aside').classList.add('open');
  document.getElementById('drawer-backdrop').classList.add('show');
}
function closeDrawer() {
  document.querySelector('aside').classList.remove('open');
  document.getElementById('drawer-backdrop').classList.remove('show');
}

document.getElementById('menu-toggle').onclick = openDrawer;
document.getElementById('drawer-backdrop').onclick = closeDrawer;
document.getElementById('btn-theme').onclick = cycleTheme;
document.getElementById('btn-daily').onclick = () => { state.view = 'daily'; renderNipatas(); render(); };
document.getElementById('btn-bookmarks').onclick = () => { state.view = 'bookmarks'; renderNipatas(); render(); };
document.getElementById('btn-random').onclick = () => {
  state.view = 'random';
  state.randomNo = state.stories[Math.floor(Math.random() * state.stories.length)].no;
  renderNipatas();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};
document.getElementById('search').addEventListener('input', e => {
  state.query = e.target.value.trim();
  state.view = state.query ? 'search' : 'nipata';
  renderNipatas();
  render();
});

load().catch(err => {
  document.getElementById('cards').innerHTML =
    `<div class="empty">jataka.json ဖတ်၍မရပါ။<br><small>serve.ps1 ဖြင့် local server ဖွင့်၍ ကြည့်ပါ — သို့မဟုတ် build.ps1 ဖြင့် standalone ထုတ်ပါ။</small><br><small>${escapeHtml(String(err))}</small></div>`;
});
