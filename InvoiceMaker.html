<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice &amp; Receipt Maker — MyoMT Utilities</title>
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="_motion.css">
<link rel="stylesheet" href="_effects.css">
<link rel="stylesheet" href="_design.css">
<style>
  :root{
    --bg:#070a0f; --bg2:#0d1119; --card:#151a24; --card2:#1b2130;
    --field:#12161f; --field-border:#2b3342; --text:#f2f5fa; --muted:#9aa4b3; --faint:#616c7d;
    --accent:#6366f1; --accent-2:#0ea5e9; --ok:#34d399; --danger:#ff6b6b;
    --sans:'Pyidaungsu','Padauk','Inter','Segoe UI',system-ui,sans-serif;
    --mono:'Cascadia Code','Consolas',monospace;
  }
  *{box-sizing:border-box}
  body{margin:0; font-family:var(--sans); color:var(--text); min-height:100vh; padding:20px 16px 50px;
    background:radial-gradient(1000px 600px at 10% -10%, rgba(99,102,241,.13), transparent 55%),
      radial-gradient(900px 550px at 105% 0%, rgba(14,165,233,.10), transparent 55%),
      linear-gradient(180deg, var(--bg2), var(--bg) 60%); background-attachment:fixed}
  .wrap{max-width:1180px; margin:0 auto}
  header{display:flex; align-items:center; gap:13px; margin-bottom:14px; flex-wrap:wrap}
  .logo{width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-size:1.3rem;
    background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:0 6px 18px rgba(99,102,241,.35)}
  header h1{font-size:1.25rem; margin:0; font-weight:800; letter-spacing:-.02em}
  header .sub{color:var(--muted); font-size:.8rem}
  header .title{flex:1; min-width:160px}
  .btn{display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.1);
    background:var(--field); color:var(--text); cursor:pointer; font-family:var(--sans); font-size:.82rem; font-weight:600; transition:.14s}
  .btn:hover{border-color:var(--accent); transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.97)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2)); border:none; color:#fff; box-shadow:0 6px 16px rgba(99,102,241,.35)}
  .btn.sm{padding:6px 10px; font-size:.76rem}
  .bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
  .seg{display:inline-flex; background:var(--field); border:1px solid var(--field-border); border-radius:11px; padding:4px; gap:3px}
  .seg button{border:none; background:transparent; color:var(--muted); font-family:var(--sans); font-size:.82rem; font-weight:600; padding:7px 14px; border-radius:8px; cursor:pointer; transition:.14s}
  .seg button.on{background:var(--accent); color:#fff}

  .layout{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}
  @media(max-width:900px){ .layout{grid-template-columns:1fr} }
  .card{background:var(--card); border:1px solid rgba(255,255,255,.07); border-radius:14px; padding:16px 18px; margin-bottom:14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 12px 30px -16px rgba(0,0,0,.55)}
  .card h3{margin:0 0 13px; font-size:.86rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
  label.fl{display:block; font-size:.7rem; color:var(--faint); font-weight:600; margin:9px 0 5px; text-transform:uppercase; letter-spacing:.04em}
  input,textarea,select{width:100%; background:var(--field); border:1px solid var(--field-border); border-radius:9px; color:var(--text);
    font-family:var(--sans); font-size:14px; padding:9px 11px; outline:none; transition:.14s}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical; min-height:52px}
  .frow{display:flex; gap:10px} .frow>div{flex:1; min-width:0}
  .mono{font-family:var(--mono)}

  /* items table */
  .items{width:100%}
  .it-head,.it-row{display:grid; grid-template-columns:1fr 62px 100px 100px 30px; gap:7px; align-items:center}
  .it-head{font-size:.64rem; color:var(--faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; padding:0 2px}
  .it-head .r,.it-row .r{text-align:right}
  .it-row{margin-bottom:7px}
  .it-row input{padding:8px 9px; font-size:13px}
  .it-row .amt{font-variant-numeric:tabular-nums; text-align:right; font-weight:700; color:var(--text); font-size:13.5px; padding-right:4px}
  .it-row .del{width:28px; height:30px; border-radius:7px; border:1px solid var(--field-border); background:var(--field); color:var(--faint); cursor:pointer; font-size:.8rem}
  .it-row .del:hover{color:var(--danger); border-color:var(--danger)}
  .totbox{margin-top:12px; border-top:1px dashed rgba(255,255,255,.1); padding-top:12px}
  .trow{display:flex; justify-content:space-between; align-items:center; font-size:.86rem; margin-bottom:7px; gap:10px}
  .trow .lbl{color:var(--muted)} .trow .v{font-variant-numeric:tabular-nums; font-weight:700}
  .trow.grand{font-size:1.15rem; color:var(--accent-2); border-top:1px solid rgba(255,255,255,.12); padding-top:9px; margin-top:4px}
  .trow input{width:90px; text-align:right}

  /* preview sheet (printable) */
  .preview-wrap{position:sticky; top:16px}
  .sheet{background:#ffffff; color:#1a2230; border-radius:12px; padding:30px 32px; font-size:13px; box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .sheet .s-top{display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:18px}
  .sheet .s-biz{display:flex; gap:12px; align-items:flex-start}
  .sheet .s-logo{width:52px; height:52px; border-radius:10px; object-fit:cover; flex:none; background:#eef0fe}
  .sheet .s-biz h2{margin:0 0 3px; font-size:1.15rem; color:#1e2a52}
  .sheet .s-biz .meta{color:#5a6678; font-size:11.5px; line-height:1.6; white-space:pre-line}
  .sheet .s-inv{text-align:right}
  .sheet .s-inv .ttl{font-size:1.5rem; font-weight:800; color:#3730a3; letter-spacing:.02em}
  .sheet .s-inv .no{font-family:var(--mono); color:#4f46e5; font-weight:700; margin-top:3px}
  .sheet .s-inv .dt{color:#5a6678; font-size:11.5px; margin-top:4px; line-height:1.7}
  .sheet .s-bill{display:flex; justify-content:space-between; gap:16px; margin-bottom:16px}
  .sheet .s-bill .lab{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:#8a93a5; margin-bottom:3px}
  .sheet .s-bill b{color:#1e2a52}
  .sheet .s-bill .blk{line-height:1.6; color:#3a4559; white-space:pre-line}
  .sheet .paidstamp{display:inline-block; border:2.5px solid #16a34a; color:#16a34a; font-weight:800; font-size:1rem; padding:4px 14px; border-radius:8px; transform:rotate(-8deg); letter-spacing:.08em}
  table.s-items{width:100%; border-collapse:collapse; margin:6px 0 12px}
  table.s-items th{background:#eef0fe; color:#312e81; text-align:left; padding:8px 10px; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em}
  table.s-items th.r,table.s-items td.r{text-align:right}
  table.s-items td{padding:8px 10px; border-bottom:1px solid #eceef5; font-variant-numeric:tabular-nums; vertical-align:top}
  .sheet .s-sum{margin-left:auto; width:260px}
  .sheet .s-sum .row{display:flex; justify-content:space-between; padding:4px 0; font-size:12.5px; color:#3a4559}
  .sheet .s-sum .row.g{border-top:2px solid #4f46e5; margin-top:4px; padding-top:8px; font-size:1.05rem; font-weight:800; color:#3730a3}
  .sheet .s-notes{margin-top:18px; border-top:1px solid #eceef5; padding-top:12px; color:#5a6678; font-size:11.5px; line-height:1.6; white-space:pre-line}
  .sheet .s-thanks{text-align:center; color:#8a93a5; font-size:11px; margin-top:16px}

  footer{text-align:center; color:var(--faint); font-size:.72rem; margin-top:22px}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--card2); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:10px 16px; font-size:.84rem; font-weight:600; box-shadow:0 12px 30px rgba(0,0,0,.5); transition:.25s; z-index:9999; pointer-events:none}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media print{
    body{background:#fff !important; padding:0 !important}
    body *{visibility:hidden}
    .preview-wrap, .preview-wrap *{visibility:visible}
    .preview-wrap{position:absolute; left:0; top:0; width:100%}
    .sheet{box-shadow:none; border-radius:0; padding:12mm 14mm; max-width:none}
    .nr, .nr-bottom-nav, .st-gear, .pwa-install-btn{display:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🧾</div>
    <div class="title"><h1>Invoice &amp; Receipt Maker</h1><div class="sub">ဘောင်ချာ / ပြေစာ — print / PDF · Myanmar Ks · offline</div></div>
  </header>

  <div class="bar">
    <div class="seg" id="modeSeg"><button data-m="invoice" class="on">🧾 Invoice</button><button data-m="receipt">✅ Receipt</button></div>
    <button class="btn" id="newBtn">＋ အသစ်</button>
    <button class="btn" id="saveBtn">💾 Save draft</button>
    <select id="drafts" style="width:auto; min-width:150px"></select>
    <span style="flex:1"></span>
    <button class="btn" id="jsonBtn">⬇ JSON</button>
    <button class="btn primary" id="printBtn">🖨 Print / PDF</button>
  </div>

  <div class="layout">
    <!-- FORM -->
    <div>
      <div class="card">
        <h3>🏢 Your business</h3>
        <div class="frow"><div><label class="fl">Business name</label><input id="bizName" placeholder="MyoMT Co., Ltd."></div>
          <div style="flex:0 0 80px"><label class="fl">Logo</label><button class="btn sm" id="logoBtn" style="width:100%">📷 Upload</button><input type="file" id="logoInput" accept="image/*" style="display:none"></div></div>
        <label class="fl">Address / contact</label><textarea id="bizMeta" placeholder="No.123, Yangon&#10;09-xxxxxxxx · hello@myomt.dev"></textarea>
      </div>
      <div class="card">
        <h3>👤 Bill to</h3>
        <label class="fl">Client name</label><input id="cliName" placeholder="Customer name">
        <label class="fl">Client address / phone</label><textarea id="cliMeta" placeholder="Address&#10;Phone"></textarea>
      </div>
      <div class="card">
        <h3>📋 Details</h3>
        <div class="frow">
          <div><label class="fl">Invoice #</label><input id="invNo" class="mono"></div>
          <div><label class="fl">Date</label><input id="invDate" type="date"></div>
        </div>
        <div class="frow">
          <div><label class="fl" id="dueLbl">Due date</label><input id="dueDate" type="date"></div>
          <div><label class="fl">Currency</label><select id="currency"><option>Ks</option><option>MMK</option><option>$</option><option>฿</option><option>€</option><option>£</option><option>₹</option></select></div>
        </div>
      </div>
      <div class="card">
        <h3>📦 Items</h3>
        <div class="items">
          <div class="it-head"><span>Description</span><span class="r">Qty</span><span class="r">Price</span><span class="r">Amount</span><span></span></div>
          <div id="itemRows"></div>
        </div>
        <button class="btn sm" id="addItem" style="margin-top:4px">＋ Add item</button>
        <div class="totbox">
          <div class="trow"><span class="lbl">Subtotal</span><span class="v" id="subTotal">0</span></div>
          <div class="trow"><span class="lbl">Tax %</span><input id="taxPct" type="number" value="0" min="0" step="0.5"></div>
          <div class="trow"><span class="lbl">Discount (amount)</span><input id="discount" type="number" value="0" min="0"></div>
          <div class="trow grand"><span class="lbl">Total</span><span class="v" id="grandTotal">0</span></div>
        </div>
      </div>
      <div class="card">
        <h3>📝 Notes / terms</h3>
        <textarea id="notes" placeholder="Payment within 7 days. Thank you!"></textarea>
        <div class="frow" style="margin-top:8px"><div><label class="fl">Paid amount (receipt)</label><input id="paid" type="number" value="0" min="0"></div>
          <div><label class="fl">Pay method</label><input id="payMethod" placeholder="Cash / KBZPay / Transfer"></div></div>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="preview-wrap">
      <div class="sheet" id="sheet"></div>
    </div>
  </div>
  <footer>Developed by <b>MyoMT</b> · offline · data stays on this device</footer>
</div>
<div class="toast" id="toast"></div>

<script defer src="_palette.js"></script>
<script defer src="_navrail.js"></script>
<script defer src="_ui.js"></script>
<script defer src="_pwa.js"></script>
<script defer src="_settings.js"></script>
<script defer src="_applock.js"></script>
<script defer src="_cloudsync.js"></script>
<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id);
  const STORE='invoices.v1', PROFILE='invoices.profile';
  let mode='invoice', items=[], logo='', drafts=[];
  const toastEl=$('toast');
  function toast(m){ toastEl.textContent=m; toastEl.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),1500); }
  const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const num=v=>{ const n=parseFloat(String(v).replace(/[^\d.-]/g,'')); return isNaN(n)?0:n; };
  const fmt=n=>Math.round(n*100)/100===Math.round(n)?Math.round(n).toLocaleString('en-US'):n.toLocaleString('en-US',{maximumFractionDigits:2});

  function newItem(d='',q=1,p=0){ return {desc:d, qty:q, price:p}; }
  function renderItems(){
    const wrap=$('itemRows'); wrap.innerHTML='';
    items.forEach((it,i)=>{
      const row=document.createElement('div'); row.className='it-row';
      row.innerHTML=`<input class="desc" placeholder="Item / service" value="${esc(it.desc)}">
        <input class="qty r" type="number" min="0" step="1" value="${it.qty}">
        <input class="price r" type="number" min="0" step="any" value="${it.price}">
        <span class="amt">${fmt(num(it.qty)*num(it.price))}</span>
        <button class="del" title="Remove">✕</button>`;
      row.querySelector('.desc').addEventListener('input',e=>{ it.desc=e.target.value; update(); });
      row.querySelector('.qty').addEventListener('input',e=>{ it.qty=e.target.value; refreshAmts(); update(); });
      row.querySelector('.price').addEventListener('input',e=>{ it.price=e.target.value; refreshAmts(); update(); });
      row.querySelector('.del').addEventListener('click',()=>{ items.splice(i,1); if(!items.length)items.push(newItem()); renderItems(); update(); });
      wrap.appendChild(row);
    });
  }
  function refreshAmts(){ document.querySelectorAll('#itemRows .it-row').forEach((row,i)=>{ row.querySelector('.amt').textContent=fmt(num(items[i].qty)*num(items[i].price)); }); }

  function calc(){ const sub=items.reduce((a,it)=>a+num(it.qty)*num(it.price),0);
    const tax=sub*num($('taxPct').value)/100; const disc=num($('discount').value);
    return { sub, tax, disc, total:Math.max(0, sub+tax-disc) }; }

  function render(){
    const c=calc(); $('subTotal').textContent=fmt(c.sub); $('grandTotal').textContent=fmt(c.total);
    const cur=$('currency').value;
    const biz=$('bizName').value||'Your Business', bizMeta=$('bizMeta').value;
    const cli=$('cliName').value||'Client', cliMeta=$('cliMeta').value;
    const paid=num($('paid').value), bal=Math.max(0,c.total-paid);
    const title = mode==='receipt'?'RECEIPT':'INVOICE';
    const itemRows = items.filter(it=>it.desc||num(it.price)).map(it=>`<tr><td>${esc(it.desc)||'—'}</td><td class="r">${fmt(num(it.qty))}</td><td class="r">${cur} ${fmt(num(it.price))}</td><td class="r">${cur} ${fmt(num(it.qty)*num(it.price))}</td></tr>`).join('') || `<tr><td colspan="4" style="color:#9aa4b3;text-align:center;padding:14px">No items yet</td></tr>`;
    $('sheet').innerHTML=`
      <div class="s-top">
        <div class="s-biz">${logo?`<img class="s-logo" src="${logo}" alt="">`:''}<div><h2>${esc(biz)}</h2><div class="meta">${esc(bizMeta)}</div></div></div>
        <div class="s-inv"><div class="ttl">${title}</div><div class="no">${esc($('invNo').value)}</div>
          <div class="dt">${$('invDate').value?'Date: '+$('invDate').value:''}${mode==='invoice'&&$('dueDate').value?'<br>Due: '+$('dueDate').value:''}</div>
          ${mode==='receipt'&&bal<=0&&c.total>0?'<div style="margin-top:8px"><span class="paidstamp">PAID</span></div>':''}</div>
      </div>
      <div class="s-bill"><div><div class="lab">Bill to</div><b>${esc(cli)}</b><div class="blk">${esc(cliMeta)}</div></div></div>
      <table class="s-items"><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr></thead><tbody>${itemRows}</tbody></table>
      <div class="s-sum">
        <div class="row"><span>Subtotal</span><span>${cur} ${fmt(c.sub)}</span></div>
        ${num($('taxPct').value)?`<div class="row"><span>Tax (${num($('taxPct').value)}%)</span><span>${cur} ${fmt(c.tax)}</span></div>`:''}
        ${c.disc?`<div class="row"><span>Discount</span><span>− ${cur} ${fmt(c.disc)}</span></div>`:''}
        <div class="row g"><span>Total</span><span>${cur} ${fmt(c.total)}</span></div>
        ${mode==='receipt'&&paid?`<div class="row"><span>Paid${$('payMethod').value?' ('+esc($('payMethod').value)+')':''}</span><span>${cur} ${fmt(paid)}</span></div>${bal>0?`<div class="row" style="color:#c2410c"><span>Balance due</span><span>${cur} ${fmt(bal)}</span></div>`:''}`:''}
      </div>
      ${$('notes').value?`<div class="s-notes">${esc($('notes').value)}</div>`:''}
      <div class="s-thanks">ကျေးဇူးတင်ပါသည် · Thank you for your business</div>`;
  }
  function update(){ render(); saveProfile(); }

  // mode
  $('modeSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; mode=b.dataset.m;
    [...$('modeSeg').children].forEach(x=>x.classList.toggle('on',x===b)); $('dueLbl').textContent=mode==='receipt'?'(n/a)':'Due date'; render(); });
  // items
  $('addItem').addEventListener('click',()=>{ items.push(newItem()); renderItems(); update(); });
  ['taxPct','discount','paid','payMethod','currency','bizName','bizMeta','cliName','cliMeta','invNo','invDate','dueDate','notes'].forEach(id=>$(id).addEventListener('input',update));
  // logo
  $('logoBtn').addEventListener('click',()=>$('logoInput').click());
  $('logoInput').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ logo=r.result; update(); toast('✓ logo'); }; r.readAsDataURL(f); });
  // actions
  $('printBtn').addEventListener('click',()=>window.print());
  $('newBtn').addEventListener('click',()=>{ items=[newItem(),newItem()]; $('cliName').value=''; $('cliMeta').value=''; $('notes').value=''; $('taxPct').value=0; $('discount').value=0; $('paid').value=0; $('payMethod').value=''; $('invNo').value=nextInvNo(); $('invDate').value=today(); renderItems(); update(); toast('🧾 new'); });
  $('jsonBtn').addEventListener('click',()=>{ const blob=new Blob([JSON.stringify(collect(),null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=($('invNo').value||'invoice')+'.json'; a.click(); URL.revokeObjectURL(a.href); });
  $('saveBtn').addEventListener('click',()=>{ const d=collect(); d.savedAt=Date.now(); const i=drafts.findIndex(x=>x.invNo===d.invNo); if(i>=0)drafts[i]=d; else drafts.unshift(d); if(drafts.length>50)drafts.pop(); persistDrafts(); renderDrafts(); toast('💾 saved'); });
  $('drafts').addEventListener('change',e=>{ const d=drafts.find(x=>x.invNo===e.target.value); if(d)load(d); });

  function collect(){ return { mode, bizName:$('bizName').value, bizMeta:$('bizMeta').value, logo, cliName:$('cliName').value, cliMeta:$('cliMeta').value,
    invNo:$('invNo').value, invDate:$('invDate').value, dueDate:$('dueDate').value, currency:$('currency').value, items,
    taxPct:$('taxPct').value, discount:$('discount').value, notes:$('notes').value, paid:$('paid').value, payMethod:$('payMethod').value }; }
  function load(d){ mode=d.mode||'invoice'; [...$('modeSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.m===mode));
    logo=d.logo||''; items=(d.items&&d.items.length)?d.items:[newItem(),newItem()];
    const set=(id,v)=>{ if($(id))$(id).value=v??''; };
    set('bizName',d.bizName); set('bizMeta',d.bizMeta); set('cliName',d.cliName); set('cliMeta',d.cliMeta);
    set('invNo',d.invNo); set('invDate',d.invDate); set('dueDate',d.dueDate); set('currency',d.currency||'Ks');
    set('taxPct',d.taxPct||0); set('discount',d.discount||0); set('notes',d.notes); set('paid',d.paid||0); set('payMethod',d.payMethod);
    renderItems(); render(); }

  function renderDrafts(){ const sel=$('drafts'); sel.innerHTML='<option value="">— drafts ('+drafts.length+') —</option>'+drafts.map(d=>`<option value="${esc(d.invNo)}">${esc(d.invNo)} · ${esc(d.cliName||'—')}</option>`).join(''); }
  function persistDrafts(){ try{ localStorage.setItem(STORE, JSON.stringify(drafts)); }catch(e){} }
  function loadDrafts(){ try{ drafts=JSON.parse(localStorage.getItem(STORE)||'[]'); if(!Array.isArray(drafts))drafts=[]; }catch(e){ drafts=[]; } }
  function saveProfile(){ try{ localStorage.setItem(PROFILE, JSON.stringify({bizName:$('bizName').value, bizMeta:$('bizMeta').value, logo, currency:$('currency').value})); }catch(e){} }
  function loadProfile(){ try{ const p=JSON.parse(localStorage.getItem(PROFILE)||'null'); if(p){ $('bizName').value=p.bizName||''; $('bizMeta').value=p.bizMeta||''; logo=p.logo||''; if(p.currency)$('currency').value=p.currency; } }catch(e){} }

  const today=()=>new Date().toISOString().slice(0,10);
  function nextInvNo(){ const n=(parseInt(localStorage.getItem('invoices.seq')||'1000',10))+1; localStorage.setItem('invoices.seq',String(n)); return 'INV-'+n; }

  // init
  loadDrafts(); loadProfile(); renderDrafts();
  items=[newItem('',1,0),newItem('',1,0)];
  if(!$('invNo').value) $('invNo').value='INV-'+(parseInt(localStorage.getItem('invoices.seq')||'1000',10)+1);
  $('invDate').value=today();
  renderItems(); render();
})();
</script>
