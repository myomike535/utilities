<style>

  [data-theme="dark"] {
    --bg-1: #1a1310; --bg-2: #2a1e18;
    --paper: #2f231a; --paper-2: #3a2c22; --paper-3: #453629;

  }
  [data-theme="royal"] {
    --bg-1: #1a1830; --bg-2: #2d2650;
    --paper: #241e42; --paper-2: #2d2650; --paper-3: #362e5d;
    --ink: #f2d98a; --ink-dim: #d4b56a; --ink-mute: #9b8248;

  body {
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color:var(--ink); min-height:100vh;

  .app {
    background:var(--paper); max-width:640px; width:100%;

  }
  header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  header .title { flex:1; }
  header h1 { font-size:1.25rem; color:var(--accent); }
  header .sub { font-family:var(--serif); font-style:italic; color:var(--ink-mute); font-size:0.78rem; }

  .hbtn:hover { border-color:var(--accent); }
  .hbtn.on { background:var(--accent); color:#fff; border-color:var(--accent); }

  .toc { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; padding-bottom:14px; border-bottom:1px dashed var(--border); }

  .toc button:hover { border-color:var(--accent); color:var(--accent); }

  .chant { margin-bottom:26px; scroll-margin-top:12px; }
  .chant h2 {
    font-size:1.05rem; color:var(--accent); margin-bottom:2px;
    display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  }
  .chant h2 .pali-t { font-family:var(--serif); font-style:italic; font-weight:400; font-size:0.85rem; color:var(--ink-mute); }
  .chant .body { margin-top:10px; display:flex; flex-direction:column; gap:10px; }
  .verse {
    background:var(--paper-2); border-left:3px solid var(--accent-2);
    border-radius:0 8px 8px 0; padding:12px 16px;
  }
  .verse .pali {
    font-family:var(--serif); font-style:italic; color:var(--accent);
    line-height:1.9; font-size:calc(0.98rem * var(--cs,1)); margin-bottom:8px;
  }
  .verse .mm { color:var(--ink); line-height:2; font-size:calc(0.95rem * var(--cs,1)); }
  .verse.rep { border-left-color:var(--gold); }
  .rep-note { font-size:0.72rem; color:var(--gold); font-weight:700; margin-bottom:6px; }
  [data-theme="parchment"] .rep-note { color:#a07d1c; }
  .chant .note { font-size:0.8rem; color:var(--ink-mute); font-style:italic; margin-top:8px; line-height:1.7; }
  .chant .note a { color:var(--accent); }

  .fs-bar { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .fs-bar span { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-mute); }
  .fs-bar button {
    min-width:32px; height:30px; border:1px solid var(--border); background:var(--paper-2);
    color:var(--ink); border-radius:8px; cursor:pointer;
  }
  .fs-bar button:hover { border-color:var(--accent); color:var(--accent); }
  footer { text-align:center; font-family:var(--serif); font-style:italic; color:var(--ink-mute); font-size:0.8rem; margin-top:10px; line-height:1.9; }
</style>
</head>

        { pali: 'Ahaṃ avero homi, abyāpajjo homi, anīgho homi, sukhī attānaṃ pariharāmi.',
          mm: 'ကျွန်ုပ်သည် ရန်မရှိပါစေသတည်း၊ စိတ်ဆင်းရဲခြင်း မရှိပါစေသတည်း၊ ကိုယ်ဆင်းရဲခြင်း မရှိပါစေသတည်း၊ ချမ်းသာစွာ မိမိကိုယ်ကို ဆောင်ရွက်နိုင်ပါစေသတည်း။' },
        { pali: 'Sabbe sattā averā hontu, abyāpajjā hontu, anīghā hontu, sukhī attānaṃ pariharantu.',
          mm: 'သတ္တဝါအားလုံးတို့သည် ရန်မရှိကြပါစေသတည်း၊ စိတ်ဆင်းရဲခြင်း မရှိကြပါစေသတည်း၊ ကိုယ်ဆင်းရဲခြင်း မရှိကြပါစေသတည်း၊ ချမ်းသာစွာ မိမိကိုယ်ကို ဆောင်ရွက်နိုင်ကြပါစေသတည်း။' },
      ],
    },
    {
      id: 'dedication', my: 'အမျှဝေခြင်း', pali: 'Puñña-anumodana',
      verses: [
        { pali: 'Idaṃ me puññaṃ āsavakkhayāvahaṃ hotu.\nIdaṃ me puññaṃ nibbānassa paccayo hotu.',
          mm: 'ဤကောင်းမှုသည် အာသဝေါတရား ကုန်ခန်းခြင်း၏ အကြောင်းဖြစ်ပါစေ။\nဤကောင်းမှုသည် နိဗ္ဗာန်၏ အထောက်အပံ့ ဖြစ်ပါစေ။' },
        { rep: '၃ ကြိမ်', pali: 'Sabbe sattā imaṃ puññaṃ anumodantu.',
          mm: 'ပြုပြီးသမျှ ကုသိုလ်ကောင်းမှုတို့ကို သတ္တဝါအားလုံး အမျှ … အမျှ … အမျှ ယူတော်မူကြပါကုန်လော့။' },
      ],
    },
    {
      id: 'paritta', my: 'ပရိတ်ကြီးများ', pali: 'Paritta',
      verses: [],
      note: 'မင်္ဂလသုတ်၊ ရတနသုတ်၊ မေတ္တသုတ် — အပြည့်အစုံကို <a href="tipitaka.html">Tipiṭaka app</a> တွင် မြန်မာပြန်နှင့်တကွ ဖတ်ရှုနိုင်ပါသည်။ ကျန် ပရိတ်များကိုလည်း Tipiṭaka app ၏ 🌐 ရယူရန် စနစ်ဖြင့် ရယူနိုင်ပါသည်။',
    },
  ];

  const $ = id => document.getElementById(id);

  // ---- render ----
  const toc = $('toc'), host = $('chants');
  CHANTS.forEach(ch => {
    const b = document.createElement('button');
    b.textContent = ch.my;
    b.onclick = () => document.getElementById('c-' + ch.id)?.scrollIntoView({ behavior: 'smooth' });
    toc.appendChild(b);

    const sec = document.createElement('section');
    sec.className = 'chant'; sec.id = 'c-' + ch.id;
    sec.innerHTML = `<h2>${ch.my} <span class="pali-t">· ${ch.pali}</span></h2>`;
    const body = document.createElement('div'); body.className = 'body';
    ch.verses.forEach(v => {
      const d = document.createElement('div');
      d.className = 'verse' + (v.rep ? ' rep' : '');
      d.innerHTML =
        (v.rep ? `<div class="rep-note">🔁 ${v.rep} ရွတ်ပါ</div>` : '') +
        `<div class="pali">${v.pali.replace(/\n/g, '<br>')}</div>` +
        `<div class="mm">${v.mm.replace(/\n/g, '<br>')}</div>`;
      body.appendChild(d);
    });
    sec.appendChild(body);
    if (ch.note) {
      const n = document.createElement('div'); n.className = 'note'; n.innerHTML = ch.note;
      sec.appendChild(n);
    }
    host.appendChild(sec);
  });

  // ---- font scale ----
  function setFs(v) {
    v = Math.min(1.6, Math.max(0.85, Math.round(v * 100) / 100));
    localStorage.setItem(FS_KEY, String(v));
    document.documentElement.style.setProperty('--cs', v);
  }
  const getFs = () => parseFloat(localStorage.getItem(FS_KEY)) || 1;
  setFs(getFs());
  $('fsDown').onclick = () => setFs(getFs() - 0.1);
  $('fsUp').onclick = () => setFs(getFs() + 0.1);
  $('fsReset').onclick = () => setFs(1);

  // ---- theme ----
  const THEMES = ['parchment', 'dark', 'royal'];
  const THEME_ICONS = { parchment: '📜', dark: '🌙', royal: '👑' };
  function applyTheme(t) {
    if (!THEMES.includes(t)) t = 'parchment';
    document.documentElement.dataset.theme = t;
    localStorage.setItem(THEME_KEY, t);
    $('themeBtn').textContent = THEME_ICONS[t];
  }
  applyTheme(localStorage.getItem(THEME_KEY) || 'parchment');
  $('themeBtn').onclick = () => {
    const i = THEMES.indexOf(document.documentElement.dataset.theme);
    applyTheme(THEMES[(i + 1) % THEMES.length]);
  };

  // ---- wake lock (keep screen on while chanting) ----
  let wakeLock = null;
  $('wakeBtn').onclick = async () => {
    if (wakeLock) { wakeLock.release(); wakeLock = null; $('wakeBtn').classList.remove('on'); return; }
    try {
      wakeLock = await navigator.wakeLock?.request('screen');
      if (wakeLock) {
        $('wakeBtn').classList.add('on');
        wakeLock.addEventListener('release', () => { wakeLock = null; $('wakeBtn').classList.remove('on'); });
      }
    } catch (e) {}
  };
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && $('wakeBtn').classList.contains('on') && !wakeLock) {
      try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
    }
  });
})();
</script>
</body>
</html>
