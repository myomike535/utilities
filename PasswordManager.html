<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vault — Password Manager</title>

<!-- PWA: installable on iOS (Add to Home Screen) and Android (Install app) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1216">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vault">
<link rel="stylesheet" href="_motion.css">
<script defer src="_motion.js"></script>
<style>
  :root{
    --bg:#070a0f; --bg2:#0d1119;
    --card:linear-gradient(158deg, rgba(34,41,54,.92), rgba(20,25,34,.94));
    --card-solid:#171c26;
    --field:#12161f; --field-hover:#1a2029; --field-border:#2b3342;
    --text:#f2f5fa; --muted:#9aa4b3; --faint:#616c7d;
    --accent:#5aa9ff; --accent-2:#8b6bff;
    --danger:#ff6b6b; --ok:#42d392;
    --shadow:0 12px 40px rgba(0,0,0,.55);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:'Inter','Segoe UI',system-ui,Arial,sans-serif;
    color:var(--text); min-height:100vh; padding:36px 18px 60px;
    background:
      radial-gradient(1100px 620px at 12% -12%, rgba(90,169,255,.20), transparent 58%),
      radial-gradient(950px 600px at 105% -5%, rgba(139,107,255,.18), transparent 55%),
      radial-gradient(700px 700px at 50% 120%, rgba(66,211,146,.06), transparent 60%),
      linear-gradient(180deg, var(--bg2) 0%, var(--bg) 62%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px; margin:0 auto}

  /* Header */
  .head{display:flex; align-items:center; gap:14px; margin-bottom:26px}
  .logo{
    width:46px; height:46px; border-radius:13px; display:grid; place-items:center;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 6px 18px rgba(90,169,255,.35); flex:none;
  }
  .logo svg{width:24px; height:24px; stroke:#0b0e13; stroke-width:2.2}
  .head h1{font-size:21px; font-weight:700; margin:0; letter-spacing:-.01em}
  .head .sub{color:var(--muted); font-size:12.5px; margin:2px 0 0}

  button{font-family:inherit; cursor:pointer}
  .btn{
    background:rgba(255,255,255,.04); color:var(--text); border:1px solid var(--field-border);
    padding:9px 16px; border-radius:11px; font-size:13.5px; font-weight:500;
    transition:.16s; display:inline-flex; align-items:center; gap:7px;
  }
  .btn:hover{background:rgba(255,255,255,.09); border-color:#3a4351}
  .btn.solid{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#08111f; border:none; font-weight:600; box-shadow:0 4px 14px rgba(90,169,255,.3)}
  .btn.solid:hover{filter:brightness(1.08)}
  .btn.danger{color:var(--danger); border-color:rgba(255,107,107,.4)}
  .btn.danger:hover{background:rgba(255,107,107,.12)}
  .btn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2}

  .toolbar{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center}
  .search-wrap{flex:1 1 100%; min-width:0; position:relative; display:flex; align-items:center}
  .search-wrap svg{position:absolute; left:14px; width:17px; height:17px; stroke:var(--faint); fill:none; stroke-width:2; pointer-events:none}
  .search{
    width:100%; background:var(--field); border:1px solid var(--field-border); color:var(--text);
    padding:11px 14px 11px 40px; border-radius:12px; font-size:14px; transition:.16s;
  }
  .search:focus{outline:none; border-color:var(--accent); background:var(--field-hover)}
  .search::placeholder{color:var(--faint)}

  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px}
  .tab{
    background:rgba(255,255,255,.03); border:1px solid var(--field-border); color:var(--muted);
    padding:7px 13px; border-radius:11px; font-size:13px; transition:.16s;
    display:inline-flex; align-items:center; gap:7px;
  }
  .tab .ic{font-size:14px; line-height:1}
  .tab .cnt{background:rgba(255,255,255,.08); border-radius:8px; padding:0 6px; font-size:11px; min-width:18px; text-align:center}
  .tab:hover{color:var(--text); border-color:#3a4351}
  .tab.active{color:#08111f; font-weight:600; border-color:transparent;
    background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 4px 12px rgba(90,169,255,.28)}
  .tab.active .cnt{background:rgba(0,0,0,.18)}

  /* Cards */
  .card{
    position:relative; background:var(--card); backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.08); border-radius:var(--radius);
    padding:20px 22px 18px; margin-bottom:16px; box-shadow:var(--shadow);
    overflow:hidden; transition:transform .14s, border-color .16s, box-shadow .16s;
  }
  /* Top sheen — subtle light catching the upper edge for a premium, glassy surface */
  .card::after{content:""; position:absolute; left:0; right:0; top:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent); pointer-events:none}
  .card:hover{transform:translateY(-3px); border-color:color-mix(in srgb, var(--cat,#5aa9ff) 50%, transparent);
    box-shadow:0 16px 44px rgba(0,0,0,.55), 0 0 26px -6px color-mix(in srgb, var(--cat,#5aa9ff) 45%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--cat,#5aa9ff) 12%, transparent)}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg, var(--cat,#5aa9ff), color-mix(in srgb, var(--cat,#5aa9ff) 55%, #000));
    box-shadow:0 0 16px -2px var(--cat,#5aa9ff)}
  .card-head{display:flex; align-items:center; gap:11px; cursor:pointer; user-select:none}
  .cat-ic{
    width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-size:17px; flex:none;
    background:color-mix(in srgb, var(--cat) 20%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--cat) 35%, transparent);
  }
  .head-txt{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
  .card-head .title{font-size:15.5px; font-weight:650; letter-spacing:-.01em; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .subline{color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .icon-btn.q{color:var(--muted)}
  .chev{color:var(--faint); display:flex; flex:none; transition:transform .22s}
  .chev svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .card.open .chev{transform:rotate(180deg)}
  /* 0fr -> 1fr grid-row trick animates to natural height without max-height hacks */
  .card-body{display:grid; grid-template-rows:0fr; transition:grid-template-rows .26s ease}
  .card.open .card-body{grid-template-rows:1fr}
  .card-body-in{overflow:hidden; min-height:0}
  .card-body .grid{padding-top:16px}
  .badge{font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600;
    color:var(--cat); background:color-mix(in srgb, var(--cat) 16%, transparent)}
  .badge.locked{color:#ffa657; background:rgba(255,166,87,.16); display:inline-flex; align-items:center; gap:4px}
  .badge.locked svg{width:11px; height:11px; stroke:currentColor; fill:none; stroke-width:2.4}
  .card.locked .value-row:has([data-secret]) [data-act="reveal"],
  .card.locked .value-row:has([data-secret]) [data-act="copy"]{opacity:.35; pointer-events:none}
  .btn.locked-on{color:#ffa657; border-color:rgba(255,166,87,.4); background:rgba(255,166,87,.1)}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:13px 22px}
  @media(max-width:580px){.grid{grid-template-columns:1fr}}
  @media(max-width:480px){.grid{gap:11px 0}}
  .label{color:var(--muted); font-size:11px; margin-bottom:5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em}
  .value-row{display:flex; align-items:center; gap:6px; background:var(--field); border:1px solid transparent; border-radius:10px; padding:8px 10px 8px 12px; transition:.16s}
  .value-row:hover{background:var(--field-hover); border-color:var(--field-border)}
  .value-row .val{flex:1; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-variant-numeric:tabular-nums}
  .value-row .val.wrap{white-space:pre-wrap; word-break:break-word; font-family:'Cascadia Code','Consolas',monospace; font-size:13px; line-height:1.55}
  .value-row .val[data-secret]{letter-spacing:.06em; color:var(--muted)}
  .value-row .val[data-shown="1"]{color:var(--text); letter-spacing:normal; white-space:pre-wrap; word-break:break-word}
  .value-row a{color:var(--accent); text-decoration:none}
  .value-row a:hover{text-decoration:underline}
  .icon-btn{background:transparent; border:none; color:var(--faint); padding:5px; border-radius:8px; display:flex; transition:.14s}
  .icon-btn:hover{color:var(--text); background:rgba(255,255,255,.08)}
  .icon-btn svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .full{grid-column:1 / -1}

  .card-actions{display:flex; gap:9px; margin-top:16px; padding-top:14px; border-top:1px solid rgba(255,255,255,.06)}
  .card-actions .btn{padding:7px 14px; font-size:13px}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(5,7,10,.6); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:16px; z-index:50}
  .overlay.show{display:flex; animation:fade .15s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--card-solid); border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:26px; width:100%; max-width:500px; max-height:90vh; overflow:auto; box-shadow:var(--shadow)}
  .modal h2{margin:0 0 20px; font-size:18px; font-weight:700}
  .modal label{display:block; margin-bottom:13px}
  .modal label span{display:block; color:var(--muted); font-size:11.5px; margin-bottom:6px; font-weight:600}
  .modal input, .modal textarea, .modal select{
    width:100%; background:var(--field); border:1px solid var(--field-border); color:var(--text);
    padding:10px 12px; border-radius:10px; font-size:14px; font-family:inherit; transition:.16s;
  }
  .modal input:focus, .modal textarea:focus, .modal select:focus{outline:none; border-color:var(--accent)}
  .modal textarea{resize:vertical; min-height:58px}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:8px}
  .pw-input-wrap{position:relative}
  .pw-input-wrap input{padding-right:112px}
  .pw-input-wrap textarea{padding-right:40px}
  .pw-gen{font-size:11px; color:var(--accent); background:rgba(90,169,255,.12); border:none; padding:5px 9px; border-radius:7px; font-weight:600}
  .pw-gen:hover{background:rgba(90,169,255,.22)}
  .fld-ctl{position:absolute; right:6px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:2px}
  .fld-ctl.ta{top:8px; transform:none}
  .fld-eye{background:transparent; border:none; color:var(--faint); padding:4px 6px; border-radius:7px; display:flex}
  .fld-eye:hover{color:var(--text); background:rgba(255,255,255,.08)}
  .fld-eye svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  textarea.masked{-webkit-text-security:disc}

  .empty{color:var(--muted); text-align:center; padding:56px 0; font-size:14px}
  .empty .big{font-size:34px; margin-bottom:10px; opacity:.6}
  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:#0b0e13; color:#fff; padding:11px 20px; border-radius:11px; font-size:13px; opacity:0; transition:.25s; pointer-events:none; border:1px solid rgba(255,255,255,.1); box-shadow:var(--shadow); display:flex; align-items:center; gap:8px}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast svg{width:16px; height:16px; stroke:var(--ok); fill:none; stroke-width:2.5}
  .toast.error svg{stroke:var(--danger)}
  .toast.info svg{stroke:var(--accent)}

  /* Lock */
  .lock{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:100; padding:16px;
    background:radial-gradient(700px 400px at 50% 0%, rgba(92,124,255,.18), transparent 60%), linear-gradient(180deg,var(--bg2),var(--bg))}
  .lock.show{display:flex}
  .lock .box{background:var(--card-solid); border:1px solid rgba(255,255,255,.08); border-radius:22px; padding:34px 32px; width:100%; max-width:390px; text-align:center; box-shadow:var(--shadow)}
  .lock .logo{margin:0 auto 18px}
  .lock h2{margin:0 0 6px; font-size:20px; font-weight:700}
  .lock p{color:var(--muted); font-size:13px; margin:0 0 22px}
  .lock input{width:100%; background:var(--field); border:1px solid var(--field-border); color:var(--text); padding:13px; border-radius:11px; font-size:15px; text-align:center; margin-bottom:14px; transition:.16s}
  .lock input:focus{outline:none; border-color:var(--accent)}
  .lock .err{color:var(--danger); font-size:13px; min-height:18px; margin-bottom:10px}
  .lock .btn{width:100%; justify-content:center}

  /* Favorite star */
  .star{background:transparent; border:none; padding:4px; border-radius:8px; color:var(--faint); display:flex; transition:.14s}
  .star:hover{color:#ffd24a; background:rgba(255,255,255,.06)}
  .star.on{color:#ffd24a}
  .star svg{width:18px; height:18px; stroke:currentColor; stroke-width:2; fill:none}
  .star.on svg{fill:#ffd24a}
  .card-meta{margin-left:auto; color:var(--muted); font-size:12px; white-space:nowrap; align-self:center}

  /* Strength meter */
  .meter{margin-top:7px; display:flex; align-items:center; gap:9px}
  .meter .track{flex:1; height:6px; border-radius:4px; background:var(--field-border); overflow:hidden}
  .meter .fill{height:100%; width:0; border-radius:4px; transition:width .2s, background .2s}
  .meter .lbl{font-size:11px; font-weight:600; color:var(--muted); min-width:42px; text-align:right}

  /* Password history */
  .hist-wrap{margin:4px 0 14px; border:1px solid var(--field-border); border-radius:10px; background:var(--field); overflow:hidden}
  .hist-wrap summary{cursor:pointer; list-style:none; padding:10px 13px; font-size:12.5px; font-weight:600; color:var(--muted); user-select:none}
  .hist-wrap summary::-webkit-details-marker{display:none}
  .hist-wrap summary::before{content:"▸"; display:inline-block; margin-right:8px; transition:transform .15s; color:var(--faint)}
  .hist-wrap[open] summary::before{transform:rotate(90deg)}
  .hist-wrap summary:hover{color:var(--text)}
  .hist-list{padding:4px 11px 11px}
  .hist-item{margin-bottom:9px}
  .hist-item:last-child{margin-bottom:2px}
  .hist-meta{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px}
  .hist-key{font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
  .hist-when{font-size:11px; color:var(--faint)}
  .hist-note{font-size:12px; color:#ffa657; margin:0 0 8px; padding:0 2px}
  .hist-item .value-row{background:var(--card-solid)}

  /* Generator */
  .gen-out{display:flex; align-items:center; gap:8px; background:var(--field); border:1px solid var(--field-border); border-radius:11px; padding:12px 14px; margin-bottom:18px}
  .gen-out .txt{flex:1; font-family:'Consolas','SF Mono',monospace; font-size:15px; word-break:break-all; letter-spacing:.02em}
  .gen-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
  .gen-row label{color:var(--muted); font-size:13px; display:flex; align-items:center; gap:9px; cursor:pointer; margin:0}
  .gen-row input[type=range]{flex:1; accent-color:var(--accent)}
  .gen-row .len{font-variant-numeric:tabular-nums; font-weight:600; min-width:26px; text-align:right}
  .switch{position:relative; width:38px; height:22px; flex:none}
  .switch input{opacity:0; width:0; height:0; position:absolute}
  .switch .sl{position:absolute; inset:0; background:var(--field-border); border-radius:20px; transition:.18s}
  .switch .sl::before{content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.18s}
  .switch input:checked + .sl{background:var(--accent)}
  .switch input:checked + .sl::before{transform:translateX(16px)}
  .toggles{display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; margin-bottom:20px}

  /* Health report */
  .health-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px}
  .stat{background:var(--field); border:1px solid var(--field-border); border-radius:12px; padding:14px; text-align:center}
  .stat .n{font-size:24px; font-weight:700}
  .stat .t{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:3px}
  .stat.warn .n{color:var(--danger)} .stat.ok .n{color:var(--ok)} .stat.mid .n{color:#ffa657}
  .hsec{margin-bottom:18px}
  .hsec h3{font-size:13px; margin:0 0 9px; color:var(--muted); font-weight:600}
  .hitem{display:flex; align-items:center; gap:10px; background:var(--field); border:1px solid var(--field-border); border-radius:10px; padding:9px 12px; margin-bottom:7px; cursor:pointer; transition:.14s}
  .hitem:hover{background:var(--field-hover); border-color:#3a4351}
  .hitem .hic{font-size:15px} .hitem .hname{flex:1; font-size:13.5px; font-weight:500}
  .hitem .htag{font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px}
  .modal.wide{max-width:540px}
  .modal.dialog{max-width:420px}
  .dlg-msg{color:var(--muted); font-size:13.5px; line-height:1.55; margin:0 0 18px}
  #dlgInputWrap{margin-bottom:18px}
  #dlgInput{width:100%; background:var(--field); border:1px solid var(--field-border); color:var(--text); padding:11px 13px; border-radius:10px; font-size:14px; transition:.16s}
  #dlgInput:focus{outline:none; border-color:var(--accent)}
  .btn.danger-solid{background:var(--danger); color:#2a0b0b; border:none; font-weight:600}
  .btn.danger-solid:hover{filter:brightness(1.06); background:var(--danger)}

  /* Credit */
  .credit{text-align:center; color:var(--faint); font-size:12px; margin-top:34px; letter-spacing:.02em}
  .credit b{color:var(--muted); font-weight:600}

  /* Responsive — tablet */
  @media(max-width:768px){
    body{padding:28px 14px 50px}
    .head{margin-bottom:20px; gap:11px}
    .head h1{font-size:19px}
    .head .sub{font-size:12px}
    .logo{width:42px; height:42px; border-radius:11px}
    .logo svg{width:22px; height:22px}
    .toolbar{gap:8px; margin-bottom:14px}
    .btn{padding:8px 13px; font-size:13px}
    .tabs{gap:7px; margin-bottom:18px}
    .tab{padding:6px 11px; font-size:12.5px}
    .card{padding:17px 17px 15px; border-radius:14px}
    .card-actions{flex-wrap:wrap}
    .card-meta{margin-left:auto}
  }

  /* Responsive — phone */
  @media(max-width:480px){
    body{padding:20px 12px 44px}
    .wrap{max-width:100%}
    .head{margin-bottom:18px}
    .head h1{font-size:18px}
    .head .sub{font-size:11.5px; line-height:1.4}

    /* Toolbar: search alone on row 1, action buttons row 2 (icon + short label) */
    .toolbar{gap:7px}
    .search-wrap{flex:0 0 100%; min-width:0; order:-1}
    .search{padding:10px 12px 10px 38px; font-size:13.5px}
    .search-wrap svg{left:12px}
    .btn{flex:1 1 0; min-width:0; justify-content:center; padding:9px 6px; font-size:12px; gap:5px}
    .btn svg{width:15px; height:15px; flex:none}
    /* Hide button text on narrow screens — keep icons (7 buttons don't fit with labels) */
    @media(max-width:460px){
      .toolbar .btn{font-size:0; padding:9px 10px}
      .toolbar .btn svg{width:17px; height:17px}
    }

    /* Tabs scroll horizontally instead of wrapping into many rows */
    .tabs{flex-wrap:nowrap !important; overflow-x:auto; overflow-y:hidden;
          margin:0 -12px 18px; padding:0 12px 6px;
          scrollbar-width:none; -webkit-overflow-scrolling:touch}
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex:0 0 auto; white-space:nowrap}

    /* Card */
    .card{padding:15px 15px 13px; margin-bottom:13px}
    .card-head{gap:9px}
    .card-head .badge{display:none} /* icon color already signals category */
    .card-head .title{font-size:14.5px}
    .cat-ic{width:30px; height:30px; font-size:15px; border-radius:9px}
    .badge{font-size:10.5px; padding:2px 7px}
    .label{font-size:10.5px}
    .value-row{padding:7px 8px 7px 11px}
    .value-row .val{font-size:13px; white-space:normal; word-break:break-word}
    .value-row .val.wrap{white-space:pre-wrap; word-break:break-word}
    .card-actions{gap:7px; margin-top:13px; padding-top:11px}
    .card-actions .btn{padding:7px 11px; font-size:12.5px; flex:1 1 auto; justify-content:center}
    .card-meta{flex-basis:100%; margin-left:0; text-align:right; padding-top:4px}

<script>
(() => {
  "use strict";
  const STORE_KEY = "pmvault.v2";
  const HISTORY_CAP = 20;
  // KDF_ITER: current PBKDF2 cost (OWASP-recommended). LEGACY_ITER: blobs written
  // before `iter` was stored in the payload — old vaults/backups decrypt with it,
  // then get transparently re-encrypted at KDF_ITER on unlock.
  const KDF_ITER = 600000, LEGACY_ITER = 150000;
  const enc = new TextEncoder(), dec = new TextDecoder();

  // ---- Category / field schema ----
  // flags: copy, secret (masked + reveal), link (<a>), area (textarea / multi-line), gen (password generator)
  const CATEGORIES = {
    website: { label:"Website", icon:"🌐", color:"#5aa9ff", fields:[
      {key:"username", label:"Username", copy:true},
      {key:"password", label:"Password", secret:true, copy:true, gen:true},
      {key:"url", label:"Site URL", link:true},
      {key:"note", label:"Note", area:true},
    ]},
    database: { label:"Database", icon:"🗄️", color:"#7c5cff", fields:[
      {key:"engine", label:"Engine (MySQL / SQL Server / Postgres…)"},
      {key:"host", label:"Host / IP", copy:true},
      {key:"port", label:"Port", copy:true},
      {key:"dbname", label:"Database Name", copy:true},
      {key:"username", label:"Username", copy:true},
      {key:"password", label:"Password", secret:true, copy:true, gen:true},
      {key:"connstr", label:"Connection String", secret:true, copy:true, area:true},
      {key:"note", label:"Note", area:true},
    ]},
    server: { label:"Server", icon:"🖥️", color:"#42d392", fields:[
      {key:"host", label:"Hostname / IP", copy:true},
      {key:"port", label:"Port", copy:true},
      {key:"os", label:"OS / Role"},
      {key:"username", label:"Username", copy:true},
      {key:"password", label:"Password", secret:true, copy:true, gen:true},
      {key:"sshkey", label:"SSH Key / Secret", secret:true, area:true},
      {key:"url", label:"Admin URL", link:true},
      {key:"note", label:"Note", area:true},
    ]},
    app: { label:"App / API", icon:"🔌", color:"#ffa657", fields:[
      {key:"username", label:"Username / Client ID", copy:true},
      {key:"password", label:"Password / Secret", secret:true, copy:true, gen:true},
      {key:"apikey", label:"API Key / Token", secret:true, copy:true, area:true},
      {key:"url", label:"Endpoint / URL", link:true},
      {key:"note", label:"Note", area:true},
    ]},
    note: { label:"Secure Note", icon:"📝", color:"#9aa0a6", fields:[
      {key:"note", label:"Note", secret:true, area:true},
    ]},
    info: { label:"Useful Note", icon:"📒", color:"#ffd24a", fields:[
      {key:"note", label:"Note", copy:true, area:true},
      {key:"url", label:"Related URL", link:true},
    ]},
    study: { label:"Study Case", icon:"📚", color:"#a78bfa", fields:[
      {key:"context", label:"Context / Background", area:true},
      {key:"problem", label:"Problem", area:true, copy:true},
      {key:"solution", label:"Solution / Approach", area:true, copy:true},
      {key:"outcome", label:"Outcome / Lessons Learned", area:true, copy:true},
      {key:"tech", label:"Tech / Stack (comma-separated)"},
      {key:"url", label:"Reference URL", link:true},
    ]},
    auth: { label:"2FA / Authenticator", icon:"🔐", color:"#22c55e", fields:[
      {key:"issuer", label:"Issuer (e.g. GitHub, Google)", copy:true},
      {key:"account", label:"Account / Email", copy:true},
      {key:"secret", label:"TOTP Secret (base32)", secret:true, area:true, totp:true},
      {key:"note", label:"Note", area:true},
    ]},
  };
  const CAT_KEYS = Object.keys(CATEGORIES);
  const catOf = t => CATEGORIES[t] || CATEGORIES.website;

  // ---- State ----
  let entries = [], cryptoKey = null, salt = null, kdfIter = KDF_ITER, editingId = null, activeTab = "all";
  const expandedIds = new Set(); // cards open this session (not persisted)

  // ---- DOM ----
  const $ = id => document.getElementById(id);
  const listEl = $("list"), toastEl = $("toast"), overlay = $("overlay");

  // ---- Crypto ----
  const b64 = {
    enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))),
    dec: str => Uint8Array.from(atob(str), c => c.charCodeAt(0)),
  };
  async function deriveKey(password, saltBytes, iterations){
    const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name:"PBKDF2", salt:saltBytes, iterations, hash:"SHA-256" },
      base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
  }
  async function encryptVault(){
    const payload = enc.encode(JSON.stringify(entries));
    if(!cryptoKey) return JSON.stringify({ v:2, enc:false, data:b64.enc(payload) });
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, cryptoKey, payload);
    return JSON.stringify({ v:2, enc:true, iter:kdfIter, salt:b64.enc(salt), iv:b64.enc(iv), data:b64.enc(ct) });
  }
  async function persist(){ localStorage.setItem(STORE_KEY, await encryptVault()); }

  // ---- Toast ----
  let toastTimer;
  const TOAST_ICON = {
    success:'<svg viewBox="0 0 24 24" fill="none"><path d="m5 13 4 4L19 7"/></svg>',
    error:'<svg viewBox="0 0 24 24" fill="none"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  };
  function toast(msg, type){
    type = type || "success";
    toastEl.className = "toast " + type;
    toastEl.innerHTML = `${TOAST_ICON[type] || TOAST_ICON.success}${msg}`;
    toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove("show"), 1600);
  }

  // ---- Custom dialog (replaces native prompt/confirm) ----
  // Resolves: input mode -> string | null;  confirm mode -> true | false;  Esc/backdrop -> null
  const dialogOverlay = $("dialogOverlay");
  let dialogResolve = null, dialogIsInput = false;
  function openDialog(opts){
    return new Promise(resolve => {
      dialogResolve = resolve;
      dialogIsInput = !!opts.input;
      $("dlgTitle").textContent = opts.title || "";
      $("dlgMsg").innerHTML = opts.message || "";
      $("dlgMsg").style.display = opts.message ? "block" : "none";
      $("dlgInputWrap").style.display = dialogIsInput ? "block" : "none";
      const inp = $("dlgInput");
      if(dialogIsInput){ inp.type = opts.inputType || "text"; inp.placeholder = opts.placeholder || ""; inp.value = ""; }
      const ok = $("dlgOk");
      ok.textContent = opts.okLabel || "OK";
      ok.className = "btn " + (opts.danger ? "danger-solid" : "solid");
      $("dlgCancel").textContent = opts.cancelLabel || "Cancel";
      dialogOverlay.classList.add("show");
      setTimeout(() => (dialogIsInput ? inp : ok).focus(), 30);
    });
  }
  function settleDialog(result){
    if(dialogResolve === null) return;
    const r = dialogResolve; dialogResolve = null;
    dialogOverlay.classList.remove("show");
    r(result);
  }
  $("dlgOk").addEventListener("click", () => settleDialog(dialogIsInput ? $("dlgInput").value : true));
  $("dlgCancel").addEventListener("click", () => settleDialog(dialogIsInput ? null : false));
  dialogOverlay.addEventListener("click", e => { if(e.target === dialogOverlay) settleDialog(null); });
  $("dlgInput").addEventListener("keydown", e => { if(e.key === "Enter") settleDialog($("dlgInput").value); });

  // ---- Helpers ----
  const esc = s => (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---- Password history ----
  function getHistory(e){ return Array.isArray(e && e.history) ? e.history : []; }
  // Diff OLD stored gen-field values vs new form values; push OLD values that changed.
  // MUST run before e.fields is overwritten, using the OLD entry's type.
  function recordHistory(oldEntry, oldType, newFields, when){
    if(!CATEGORIES[oldType]) return; // unknown/legacy type -> don't mis-target keys
    const genKeys = CATEGORIES[oldType].fields.filter(f => f.gen).map(f => f.key);
    let hist = getHistory(oldEntry), changed = false;
    for(const key of genKeys){
      const oldVal = (oldEntry.fields && oldEntry.fields[key]) || "";
      const newVal = newFields[key] || "";
      if(oldVal && oldVal !== newVal){ hist = [{ key, value: oldVal, changedAt: when }, ...hist]; changed = true; }
    }
    if(changed) oldEntry.history = hist.slice(0, HISTORY_CAP); // newest-first, capped
  }
  function fieldLabel(type, key){
    const f = catOf(type).fields.find(x => x.key === key);
    return f ? f.label : key;
  }

  const ICON = {
    copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    eye:'<svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff:'<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10 10 0 0 1 12 20C5 20 1 13 1 13a18 18 0 0 1 5-5.94M9.9 4.24A9 9 0 0 1 12 4c7 0 11 7 11 7a18 18 0 0 1-2.16 3.19M1 1l22 22"/></svg>',
    restore:'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/></svg>',
    user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
    key:'<svg viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M11 12 21 2m-4 1 3 3"/></svg>',
    chev:'<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  };
  function genPassword(len, opts){
    len = len || 18;
    opts = opts || { upper:true, lower:true, digit:true, sym:true, ambig:true };
    let pool = "";
    if(opts.upper) pool += opts.ambig ? "ABCDEFGHJKLMNPQRSTUVWXYZ" : "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    if(opts.lower) pool += opts.ambig ? "abcdefghijkmnpqrstuvwxyz" : "abcdefghijklmnopqrstuvwxyz";
    if(opts.digit) pool += opts.ambig ? "23456789" : "0123456789";
    if(opts.sym)   pool += "!@#$%^&*?-_=+";
    if(!pool) pool = "abcdefghijklmnopqrstuvwxyz";
    const arr = crypto.getRandomValues(new Uint32Array(len));
    return Array.from(arr, n => pool[n % pool.length]).join("");
  }

  // ---- Password strength (entropy heuristic) ----
  function pwStrength(pw){
    if(!pw) return { idx:-1, label:"", color:"var(--field-border)", pct:0 };
    let pool = 0;
    if(/[a-z]/.test(pw)) pool += 26;
    if(/[A-Z]/.test(pw)) pool += 26;
    if(/[0-9]/.test(pw)) pool += 10;
    if(/[^A-Za-z0-9]/.test(pw)) pool += 33;
    const bits = pw.length * Math.log2(pool || 1);
    const levels = [
      { max:36,  label:"Weak",   color:"#ff6b6b" },
      { max:60,  label:"Fair",   color:"#ffa657" },
      { max:80,  label:"Good",   color:"#5aa9ff" },
      { max:1e9, label:"Strong", color:"#42d392" },
    ];
    const idx = levels.findIndex(l => bits < l.max);
    return { idx, label:levels[idx].label, color:levels[idx].color, pct:Math.min(100, bits/90*100) };
  }

  // ---- Relative time ----
  function relTime(ts){
    if(!ts) return "";
    const s = Math.floor((Date.now() - ts) / 1000);
    if(s < 60) return "just now";
    const m = Math.floor(s/60); if(m < 60) return `${m}m ago`;
    const h = Math.floor(m/60); if(h < 24) return `${h}h ago`;
    const d = Math.floor(h/24); if(d < 30) return `${d}d ago`;
    const mo = Math.floor(d/30); if(mo < 12) return `${mo}mo ago`;
    return `${Math.floor(mo/12)}y ago`;
  }

  // ---- Entry -> shareable text ----
  function entryToText(e, { masked } = {}){
    const cat = catOf(e.type);
    const lines = [`${e.title || "(untitled)"}  [${cat.label}]`];
    cat.fields.forEach(f => {
      const v = e.fields[f.key]; if(!v) return;
      const shown = (masked && f.secret) ? "•".repeat(Math.min(12, v.length)) : v;
      lines.push(`${f.label}: ${shown}`);
    });
    return lines.join("\n");
  }

  // ---- Clipboard auto-clear ----
  const CLIP_CLEAR_MS = 30000;
  let clipTimer = 0, clipSeq = 0;
  function copyWithAutoClear(text){
    if(!text){ toast("Nothing to copy", "info"); return; }
    const seq = ++clipSeq;
    navigator.clipboard.writeText(text).then(() => {
      toast("Copied — clears in 30s");
      clearTimeout(clipTimer);
      clipTimer = setTimeout(() => {
        // only wipe if no newer copy happened since
        if(seq === clipSeq) navigator.clipboard.writeText("").catch(()=>{});
      }, CLIP_CLEAR_MS);
    }).catch(() => toast("Copy failed", "error"));
  }

  // ---- Auto-lock on idle ----
  const IDLE_MS = 5 * 60 * 1000;
  let idleTimer = 0, idleArmed = false;
  function resetIdle(){
    if(!idleArmed) return;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { navigator.clipboard.writeText("").catch(()=>{}); location.reload(); }, IDLE_MS);
  }
  function armIdle(){
    idleArmed = true;
    ["mousemove","keydown","click","scroll","touchstart"].forEach(ev =>
      window.addEventListener(ev, resetIdle, { passive:true }));
    resetIdle();
  }

  // ---- Tabs ----
  function tabCount(k){
    if(k==="all") return entries.length;
    if(k==="fav") return entries.filter(e=>e.fav).length;
    return entries.filter(e=>e.type===k).length;
  }
  function renderTabs(){
    const tabs = [["all","All","✳️"], ["fav","Favorites","⭐"], ...CAT_KEYS.map(k => [k, CATEGORIES[k].label, CATEGORIES[k].icon])];
    $("tabs").innerHTML = tabs.map(([k,label,icon]) => {
      const count = tabCount(k);
      return `<button class="tab ${activeTab===k?'active':''}" data-tab="${k}"><span class="ic">${icon}</span>${label}${count?`<span class="cnt">${count}</span>`:''}</button>`;

  $("tabs").addEventListener("click", e => {
    const t = e.target.closest("[data-tab]"); if(!t) return;
    activeTab = t.dataset.tab; renderTabs(); render();
  });

  // ---- TOTP (2FA) generation ----
  // Base32 decoder (RFC 4648, ignores spaces/dashes and lowercase)
  function base32Decode(str) {
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
    const clean = String(str || '').toUpperCase().replace(/[^A-Z2-7]/g, '');
    let bits = '', bytes = [];
    for (const ch of clean) {
      const idx = alphabet.indexOf(ch);
      if (idx < 0) continue;
      bits += idx.toString(2).padStart(5, '0');
    }
    for (let i = 0; i + 8 <= bits.length; i += 8) {
      bytes.push(parseInt(bits.slice(i, i + 8), 2));
    }
    return new Uint8Array(bytes);
  }
  // HMAC-SHA1 via Web Crypto → TOTP 6-digit code
  async function totpCode(secretBase32, period = 30, digits = 6, time = null) {
    const t = time ?? Math.floor(Date.now() / 1000);
    const counter = Math.floor(t / period);
    const key = base32Decode(secretBase32);
    if (!key.length) return '------';
    const buf = new ArrayBuffer(8);
    const view = new DataView(buf);
    view.setUint32(0, Math.floor(counter / 0x100000000));
    view.setUint32(4, counter & 0xffffffff);
    try {
      const cryptoKey = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
      const sig = new Uint8Array(await crypto.subtle.sign('HMAC', cryptoKey, buf));
      const offset = sig[sig.length - 1] & 0x0f;
      const bin = ((sig[offset] & 0x7f) << 24) | (sig[offset + 1] << 16) | (sig[offset + 2] << 8) | sig[offset + 3];
      return String(bin % Math.pow(10, digits)).padStart(digits, '0');
    } catch (err) {
      console.warn('TOTP failed:', err);
      return '------';
    }
  }
  function totpSecondsRemaining(period = 30) {
    return period - Math.floor(Date.now() / 1000) % period;
  }
  // Live tick — refreshes all .totp-live spans in the DOM every second
  let totpInterval = null;
  function startTotpLiveUpdater() {
    if (totpInterval) return;
    totpInterval = setInterval(refreshLiveTotps, 1000);
  }
  async function refreshLiveTotps() {
    const nodes = document.querySelectorAll('.totp-live[data-secret]');
    if (!nodes.length) { clearInterval(totpInterval); totpInterval = null; return; }
    const remaining = totpSecondsRemaining();
    for (const node of nodes) {
      const secret = node.dataset.secret;
      const code = await totpCode(secret);
      // Only update the numeric part; countdown is separate
      const numEl = node.querySelector('.totp-num');
      const cdEl = node.querySelector('.totp-cd');
      const barEl = node.querySelector('.totp-bar');
      if (numEl) numEl.textContent = code.slice(0,3) + ' ' + code.slice(3);
      if (cdEl) cdEl.textContent = remaining + 's';
      if (barEl) barEl.style.width = ((remaining / 30) * 100) + '%';
      // Warning colour when about to expire
      node.classList.toggle('expiring', remaining <= 5);
    }
  }

      const sf = cat.fields.find(x => x.secret && f[x.key]); // primary secret for quick-copy
      const quick =
        (f.username ? `<button class="icon-btn q" data-act="qcopy" data-key="username" title="Copy username">${ICON.user}</button>` : "") +

        (e.type === "study" && f.solution ? `<button class="icon-btn q" data-act="qcopy" data-key="solution" title="Copy solution">${ICON.copy}</button>` : "");
      const open = expandedIds.has(e.id);
      return `<div class="card ${e.locked?'locked':''} ${open?'open':''}" data-id="${e.id}" style="--cat:${cat.color}">
        <div class="card-head" data-act="toggle">
          <span class="cat-ic">${cat.icon}</span>
          <div class="head-txt">
            <span class="title">${esc(e.title) || '(untitled)'}</span>
            ${sub ? `<span class="subline">${esc(sub)}</span>` : ""}
          </div>
          <span class="badge">${esc(cat.label)}</span>
          ${lockedBadge}

          <button class="star ${e.fav?'on':''}" data-act="fav" title="Favorite"><svg viewBox="0 0 24 24"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 18.8 6.2 21.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg></button>
          <span class="chev">${ICON.chev}</span>
        </div>
        <div class="card-body"><div class="card-body-in">
          ${e.type === 'auth' && e.fields.secret && !e.locked ? `
            <div class="totp-widget totp-live" data-secret="${esc(e.fields.secret)}" data-id="${e.id}">
              <div class="totp-num" style="font-family:'Consolas',monospace;font-size:1.9rem;font-weight:600;letter-spacing:0.14em;text-align:center;padding:6px 0;color:#22c55e">------</div>
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                <div style="flex:1;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;">
                  <div class="totp-bar" style="height:100%;background:linear-gradient(90deg,#22c55e,#a78bfa);width:100%;transition:width 1s linear;"></div>
                </div>
                <span class="totp-cd" style="font-size:0.72rem;color:var(--muted,#9ba0a6);font-family:'Consolas',monospace;min-width:32px;text-align:right;">30s</span>
                <button class="icon-btn" data-act="totpcopy" title="Copy current code" style="width:26px;height:26px;">${ICON.copy}</button>
              </div>
            </div>
          ` : (e.type === 'auth' && e.locked ? '<div class="empty" style="padding:8px 0;text-align:center;color:var(--muted)">🔒 Unprotect entry to view live TOTP code</div>' : '')}
          <div class="grid">${cells || '<div class="empty" style="padding:8px 0">No details</div>'}</div>
          ${attGrid}
          <div class="card-actions">
            <button class="btn" data-act="edit">Edit</button>
            <button class="btn" data-act="copyinfo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy Info</button>
            <button class="btn" data-act="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>Share</button>
            <button class="btn ${e.locked?'locked-on':''}" data-act="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>${lockLabel}</button>

      </div>`;
    }).join("");
    // Kick TOTP live updater if any auth cards rendered
    if (document.querySelector('.totp-live')) { refreshLiveTotps(); startTotpLiveUpdater(); }
  }

  // ---- List interactions ----
  listEl.addEventListener("click", async e => {
    // Attachment thumbnail click → lightbox (independent of data-act)
    const thumb = e.target.closest("[data-atts-idx]");
    if(thumb){
      e.stopPropagation();
      const c = e.target.closest(".card");
      const it = entries.find(x => x.id === c?.dataset.id);
      if(it && it.attachments) openLightbox(it.attachments, +thumb.dataset.attsIdx);
      return;
    }
    const btn = e.target.closest("[data-act]"); if(!btn) return;
    const card = e.target.closest(".card"); const item = entries.find(x => x.id === card.dataset.id);
    if(!item) return;
    const act = btn.dataset.act;
    if(act === "atts"){
      e.stopPropagation();
      if(item.attachments && item.attachments.length) openLightbox(item.attachments, 0);
      return;
    }
    if(act === "totpcopy"){
      e.stopPropagation();
      if(item.locked){ toast("Unprotect to copy TOTP code", "info"); return; }
      const secret = item.fields.secret;
      if(!secret){ toast("No 2FA secret set", "error"); return; }
      totpCode(secret).then(code => copyWithAutoClear(code));
      return;
    }
    if(act === "toggle"){
      const nowOpen = card.classList.toggle("open");
      if(nowOpen) expandedIds.add(item.id); else expandedIds.delete(item.id);
    } else if(act === "qcopy"){
      if(item.locked && btn.dataset.sec){ toast("Unprotect to copy this secret", "info"); return; }
      copyWithAutoClear(item.fields[btn.dataset.key] || "");
    } else if(act === "copy"){
      const isSecret = !!btn.closest(".value-row")?.querySelector("[data-secret]");
      if(item.locked && isSecret){ toast("Unprotect to copy this secret", "info"); return; }
      copyWithAutoClear(item.fields[btn.dataset.key] || "");
    } else if(act === "reveal"){
      const row = btn.closest(".value-row"); const span = row.querySelector("[data-secret]");
      const shown = span.dataset.shown === "1";
      span.textContent = shown ? "••••••••••••" : (item.fields[btn.dataset.key] || "");
      span.dataset.shown = shown ? "" : "1";
      btn.innerHTML = shown ? ICON.eye : ICON.eyeOff;
    } else if(act === "edit"){
      openModal(item);
    } else if(act === "fav"){
      item.fav = !item.fav;
      persist().then(()=>{ renderTabs(); render(); });
      toast(item.fav ? "Added to favorites" : "Removed from favorites");
    } else if(act === "copyinfo"){
      copyWithAutoClear(entryToText(item, { masked: item.locked }));
      if(item.locked) toast("Copied (secrets masked — entry is protected)", "info");
    } else if(act === "share"){
      shareEntry(item, { masked: item.locked });
    } else if(act === "lock"){
      item.locked = !item.locked;
      if(item.locked){
        // re-mask any revealed secrets
        card.querySelectorAll("[data-secret][data-shown='1']").forEach(span => {
          span.textContent = "••••••••••••";
          span.dataset.shown = "";
        });
        card.querySelectorAll('[data-act="reveal"]').forEach(b => b.innerHTML = ICON.eye);
      }
      persist().then(() => render());

    } else if(act === "delete"){
      const ok = await openDialog({
        title:"Delete entry?",
        message:`This permanently removes <b>${esc(item.title) || "this entry"}</b>. This can't be undone.`,
        okLabel:"Delete", cancelLabel:"Cancel", danger:true,

        entries = entries.filter(x => x.id !== item.id);
        await persist(); renderTabs(); render(); toast("Deleted");
      }
    }
  });

  // ---- Share ----
  async function shareEntry(item, opts){
    const text = entryToText(item, opts || {});

  // ---- Modal / dynamic form ----
  function buildFields(type, values){
    $("dynFields").innerHTML = catOf(type).fields.map(f => {
      const v = esc((values && values[f.key]) || "");
      const eyeBtn = f.secret ? `<button class="fld-eye" type="button" data-eye="${f.key}" title="Show / hide">${ICON.eye}</button>` : "";
      if(f.area){
        if(!f.secret) return `<label><span>${esc(f.label)}</span><textarea data-fkey="${f.key}">${v}</textarea></label>`;
        // -webkit-text-security masks textarea content (Chromium/Safari; shows plain in Firefox)
        return `<label><span>${esc(f.label)}</span><div class="pw-input-wrap"><textarea data-fkey="${f.key}" class="masked">${v}</textarea><div class="fld-ctl ta">${eyeBtn}</div></div></label>`;
      }
      const genBtn = f.gen ? `<button class="pw-gen" type="button" data-gen="${f.key}">Generate</button>` : "";
      const meter = f.gen ? `<div class="meter" data-meter="${f.key}"><div class="track"><div class="fill"></div></div><span class="lbl"></span></div>` : "";
      const ctl = (eyeBtn || genBtn) ? `<div class="fld-ctl">${eyeBtn}${genBtn}</div>` : "";
      const inputAttrs = f.secret ? 'type="password" autocomplete="new-password"' : 'type="text" autocomplete="off"';
      return `<label><span>${esc(f.label)}</span><div class="${ctl?'pw-input-wrap':''}"><input data-fkey="${f.key}" ${inputAttrs} value="${v}">${ctl}</div>${meter}</label>`;

  function updateMeter(key){
    const meter = $("dynFields").querySelector(`[data-meter="${key}"]`); if(!meter) return;
    const input = $("dynFields").querySelector(`[data-fkey="${key}"]`);
    const s = pwStrength(input.value);

    meter.querySelector(".fill").style.background = s.color;

  function buildHistory(item){

  function openModal(item){

  // ---- Attachments ----
  let editingAttachments = [];
  const MAX_DIM = 1600;
  const IMG_QUALITY = 0.82;

  function fmtBytes(n){
    if(n < 1024) return n + "B";
    if(n < 1024*1024) return (n/1024).toFixed(0) + "KB";
    return (n/1024/1024).toFixed(1) + "MB";
  }
  function approxSize(dataUrl){
    // base64 → binary size ≈ length * 0.75, minus header
    const comma = dataUrl.indexOf(",");
    return Math.floor((dataUrl.length - comma - 1) * 0.75);
  }
  async function compressImage(fileOrBlob){
    const url = URL.createObjectURL(fileOrBlob);
    try{
      const img = await new Promise((res, rej) => {
        const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url;
      });
      let w = img.naturalWidth, h = img.naturalHeight;
      if(w > MAX_DIM || h > MAX_DIM){
        const ratio = Math.min(MAX_DIM / w, MAX_DIM / h);
        w = Math.round(w * ratio); h = Math.round(h * ratio);
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      // Try WebP first (better compression, universal in Chromium/Firefox)
      const webp = canvas.toDataURL("image/webp", IMG_QUALITY);
      if(webp.startsWith("data:image/webp")) return webp;
      return canvas.toDataURL("image/jpeg", IMG_QUALITY);
    } finally {
      URL.revokeObjectURL(url);
    }

  function buildHealth(){

    const reused = items.filter(i => counts[i.v] > 1);
    const weak = items.filter(i => pwStrength(i.v).idx <= 1); // Weak or Fair
    const OLD_MS = 180 * 86400000;
    const old = entries.filter(e => e.updatedAt && (Date.now() - e.updatedAt > OLD_MS));

    const seenReused = new Set();
    const reusedUnique = reused.filter(i => { const k = i.e.id; if(seenReused.has(k)) return false; seenReused.add(k); return true; });

    const stat = (n, t, cls) => `<div class="stat ${n?cls:'ok'}"><div class="n">${n}</div><div class="t">${t}</div></div>`;
    const item = (e, tag, tagColor, ic) =>
      `<div class="hitem" data-hid="${e.id}"><span class="hic">${ic}</span><span class="hname">${esc(e.title)||'(untitled)'} <span style="color:var(--faint)">· ${esc(catOf(e.type).label)}</span></span><span class="htag" style="color:${tagColor}; background:color-mix(in srgb,${tagColor} 16%,transparent)">${tag}</span></div>`;

    const section = (title, rows) => rows.length
      ? `<div class="hsec"><h3>${title}</h3>${rows.join("")}</div>` : "";

    let body = `<div class="health-summary">
      ${stat(weak.length, "Weak", "warn")}
      ${stat(reusedUnique.length, "Reused", "mid")}
      ${stat(old.length, "Old (>6mo)", "mid")}
    </div>`;

    if(!items.length && !old.length){
      body += `<div class="empty" style="padding:20px 0">No passwords to analyze yet.</div>`;
    } else if(!weak.length && !reusedUnique.length && !old.length){
      body += `<div class="empty" style="padding:20px 0"><div class="big">✅</div>All good — no weak, reused, or old passwords.</div>`;
    } else {
      const weakSeen = new Set();
      body += section("⚠️ Weak passwords", weak.filter(i=>{ if(weakSeen.has(i.e.id))return false; weakSeen.add(i.e.id); return true; })

    }
    $("healthBody").innerHTML = body;

  // ---- RFC-4180 parser (dependency-free): quoted fields, "" escapes,
  // embedded commas/newlines, CRLF/LF/CR, leading BOM, ',' vs ';' auto-detect. ----
  function parseCSV(text){
    if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
    const delim = detectDelimiter(text);
    const rows = []; let row = [], field = "", inQuotes = false, i = 0;
    const n = text.length;
    while(i < n){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i += 2; continue; } // escaped ""
          inQuotes = false; i++; continue;                          // closing quote
        }
        field += c; i++; continue;
      }
      if(c === '"'){ inQuotes = true; i++; continue; }
      if(c === delim){ row.push(field); field = ""; i++; continue; }
      if(c === '\r'){ if(text[i+1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
      if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
      field += c; i++;
    }
    row.push(field); rows.push(row);
    if(rows.length && rows[rows.length-1].length === 1 && rows[rows.length-1][0] === "") rows.pop();
    return rows;
  }
  function detectDelimiter(text){
    let inQuotes = false, comma = 0, semi = 0;
    for(let i = 0; i < text.length; i++){
      const c = text[i];
      if(c === '"'){ if(inQuotes && text[i+1] === '"'){ i++; continue; } inQuotes = !inQuotes; continue; }
      if(inQuotes) continue;
      if(c === ',') comma++; else if(c === ';') semi++;
      else if(c === '\n' || c === '\r') break; // header line only
    }
    return semi > comma ? ';' : ',';
  }
  function isEmptyRow(cells){ return !cells || cells.length === 0 || cells.every(c => (c||"").trim() === ""); }

  // ---- URL scheme guard: only http(s)/ftp are safe in an <a href>. ----
  function safeUrl(u){
    u = (u || "").trim();
    if(!u) return "";
    if(/^(https?|ftp):\/\//i.test(u)) return u;
    if(/^[a-z][\w+.-]*:/i.test(u)) return ""; // other scheme (javascript:, data:…) -> reject
    return "https://" + u;                    // bare host -> assume https
  }

  // ---- Note-folding helpers (no data loss) ----
  function appendNote(note, label, value){
    value = (value || "").trim(); if(!value) return note;
    const line = label ? `${label}: ${value}` : value;
    return note ? note + "\n" + line : line;
  }
  // Bitwarden packs multiple URIs newline-separated inside one quoted cell.
  function splitUris(cell){
    const lines = (cell || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    return { first: lines[0] || "", rest: lines.slice(1) };
  }
  const truthy = v => /^(1|true|yes|on)$/i.test((v||"").trim());

  function hostOf(u){
    u = (u || "").trim(); if(!u) return "";
    try{ return new URL(/^[a-z][\w+.-]*:\/\//i.test(u) ? u : "https://" + u).hostname || ""; }
    catch{ return ""; }
  }

  // ---- Header lookup (case-insensitive, by name not position) ----
  function makeCell(header, row){
    const map = {};
    header.forEach((h, i) => { const k = (h||"").trim().toLowerCase(); if(!(k in map)) map[k] = i; });
    return name => { const i = map[name]; return i == null ? "" : (row[i] || "").trim(); };
  }

  // ---- Vendor formats: most-specific signature FIRST; Chromium broad match late; generic last.
  // Each map(cell) returns { type, title, fields:{username,password,url,note}, fav } or null to skip. ----
  const CSV_FORMATS = [
    { vendor:"Bitwarden",
      match:h => h.has("login_uri") && h.has("login_password"),
      map:cell => {
        const isNote = cell("type") === "note";
        const { first, rest } = splitUris(cell("login_uri"));
        let note = cell("notes");
        if(rest.length) note = appendNote(note, "Other URLs", rest.join("\n"));
        note = appendNote(note, "TOTP", cell("login_totp"));
        note = appendNote(note, "Custom fields", cell("fields"));
        if(isNote) return { type:"note", title:cell("name"), fields:{ note }, fav:truthy(cell("favorite")) };
        return { type:"website", title:cell("name"),
          fields:{ username:cell("login_username"), password:cell("login_password"), url:first, note },
          fav:truthy(cell("favorite")) };
      }},
    { vendor:"LastPass",
      match:h => h.has("grouping") && h.has("extra"),
      map:cell => {
        const url = cell("url");
        let note = cell("extra");
        note = appendNote(note, "TOTP", cell("totp"));
        note = appendNote(note, "Group", cell("grouping"));
        if(url === "http://sn") // secure-note sentinel
          return { type:"note", title:cell("name"), fields:{ note }, fav:truthy(cell("fav")) };
        return { type:"website", title:cell("name") || url,
          fields:{ username:cell("username"), password:cell("password"), url, note },
          fav:truthy(cell("fav")) };
      }},
    { vendor:"Firefox",
      match:h => h.has("formactionorigin") && h.has("guid"),
      map:cell => {
        const url = cell("url");
        let note = appendNote("", "HTTP Realm", cell("httprealm"));
        return { type:"website", title:hostOf(url) || url,
          fields:{ username:cell("username"), password:cell("password"), url, note } };
      }},
    { vendor:"1Password",
      match:h => h.has("otpauth") && h.has("archived"),
      map:cell => {
        if(truthy(cell("archived"))) return null; // skip archived
        let note = cell("notes");
        note = appendNote(note, "TOTP", cell("otpauth"));
        note = appendNote(note, "Tags", cell("tags"));
        return { type:"website", title:cell("title") || cell("url"),
          fields:{ username:cell("username"), password:cell("password"), url:cell("url"), note },
          fav:truthy(cell("favorite")) };
      }},
    { vendor:"Apple Passwords",
      match:h => h.has("otpauth") && h.has("title") && h.has("url") && !h.has("archived") && !h.has("favorite"),
      map:cell => {
        let note = cell("notes");
        note = appendNote(note, "TOTP", cell("otpauth"));
        return { type:"website", title:cell("title") || cell("url"),
          fields:{ username:cell("username"), password:cell("password"), url:cell("url"), note } };
      }},
    { vendor:"Chrome / Edge",
      match:h => h.has("name") && h.has("url") && h.has("username") && h.has("password") && h.has("note"),
      map:cell => ({ type:"website", title:cell("name") || cell("url"),
        fields:{ username:cell("username"), password:cell("password"), url:cell("url"),
                 note:cell("note") || cell("notes") } }) },
  ];

  // Generic fallback: alias-based, case-insensitive. Unmapped non-empty columns -> note.
  const GENERIC_ALIASES = {
    title:    ["title","name","account","item","entry"],
    username: ["username","user","login","login_username","email","e-mail","user name"],
    password: ["password","pass","pwd","login_password","secret","passphrase"],
    url:      ["url","uri","website","site","link","login_uri","web site"],
    note:     ["note","notes","extra","comment","comments","description","memo"],
    totp:     ["totp","otp","otpauth","2fa","login_totp"],
    fav:      ["fav","favorite","favourite","starred"],
  };
  function genericMap(header){
    const lower = header.map(h => (h||"").trim().toLowerCase());
    const find = names => { for(const nm of names){ const i = lower.indexOf(nm); if(i >= 0) return i; } return -1; };
    const idx = {}; for(const k in GENERIC_ALIASES) idx[k] = find(GENERIC_ALIASES[k]);
    const used = new Set(Object.values(idx).filter(i => i >= 0));
    return row => {
      const at = i => i >= 0 ? (row[i]||"").trim() : "";
      let note = at(idx.note);
      note = appendNote(note, "TOTP", at(idx.totp));
      header.forEach((h, i) => { if(!used.has(i)){ const v = (row[i]||"").trim(); if(v) note = appendNote(note, (h||"col").trim(), v); }});
      const url = at(idx.url);
      const out = { type:"website", title:at(idx.title) || hostOf(url) || url,
        fields:{ username:at(idx.username), password:at(idx.password), url, note }, fav:truthy(at(idx.fav)) };
      if(!out.fields.username && !out.fields.password) return null; // need a credential
      return out;
    };
  }

  // ---- Detect format, map all rows -> entry objects. Throws "empty"/"unrecognized". ----
  function csvToEntries(rows){
    if(!rows.length) throw new Error("empty");
    const header = rows[0];
    const hset = new Set(header.map(h => (h||"").trim().toLowerCase()));
    const fmt = CSV_FORMATS.find(f => f.match(hset));
    const mapper = fmt ? (row => fmt.map(makeCell(header, row))) : genericMap(header);
    const vendor = fmt ? fmt.vendor : "CSV";
    if(!fmt){
      const lower = header.map(h => (h||"").trim().toLowerCase());
      const hasCred = GENERIC_ALIASES.username.some(a => lower.includes(a)) ||
                      GENERIC_ALIASES.password.some(a => lower.includes(a));
      if(!hasCred) throw new Error("unrecognized");
    }
    const now = Date.now(); const out = [];
    for(let r = 1; r < rows.length; r++){
      if(isEmptyRow(rows[r])) continue;
      const m = mapper(rows[r]); if(!m) continue;
      const fields = {};
      for(const k in m.fields){
        let v = (m.fields[k] || "").trim(); if(!v) continue;
        if(k === "url"){ const safe = safeUrl(v); if(safe) v = safe; else { m.fields.note = appendNote(m.fields.note, "URL", v); continue; } }
        fields[k] = v;
      }
      if(m.fields.note && !fields.note) fields.note = m.fields.note.trim(); // re-fold rejected-url note
      const title = (m.title || "").trim();
      if(!title && Object.keys(fields).length === 0) continue;
      out.push({ id: crypto.randomUUID(),
        type: CAT_KEYS.includes(m.type) ? m.type : "website",
        title, fields, fav: !!m.fav, updatedAt: now });
    }
    return { vendor, entries: out };
  }

  // ---- Import from backup ----
  async function decryptVaultText(text, askPassword){
    const parsed = JSON.parse(text);
    if(!parsed.enc) return JSON.parse(dec.decode(b64.dec(parsed.data)));
    const pw = await askPassword();
    if(!pw) return null; // cancelled or empty
    const key = await deriveKey(pw, b64.dec(parsed.salt), parsed.iter || LEGACY_ITER);
    const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64.dec(parsed.iv) }, key, b64.dec(parsed.data));
    return JSON.parse(dec.decode(pt));
  }
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async e => {
    const file = e.target.files[0]; if(!file) return;
    e.target.value = ""; // allow re-importing same file later
    let text = await file.text();
    if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM before sniff
    const isJson = /\.json$/i.test(file.name) || (!/\.csv$/i.test(file.name) && /^\s*[{[]/.test(text));
    return isJson ? importJson(text) : importCsv(text);
  });

  // ---- JSON backup import (one concat instead of O(n^2) unshift loop) ----
  async function importJson(text){
    try{
      const imported = await decryptVaultText(text, () => openDialog({
        title:"Encrypted backup",
        message:"This backup is encrypted. Enter its master password to import.",
        input:true, inputType:"password", placeholder:"Master password", okLabel:"Unlock",
      }));
      if(imported === null) return; // user cancelled password
      if(!Array.isArray(imported)) throw new Error("bad format");
      const existing = new Set(entries.map(x => x.id));
      const add = [];
      for(const item of imported){
        if(!item || typeof item !== "object" || !item.fields) continue;
        if(!item.id || existing.has(item.id)) item.id = crypto.randomUUID();
        existing.add(item.id);
        // normalize/cap imported history at the trust boundary
        if(!Array.isArray(item.history)) delete item.history;
        else item.history = item.history.slice(0, HISTORY_CAP)
          .filter(h => h && typeof h === "object" && typeof h.value === "string");
        add.push(item);
      }
      entries = add.concat(entries);
      const n = add.length;
      await persist(); renderTabs(); render();
      toast(n ? `Imported ${n} entr${n===1?'y':'ies'}` : "Nothing new to import", n ? "success" : "info");
    }catch(err){
      toast("Import failed — wrong password or invalid file", "error");
    }
  }

  // ---- CSV import ----
  async function importCsv(text){
    let parsed;
    try{ parsed = csvToEntries(parseCSV(text)); }
    catch(err){
      toast(err && err.message === "unrecognized"
        ? "Unrecognized CSV — no login columns found" : "Couldn't read that CSV file", "error");
      return;
    }
    const { vendor, entries: incoming } = parsed;
    if(!incoming.length){ toast("No logins found in CSV", "info"); return; }
    const ok = await openDialog({
      title:"Import CSV",
      message:`Found <b>${incoming.length}</b> login${incoming.length===1?"":"s"} from <b>${esc(vendor)}</b>.<br>Add them to your vault?`,
      okLabel:"Import", cancelLabel:"Cancel",
    });
    if(ok !== true){ toast("Import cancelled", "info"); return; }
    entries = incoming.concat(entries); // fresh UUIDs already assigned; one O(n) prepend
    await persist(); renderTabs(); render();
    toast(`Imported ${incoming.length} login${incoming.length===1?"":"s"} from ${esc(vendor)}`, "success");
  }

  // ---- Lock screen ----
  const lock = $("lockScreen");
  function showLock(opts){
    $("lockTitle").textContent = opts.title; $("lockHint").textContent = opts.hint;
    $("lockBtn").textContent = opts.btn; $("lockSkip").style.display = opts.skip ? "inline-flex" : "none";
    $("lockErr").textContent = ""; $("lockInput").value = "";
    lock.classList.add("show"); $("lockInput").focus(); lock._onSubmit = opts.onSubmit;
  }
  function hideLock(){ lock.classList.remove("show"); }
  $("lockBtn").addEventListener("click", () => lock._onSubmit && lock._onSubmit());
  $("lockInput").addEventListener("keydown", e => { if(e.key==="Enter") lock._onSubmit && lock._onSubmit(); });

  // Escape closes any open modal/overlay (not the vault lock screen)
  document.addEventListener("keydown", e => {
    if(e.key !== "Escape") return;
    if(dialogResolve !== null){ settleDialog(null); return; } // resolve the dialog promise
    let closed = false;
    document.querySelectorAll(".overlay.show").forEach(o => { o.classList.remove("show"); closed = true; });
    if(closed){ editingId = null; genTarget = null; $("historySection").innerHTML = ""; }
  });

  // ---- Boot ----
  async function boot(){
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw){
      showLock({ title:"Set Up Vault", hint:"Create a master password to encrypt your data", btn:"Create", skip:true,
        onSubmit: async () => {
          const pw = $("lockInput").value;
          if(pw.length < 4){ $("lockErr").textContent = "Use at least 4 characters."; return; }
          salt = crypto.getRandomValues(new Uint8Array(16)); cryptoKey = await deriveKey(pw, salt, KDF_ITER); kdfIter = KDF_ITER;
          entries = []; await persist(); hideLock(); renderTabs(); render(); armIdle();
        }});
      $("lockSkip").onclick = async () => { cryptoKey = null; entries = []; await persist(); hideLock(); renderTabs(); render(); armIdle(); };
      return;
    }
    const parsed = JSON.parse(raw);
    if(!parsed.enc){ cryptoKey = null; entries = JSON.parse(dec.decode(b64.dec(parsed.data))); renderTabs(); render(); armIdle(); return; }
    salt = b64.dec(parsed.salt);
    showLock({ title:"Unlock Vault", hint:"Enter your master password", btn:"Unlock", skip:false,
      onSubmit: async () => {
        try{
          const iter = parsed.iter || LEGACY_ITER;
          const pw = $("lockInput").value;
          const key = await deriveKey(pw, salt, iter);
          const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64.dec(parsed.iv) }, key, b64.dec(parsed.data));
          entries = JSON.parse(dec.decode(pt));
          if(iter < KDF_ITER){ // transparent KDF upgrade: fresh salt, stronger cost
            salt = crypto.getRandomValues(new Uint8Array(16));
            cryptoKey = await deriveKey(pw, salt, KDF_ITER); kdfIter = KDF_ITER;
            await persist();
          } else { cryptoKey = key; kdfIter = iter; }
          hideLock(); renderTabs(); render(); armIdle();
        }catch(err){ $("lockErr").textContent = "Wrong password. Try again."; }
      }});
  }
  boot();
})();
</script>

<!-- PWA service worker registration (enables offline + installability when served over http/https) -->
<script>
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
</script>
